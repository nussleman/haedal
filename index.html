.st-diag-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--text-faint);}
.st-diag-title{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:5px;color:var(--text);}
.st-diag.input .st-diag-title{color:var(--gold-soft);}
.st-diag.market .st-diag-title{color:#8fb4dd;}
.st-diag-lead{font-size:12.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
.st-diag-kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:15px;}
.st-diag-kv span{display:flex;flex-direction:column;gap:2px;}
.st-diag-kv em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.st-diag-kv b{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text);}
.st-diag-mile{margin-top:14px;padding-top:11px;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:11px;color:var(--text-faint);}
.st-diag-mile b{color:var(--gold-soft);}

.st-todo{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.st-todo-card{border:1px solid var(--border);border-radius:11px;background:var(--panel-2);padding:13px 14px 14px;}
.st-todo-card.p1{border-color:var(--gold);background:rgba(201,162,39,.08);}
.st-todo-top{display:flex;align-items:center;gap:7px;}
.st-rank{font-family:var(--mono);font-size:11px;font-weight:700;width:19px;height:19px;line-height:19px;text-align:center;
  border-radius:50%;background:rgba(255,255,255,.07);color:var(--text-dim);}
.st-todo-card.p1 .st-rank{background:var(--gold);color:#1a1508;}
.st-stage{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:10px;}
.st-stage.income{background:var(--green-soft);color:#8fd0ac;}
.st-stage.expense{background:var(--red-soft);color:#eb9891;}
.st-stage.transfer{background:rgba(201,162,39,.2);color:var(--gold-soft);}
.st-todo-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;margin-top:9px;min-height:39px;}
.st-todo-imp{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--gold-soft);margin-top:4px;}
.st-todo-imp em{font-style:normal;font-size:10px;color:var(--text-faint);margin-left:4px;}
.st-todo-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px;}
.st-todo-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.st-todo-ctrl{display:flex;align-items:center;gap:8px;margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.st-todo-ctrl i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;}
.st-todo-ctrl b{display:block;height:100%;border-radius:2px;background:var(--green);}
.st-risk{margin-top:11px;border:1px dashed rgba(193,72,63,.45);background:rgba(193,72,63,.09);
  border-radius:9px;padding:9px 12px;font-size:12px;color:#e39a93;font-family:var(--mono);}

.st-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;}
.st-chk{display:flex;flex-direction:column;gap:3px;border-radius:9px;padding:10px 12px;
  border:1px solid var(--border);background:var(--panel-2);border-left-width:3px;}
.st-chk.ok{border-left-color:var(--green);}
.st-chk.no{border-left-color:var(--red);}
.st-chk.na{border-left-color:var(--text-faint);opacity:.7;}
.st-chk-nm{font-size:11.5px;color:var(--text-dim);}
.st-chk-cur{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text);}
.st-chk.ok .st-chk-cur{color:var(--green);}
.st-chk.no .st-chk-cur{color:var(--red);}
.st-chk-tgt{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
@media (max-width:900px){
  .st-todo{grid-template-columns:1fr;}
  .st-todo-name{min-height:0;}
}

/* ---------- 체크 배지 (Good/Bad·고정비·환급) ---------- */
.chk-strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.chk-pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;padding:2px 6px;border-radius:5px;white-space:nowrap;}
.chk-pill.fixed{background:rgba(91,143,199,0.18);color:#9dc2e8;}
.chk-pill.regret{background:rgba(193,72,63,0.20);color:#eb9891;}
.chk-pill.good{background:rgba(96,150,120,0.22);color:#93d4b1;}
.chk-pill.refund{background:rgba(76,140,107,0.20);color:#8fd0ac;}
#today-left{display:flex;flex-direction:column;gap:var(--gap);min-width:0;}
#today-left .stat-card{flex:0 0 auto;}
.today-col .stat-card .chk-strip{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
#today-left .panel{flex:1;}

/* ---------- 목표 보드 (좌 → 우 시간순 · 가로 스크롤) ---------- */
#goal-board-wrap{min-width:0;padding-left:14px;}
.gb-board{display:flex;gap:20px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 10px;scroll-snap-type:x proximity;}
.gb-board::-webkit-scrollbar{height:9px;}
.gb-board::-webkit-scrollbar-track{background:var(--panel-2);border-radius:5px;}
.gb-board::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;}
.gb-board::-webkit-scrollbar-thumb:hover{background:var(--gold-soft);}
.gb-col{flex:0 0 250px;display:flex;flex-direction:column;scroll-snap-align:start;
  border:none;background:transparent;padding:0;}
.gb-col.undated{flex-basis:218px;}
.gb-colhead{display:flex;align-items:baseline;justify-content:space-between;gap:6px;
  padding:0 2px 8px;margin-bottom:9px;border-bottom:1px solid var(--border-strong);}
.gb-colhead b{font-family:var(--sans);font-size:15px;font-weight:800;color:var(--text-dim);line-height:1.2;white-space:nowrap;letter-spacing:-.01em;}
.gb-colhead span{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
.gb-col.now .gb-colhead b{color:var(--gold-soft);}
.gb-col.undated .gb-colhead b{color:var(--text-faint);}
.gb-lane{display:flex;flex-direction:column;gap:7px;flex:1;min-height:110px;
  border-radius:8px;padding:2px;transition:background .15s;}
.gb-lane.over{background:rgba(201,162,39,0.14);outline:1px dashed var(--gold-soft);}
.gb-empty{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);padding:22px 6px;text-align:center;}
.gb-card{background:var(--panel);border:1px solid var(--border-strong);
  border-left:3px solid var(--text-faint);border-radius:9px;padding:9px 11px;cursor:grab;transition:transform .12s,box-shadow .12s;}
.gb-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.35);transform:translateY(-1px);}
.gb-card.dragging{opacity:.45;cursor:grabbing;}
.gb-card.ok{border-left-color:var(--green);}
.gb-card.no{border-left-color:var(--red);}
.gb-card.active{border-left-color:var(--gold);}
.gb-card.pending{border-left-color:var(--text-faint);}
.gb-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.gb-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;}
.gb-pct{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gold-soft);flex-shrink:0;}
.gb-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:7px;}
.gb-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.gb-bar i.good{background:linear-gradient(90deg,var(--green),#6fb08c);}
.gb-figs{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-faint);margin-top:4px;}
.gb-foot{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;}
.gb-tag,.gb-status,.gb-date,.gb-pending{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;white-space:nowrap;}
.gb-tag{background:rgba(91,143,199,0.16);color:#9dc2e8;}
.gb-status.ok{background:rgba(76,140,107,0.18);color:#8fd0ac;}
.gb-status.no{background:rgba(193,72,63,0.18);color:#eb9891;}
.gb-status.active{background:rgba(201,162,39,0.2);color:var(--gold-soft);}
.gb-status.pending{background:rgba(154,163,182,0.14);color:var(--text-dim);}
.gb-date{background:rgba(255,255,255,.05);color:var(--text-faint);}
.gb-pending{background:rgba(201,162,39,.22);color:var(--gold-soft);}
.gb-memo{font-size:11px;color:var(--text-faint);line-height:1.5;margin-top:6px;}
.gb-donut{height:9px;border-radius:5px;background:var(--panel-2);overflow:hidden;}
.gb-donut i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),#6fb08c);}
@media (max-width:820px){
  .gb-col{flex-basis:82vw;}
  .gb-col.undated{flex-basis:82vw;}
}

/* 목표 카드 — 상태별 강조/감쇠 + 지표 방향 */
.gb-card.ok{border-color:rgba(76,140,107,.4);background:rgba(76,140,107,.06);opacity:.72;}
.gb-card.ok:hover{opacity:1;}
.gb-card.pending{border-style:dashed;border-color:var(--border-strong);background:transparent;opacity:.55;}
.gb-card.pending:hover{opacity:.9;}
.gb-card.pending .gb-title{color:var(--text-dim);}
.gb-check{color:var(--green);font-weight:700;font-size:13px;flex-shrink:0;}
.gb-boardbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding-left:2px;}
.gb-card{border-left:none;border:1px solid var(--border-strong);}
.gb-card.active{border-color:rgba(201,162,39,.5);background:rgba(201,162,39,.05);}
.gb-card.no{border-color:rgba(193,72,63,.5);}
.gb-card.ok .gb-title{text-decoration:line-through;text-decoration-color:var(--text-faint);}
.gb-metric{display:flex;align-items:baseline;gap:5px;margin-top:9px;font-family:var(--mono);font-size:12px;flex-wrap:wrap;}
.gb-dir{font-size:13px;font-weight:700;}
.gb-metric.good .gb-dir,.gb-metric.good .gb-cur{color:var(--green);}
.gb-metric.bad .gb-dir,.gb-metric.bad .gb-cur{color:var(--red);}
.gb-cur{font-size:14px;font-weight:600;}
.gb-arrow,.gb-tgt{color:var(--text-faint);}
.gb-verdict{margin-left:auto;font-size:9.5px;padding:1px 6px;border-radius:4px;}
.gb-metric.good .gb-verdict{background:var(--green-soft);color:#8fd0ac;}
.gb-metric.bad .gb-verdict{background:var(--red-soft);color:#eb9891;}
.gb-bar i.bad{background:linear-gradient(90deg,var(--red),#d9756c);}
.gb-ov{font-size:10px;color:var(--gold-soft);margin-left:4px;}
.gb-nolink{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.05);color:var(--text-faint);}

/* ---------- 증식 구조: 시뮬레이터 ---------- */
.sim-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--border);}
.sim-kpi span{display:flex;flex-direction:column;gap:2px;}
.sim-kpi em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--text-dim);}
.sim-kpi b{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text);}
.sim-kpi i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text-faint);}

.lv-sec{display:flex;align-items:center;gap:9px;margin:14px 0 6px;}
.lv-sec:first-of-type{margin-top:2px;}
.lv-sec span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;font-weight:600;
  padding:2px 9px;border-radius:5px;white-space:nowrap;}
.lv-sec::after{content:'';flex:1;height:1px;background:var(--border);}
.lv-sec.inflow span{background:var(--green-soft);color:#8fd0ac;}
.lv-sec.leak span{background:var(--red-soft);color:#eb9891;}
.lv-sec.ret span{background:rgba(155,127,194,.2);color:#c0a8e0;}
.lv{display:grid;grid-template-columns:1fr auto;grid-template-areas:'nm cur' 'in delta';
  gap:4px 8px;padding:8px 0;border-bottom:1px dotted var(--border);}
.lv:last-child{border-bottom:none;}
.lv-nm{grid-area:nm;font-size:13px;color:var(--text);}
.lv-nm em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-left:7px;}
.lv-cur{grid-area:cur;font-family:var(--mono);font-size:11.5px;color:var(--text-faint);align-self:center;}
.lv-in{grid-area:in;display:flex;align-items:center;gap:5px;}
.lv-in input{width:118px;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--mono);font-size:13px;border-radius:6px;padding:5px 8px;text-align:right;}
.lv-in input:focus{outline:none;border-color:var(--gold-soft);}
.lv-in i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text-faint);}
.lv-delta{grid-area:delta;font-family:var(--mono);font-size:12px;color:var(--text-faint);align-self:center;text-align:right;}
.lv.up .lv-delta{color:var(--green);}
.lv.down .lv-delta{color:var(--red);}
.lv.up .lv-in input{border-color:rgba(76,140,107,.6);}
.lv.down .lv-in input{border-color:rgba(193,72,63,.6);}

.pri-list{display:flex;flex-direction:column;}
.pri{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:start;
  padding:9px 2px;border-bottom:1px dotted var(--border);}
.pri:last-child{border-bottom:none;}
.pri.p1{background:rgba(201,162,39,.07);border-radius:8px;padding-left:7px;padding-right:7px;}
.pri.risk{background:rgba(193,72,63,.07);border-radius:8px;padding-left:7px;padding-right:7px;}
.pri-rank{font-family:var(--mono);font-size:11px;font-weight:700;width:21px;height:21px;line-height:21px;
  text-align:center;border-radius:50%;background:rgba(255,255,255,.07);color:var(--text-dim);margin-top:1px;}
.pri.p1 .pri-rank{background:var(--gold);color:#1a1508;}
.pri.risk .pri-rank{background:var(--red-soft);color:#eb9891;}
.pri-body{min-width:0;}
.pri-body b{display:block;font-size:13px;font-weight:600;color:var(--text);line-height:1.35;}
.pri-body em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:2px;}
.pri-imp{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--gold-soft);white-space:nowrap;text-align:right;}
.pri-imp i{font-style:normal;font-size:10px;color:var(--text-faint);margin-left:2px;}
.pri-goal-chip{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--gold-soft);
  background:rgba(201,162,39,.12);border-radius:5px;padding:2px 6px;margin-top:5px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- 카테고리별 예산 ---------- */
.bg-total{border:1px solid var(--border-strong);border-radius:11px;background:var(--panel-2);padding:13px 15px;margin-bottom:14px;}
.bg-total.over{border-color:rgba(193,72,63,.5);background:rgba(193,72,63,.07);}
.bg-total-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.bg-total-head span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-faint);}
.bg-total-head b{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);}
.bg-total-head em{font-style:normal;font-size:13px;color:var(--text-faint);}
.bg-total-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:6px;}
.bg-track{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.bg-track.lg{height:10px;border-radius:5px;margin-top:9px;}
.bg-fill{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),#6fb08c);}
.bg-fill.over{background:linear-gradient(90deg,var(--red),#d9756c);}
.bg-table{display:flex;flex-direction:column;}
.bg-head,.bg-row{display:grid;grid-template-columns:1.3fr 84px 106px 1.1fr 92px;gap:10px;align-items:center;}
.bg-head{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--text-faint);
  padding:0 2px 7px;border-bottom:1px solid var(--border-strong);}
.bg-head span:not(:first-child){text-align:right;}
.bg-head .bg-barcol{text-align:left;}
.bg-row{padding:7px 2px;border-bottom:1px dotted var(--border);font-size:12.5px;}
.bg-row:last-child{border-bottom:none;}
.bg-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.bg-cur{font-family:var(--mono);text-align:right;color:var(--text-dim);}
.bg-bud{display:flex;align-items:center;justify-content:flex-end;gap:5px;}
.bg-bud em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--text-faint);
  background:rgba(255,255,255,.05);border-radius:4px;padding:1px 4px;}
.bg-barcol{display:flex;align-items:center;gap:8px;}
.bg-barcol .bg-track{flex:1;}
.bg-barcol em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--text-faint);width:32px;text-align:right;}
.bg-rem{font-family:var(--mono);text-align:right;color:var(--green);}
.bg-rem.over{color:var(--red);}
@media (max-width:1100px){
  .bg-head{display:none;}
  .bg-row{grid-template-columns:1fr auto;grid-auto-rows:auto;row-gap:5px;}
  .bg-row .bg-barcol{grid-column:1 / -1;}
}

.gb-recs{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.gb-rec{position:relative;border:1px dashed var(--border-strong);border-radius:9px;padding:10px 11px;background:var(--panel-2);}
.gb-rec-x{position:absolute;top:3px;right:4px;background:none;border:none;color:var(--text-faint);
  font-size:11px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:4px;opacity:.6;}
.gb-rec-x:hover{opacity:1;color:#eb9891;background:rgba(255,255,255,.07);}
.gb-rec-title{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.4;padding-right:16px;}
.gb-rec-why{font-family:var(--mono);font-size:10px;color:var(--text-faint);line-height:1.6;margin-top:4px;}
.gb-rec .btn{margin-top:8px;width:100%;}

.thm-row{display:grid;grid-template-columns:1.2fr 1.4fr 96px 1.3fr;gap:12px;align-items:center;
  padding:7px 2px;border-bottom:1px dotted var(--border);font-size:12.5px;}
.thm-row:last-child{border-bottom:none;}
.thm-nm{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.thm-nm em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-left:6px;}
.thm-track{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.thm-track i{display:block;height:100%;border-radius:3px;background:var(--green);}
.thm-track i.neg{background:var(--red);}
.thm-amt{font-family:var(--mono);text-align:right;}
.thm-top{font-family:var(--mono);font-size:10px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (max-width:1100px){
  .thm-row{grid-template-columns:1fr 90px;row-gap:4px;}
  .thm-track,.thm-top{grid-column:1 / -1;}
}

.yr-list{display:flex;flex-direction:column;}
.yr-row{display:grid;grid-template-columns:auto 1fr 78px 44px;gap:10px;align-items:center;
  padding:8px 4px;border-bottom:1px dotted var(--border);cursor:pointer;border-radius:6px;}
.yr-row:last-child{border-bottom:none;}
.yr-row:hover{background:var(--panel-2);}
.yr-row.on{background:rgba(201,162,39,.09);}
.yr-y{font-family:var(--mono);font-size:13px;color:var(--text);}
.yr-y em{font-style:normal;font-size:10px;color:var(--text-faint);margin-left:5px;}
.yr-track{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.yr-track i{display:block;height:100%;border-radius:3px;background:var(--net);}
.yr-track i.neg{background:var(--red);}
.yr-net{font-family:var(--mono);font-size:12.5px;text-align:right;}
.yr-rate{font-family:var(--mono);font-size:11px;color:var(--text-faint);text-align:right;}

/* ---------- 비중 도넛 ---------- */
/* 트리맵 + 목록 */
.share-split{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:stretch;}
.share-tmap{position:relative;min-height:340px;}
.tmap{position:absolute;inset:0;}
.tm-cell{position:absolute;overflow:hidden;border:1.5px solid var(--panel);border-radius:3px;
  padding:5px 6px;display:flex;flex-direction:column;justify-content:flex-start;gap:1px;cursor:default;}
.tm-cell b{font-size:10.5px;font-weight:700;color:rgba(15,20,29,.92);line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%;}
.tm-cell em{font-style:normal;font-family:var(--mono);font-size:10px;color:rgba(15,20,29,.72);
  line-height:1.2;white-space:nowrap;}
.share-donut{height:132px;position:relative;}
.share-list{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;padding-right:4px;}
.share-row{display:grid;grid-template-columns:9px 1fr 46px 62px;gap:8px;align-items:center;
  padding:4px 0;font-size:12px;}
.share-sw{width:9px;height:9px;border-radius:2px;}
.share-nm{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.share-pct{font-family:var(--mono);font-size:12px;color:var(--text);text-align:right;}
.share-amt{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-align:right;}
@media (max-width:760px){.share-split{grid-template-columns:1fr;}.share-tmap{min-height:200px;}}

/* ---------- 예산 트리 / 실적 ---------- */
.bt{display:flex;flex-direction:column;}
.bt-g{border-bottom:1px solid var(--border);}
.bt-g:last-child{border-bottom:none;}
.bt-ghead{display:grid;grid-template-columns:14px 1fr 1.1fr auto;gap:10px;align-items:center;
  padding:10px 2px;cursor:pointer;border-radius:6px;}
.bt-ghead:hover{background:var(--panel-2);}
.bt-caret{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.bt-gnm{font-size:13px;font-weight:600;color:var(--text);}
.bt-gnm em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-left:6px;}
.bt-gtrack{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.bt-gtrack i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.bt-gamt{font-family:var(--mono);font-size:13px;color:var(--text);text-align:right;}
.bt-i{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:6px 2px 6px 26px;font-size:12px;border-top:1px dotted var(--border);}
.bt-inm{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bt-iavg{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
.bt-iin{display:flex;align-items:center;gap:5px;}
.bt-iin em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--text-faint);
  background:rgba(255,255,255,.05);border-radius:4px;padding:1px 4px;}
.ba-list{display:flex;flex-direction:column;}
.ba-row{display:grid;grid-template-columns:1fr 1fr 38px auto;grid-template-areas:'nm track pct fig' 'nm track pct rem';
  gap:2px 10px;align-items:center;padding:8px 2px;border-bottom:1px dotted var(--border);font-size:12.5px;}
.ba-row:last-child{border-bottom:none;}
.ba-nm{grid-area:nm;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ba-track{grid-area:track;height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
.ba-track i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),#6fb08c);}
.ba-track i.over{background:linear-gradient(90deg,var(--red),#d9756c);}
.ba-pct{grid-area:pct;font-family:var(--mono);font-size:11px;color:var(--text-faint);text-align:right;}
.ba-fig{grid-area:fig;font-family:var(--mono);font-size:11.5px;color:var(--text-dim);text-align:right;white-space:nowrap;}
.ba-fig em{font-style:normal;color:var(--text-faint);margin-left:3px;}
.ba-rem{grid-area:rem;font-family:var(--mono);font-size:11px;color:var(--green);text-align:right;}
.ba-rem.over{color:var(--red);}

/* 자산 배분 · 계좌별 잔액 압축 */
.alloc-split{display:grid;grid-template-columns:124px 1fr;gap:14px;align-items:center;}
.alloc-donut{height:124px;position:relative;}
.alloc-legend{display:flex;flex-direction:column;}
.alloc-split .alloc-row{display:grid;grid-template-columns:10px 1fr auto;gap:9px;padding:5px 0;font-size:12.5px;}
.alloc-split .alloc-amt{font-family:var(--mono);font-size:12.5px;color:var(--text);}
.alloc-split .alloc-amt em{font-style:normal;font-size:10.5px;color:var(--text-faint);margin-left:6px;}
/* 카테고리 4개가 항상 같은 줄. 좁아지면 2×2로만 떨어지게 (하나만 밀려나는 일 방지) */
.acct-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px;align-items:start;}
@media (max-width:1100px){.acct-board{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;}}
@media (max-width:520px){.acct-board{grid-template-columns:minmax(0,1fr);}}
.acct-col{display:flex;flex-direction:column;gap:6px;}
.acct-col-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding-bottom:6px;border-bottom:2px solid var(--catc);}
.acct-col-head b{font-size:12.5px;font-weight:700;color:var(--text);}
.acct-col-head span{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.acct-col-head em{font-style:normal;font-size:10px;color:var(--text-faint);margin-left:5px;}
.acct-cell{display:grid;grid-template-columns:1fr auto;gap:3px 8px;
  border:1px solid var(--border);border-radius:8px;background:var(--panel-2);padding:8px 10px;}
.acct-nm{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-val{font-family:var(--mono);font-size:12.5px;color:var(--text);white-space:nowrap;text-align:right;}
.acct-bar{grid-column:1 / -1;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;}
.acct-bar i{display:block;height:100%;border-radius:2px;background:var(--catc);opacity:.75;}
@media (max-width:600px){.alloc-split{grid-template-columns:1fr;}.alloc-donut{height:130px;}}

/* 차트 시리즈 체크박스 */
.series-toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.series-chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  font-size:11.5px;color:var(--text-faint);border:1px solid var(--border);border-radius:20px;padding:4px 11px 4px 8px;
  transition:all .15s;}
.series-chk:hover{color:var(--text);border-color:var(--border-strong);}
.series-chk.on{color:var(--text);border-color:var(--border-strong);background:var(--panel-2);}
.series-chk input{width:12px;height:12px;accent-color:var(--gold);margin:0;}
.series-chk i{width:9px;height:9px;border-radius:2px;display:inline-block;opacity:.35;}
.series-chk.on i{opacity:1;}

/* ---------- 모달 (목표 편집) ---------- */
.modal-back{position:fixed;inset:0;background:rgba(6,9,15,.72);z-index:9998;
  display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{width:min(560px,100%);max-height:88vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 18px;border-bottom:1px solid var(--border);}
.modal-head b{font-size:15px;color:var(--text);}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 18px;border-top:1px solid var(--border);}
.fld{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
.fld>span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-faint);}
.fld input,.fld select{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--sans);font-size:13px;border-radius:7px;padding:8px 10px;width:100%;}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold-soft);}
.fld-row{display:flex;gap:12px;flex-wrap:wrap;}
.ge-link{border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.7;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);}
.ge-link.good{border-color:rgba(76,140,107,.45);background:var(--green-soft);color:#a8d8bf;}
.ge-link.bad{border-color:rgba(193,72,63,.45);background:var(--red-soft);color:#eb9891;}
.ge-link.none{color:var(--text-faint);}
.btn.small.on{border-color:var(--gold);color:var(--gold-soft);}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1508;font-weight:700;}
.btn.danger{border-color:rgba(193,72,63,.5);color:#eb9891;}

/* ---------- 토스트 ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--panel);border:1px solid var(--border-strong);color:var(--text);
  font-size:12.5px;padding:10px 16px;border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.good{border-color:rgba(76,140,107,.5);}
.toast.warn{border-color:rgba(201,162,39,.5);}

/* ---------- 자산 증식 구조: 압축 ---------- */
.eng-node{padding:7px 8px;gap:3px;}
.eng-node-top .nm{font-size:12px;}
.eng-amt{font-size:14px;}
.eng-stage-head span{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-left:auto;}

/* 캘린더 월 타이틀 */
.cal-month-title{font-family:var(--sans);font-weight:800;font-size:27px;line-height:1.15;color:var(--text);letter-spacing:-.01em;}
@media (max-width:820px){.cal-month-title{font-size:22px;}}

/* 캘린더 우측 내역 패널 */
#panel-cal-day .stat-grid{grid-template-columns:1fr 1fr;}
#panel-cal-day .table-scroll{overflow-y:auto;}
#panel-cal-day .data-table{font-size:11.5px;}
#panel-cal-day .data-table thead th{padding:6px 6px;font-size:10px;}
#panel-cal-day .data-table tbody td{padding:6px 6px;white-space:normal;word-break:break-word;max-width:none;}
#panel-cal-day .data-table td.amt{white-space:nowrap;}

/* ---------- 데이터 품질 뱃지 ---------- */
.dq-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.dq-pill{font-family:var(--mono);font-size:10px;letter-spacing:.02em;padding:3px 8px;border-radius:6px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);white-space:nowrap;}
.dq-pill.ok{border-color:rgba(76,140,107,.45);background:var(--green-soft);color:#a8d8bf;}
.dq-pill.warn{border-color:rgba(201,162,39,.45);background:rgba(201,162,39,.14);color:#e6d08f;}
.dq-pill.bad{border-color:rgba(193,72,63,.45);background:var(--red-soft);color:#eb9891;}

/* ---------- 목표 배분 갭 ---------- */
.gap-row{display:grid;grid-template-columns:64px 1fr 108px;gap:9px;align-items:center;padding:7px 0;
  border-bottom:1px solid var(--border);}
.gap-row:last-child{border-bottom:none;}
.gap-nm{font-size:12px;color:var(--text-dim);white-space:nowrap;}
.gap-bar{position:relative;height:16px;border-radius:5px;background:rgba(255,255,255,.045);overflow:hidden;}
.gap-bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;opacity:.85;}
.gap-bar>u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--paper);opacity:.85;text-decoration:none;}
.gap-val{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap;}
.gap-val em{font-style:normal;display:block;font-size:10px;color:var(--text-faint);}
.gap-val.over{color:#eb9891;} .gap-val.under{color:#8fd0ac;} .gap-val.fit{color:var(--text-dim);}

/* ---------- 운용 점검 ---------- */
.idle-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.idle-row:last-child{border-bottom:none;}
.idle-row .nm{flex:1;min-width:0;color:var(--text);}
.idle-row .st{font-family:var(--mono);font-size:10.5px;white-space:nowrap;}
.idle-row .st.bad{color:#eb9891;} .idle-row .st.ok{color:#8fd0ac;} .idle-row .st.warn{color:#e6d08f;}

/* ---------- 돈의 흐름표 ---------- */
/* 수입 · 지출 · 자산 · 부채를 왼쪽부터 한 줄로. 수입·자산은 살짝 위, 지출·부채는 살짝 아래 */
.fm-wrap{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;padding:18px 0;}
.fm-wrap>.fm-cell:nth-child(1),.fm-wrap>.fm-cell:nth-child(2){transform:translateY(0);}
.fm-wrap>.fm-cell:nth-child(3),.fm-wrap>.fm-cell:nth-child(4){transform:translateY(92px);}
.fm-wrap{padding-bottom:110px;}
@media (max-width:900px){
  .fm-wrap{grid-template-columns:repeat(2,1fr);}
  .fm-wrap>.fm-cell{transform:none !important;}
}
.fm-cell{padding:12px 13px;min-height:170px;border:1px solid var(--border-strong);border-radius:10px;
  background:var(--panel);border-top:3px solid var(--qc);}
.fm-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px;}
.fm-h b{font-family:var(--serif);font-size:16px;color:var(--text);}
.fm-h span{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.fm-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;}
.fm-item:hover{background:rgba(255,255,255,.06);}
.fm-item.on{background:rgba(201,162,39,.16);}
.fm-item .nm{flex:1;min-width:0;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fm-item .vl{font-family:var(--mono);font-size:11px;color:var(--text);}
.fm-add{margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  background:none;border:1px dashed var(--border-strong);border-radius:6px;padding:4px 8px;cursor:pointer;width:100%;}
.fm-add:hover{color:var(--gold-soft);border-color:var(--gold-soft);}
.fm-sub{margin-top:12px;}
.fm-sub-h{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-faint);margin-bottom:6px;}
.fm-sub-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);}
.fm-sub-row:last-child{border-bottom:none;}
.fm-sub-row .nm{flex:1;min-width:0;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fm-sub-row .bar{width:52px;height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;flex-shrink:0;}
.fm-sub-row .bar>i{display:block;height:100%;border-radius:3px;}
.fm-sub-row .vl{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap;}
.fm-detail .empty-state{padding:24px 0;}
.fm-dt-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.fm-dt-h b{font-size:15px;}
.fm-kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
.fm-kv span{color:var(--text-dim);} .fm-kv b{font-family:var(--mono);font-weight:500;}
.fm-memo{margin-top:10px;font-size:12.5px;line-height:1.75;color:var(--text-dim);white-space:pre-wrap;}
.fm-sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}

/* ---------- 후회 소비 ---------- */
.rg-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.rg-row:last-child{border-bottom:none;}
.rg-row .dt{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);width:60px;flex-shrink:0;}
.rg-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rg-row .vl{font-family:var(--mono);font-size:11.5px;color:#eb9891;white-space:nowrap;}

/* ---------- 목표 마일스톤 사다리 ---------- */
.ld-now{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.ld-now>b{font-family:var(--mono);font-size:22px;color:var(--text);}
.ld-now>span{font-size:12.5px;color:var(--text-dim);}
.ld-track{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.05);margin:0 0 6px;}
.ld-track>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.ld-track>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text-faint);text-decoration:none;transform:translateX(-1px);}
.ld-track>u.on{background:var(--paper);}
.ld-track>u.next{background:var(--green);width:3px;}
.ld-marks{display:flex;justify-content:space-between;gap:4px;font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-wrap:wrap;}
.ld-marks>span.on{color:var(--gold-soft);}
.ld-eta{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;}
.ld-eta>div{font-size:12px;color:var(--text-dim);}
.ld-eta>div>span{display:block;font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em;}
.ld-eta>div>b{font-size:14px;color:var(--text);font-weight:600;}
.ld-eta .settings-note{flex-basis:100%;}
.gb-warn{font-family:var(--mono);font-size:10px;color:#e6d08f;margin-top:4px;}
.gb-freq{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);
  border:1px solid var(--border);border-radius:4px;padding:1px 4px;margin-left:6px;}

/* ---------- 배분 보조 축 · 추천 ---------- */
.ax-row{display:grid;grid-template-columns:88px 1fr auto;gap:9px;align-items:center;padding:6px 0;font-size:11.5px;}
.ax-nm{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.ax-bar{position:relative;height:8px;border-radius:4px;background:rgba(76,140,107,.35);overflow:hidden;}
.ax-bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:4px;}
.ax-bar>i.lock{background:var(--net);}
.ax-vl{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);white-space:nowrap;}
.sug-box{margin-top:12px;border:1px dashed var(--border-strong);border-radius:9px;padding:10px 12px;}
.sug-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-faint);margin-bottom:8px;}
.sug-vals{display:flex;gap:14px;flex-wrap:wrap;}
.sug-vals>span{font-family:var(--mono);font-size:14px;color:var(--gold-soft);}
.sug-vals>span>em{font-style:normal;display:block;font-size:9.5px;color:var(--text-faint);letter-spacing:.04em;}

/* ---------- 예산 표 (예산 + 실적 통합) ---------- */
.bt2-wrap{max-width:820px;margin:0 auto;}
.bt2{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;}
.bt2 col.w-nm{width:auto;}
.bt2 col.w-in{width:132px;}
.bt2 col.w-act{width:130px;}
.bt2 col.w-num{width:150px;}
.bt2 th{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.01em;
  color:var(--text-dim);text-align:right;padding:0 10px 8px;border-bottom:1px solid var(--border-strong);
  vertical-align:bottom;}
.bt2 th.c-nm{text-align:left;padding-left:2px;}
.bt2 th em{font-style:normal;display:block;font-family:var(--mono);font-size:9px;
  color:var(--text-faint);font-weight:400;letter-spacing:.05em;margin-top:2px;}
/* 실적 열은 '월에 따라 바뀌는 값'이라는 걸 배경·헤더로 드러낸다 */
.bt2 th.c-act{background:rgba(201,162,39,.07);border-bottom-color:var(--gold-soft);
  color:var(--gold-soft);padding-bottom:6px;border-radius:8px 8px 0 0;}
.bt2 th.c-act .month-nav{margin-top:4px;justify-content:flex-end;}
.bt2 th.c-act .month-nav select{font-size:10.5px;padding:2px 4px;}
.bt2 th.c-act .month-nav button{font-size:10px;padding:2px 6px;}
.bt2 .bt2-mlabel{display:block;font-family:var(--mono);font-size:10px;color:var(--text-faint);
  font-weight:400;margin-top:3px;}
.bt2 td{padding:0 10px;height:36px;vertical-align:middle;}
.bt2 td.c-num,.bt2 td.c-in,.bt2 td.c-act{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap;}
.bt2 td.c-nm{color:var(--text-dim);padding-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;}
.bt2 td.c-in,.bt2 th.c-in{border-left:1px solid var(--border);}
.bt2 td.c-act{background:rgba(201,162,39,.055);border-left:1px solid var(--border);}
.bt2 td.c-num:last-child,.bt2 th.c-num:last-child{border-left:1px solid var(--border);}

.bt2-g{cursor:pointer;}
.bt2-g td{background:rgba(255,255,255,.05);border-top:1px solid var(--border-strong);
  color:var(--text);height:40px;}
.bt2-g td.c-act{background:rgba(201,162,39,.11);}
.bt2-g td.c-nm b{font-weight:700;font-size:14px;}
.bt2-g:hover td{background:rgba(255,255,255,.085);}
.bt2-g:hover td.c-act{background:rgba(201,162,39,.15);}
.bt2-g td.c-nm em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-left:7px;}
.bt2-caret{display:inline-block;width:15px;color:var(--gold-soft);font-size:10px;}

.bt2-i td{border-bottom:1px solid var(--border);}
.bt2-i td.c-nm{font-size:12.5px;color:var(--text-faint);}
.bt2-i td.c-act{color:var(--text-dim);}
.bt2-ind{display:inline-block;width:34px;padding-left:19px;color:var(--border-strong);font-size:10px;}
.bt2-auto{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--text-faint);
  border:1px solid var(--border);border-radius:3px;padding:1px 3px;margin-left:6px;}
.bt2-input{width:104px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  font-family:var(--mono);font-size:12.5px;border-radius:5px;padding:4px 7px;text-align:right;}
.bt2-input:focus{outline:none;border-color:var(--gold-soft);}

/* 남음 / 초과 — 게이지로 사용률을 같이 보여준다 */
.bt2-gauge{display:flex;align-items:center;gap:7px;justify-content:flex-end;}
.bt2-gauge .g-track{position:relative;flex:0 0 46px;height:6px;border-radius:3px;
  background:rgba(255,255,255,.07);overflow:hidden;display:flex;}
.bt2-gauge .g-track i{display:block;height:100%;background:#5b8fc7;opacity:.75;}
.bt2-gauge .g-track u{display:block;height:100%;background:#d9884f;text-decoration:none;}
.bt2-gauge .g-txt{font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;}
.bt2-gauge.over .g-track i{background:#d9884f;opacity:.9;}
.bt2-gauge.over .g-txt{color:#d9884f;}

.bt2 tfoot td{height:44px;border-top:2px solid var(--border-strong);border-bottom:none;
  font-family:var(--mono);font-size:14px;color:var(--text);}
.bt2 tfoot td.c-nm{font-family:var(--sans);font-weight:700;}
.bt2 tfoot td.c-act{background:rgba(201,162,39,.11);border-radius:0 0 8px 8px;}
@media (max-width:760px){
  .bt2 col.w-in{width:98px;} .bt2 col.w-act{width:96px;} .bt2 col.w-num{width:118px;}
  .bt2-input{width:80px;} .bt2 td{font-size:12px;padding:0 6px;}
  .bt2-ind{width:24px;padding-left:12px;}
  .bt2-gauge .g-track{flex-basis:32px;}
}
/* ---------- 자산 배분 ---------- */
.al-split{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;}
.al-donut{height:132px;position:relative;}
.al{width:100%;border-collapse:collapse;font-size:12.5px;}
.al th{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--text-faint);
  font-weight:400;text-align:right;padding:0 8px 6px;}
.al th.c-nm{text-align:left;}
.al th.h-tgt{background:rgba(255,255,255,.04);}
.al th.h-gap{border-left:1px solid var(--border);}
.al td{padding:0 8px;height:32px;vertical-align:middle;text-align:right;
  border-top:1px solid var(--border);white-space:nowrap;}
.al tr:first-child td{border-top:1px solid var(--border-strong);}
.al td.c-nm{text-align:left;color:var(--text);padding-left:0;}
.al td.c-nm i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;}
/* 현재 = 크고 밝게 · 목표 = 음영 배경 · 갭 = 세로선으로 분리 */
.al td.c-cur{font-family:var(--mono);font-size:15px;color:var(--text);}
.al td.c-cur span{font-size:10px;color:var(--text-faint);margin-left:1px;}
.al td.c-cur em{font-style:normal;display:block;font-size:9.5px;color:var(--text-faint);margin-top:-2px;}
.al td.c-tgt{font-family:var(--mono);font-size:13px;color:var(--text-dim);background:rgba(255,255,255,.04);}
.al td.c-tgt.sug{color:var(--gold-soft);}
.al td.c-gap{font-family:var(--mono);font-size:12px;border-left:1px solid var(--border);color:var(--text-faint);}
.al td.c-gap em{font-style:normal;display:block;font-size:9.5px;color:var(--text-faint);margin-top:-2px;}
.al td.c-gap.off{color:#d9884f;}
.al td.c-gap.off em{color:#c07a4c;}
.al-notes{list-style:none;margin:12px 0 0;padding:0;}
.al-notes li{position:relative;padding-left:12px;font-size:12px;color:var(--text-dim);line-height:1.75;}
.al-notes li:before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--gold-soft);}
.al-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:11px;padding-top:9px;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
.al-foot b{color:var(--text-dim);font-weight:500;font-size:12px;}
@media (max-width:640px){.al-split{grid-template-columns:1fr;}.al-donut{height:150px;}}


.stat-card .value .v-note{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-left:7px;font-weight:400;}

/* ---------- 오늘: 중앙 1열 ---------- */
.today-center{max-width:820px;margin:0 auto;}

.pace-tag{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text-dim);white-space:nowrap;}
.kpi-mini.one{grid-template-columns:1fr;}
.kpi-mini.one>div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 12px;}
.kpi-mini.one .k{margin-bottom:0;}
.kpi-mini.one .v{font-size:16px;}
@media (max-width:900px){.kpi-mini.one{grid-template-columns:repeat(2,1fr);}}

/* ---------- 오늘: 좌우 2단, 화면 중앙 ---------- */
/* 바깥은 화면 상하 중앙, 안쪽은 두 칼럼 윗선 정렬 */
.today-center{display:flex;align-items:center;justify-content:center;min-height:min(66vh,660px);}
.today-inner{display:flex;gap:16px;align-items:flex-start;justify-content:center;
  width:100%;max-width:1060px;}
.today-col{flex:0 0 300px;display:flex;flex-direction:column;gap:12px;}
.today-list{flex:1 1 auto;min-width:0;}
@media (max-width:820px){
  .today-center{min-height:0;}
  .today-inner{flex-direction:column;align-items:stretch;}
  .today-col{flex:none;}
}
/* 지표 아래 비교 줄 */
.cmp-list{margin-top:14px;padding-top:11px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px;}
.cmp-row{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:baseline;font-size:11.5px;}
.cmp-row .cl-l{color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmp-row .cl-b{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);}
.cmp-row .cl-d{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;min-width:78px;text-align:right;}
.cmp-row.good .cl-d{color:#7fc0a0;}
.cmp-row.bad .cl-d{color:#e08a5f;}
.cmp-row.same .cl-d,.cmp-row.none .cl-d{color:var(--text-faint);font-weight:400;}
/* 체크 배지 가독성 */
.chk-pill{font-size:11px;padding:3px 8px;font-weight:500;}
.chk-pill.regret{background:rgba(193,72,63,0.30);color:#f5b4ae;}
.chk-pill.good{background:rgba(96,150,120,0.30);color:#a8e2c3;}
.chk-pill.fixed{background:rgba(91,143,199,0.28);color:#b6d5f2;}
.chk-pill.refund{background:rgba(76,140,107,0.28);color:#a6dcbf;}

.panel-title .pace-tag{margin-left:12px;padding-left:12px;border-left:1px solid var(--border-strong);}

.gw-code{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--text-dim);overflow-x:auto;
  white-space:pre;margin-top:10px;max-height:240px;}

/* ---------- 패널 없이 펼치는 페이지 ---------- */
.bare{width:100%;padding:2px 2px 0;}
.bare-bar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

/* ---------- 흐름 차트 축 버튼 ---------- */
.axis-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.axis-btns{display:flex;gap:6px;}
.axis-btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text-faint);
  background:none;border:1px solid var(--border);border-radius:8px;padding:6px 13px;transition:all .15s;}
.axis-btn i{width:10px;height:10px;border-radius:3px;background:var(--ac);opacity:.28;display:inline-block;}
.axis-btn:hover{color:var(--text-dim);border-color:var(--border-strong);}
.axis-btn.on{color:var(--text);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);}
.axis-btn.on i{opacity:1;}

/* ---------- 흐름표 인사이트 ---------- */
.fm-h{cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px 9px;transition:background .15s;}
.fm-h:hover{background:rgba(255,255,255,.06);}
.fm-h.on{background:rgba(255,255,255,.10);}
.fm-ins{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;}
.fm-ins li{position:relative;padding-left:13px;font-size:12px;line-height:1.65;color:var(--text-dim);}
.fm-ins li:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--text-faint);}
.fm-ins li.good{color:#a8d8bf;} .fm-ins li.good:before{background:#7fc0a0;}
.fm-ins li.warn{color:#e6b48f;} .fm-ins li.warn:before{background:#d9884f;}
.fm-ins li b{color:var(--text);font-weight:600;}
.fm-spark{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:4px;}
.fs-bar{flex:1;height:100%;display:flex;align-items:flex-end;}
.fs-bar i{display:block;width:100%;border-radius:2px 2px 0 0;}

.al-notes li,.cmp-row{font-size:12px;line-height:1.65;}

/* ---------- 자산>투자>스터디: 한 번에 하나씩, 정중앙 ---------- */
.sd-stage{display:flex;flex-direction:column;align-items:center;padding:4px 0 2px;}
.sd-top{width:100%;max-width:660px;margin-bottom:16px;}
.sd-phases{display:flex;gap:3px;margin-bottom:6px;}
.sd-ph{flex:1;display:flex;flex-direction:column;gap:4px;}
.sd-ph .lbl{font-size:9.5px;font-family:var(--mono);letter-spacing:.06em;color:var(--text-faint);}
.sd-ph.on .lbl{color:var(--gold-soft);}
.sd-ph .bars{display:flex;gap:2px;}
.sd-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.08);}
.sd-seg.done{background:rgba(201,162,39,0.42);}
.sd-seg.on{background:var(--gold);}
.sd-topbar{display:flex;align-items:center;gap:8px;margin-top:10px;}
.sd-name{
  flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--text);padding:4px 1px;font-size:13px;font-family:var(--sans);font-weight:600;
}
.sd-name:focus{outline:none;border-bottom-color:var(--gold);}
.sd-name::placeholder{color:var(--text-faint);font-weight:400;}
.sd-type{
  font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:20px;flex-shrink:0;
  background:rgba(201,162,39,0.15);color:var(--gold-soft);border:1px solid rgba(201,162,39,0.4);
}

/* 중앙 카드 */
.sd-card{width:100%;max-width:660px;min-height:330px;display:flex;flex-direction:column;}
.sd-eyebrow{
  font-size:10px;font-family:var(--mono);letter-spacing:.1em;color:var(--text-faint);
  margin-bottom:9px;text-transform:uppercase;
}
.sd-ask{font-size:19px;font-weight:700;color:var(--text);line-height:1.45;margin-bottom:8px;letter-spacing:-.01em;}
.sd-why{font-size:12.5px;color:var(--text-dim);line-height:1.8;margin-bottom:16px;}
.sd-lens{
  font-size:12px;line-height:1.75;padding:8px 11px;border-radius:7px;margin-bottom:14px;
  background:rgba(201,162,39,0.06);border-left:2px solid rgba(201,162,39,0.5);color:var(--text-dim);
}
.sd-lens b{color:var(--gold-soft);font-weight:600;}
.sd-opts{display:flex;flex-direction:column;gap:7px;}
.sd-opt{
  text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:11px 13px;font-size:13.5px;font-family:var(--sans);
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s,transform .08s;
}
.sd-opt:hover{border-color:var(--border-strong);background:rgba(255,255,255,0.035);}
.sd-opt:active{transform:scale(.995);}
.sd-opt.sel{border-color:var(--gold);background:rgba(201,162,39,0.13);color:var(--gold-soft);font-weight:600;}
.sd-opt .sd-sub{display:block;font-size:11.5px;color:var(--text-faint);font-weight:400;margin-top:4px;}
.sd-opt.sel .sd-sub{color:var(--text-dim);}
.sd-opt.flat{cursor:default;}
.sd-opt.flat:hover{border-color:var(--border);background:var(--panel-2);}

.sd-verdict{
  margin-top:13px;padding:11px 13px;border-radius:8px;font-size:12.5px;line-height:1.8;
  border-left:2px solid var(--gold);background:rgba(201,162,39,0.07);color:var(--text);
}
.sd-verdict.warn{border-left-color:var(--red);background:var(--red-soft);}
.sd-verdict.good{border-left-color:var(--green);background:var(--green-soft);}
.sd-verdict b{color:var(--gold-soft);}
.sd-verdict.warn b{color:var(--red);}
.sd-verdict.good b{color:var(--green);}
.sd-memo{
  width:100%;margin-top:9px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:var(--sans);resize:vertical;min-height:46px;
}
.sd-memo:focus{outline:none;border-color:var(--gold);}
.sd-input{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:9px 11px;font-size:13px;font-family:var(--mono);width:110px;
}
.sd-input:focus{outline:none;border-color:var(--gold);}

/* 유형 발표 */
.sd-reveal{text-align:center;padding:2px 0 6px;}
.sd-reveal .big{font-size:30px;font-weight:800;color:var(--gold-soft);letter-spacing:-.02em;line-height:1.2;}
.sd-reveal .sub{font-size:12.5px;color:var(--text-dim);margin-top:6px;}
.sd-rx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin:16px 0 0;}
.sd-rx-item{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
.sd-rx-item .k{font-size:9.5px;font-family:var(--mono);letter-spacing:.05em;color:var(--text-faint);margin-bottom:5px;}
.sd-rx-item .v{font-size:13px;color:var(--text);font-weight:600;line-height:1.5;}
.sd-rx-item.hot{border-color:rgba(201,162,39,0.42);background:rgba(201,162,39,0.08);}
.sd-rx-item.hot .v{color:var(--gold-soft);}
.sd-trap{font-size:12px;color:var(--text-dim);line-height:1.8;margin-top:14px;padding-left:11px;border-left:2px solid var(--red);}

.sd-badge{display:inline-block;font-size:9.5px;font-family:var(--mono);padding:2px 7px;border-radius:4px;letter-spacing:.04em;vertical-align:middle;margin-left:8px;}
.sd-badge.core{background:rgba(201,162,39,0.2);color:var(--gold-soft);}
.sd-badge.mid{background:rgba(255,255,255,0.06);color:var(--text-dim);}
.sd-badge.low{background:rgba(255,255,255,0.04);color:var(--text-faint);}

.sd-crit{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.sd-crit label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.sd-crit input{accent-color:var(--gold);width:14px;height:14px;flex-shrink:0;}
.sd-score{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-top:9px;}
.sd-score.ok{color:var(--green);}
.sd-score.bad{color:var(--red);}

/* 최종 처방전 */
.sd-final{display:flex;flex-direction:column;gap:0;}
.sd-frow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;align-items:baseline;}
.sd-frow:last-child{border-bottom:none;}
.sd-frow .k{width:88px;flex-shrink:0;font-size:10.5px;font-family:var(--mono);color:var(--text-faint);letter-spacing:.04em;}
.sd-frow .v{flex:1;color:var(--text);line-height:1.65;}
.sd-frow .v .note{display:block;font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.sd-frow.hot .v{color:var(--gold-soft);font-weight:600;}

/* 하단 이동 */
.sd-nav{display:flex;gap:7px;align-items:center;margin-top:auto;padding-top:18px;flex-wrap:wrap;}
.sd-nav .sd-spacer{flex:1;}
.sd-go{
  background:var(--gold);border:1px solid var(--gold);color:#1a1508;font-weight:700;
  border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:var(--sans);
}
.sd-go:disabled{opacity:.28;cursor:default;}
.sd-ghost{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
}
.sd-ghost:hover{border-color:var(--border-strong);color:var(--text);}
.sd-ghost:disabled{opacity:.3;cursor:default;}

/* 지나온 판단 */
.sd-trail{width:100%;max-width:660px;margin-top:20px;padding-top:13px;border-top:1px solid var(--border);
  display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.sd-trail .t-lbl{font-size:9.5px;font-family:var(--mono);color:var(--text-faint);letter-spacing:.06em;margin-right:3px;}
.sd-chip{
  font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text-dim);cursor:pointer;white-space:nowrap;
}
.sd-chip:hover{border-color:var(--gold);color:var(--gold-soft);}
.sd-chip .n{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-right:4px;}

/* 저장된 카드 */
.sd-saved{width:100%;max-width:660px;margin-top:14px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.sd-saved .t-lbl{font-size:9.5px;font-family:var(--mono);color:var(--text-faint);letter-spacing:.06em;margin-right:3px;}
.sd-scard{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--border);background:var(--panel-2);cursor:pointer;
}
.sd-scard:hover{border-color:var(--border-strong);}
.sd-scard .nm{color:var(--text);font-weight:600;}
.sd-scard .ty{font-family:var(--mono);font-size:9.5px;color:var(--gold-soft);}
.sd-scard .del{color:var(--text-faint);}
.sd-scard .del:hover{color:var(--red);}

@media (max-width:700px){
  .sd-ask{font-size:16.5px;}
  .sd-reveal .big{font-size:25px;}
  .sd-card{min-height:0;}
  .sd-frow{flex-direction:column;gap:3px;}
  .sd-frow .k{width:auto;}
}

/* ---------- 자산>투자>종목: 통합 표 ---------- */
#inv-subnav{position:sticky;top:var(--hdr-h,0px);z-index:45;background:var(--bg);
  padding-top:6px;padding-bottom:2px;}
.bk-wrap{display:block;}
.bk-stick{position:sticky;top:calc(var(--hdr-h,0px) + var(--inv-nav-h,42px));z-index:40;
  background:var(--bg);padding-top:16px;display:block;}
.bk-top{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-bottom:14px;}
.bk-spacer{flex:1;}
.bk-stat{display:flex;flex-direction:column;gap:3px;}
.bk-stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--text-faint);}
.bk-stat b{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);line-height:1.1;}
.bk-stat b.up{color:#7fc0a0;} .bk-stat b.down{color:#e39189;}
.bk-fresh{font-family:var(--mono);font-size:10.5px;color:#7fc0a0;}
.bk-fresh.stale{color:var(--red);}
.bk-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
.bk-bar2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.bk-bar2 .sdb-strip{margin-bottom:0;}
.bk-q{height:32px;font-size:12.5px;flex:0 0 186px;width:186px;
  background:var(--panel);border-color:var(--border-strong);}
.bk-bar .bk-add{margin-left:auto;}
.bk-add{height:32px;background:var(--gold);border:0;border-radius:8px;color:#1a1508;
  font-family:var(--sans);font-weight:700;font-size:12px;padding:0 14px;cursor:pointer;white-space:nowrap;}
.bk-add:hover{filter:brightness(1.08);}
.bk-clear{background:transparent;border:1px solid var(--border);border-radius:14px;
  color:var(--text-faint);font-size:11px;padding:4px 11px;cursor:pointer;white-space:nowrap;}
.bk-clear:hover{border-color:var(--red);color:#e39189;}
.bk-pick{position:relative;}
.bk-pickbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;cursor:pointer;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);
  font-family:var(--sans);font-size:12px;white-space:nowrap;}
.bk-pickbtn:hover{border-color:var(--border-strong);color:var(--text);}
.bk-pickbtn.on{background:rgba(201,162,39,.14);border-color:var(--gold-soft);color:var(--gold-soft);}
.bk-pickbtn .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-faint);}
.bk-pickbtn.on .l{color:rgba(201,162,39,.7);}
.bk-pickbtn i{font-style:normal;font-size:9px;opacity:.6;}
.bk-pickdrop{left:0;right:auto;top:calc(100% + 4px);min-width:170px;max-height:330px;}
.bk-pickdrop .lg-catopt.on{color:var(--gold-soft);}
.bk-pickdrop .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
/* 열 묶음 이름 */
/* 묶음은 선이 아니라 옅은 띠로 나눈다 — 표에 이미 가로줄이 많아서 세로선까지 더하면 지저분해진다 */
.bk-groups{display:flex;gap:9px;padding:0 12px;margin-top:24px;}
.bk-groups span{display:flex;align-items:flex-end;min-width:0;overflow:hidden;
  border-radius:7px 7px 0 0;padding:5px 9px 4px;}
.bk-groups i{font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  font-style:normal;white-space:nowrap;color:var(--text-faint);}
.bk-groups .g2,.bk-groups .g3{background:rgba(255,255,255,.035);}
.bk-groups .g2 i,.bk-groups .g3 i{color:var(--text-dim);}
.bk-groups .g1{flex:1 1 auto;}
.bk-groups .g2{flex:0 0 340px;}
.bk-groups .g3{flex:0 0 93px;}
.bk-cols [data-s]{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;}
.bk-cols .ar{color:var(--gold-soft);font-size:8px;line-height:1;}
.bk-cols [data-s]:hover{color:var(--text);}
.bk-cols{margin-top:0;background:var(--bg);}
.bk-cols .va,.bk-cols .we,.bk-cols .gn,.bk-cols .pl,.bk-cols .rz,.bk-cols .sc{justify-content:flex-end;}
.bk-cols .nm,.bk-row .nm{flex:1 1 130px;min-width:0;}
.bk-cols .th,.bk-row .th{flex:0 0 132px;min-width:0;}
.bk-cols .va,.bk-row .va{flex:0 0 92px;text-align:right;}
.bk-cols .we,.bk-row .we{flex:0 0 62px;text-align:right;}
.bk-cols .gd,.bk-row .gd{flex:0 0 116px;}
.bk-cols .sc,.bk-row .sc{flex:0 0 52px;text-align:right;}
.bk-cols .vd,.bk-row .vd{flex:0 0 78px;}
.bk-cols .ck,.bk-row .ck{flex:0 0 58px;text-align:right;}
.bk-cols .gn,.bk-row .gn{flex:0 0 88px;text-align:right;}
.bk-cols .pl,.bk-row .pl{flex:0 0 58px;text-align:right;}
.bk-cols .rz,.bk-row .rz{flex:0 0 84px;text-align:right;}
/* 묶음 경계 — 얇은 선 하나로 기본 | 판단 | 히스토리 를 나눈다 */
/* 세로선을 지우고, 판단·히스토리 묶음에 아주 옅은 배경을 깐다 */
.bk-cols .gd,.bk-cols .sc,.bk-cols .vd,.bk-cols .ck,
.bk-row .gd,.bk-row .sc,.bk-row .vd,.bk-row .ck,
.bk-cols .rz,.bk-row .rz{background:rgba(255,255,255,.035);}
.bk-cols .sep,.bk-row .sep{margin-left:-4px;padding-left:4px;border-radius:4px 0 0 4px;}
.bk-cols .ck,.bk-row .ck,.bk-cols .rz,.bk-row .rz{padding-right:4px;margin-right:-4px;border-radius:0 4px 4px 0;}
.bk-cols{border-top:0;}
.bk-dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;display:inline-block;}
.bk-dot.y{background:var(--gold);}
.bk-dot.n{background:transparent;box-shadow:inset 0 0 0 1px var(--text-faint);}
.bk-row .nm.off{color:var(--text-faint);}
.bk-row .nm .tk{font-family:var(--mono);font-size:10px;color:var(--text-faint);font-style:normal;}
.bk-row{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;
  border-bottom:1px solid var(--border);cursor:default;user-select:none;}
.bk-card .bk-row:last-child{border-bottom:0;}
.bk-row:hover{background:var(--panel-2);}
.bk-row .nm{font-size:12.5px;color:var(--text);display:flex;align-items:baseline;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bk-row .va,.bk-row .we,.bk-row .gn,.bk-row .pl,.bk-row .rz,.bk-row .sc,.bk-row .ck{
  font-family:var(--mono);font-size:11.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
.bk-row .gn.up,.bk-row .rz.up{color:#7fc0a0;}
.bk-row .gn.down,.bk-row .rz.down{color:#e39189;}
.bk-row .th{display:flex;align-items:center;gap:3px;overflow:hidden;cursor:pointer;position:relative;
  border-radius:5px;}
.bk-row .th:hover{box-shadow:inset 0 0 0 1px var(--border-strong);}
.bk-tag{font-family:var(--mono);font-size:9px;font-style:normal;white-space:nowrap;
  background:rgba(255,255,255,.06);color:var(--text-dim);border-radius:4px;padding:2px 5px;}
.bk-tag.none{opacity:.4;}
.bk-thmenu{left:0;right:auto;top:calc(100% + 2px);min-width:180px;max-height:300px;}
.bk-thnew{padding:4px 4px 6px;}
.bk-thnew input{width:100%;background:var(--panel-2);}
.bk-thmenu .lg-catopt.on{color:var(--gold-soft);}
.bk-thmenu .ck{margin-left:auto;color:var(--gold-soft);font-size:10px;}
.bk-thsave{padding:6px 4px 2px;border-top:1px solid var(--border);margin-top:4px;}
.bk-thsave button{width:100%;background:var(--gold);border:0;border-radius:6px;color:#1a1508;
  font-weight:700;font-size:11.5px;padding:6px 0;cursor:pointer;}
.bk-row .sc em{font-style:normal;color:var(--text-faint);font-size:9.5px;}
.bk-row .ck{color:var(--text-faint);}
.bk-row .pl.up{color:#7fc0a0;} .bk-row .pl.down{color:#e39189;}
.bk-row .we .over{color:var(--gold);margin-left:3px;font-size:12px;}
.bk-row .gd{display:flex;align-items:center;gap:6px;overflow:hidden;}
.bk-gd{font-family:var(--mono);font-size:9.5px;border-radius:4px;padding:2px 6px;font-style:normal;white-space:nowrap;}
.bk-gd.pass{background:var(--green-soft);color:#7fc0a0;}
.bk-gd.fail{background:var(--red-soft);color:#e39189;}
.bk-gd.wip{background:rgba(201,162,39,.14);color:var(--gold-soft);}
.bk-gd.none{background:rgba(255,255,255,.05);color:var(--text-faint);}
.bk-row .gd em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.bk-vd,.bk-gdc,.bk-ckc{position:relative;cursor:pointer;}
.bk-gdc:hover,.bk-ckc:hover{box-shadow:inset 0 0 0 1px var(--border-strong);border-radius:5px;}
.bk-gd .man{color:var(--gold);font-size:11px;margin-left:1px;}
.bk-gmenu{left:0;right:auto;min-width:170px;}
.bk-gmenu .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.bk-ckin{width:100%;font-size:11px;color-scheme:dark;background:var(--bg-2);}
.bk-vdi{font-family:var(--sans);font-size:11px;border-radius:11px;padding:3px 9px;font-style:normal;
  border:1px solid var(--border);color:var(--text-dim);white-space:nowrap;}
.bk-vdi.none{border-color:transparent;color:var(--text-faint);}
.bk-vdi.v-buy,.bk-vdi.v-add{background:var(--green-soft);border-color:rgba(76,140,107,.45);color:#8fd0af;}
.bk-vdi.v-trim,.bk-vdi.v-exit{background:var(--red-soft);border-color:rgba(193,72,63,.45);color:#e39189;}
.bk-vdi.v-hold{background:rgba(255,255,255,.05);}
.bk-vdi.v-watch{background:rgba(201,162,39,.14);border-color:rgba(201,162,39,.35);color:var(--gold-soft);}
.bk-vmenu{left:auto;right:0;top:calc(100% + 2px);min-width:110px;}
.bk-vmenu .lg-catopt.on{background:var(--panel-2);color:var(--gold-soft);}
.bk-vmenu .tx.dim{color:var(--text-faint);}
/* 판정 카드는 표를 밀어내지 않고 가운데 띄운다 */
.bk-modal{position:fixed;inset:0;z-index:300;background:rgba(8,10,15,.72);
  display:flex;align-items:center;justify-content:center;padding:28px 18px;
  backdrop-filter:blur(3px);}
.bk-sheet{position:relative;width:min(960px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--border-strong);border-radius:14px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8);}
.bk-sheetbody{overflow-y:auto;padding:20px 24px 24px;scrollbar-width:thin;}
.bk-x{position:absolute;right:10px;top:8px;z-index:2;background:none;border:0;
  color:var(--text-faint);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;}
.bk-x:hover{color:var(--text);}
.bk-sheet .sdc-head{padding-right:34px;}
.bk-sheet .sdc-sec{padding:13px 0;}
.bk-sheet .sdc-row{padding:6px 0;}
@media(max-width:640px){
  .bk-modal{padding:12px 8px;}
  .bk-sheet{max-height:92vh;}
  .bk-sheetbody{padding:16px 14px 18px;}
}

.sd-headright{display:flex;align-items:center;gap:10px;}

.st.pass{color:#7fc0a0;} .st.fail{color:#d98a82;} .st.wip{color:var(--gold-soft);} .st.none{color:var(--text-faint);}

.sdc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;

.sdc-sub b{color:var(--text);} .sdc-sub .up{color:#7fc0a0;} .sdc-sub .down{color:#d98a82;}
.sdc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.sdc-badge.fail{background:var(--red-soft);color:#e39189;border-color:rgba(193,72,63,.4);}

.sdc-sec{padding:16px 0;border-bottom:1px solid var(--border);}

  font-weight:700;color:var(--text);margin-bottom:11px;}

.sdc-h i{font-style:normal;font-weight:400;font-size:11px;color:var(--text-faint);margin-left:auto;}

.sdc-row{display:flex;align-items:center;gap:12px;padding:7px 0;
  border-top:1px dotted var(--border);}

.sdc-row .q .t{display:block;font-size:12.5px;color:var(--text);}

  color:var(--text-faint);margin-left:7px;}

.sdc-row .a{display:flex;gap:3px;flex-shrink:0;}
.sd-tri{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-faint);font-family:var(--sans);font-size:11px;padding:4px 9px;cursor:pointer;}
.sd-tri:hover{border-color:var(--border-strong);color:var(--text);}
.sd-tri.on.ok{background:var(--green-soft);border-color:rgba(76,140,107,.5);color:#8fd0af;}
.sd-tri.on.warn{background:rgba(201,162,39,.18);border-color:rgba(201,162,39,.5);color:var(--gold-soft);}
.sd-tri.on.no{background:var(--red-soft);border-color:rgba(193,72,63,.5);color:#e39189;}

.sdc-stop{margin-top:11px;background:var(--red-soft);border:1px solid rgba(193,72,63,.35);

.sdc-note{margin-top:9px;font-size:11.5px;color:var(--text-faint);line-height:1.6;}
.sdc-tags{display:flex;flex-wrap:wrap;gap:5px;}
.sd-tag{background:var(--panel-2);border:1px solid var(--border);border-radius:15px;
  color:var(--text-dim);font-family:var(--sans);font-size:11.5px;padding:5px 12px;cursor:pointer;}
.sd-tag:hover{border-color:var(--border-strong);color:var(--text);}
.sd-tag.on{background:rgba(201,162,39,.18);border-color:var(--gold-soft);color:var(--gold-soft);font-weight:600;}
.sd-tag.act.on{background:var(--gold);border-color:var(--gold);color:#1a1508;font-weight:700;}

.sdc-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);margin-bottom:10px;overflow:hidden;}
.sdc-bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .2s;}
.sdc-grade{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-top:12px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;}
.sdc-grade .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);}
.sdc-grade .v{font-size:13.5px;font-weight:700;color:var(--gold-soft);margin-right:4px;}
.sdc-grade .v.sm{font-size:11.5px;font-weight:400;color:var(--text-dim);}

.sdc-sent{background:var(--panel-2);border-left:2px solid var(--gold-soft);border-radius:0 8px 8px 0;
  padding:11px 14px;font-size:12.5px;line-height:1.85;color:var(--text-dim);margin-bottom:12px;}
.sdc-sent b{color:var(--text);font-weight:600;}
.sd-blank{color:var(--text-faint);font-style:normal;letter-spacing:.04em;}

.sdc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px;}

.sdc-fields label{display:flex;flex-direction:column;gap:4px;min-width:0;}

.sdc-fields label span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-faint);}

.sdc-memo{display:flex;flex-direction:column;gap:5px;margin-top:11px;}
.sdc-memo span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-faint);}
.sdc-memo textarea{background:var(--panel-2);border-color:var(--border);font-size:12px;
  line-height:1.7;padding:9px 11px;resize:vertical;height:auto;}
.sd-ghost.danger:hover{border-color:rgba(193,72,63,.5);color:#e39189;}
@media(max-width:1000px){
  .sdb{grid-template-columns:1fr;}
  .sdb-side{position:static;}
  .sdb-list{max-height:230px;}
  .sdc-fields,.sdc-fields.three{grid-template-columns:1fr;}
  .sdc-row{flex-direction:column;align-items:stretch;gap:7px;}
  .sdc-row .a{justify-content:flex-start;}
}

.sv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin:12px 0 4px;}

/* ---------------- 로컬 저장소 shim ----------------
   GitHub Pages에는 window.storage가 없어서 예산·체크리스트가 저장되지 않고 있었다.
   localStorage로 같은 인터페이스를 채운다. */
if (!window.storage) {
  const P = 'haedal:';
  window.storage = {
    async get(k) { const v = localStorage.getItem(P + k); if (v === null) throw new Error('not found: ' + k); return { key: k, value: v, shared: false }; },
    async set(k, v) { localStorage.setItem(P + k, v); return { key: k, value: v, shared: false }; },
    async delete(k) { localStorage.removeItem(P + k); return { key: k, deleted: true, shared: false }; },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const kk = localStorage.key(i);
        if (!kk || kk.indexOf(P) !== 0) continue;
        const k = kk.slice(P.length);
        if (!prefix || k.indexOf(prefix) === 0) keys.push(k);
      }
      return { keys, prefix, shared: false };
    }
  };
}

/* ---------------- helpers ---------------- */

function cleanLabel(s) {
  if (!s) return '';
  s = s.replace(/^\[merged\]\s*/, '');
  s = s.replace(/^[^\uAC00-\uD7A3A-Za-z0-9]+/, '');
  return s.trim();
}

function parseWon(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (s === '' || s === '-' || s === '₩ -' || s === '₩-') return 0;
  if (!/[\d]/.test(s)) return null;
  const neg = s.includes('(') || /^-/.test(s.replace(/[₩\s]/g, ''));
  /* 통화기호·공백·천단위 콤마만 제거하고 소수점은 남긴다.
     예전에는 [^\d]를 전부 제거해서 "17857.14286"이 1,785,714,286원이 됐다. */
  const cleaned = s.replace(/[^\d.]/g, '');
  if (cleaned === '' || cleaned === '.') return null;
  const v = parseFloat(cleaned);
  if (isNaN(v)) return null;
  return Math.round(neg ? -v : v);
}

function formatWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  return (neg ? '-₩' : '₩') + abs.toLocaleString('ko-KR');
}

function formatCompactWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(n);
  let out;
  if (abs >= 100000000) out = (abs / 100000000).toFixed(2).replace(/\.00$/, '') + '억';
  else if (abs >= 10000) out = Math.round(abs / 10000).toLocaleString() + '만';
  else out = Math.round(abs).toLocaleString();
  return (neg ? '-' : '') + out;
}

function wonComma(n) {
  if (n === null || n === undefined || isNaN(n)) return '0';
  return Math.round(Math.abs(n)).toLocaleString('ko-KR');
}

/* ---------------- CSV parsing (live sync) ---------------- */

function parseAssetsFromRows(rows) {
  const dateRe = /^\d{2}년\s*\d{2}월$/;
  const assetRows = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let j = 0; j < row.length; j++) {
      const cell = (row[j] || '').trim();
      if (dateRe.test(cell)) {
        if (j + 3 < row.length) {
          const cat = cleanLabel(row[j + 1] || '');
          const acct = (row[j + 2] || '').trim();
          const amt = parseWon(row[j + 3]);
          if (cat && amt !== null) {
            assetRows.push({ date: cell, category: cat, account: acct, amount: amt });
          }
        }
        break;
      }
    }
  }
  return assetRows;
}

/* 지수_S&P500 탭: 년월 / 종가 두 컬럼.
   구글 시트가 "2023-03"을 날짜로 해석해버리므로 gviz/tq CSV에서는
   "2023. 3. 1" 형태로 내려온다. 원문 문자열/날짜/한글표기 모두 받는다.
   컬럼은 항상 헤더명으로 찾는다 — 컬럼이 추가돼도 안 깨지게. */
function normIndexMonthKey(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})[.\-/년]\s*(\d{1,2})/);          // 2023-03 / 2023. 3. 1 / 2023년 3월
  if (m) return `${m[1]}-${String(parseInt(m[2], 10)).padStart(2, '0')}`;
  m = s.match(/^(\d{2})년\s*(\d{1,2})월/);                   // 23년 03월
  if (m) return `${2000 + parseInt(m[1], 10)}-${String(parseInt(m[2], 10)).padStart(2, '0')}`;
  return null;
}

function parseIndexFromRows(rows) {
  let headerRowIdx = -1, monthCol = -1, closeCol = -1;
  for (let r = 0; r < rows.length && r < 30; r++) {
    const row = (rows[r] || []).map(c => cleanLabel(c || ''));
    const mi = row.findIndex(c => c === '년월' || c === '월' || c === '기준월');
    const ci = row.findIndex(c => c === '종가' || c === '지수' || c === '가격');
    if (mi !== -1 && ci !== -1) { headerRowIdx = r; monthCol = mi; closeCol = ci; break; }
  }
  if (headerRowIdx === -1) return {};

  const out = {};
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const key = normIndexMonthKey(row[monthCol]);
    if (!key) continue;
    const v = parseFloat(String(row[closeCol] || '').replace(/[^0-9.\-]/g, ''));
    if (!isFinite(v) || v <= 0) continue;
    out[key] = v;
  }
  return out;
}

/* 목표 탭: 시기 / 구분 / 목표 / 상태 / 달성한 날 / 메모 컬럼 구조.
   "시기"와 "상태"가 함께 있는 행만 헤더로 인정한다 — 가계부(D)의
   헤더(날짜,대분류,소분류,항목,사용처,금액,메모,Good/Bad,회사 환급,고정비)에는
   이 두 단어가 없어서, 다른 탭을 잘못 목표로 오인할 위험이 없다. */
function parseGoalsFromRows(rows) {
  let headerRowIdx = -1, headerCols = [];
  for (let r = 0; r < rows.length; r++) {
    const row = (rows[r] || []).map(c => cleanLabel(c || ''));
    if (row.includes('시기') && row.includes('상태')) { headerRowIdx = r; headerCols = row; break; }
  }
  if (headerRowIdx === -1) return [];

  const colIdxs = [];
  headerCols.forEach((name, i) => { if (name) colIdxs.push({ name, i }); });

  const goals = [];
  for (let r = headerRowIdx + 1; r < rows.length && r < headerRowIdx + 500; r++) {
    const row = rows[r] || [];
    const obj = {};
    let hasAny = false;
    colIdxs.forEach(({ name, i }) => {
      const v = (row[i] || '').trim();
      if (v) hasAny = true;
      obj[name] = v;
    });
    if (!hasAny) continue;
    obj.__row = r + 1;   /* 시트 실제 행 번호 (쓰기 반영용) */
    goals.push(obj);
  }
  return goals;
}
