<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MY 자산 통장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e121a;
  --bg-2:#141a25;
  --panel:#171e2b;
  --panel-2:#1e2635;
  --border:rgba(233,231,223,0.09);
  --border-strong:rgba(233,231,223,0.16);
  --paper:#f3ecd9;
  --paper-2:#ece2c6;
  --ink:#231d10;
  --ink-dim:#5a5138;
  --gold:#c9a227;
  --gold-soft:#e0c766;
  --red:#c1483f;
  --red-soft:rgba(193,72,63,0.16);
  --green:#4c8c6b;
  --green-soft:rgba(76,140,107,0.16);
  --text:#eae8e0;
  --text-dim:#9aa3b6;
  --text-faint:#6b7385;
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(76,140,107,0.06), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:none;
  width:100%;
  margin:0 auto;
  padding:0 clamp(16px, 2.5vw, 40px) 80px;
  box-sizing:border-box;
}
::selection{background:var(--gold);color:#1a1508;}

/* ---------- sticky header ---------- */
.site-header{
  position:sticky;
  top:0;
  z-index:100;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    var(--bg);
  padding-top:28px;
  margin:0 calc(-1 * clamp(16px, 2.5vw, 40px));
  padding-left:clamp(16px, 2.5vw, 40px);
  padding-right:clamp(16px, 2.5vw, 40px);
  border-bottom:1px solid var(--border);
}
#page-content{padding-top:22px;display:flex;flex-direction:column;gap:16px;}
.grid-top{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
@media (max-width:820px){.grid-top{grid-template-columns:1fr;}}

/* ---------- top bar ---------- */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand .mark{
  font-family:var(--serif);
  font-weight:900;
  font-size:15px;
  letter-spacing:0.14em;
  color:var(--gold-soft);
  border:1px solid var(--border-strong);
  padding:3px 8px;
  border-radius:3px;
}
.brand h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  margin:0;
  letter-spacing:-0.01em;
}
.sync-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
}
.sync-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--text-faint);
  box-shadow:0 0 0 3px transparent;
  transition:all .3s;
}
.sync-dot.live{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.sync-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.sync-dot.loading{background:var(--gold);animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.btn{
  font-family:var(--sans);
  font-weight:500;
  font-size:12.5px;
  background:var(--panel-2);
  color:var(--text);
  border:1px solid var(--border-strong);
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.btn:hover{border-color:var(--gold-soft);}
.btn:active{transform:scale(0.97);}
.btn.small{padding:5px 9px;font-size:11.5px;}

/* ---------- hero / stamp ---------- */
.hero{
  position:relative;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:16px;
  padding:34px 30px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
  overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
  border:1px solid rgba(0,0,0,0.06);
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(transparent, transparent 27px, rgba(35,29,16,0.05) 28px);
  pointer-events:none;
}
.hero-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
.hero-amount{
  font-family:var(--serif);
  font-weight:900;
  font-size:clamp(34px,5.4vw,54px);
  color:var(--ink);
  line-height:1.05;
  letter-spacing:-0.01em;
  position:relative;
}
.hero-delta{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:var(--mono);
  font-size:13.5px;
  font-weight:600;
  padding:4px 10px;
  border-radius:20px;
}
.hero-delta.down{background:var(--red-soft);color:#8a2f28;}
.hero-delta.up{background:var(--green-soft);color:#2b5c42;}
.hero-sub{
  margin-top:14px;
  font-size:12.5px;
  color:var(--ink-dim);
  font-family:var(--sans);
  max-width:420px;
  line-height:1.6;
}
.stamp{
  width:118px;height:118px;
  border-radius:50%;
  border:2.5px solid var(--red);
  color:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transform:rotate(-9deg);
  opacity:0.9;
  font-family:var(--serif);
  position:relative;
  flex-shrink:0;
}
.stamp::before{
  content:'';
  position:absolute;inset:6px;
  border:1px solid var(--red);
  border-radius:50%;
  opacity:0.55;
}
.stamp .s-top{font-size:10px;letter-spacing:0.1em;font-weight:700;margin-bottom:2px;}
.stamp .s-mid{font-size:19px;font-weight:900;}
.stamp .s-bot{font-size:9px;letter-spacing:0.08em;margin-top:2px;font-family:var(--mono);}

/* ---------- grid / panels ---------- */
.grid{
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:16px;
  margin-top:16px;
}
@media (max-width:820px){
  .grid{grid-template-columns:1fr;}
  .hero{grid-template-columns:1fr;text-align:left;}
  .stamp{transform:rotate(-6deg);}
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 20px 22px;
}
.panel-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:15.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  row-gap:8px;
  margin:0 0 14px;
}
.panel-title .eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:0.1em;
  font-weight:400;
  display:block;
  margin-bottom:3px;
}
.full{grid-column:1 / -1;}

/* ---------- ledger table (Monthly Review mirror) ---------- */
.ledger-group{margin-bottom:4px;}
.ledger-group-name{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--gold-soft);
  letter-spacing:0.08em;
  padding:10px 0 6px;
  border-bottom:1px dashed var(--border-strong);
}
.ledger-row{
  display:grid;
  grid-template-columns:1fr auto auto 28px;
  gap:10px;
  align-items:baseline;
  padding:9px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
}
.ledger-row:last-child{border-bottom:none;}
.ledger-item{color:var(--text);}
.ledger-current{font-family:var(--mono);text-align:right;color:var(--text);}
.ledger-target{font-family:var(--mono);text-align:right;color:var(--text-faint);font-size:12px;}
.ledger-verdict{text-align:center;font-size:13px;}
.ledger-verdict.ok{color:var(--green);}
.ledger-verdict.no{color:var(--red);}

/* ---------- insights ---------- */
.insight{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
  line-height:1.55;
}
.insight:last-child{border-bottom:none;}
.insight .dot{
  flex-shrink:0;
  margin-top:5px;
  width:6px;height:6px;
  border-radius:50%;
}
.insight.warn .dot{background:var(--red);}
.insight.good .dot{background:var(--green);}
.insight.info .dot{background:var(--gold);}
.insight b{color:var(--gold-soft);font-weight:600;}

/* ---------- chart wrap ---------- */
.chart-wrap{position:relative;height:230px;}
.chart-wrap.tall{height:270px;}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* ---------- range toggle ---------- */
.range-toggle{display:flex;gap:4px;}
.range-toggle button{
  font-family:var(--mono);font-size:10.5px;
  background:transparent;border:1px solid var(--border-strong);
  color:var(--text-dim);padding:3px 8px;border-radius:5px;cursor:pointer;
}
.range-toggle button.active{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600;}

/* ---------- allocation list ---------- */
.alloc-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;font-size:12.5px;
}
.alloc-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.alloc-name{flex:1;color:var(--text-dim);}
.alloc-pct{font-family:var(--mono);color:var(--text);width:46px;text-align:right;}
.alloc-amt{font-family:var(--mono);color:var(--text);width:auto;text-align:right;font-size:12px;}

/* ---------- settings ---------- */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px dotted var(--border);gap:10px;
}
.settings-row:last-child{border-bottom:none;}
.settings-row label{font-size:12.5px;color:var(--text-dim);}
.settings-row input{
  width:110px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:12.5px;
  border-radius:6px;padding:6px 8px;text-align:right;
}
.settings-note{font-size:11px;color:var(--text-faint);line-height:1.6;margin-top:10px;}

/* ---------- category bars ---------- */
.cat-row{margin:12px 0;}
.cat-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.cat-row-top .amt{font-family:var(--mono);color:var(--text-dim);}
.cat-bar-track{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.cat-row.over .cat-bar-fill{background:linear-gradient(90deg,var(--red),#d9756c);}
.cat-tag{font-family:var(--mono);font-size:10px;color:var(--red);margin-left:6px;}
.budget-input{
  width:88px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:11.5px;
  border-radius:5px;padding:3px 6px;text-align:right;margin-left:4px;
}
.month-nav select{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:5px 8px;
}

/* ---------- banner ---------- */
.banner{
  display:flex;align-items:center;gap:10px;
  background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:10px;padding:11px 14px;margin-bottom:14px;
  font-size:12.5px;color:var(--text-dim);
}
.banner.err{border-color:rgba(193,72,63,0.4);color:#e3a29c;}
.banner button{margin-left:auto;}

/* ---------- footer ---------- */
.footer{
  margin-top:26px;
  text-align:center;
  font-size:11.5px;
  color:var(--text-faint);
  font-family:var(--mono);
  line-height:1.9;
}
.footer a{color:var(--gold-soft);text-decoration:none;}
.footer a:hover{text-decoration:underline;}

.empty-state{
  font-size:12.5px;color:var(--text-faint);
  text-align:center;padding:20px 0;
}

.skeleton{
  background:linear-gradient(90deg,var(--panel-2) 25%,rgba(255,255,255,0.06) 37%,var(--panel-2) 63%);
  background-size:400% 100%;
  animation:sk 1.4s ease infinite;
  border-radius:6px;
}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- nav ---------- */
.navbar{
  display:flex;gap:6px;margin:16px 0 0;
  overflow-x:auto;
}
.nav-btn{
  font-family:var(--sans);font-weight:500;font-size:13px;
  background:transparent;border:none;color:var(--text-dim);
  padding:9px 14px;cursor:pointer;position:relative;white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:color .15s;
}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);font-weight:700;}

/* ---------- stat cards ---------- */
.stat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px;
}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:15px 16px;
}
.stat-card .label{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.05em;}
.stat-card .value{font-family:var(--serif);font-weight:800;font-size:21px;margin-top:5px;color:var(--text);}
.stat-card .sub{font-size:11px;color:var(--text-dim);margin-top:4px;font-family:var(--mono);}
.stat-card .sub.up{color:var(--green);}
.stat-card .sub.down{color:var(--red);}

/* ---------- data table (가계부) ---------- */
.table-controls{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
}
.table-controls input[type="text"]{
  flex:1;min-width:160px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:8px 10px;
}
.table-controls select{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:8px 10px;
}
.table-meta{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{
  text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid var(--border-strong);
  position:sticky;top:0;background:var(--panel);
}
.data-table tbody td{
  padding:9px 8px;border-bottom:1px dotted var(--border);color:var(--text-dim);
  white-space:nowrap;
}
.data-table tbody tr:hover td{background:rgba(255,255,255,0.02);}
.data-table td.amt{font-family:var(--mono);text-align:right;}
.data-table td.amt.income{color:var(--green);}
.data-table td.amt.expense{color:var(--red);}
.data-table td.amt.transfer{color:var(--gold-soft);}
.table-scroll{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
.tag-pill{
  display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;
}
.tag-pill.income{background:var(--green-soft);color:#2b5c42;}
.tag-pill.expense{background:var(--red-soft);color:#8a2f28;}
.tag-pill.transfer{background:rgba(201,162,39,0.18);color:#8a6c15;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.pager button{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;}
.pager button:disabled{opacity:.35;cursor:default;}

/* ---------- account list (투자 페이지) ---------- */
.acct-row{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--border);font-size:12.5px;
}
.acct-row:last-child{border-bottom:none;}
.acct-name{flex:1;color:var(--text);}
.acct-cat{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.acct-amt{font-family:var(--mono);color:var(--text);}

/* ---------- gauge ---------- */
.gauge-wrap{position:relative;height:150px;margin-top:4px;}
.gauge-wrap canvas{width:100% !important;height:100% !important;}
.gauge-label{
  position:absolute;left:0;right:0;top:60%;text-align:center;pointer-events:none;
}
.gauge-value{font-family:var(--serif);font-weight:800;font-size:26px;}
.gauge-target{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:2px;}

/* ---------- category flex (pie + bars) ---------- */
.cat-flex{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
.cat-flex .pie-col{width:200px;flex-shrink:0;}
.cat-flex .bars-col{flex:1;min-width:220px;}
@media (max-width:600px){
  .cat-flex .pie-col{width:100%;}
}

/* ---------- 3-column grid variant (home allocation/trend/gauge row) ---------- */
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:820px){
  .grid-3{grid-template-columns:1fr;}
}

/* ---------- checklist checkbox accent ---------- */
.fixed-check{accent-color:var(--gold);}

/* ---------- goal hero ---------- */
.goal-bars{margin-top:16px;max-width:420px;}
.goal-bar-row{display:flex;justify-content:space-between;font-size:12.5px;font-family:var(--mono);color:var(--ink);margin-bottom:4px;}
.goal-bar-row span:first-child{font-family:var(--sans);color:var(--ink-dim);}

/* ---------- month nav ---------- */
.month-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.month-nav select{flex-shrink:0;}
.month-nav button{
  flex-shrink:0;white-space:nowrap;
}
.month-nav button:not(.btn){
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;
}
.month-nav button:disabled{opacity:.3;cursor:default;}
.month-nav .month-label{font-family:var(--mono);font-size:13px;min-width:64px;text-align:center;}

/* ---------- callout / verdict box ---------- */
.callout{
  border-radius:12px;padding:16px 18px;margin-bottom:16px;
  border:1px solid var(--border-strong);
}
.callout.good{background:rgba(76,140,107,0.1);border-color:rgba(76,140,107,0.35);}
.callout.warn{background:rgba(193,72,63,0.1);border-color:rgba(193,72,63,0.35);}
.callout-title{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:6px;}
.callout-body{font-size:13px;line-height:1.6;color:var(--text-dim);}

/* ---------- advanced table (group/sort/filter) ---------- */
.at-group{
  border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;
}
.at-group-summary{
  list-style:none;cursor:pointer;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-family:var(--mono);color:var(--text);
  background:var(--panel-2);
}
.at-group-summary::-webkit-details-marker{display:none;}
.at-group-summary span:first-child{font-family:var(--sans);color:var(--text-dim);}

/* ---------- goal cards ---------- */
.goal-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
.goal-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;}
.goal-card.ok{border-color:rgba(76,140,107,0.4);}
.goal-card.no{border-color:rgba(193,72,63,0.4);}
.goal-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}

/* ---------------- helpers ---------------- */

function cleanLabel(s) {
  if (!s) return '';
  s = s.replace(/^\[merged\]\s*/, '');
  s = s.replace(/^[^\uAC00-\uD7A3A-Za-z0-9]+/, '');
  return s.trim();
}

function parseWon(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (s === '' || s === '-' || s === '₩ -' || s === '₩-') return 0;
  if (!/[\d]/.test(s)) return null;
  const neg = s.includes('(');
  const digits = s.replace(/[^\d]/g, '');
  if (digits === '') return null;
  const v = parseInt(digits, 10);
  return neg ? -v : v;
}

function formatWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  return (neg ? '-₩' : '₩') + abs.toLocaleString('ko-KR');
}

function formatCompactWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(n);
  let out;
  if (abs >= 100000000) out = (abs / 100000000).toFixed(2).replace(/\.00$/, '') + '억';
  else if (abs >= 10000) out = Math.round(abs / 10000).toLocaleString() + '만';
  else out = Math.round(abs).toLocaleString();
  return (neg ? '-' : '') + out;
}

function pivotMonthKey(s) {
  const m = s.match(/(\d{4})-(\d{1,2})월/);
  if (!m) return 0;
  return parseInt(m[1]) * 100 + parseInt(m[2]);
}
function assetMonthKey(s) {
  const m = s.match(/(\d{2})년\s*(\d{2})월/);
  if (!m) return 0;
  return (2000 + parseInt(m[1])) * 100 + parseInt(m[2]);
}
function assetMonthLabel(s) {
  const m = s.match(/(\d{2})년\s*(\d{2})월/);
  if (!m) return s;
  return `'${m[1]}.${m[2]}`;
}
function pivotMonthLabel(s) {
  const m = s.match(/(\d{4})-(\d{1,2})월/);
  if (!m) return s;
  return `'${m[1].slice(2)}.${String(m[2]).padStart(2, '0')}`;
}
function ledgerDateKey(s) {
  const m = s.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
  if (!m) return 0;
  return parseInt(m[1]) * 10000 + parseInt(m[2]) * 100 + parseInt(m[3]);
}

/* ---------------- CSV parsing (live sync) ---------------- */

function parseAssetsFromRows(rows) {
  const dateRe = /^\d{2}년\s*\d{2}월$/;
  const assetRows = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let j = 0; j < row.length; j++) {
      const cell = (row[j] || '').trim();
      if (dateRe.test(cell)) {
        if (j + 3 < row.length) {
          const cat = cleanLabel(row[j + 1] || '');
          const acct = (row[j + 2] || '').trim();
          const amt = parseWon(row[j + 3]);
          if (cat && amt !== null) {
            assetRows.push({ date: cell, category: cat, account: acct, amount: amt });
          }
        }
        break;
      }
    }
  }
  return assetRows;
}

/* 목표 탭: 시기 / 구분 / 목표 / 상태 / 달성한 날 / 메모 컬럼 구조.
   "시기"와 "상태"가 함께 있는 행만 헤더로 인정한다 — 가계부(D)의
   헤더(날짜,대분류,소분류,항목,사용처,금액,메모,재분류,고정비)에는
   이 두 단어가 없어서, 다른 탭을 잘못 목표로 오인할 위험이 없다. */
function parseGoalsFromRows(rows) {
  let headerRowIdx = -1, headerCols = [];
  for (let r = 0; r < rows.length; r++) {
    const row = (rows[r] || []).map(c => cleanLabel(c || ''));
    if (row.includes('시기') && row.includes('상태')) { headerRowIdx = r; headerCols = row; break; }
  }
  if (headerRowIdx === -1) return [];

  const colIdxs = [];
  headerCols.forEach((name, i) => { if (name) colIdxs.push({ name, i }); });

  const goals = [];
  for (let r = headerRowIdx + 1; r < rows.length && r < headerRowIdx + 500; r++) {
    const row = rows[r] || [];
    const obj = {};
    let hasAny = false;
    colIdxs.forEach(({ name, i }) => {
      const v = (row[i] || '').trim();
      if (v) hasAny = true;
      obj[name] = v;
    });
    if (!hasAny) continue;
    goals.push(obj);
  }
  return goals;
}

const GOAL_FIELD_ALIASES = {
  period: ['시기', '연도', '기간', '일정', '분기', '목표시기'],
  category: ['구분', '분류', '카테고리'],
  title: ['목표', '항목', '내용', '제목'],
  status: ['상태', '진행상태', '진행'],
  doneDate: ['달성한 날', '달성일'],
  memo: ['메모', '비고', '노트'],
  priority: ['우선순위']
};

function pickGoalField(goal, key) {
  const names = GOAL_FIELD_ALIASES[key] || [];
  for (const n of names) {
    if (goal[n] !== undefined && goal[n] !== '') return goal[n];
  }
  return null;
}

function goalStatusClass(status) {
  if (!status) return '';
  const s = String(status);
  if (/(완료|달성|✅|done|complete)/i.test(s)) return 'ok';
  if (/(지연|실패|❌|미달|보류)/i.test(s)) return 'no';
  return '';
}

function parseLedgerFromRows(rows) {
  let r0 = -1, c0 = -1;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length - 3; c++) {
      if (row[c] === '날짜' && row[c + 1] === '대분류' && row[c + 2] === '소분류' && row[c + 3] === '항목') {
        r0 = r; c0 = c; break;
      }
    }
    if (r0 !== -1) break;
  }
  if (r0 === -1) return [];

  const dateRe = /^\d{4}\.\s*\d{1,2}\.\s*\d{1,2}$/;
  const ledger = [];
  let missStreak = 0;
  for (let r = r0 + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const dateCell = (row[c0] || '').trim();
    if (!dateRe.test(dateCell)) {
      missStreak++;
      if (missStreak > 25) break;
      continue;
    }
    missStreak = 0;
    const major = cleanLabel(row[c0 + 1] || '');
    const minor = cleanLabel(row[c0 + 2] || '');
    const item = (row[c0 + 3] || '').trim();
    const amount = parseWon(row[c0 + 5]);
    const vendor = cleanLabel(row[c0 + 6] || '');
    const memo = (row[c0 + 7] || '').trim();
    const reclass = (row[c0 + 8] || '').trim();
    const fixed = !!(row[c0 + 9] || '').trim();
    if (amount === null || amount === 0) continue;
    ledger.push({ date: dateCell, major, minor, item, amount, vendor, memo, reclass, fixed });
  }
  return ledger;
}

/* 가계부(M) 피벗 탭은 Google Sheets 병합 셀이 gviz CSV export에서
   깨져 나오는 문제가 있어(월 헤더 행이 빈 문자열로 export됨),
   parsePivotFromRows가 못 찾을 때가 있다. 이미 정상 파싱되는
   가계부(D) 일별 원장(ledger)에서 동일한 모양의 요약을 직접
   집계해서 그 자리를 대체한다. */
function buildPivotFromLedger(ledger) {
  if (!ledger || !ledger.length) return null;

  const monthOf = (dateCell) => {
    const m = dateCell.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    if (!m) return null;
    return `${m[1]}-${parseInt(m[2], 10)}월`;
  };

  const monthSet = new Set();
  ledger.forEach(r => { const mk = monthOf(r.date); if (mk) monthSet.add(mk); });
  const months = Array.from(monthSet).sort((a, b) => pivotMonthKey(a) - pivotMonthKey(b));
  if (months.length === 0) return null;
  const monthIdx = {};
  months.forEach((m, i) => { monthIdx[m] = i; });
  const zeros = () => months.map(() => 0);

  const incomeTotal = zeros(), expenseTotal = zeros();
  const expenseCategories = {}, incomeCategories = {}, transferCategories = {};

  ledger.forEach(r => {
    const mk = monthOf(r.date);
    if (!mk) return;
    const idx = monthIdx[mk];
    if (idx === undefined) return;
    const amt = r.amount || 0;
    if (r.major === '지출') {
      if (!expenseCategories[r.minor]) expenseCategories[r.minor] = zeros();
      expenseCategories[r.minor][idx] += amt;
      expenseTotal[idx] += amt;
    } else if (r.major === '수입') {
      if (!incomeCategories[r.minor]) incomeCategories[r.minor] = zeros();
      incomeCategories[r.minor][idx] += amt;
      incomeTotal[idx] += amt;
    } else if (r.major === '이체') {
      if (!transferCategories[r.minor]) transferCategories[r.minor] = zeros();
      transferCategories[r.minor][idx] += amt;
    }
  });

  return { months, incomeTotal, expenseTotal, expenseCategories, incomeCategories, transferCategories };
}

function parseInvestmentTagsFromRows(rows) {
  let r0 = -1, c0 = -1;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length - 6; c++) {
      if (row[c] === '국내/해외' && row[c + 1] === '태그' && row[c + 2] === '종목' && row[c + 3] === '판매수익') {
        r0 = r; c0 = c; break;
      }
    }
    if (r0 !== -1) break;
  }
  if (r0 === -1) return [];
  const out = [];
  let missStreak = 0;
  for (let r = r0 + 1; r < rows.length && r < r0 + 500; r++) {
    const row = rows[r] || [];
    const stock = (row[c0 + 2] || '').trim();
    const total = parseWon(row[c0 + 6]);
    const pctCell = (row[c0 + 7] || '').trim();
    const looksValid = stock && total !== null && (pctCell === '' || /%$/.test(pctCell));
    if (!looksValid) {
      missStreak++;
      if (missStreak > 15) break;
      continue;
    }
    missStreak = 0;
    const tagRaw = cleanLabel(row[c0 + 1] || '');
    const tags = tagRaw ? tagRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
    let stockName = cleanLabel(stock);
    if (stockName.includes('›')) stockName = stockName.split('›').pop().trim();
    out.push({
      stock: stockName, tags,
      sale: parseWon(row[c0 + 3]) || 0, dividend: parseWon(row[c0 + 4]) || 0, interest: parseWon(row[c0 + 5]) || 0,
      total
    });
  }
  return out;
}

function aggregateByTag(tagRows) {
  const map = {};
  tagRows.forEach(r => {
    const tags = r.tags.length ? r.tags : ['미분류'];
    tags.forEach(t => { map[t] = (map[t] || 0) + r.total; });
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

/* ---------------- derived analysis ---------------- */

function computeDerived(data) {
  const byMonth = {};
  data.assetRows.forEach(r => {
    if (r.amount === null) return;
    byMonth[r.date] = (byMonth[r.date] || 0) + r.amount;
  });
  const assetMonths = Object.keys(byMonth).sort((a, b) => assetMonthKey(a) - assetMonthKey(b));
  const latestMonth = assetMonths[assetMonths.length - 1];
  const prevMonth = assetMonths[assetMonths.length - 2];
  const totalAssets = byMonth[latestMonth] || 0;
  const prevTotalAssets = prevMonth ? byMonth[prevMonth] : null;
  const deltaAssets = prevTotalAssets !== null ? totalAssets - prevTotalAssets : null;
  const deltaPct = (prevTotalAssets && prevTotalAssets !== 0) ? (deltaAssets / Math.abs(prevTotalAssets)) * 100 : null;

  const allocation = {};
  data.assetRows.filter(r => r.date === latestMonth).forEach(r => {
    if (r.amount === null) return;
    allocation[r.category] = (allocation[r.category] || 0) + r.amount;
  });

  const cashLike = (allocation['현금 자산'] || 0) + (allocation['저축 자산'] || 0);
  const normAcct = s => (s || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const cmaRow = data.assetRows.find(r => r.date === latestMonth && normAcct(r.account) === 'NHCMA');
  const emergencyFund = cmaRow ? cmaRow.amount : 0;

  const displayAllocation = {};
  Object.entries(allocation).forEach(([cat, amt]) => {
    const g = DISPLAY_GROUP[cat] || cat;
    displayAllocation[g] = (displayAllocation[g] || 0) + amt;
  });

  const cashflow = data.months.map((m, i) => {
    const income = data.incomeTotal[i];
    const expense = data.expenseTotal[i];
    if (!income || income <= 0) return null;
    const savingsRate = ((income - expense) / income) * 100;
    return { month: m, income, expense, savingsRate };
  }).filter(Boolean);

  const catNames = Object.keys(data.expenseCategories);
  const latestPivotIdx = (() => {
    for (let i = data.months.length - 1; i >= 0; i--) {
      if (data.incomeTotal[i] && data.incomeTotal[i] > 0) return i;
    }
    return data.months.length - 1;
  })();
  const catLatest = {};
  const catAvg3 = {};
  catNames.forEach(name => {
    const vals = data.expenseCategories[name];
    catLatest[name] = vals[latestPivotIdx] || 0;
    const window3 = [vals[latestPivotIdx - 1] || 0, vals[latestPivotIdx - 2] || 0, vals[latestPivotIdx - 3] || 0];
    catAvg3[name] = window3.reduce((a, b) => a + b, 0) / 3;
  });

  const cashByKey = {};
  data.months.forEach((m, i) => {
    cashByKey[pivotMonthKey(m)] = { income: data.incomeTotal[i] || 0, expense: data.expenseTotal[i] || 0 };
  });
  const decomposition = [];
  for (let i = 1; i < assetMonths.length; i++) {
    const curM = assetMonths[i], prevM = assetMonths[i - 1];
    const totalDelta = byMonth[curM] - byMonth[prevM];
    const cf = cashByKey[assetMonthKey(curM)];
    const netSavings = cf ? (cf.income - cf.expense) : null;
    const marketOther = netSavings !== null ? totalDelta - netSavings : null;
    decomposition.push({ month: curM, label: assetMonthLabel(curM), totalDelta, netSavings, marketOther });
  }

  return {
    byMonth, assetMonths, latestMonth, prevMonth, totalAssets, prevTotalAssets, deltaAssets, deltaPct,
    allocation, displayAllocation, cashLike, emergencyFund, cashflow, catNames, catLatest, catAvg3, latestPivotIdx, decomposition
  };
}

function daysInMonthFromLabel(label) {
  const m = (label || '').match(/(\d{4})-(\d{1,2})/);
  if (!m) return 30;
  return new Date(parseInt(m[1]), parseInt(m[2]), 0).getDate();
}

function computeSuggestedGoals(data, d) {
  const last12 = d.cashflow.slice(-12);
  const avgRate = last12.length ? last12.reduce((a, c) => a + c.savingsRate, 0) / last12.length : 40;
  const suggestedSavings = Math.max(0, Math.round(avgRate / 5) * 5);
  const last3Expense = d.cashflow.slice(-3).map(c => c.expense);
  const avgExpense = last3Expense.length ? last3Expense.reduce((a, b) => a + b, 0) / last3Expense.length : 0;
  const suggestedEmergency = Math.max(500000, Math.round((avgExpense * 3) / 100000) * 100000);
  return { suggestedSavings, suggestedEmergency, avgRate, avgExpense };
}

function ledgerMonthKey(dateStr) {
  const m = (dateStr || '').match(/(\d{4})\.\s*(\d{1,2})/);
  if (!m) return null;
  return `${m[1]}-${m[2].padStart(2, '0')}`;
}

function getFixedItems(ledger) {
  const map = {};
  ledger.filter(r => r.fixed && r.major.includes('지출')).forEach(r => {
    const key = r.item + '|' + r.vendor;
    if (!map[key]) map[key] = { item: r.item, vendor: r.vendor, minor: r.minor, occurrences: [] };
    map[key].occurrences.push({ date: r.date, amount: r.amount });
  });
  return Object.values(map).map(g => {
    g.occurrences.sort((a, b) => ledgerDateKey(b.date) - ledgerDateKey(a.date));
    const latest = g.occurrences[0];
    const avg = g.occurrences.reduce((a, o) => a + o.amount, 0) / g.occurrences.length;
    return { item: g.item, vendor: g.vendor, minor: g.minor, latestAmount: latest.amount, latestDate: latest.date, count: g.occurrences.length, avg };
  }).sort((a, b) => b.latestAmount - a.latestAmount);
}

function getFixedMonthlyTrend(ledger) {
  const byMonth = {};
  ledger.filter(r => r.fixed && r.major.includes('지출')).forEach(r => {
    const key = ledgerMonthKey(r.date);
    if (!key) return;
    byMonth[key] = (byMonth[key] || 0) + r.amount;
  });
  return Object.keys(byMonth).sort().map(k => ({ month: k, total: byMonth[k] }));
}

function getStockProfit(ledger) {
  const map = {};
  ledger.filter(r => r.minor === '투자 수익').forEach(r => {
    let name = r.vendor || '기타';
    if (name.includes('›')) name = name.split('›').pop().trim();
    if (!name) name = '기타';
    map[name] = (map[name] || 0) + r.amount;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function getInvestmentIncomeMonthly(ledger) {
  const byMonthItem = {};
  const items = new Set();
  ledger.filter(r => r.minor === '투자 수익').forEach(r => {
    const key = ledgerMonthKey(r.date);
    if (!key) return;
    byMonthItem[key] = byMonthItem[key] || {};
    byMonthItem[key][r.item] = (byMonthItem[key][r.item] || 0) + r.amount;
    items.add(r.item);
  });
  const months = Object.keys(byMonthItem).sort();
  return { months, items: [...items], byMonthItem };
}

function currentMonthKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

async function loadFixedChecklist(monthKey) {
  try {
    const res = await window.storage.get('fixedcheck-' + monthKey, false);
    if (res && res.value) return JSON.parse(res.value);
  } catch (e) { /* nothing saved yet */ }
  return {};
}

async function saveFixedChecklist(monthKey, obj) {
  try { await window.storage.set('fixedcheck-' + monthKey, JSON.stringify(obj), false); } catch (e) {}
}

function generateInsights(data, d, goals) {
  const insights = [];

  const latestDecomp = d.decomposition[d.decomposition.length - 1];
  if (latestDecomp && latestDecomp.netSavings !== null) {
    if (latestDecomp.totalDelta < 0 && latestDecomp.netSavings > 0) {
      insights.push({
        type: 'info',
        html: `이번 달은 저축(수입-지출)으로 <b>${formatCompactWon(latestDecomp.netSavings)}원</b>을 남겼지만, 총자산은 오히려 <b>${formatCompactWon(Math.abs(latestDecomp.totalDelta))}원</b> 줄었어요. 투자·연금 평가액이 약 <b>${formatCompactWon(Math.abs(latestDecomp.marketOther))}원</b> 빠진 것으로 추정돼요.`
      });
    } else if (latestDecomp.marketOther > 0) {
      insights.push({
        type: 'good',
        html: `이번 달 자산 증가분 중 저축 유입은 <b>${formatCompactWon(latestDecomp.netSavings)}원</b>, 투자·연금 평가 상승분은 약 <b>${formatCompactWon(latestDecomp.marketOther)}원</b>으로 추정돼요.`
      });
    } else if (latestDecomp.marketOther < 0 && latestDecomp.totalDelta > 0) {
      insights.push({
        type: 'info',
        html: `이번 달은 투자·연금 평가액이 약 <b>${formatCompactWon(Math.abs(latestDecomp.marketOther))}원</b> 빠졌지만, 저축 유입(<b>${formatCompactWon(latestDecomp.netSavings)}원</b>)이 이를 상쇄하고도 남아 총자산은 늘었어요.`
      });
    }
  }
  const latestCf = d.cashflow[d.cashflow.length - 1];

  if (latestCf) {
    const srRounded = Math.round(latestCf.savingsRate * 10) / 10;
    if (srRounded < goals.savingsRateTarget) {
      insights.push({
        type: 'warn',
        html: `이번 달 저축률이 <b>${latestCf.savingsRate.toFixed(1)}%</b>로 목표(${goals.savingsRateTarget}%)보다 ${(goals.savingsRateTarget - latestCf.savingsRate).toFixed(1)}%p 낮아요. 지출 상위 항목을 먼저 점검해보세요.`
      });
    } else {
      insights.push({
        type: 'good',
        html: `이번 달 저축률 <b>${latestCf.savingsRate.toFixed(1)}%</b>로 목표(${goals.savingsRateTarget}%)를 달성했어요.`
      });
    }
  }

  const last3 = d.cashflow.slice(-3);
  const prev3 = d.cashflow.slice(-6, -3);
  if (last3.length === 3 && prev3.length === 3) {
    const avgLast3 = last3.reduce((a, c) => a + c.savingsRate, 0) / 3;
    const avgPrev3 = prev3.reduce((a, c) => a + c.savingsRate, 0) / 3;
    if (avgLast3 < avgPrev3 - 3) {
      insights.push({
        type: 'warn',
        html: `최근 3개월 평균 저축률(${avgLast3.toFixed(1)}%)이 이전 3개월(${avgPrev3.toFixed(1)}%)보다 낮아지는 추세예요.`
      });
    }
  }

  if (d.totalAssets > 0) {
    const sorted = Object.entries(d.allocation).sort((a, b) => b[1] - a[1]);
    if (sorted.length) {
      const [topCat, topAmt] = sorted[0];
      const pct = (topAmt / d.totalAssets) * 100;
      if (pct >= 65) {
        insights.push({
          type: 'info',
          html: `전체 자산의 <b>${pct.toFixed(0)}%</b>가 ${topCat}에 몰려 있어요. 분산이 필요한지 한 번 점검해보세요.`
        });
      }
    }
    const cashPct = (d.emergencyFund / d.totalAssets) * 100;
    if (d.emergencyFund < goals.emergencyFundTarget) {
      insights.push({
        type: 'warn',
        html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표(${formatCompactWon(goals.emergencyFundTarget)}원)에 못 미쳐요.`
      });
    } else {
      insights.push({
        type: 'good',
        html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>(전체 자산의 ${cashPct.toFixed(0)}%)으로 목표를 충족하고 있어요.`
      });
    }
  }

  const overspent = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest > x.avg * 1.3)
    .sort((a, b) => (b.latest - b.avg) - (a.latest - a.avg));
  if (overspent.length) {
    const top = overspent[0];
    const pct = ((top.latest - top.avg) / top.avg) * 100;
    insights.push({
      type: 'warn',
      html: `<b>${top.name}</b> 지출이 최근 3개월 평균보다 ${pct.toFixed(0)}% 늘었어요 (${formatCompactWon(top.latest)}원 vs 평균 ${formatCompactWon(top.avg)}원).`
    });
  }

  return insights;
}

function median(nums) {
  if (!nums.length) return 0;
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function computeIncomeInsights(data, d) {
  const insights = [];
  const salary = data.incomeCategories['근로소득'] || [];
  const paired = data.months.map((m, i) => ({ m, v: salary[i] })).filter(x => x.v && x.v > 0);
  if (paired.length >= 8) {
    const last6 = paired.slice(-6).map(x => x.v);
    const prev6 = paired.slice(-12, -6).map(x => x.v);
    const medLast6 = median(last6);
    if (prev6.length >= 3) {
      const medPrev6 = median(prev6);
      const growth = medPrev6 ? ((medLast6 - medPrev6) / medPrev6) * 100 : 0;
      if (Math.abs(growth) <= 15) {
        insights.push({ type: growth < 3 ? 'warn' : 'good', html: growth < 3
          ? `최근 6개월 근로소득(중앙값 기준)이 이전 6개월 대비 <b>${growth >= 0 ? '+' : ''}${growth.toFixed(1)}%</b>로 거의 정체돼 있어요. 연봉 협상, 이직, 승진 등으로 <b>주 수입원 자체를 올리는 방법</b>을 고려해볼 시점이에요.`
          : `최근 6개월 근로소득(중앙값 기준)이 이전 6개월보다 <b>+${growth.toFixed(1)}%</b> 늘었어요.` });
      } else if (growth < -15) {
        insights.push({ type: 'info', html: `최근 6개월 근로소득 중앙값이 이전 6개월보다 <b>${growth.toFixed(1)}%</b> 낮아요. 보너스처럼 특정 달에 몰린 금액이 비교 구간에 껴 있을 수도 있으니, 실제 월급 변화인지 한 번 확인해보세요.` });
      } else {
        insights.push({ type: 'good', html: `최근 6개월 근로소득(중앙값 기준)이 이전 6개월보다 <b>+${growth.toFixed(1)}%</b> 크게 늘었어요.` });
      }
    }
  }

  const other = data.incomeCategories['그 외'] || [];
  const investInc = data.incomeCategories['투자 수익'] || [];
  const idx = d.latestPivotIdx;
  const totalLatest = data.incomeTotal[idx] || 0;
  const otherLatest = other[idx] || 0;
  const otherPct = totalLatest ? (otherLatest / totalLatest) * 100 : 0;
  if (totalLatest > 0 && otherPct < 5) {
    insights.push({ type: 'info', html: `이번 달 수입의 <b>${otherPct.toFixed(1)}%</b>만 부수입·기타 수입이에요. 근로소득 하나에 의존하는 구조라, 부수입 파이프라인을 하나 더 만들어두면 소득 충격에 덜 흔들려요.` });
  }

  const last3Expense = d.cashflow.slice(-3).map(c => c.expense);
  const avgExpense3 = last3Expense.length ? last3Expense.reduce((a, b) => a + b, 0) / last3Expense.length : 0;
  const last3Income = d.cashflow.slice(-3).map(c => c.income);
  const avgIncome3 = last3Income.length ? last3Income.reduce((a, b) => a + b, 0) / last3Income.length : 0;
  const target = state.goals.savingsRateTarget;
  if (avgExpense3 > 0 && target < 100) {
    const neededIncome = avgExpense3 / (1 - target / 100);
    if (avgIncome3 > 0 && avgIncome3 < neededIncome) {
      insights.push({ type: 'info', html: `현재 지출 수준(월평균 ${formatCompactWon(avgExpense3)}원)을 유지하면서 저축률 목표 ${target}%를 채우려면, 월 수입이 최소 약 <b>${formatCompactWon(neededIncome)}원</b>은 되어야 해요 (현재 평균 ${formatCompactWon(avgIncome3)}원).` });
    }
  }

  const investPaired = data.months.map((m, i) => ({ m, v: investInc[i] })).filter(x => x.v);
  if (investPaired.length >= 6) {
    const last3 = investPaired.slice(-3).reduce((a, x) => a + x.v, 0);
    if (last3 > 0) {
      insights.push({ type: 'good', html: `최근 3개월 투자 수익(배당·매매·이자 합)이 총 <b>${formatCompactWon(last3)}원</b>이에요. 투자자산이 조금씩 현금흐름에 기여하고 있어요.` });
    }
  }

  return insights;
}

function computeExpenseVerdict(data, d) {
  const latest = d.cashflow[d.cashflow.length - 1];
  if (!latest) return null;
  const target = state.goals.savingsRateTarget;
  const ok = latest.savingsRate >= target;
  const last3 = d.cashflow.slice(-4, -1);
  const avg3Expense = last3.length ? last3.reduce((a, c) => a + c.expense, 0) / last3.length : null;
  const vsAvgPct = avg3Expense ? ((latest.expense - avg3Expense) / avg3Expense) * 100 : null;
  return { month: latest.month, income: latest.income, expense: latest.expense, savingsRate: latest.savingsRate, target, ok, avg3Expense, vsAvgPct };
}

function amtPct(amt, pct) {
  return `${formatCompactWon(amt)}원 (${pct.toFixed(1)}%)`;
}

function pivotMonthToLedgerKey(m) {
  const match = (m || '').match(/(\d{4})-(\d{1,2})월/);
  if (!match) return null;
  return `${match[1]}-${match[2].padStart(2, '0')}`;
}

function computeExpenseInsights(data, d) {
  const insights = [];
  const v = computeExpenseVerdict(data, d);
  if (v) {
    const title = v.ok ? `${v.month} 지출, 잘 관리하고 있어요.` : `${v.month} 지출, 목표보다 빠듯했어요.`;
    let body = `총 지출 ${formatWon(v.expense)} · 저축률 ${v.savingsRate.toFixed(1)}% (목표 ${v.target}%).`;
    if (v.vsAvgPct !== null) {
      body += v.vsAvgPct >= 0 ? ` 최근 3개월 평균보다 ${v.vsAvgPct.toFixed(0)}% 더 썼어요.` : ` 최근 3개월 평균보다 ${Math.abs(v.vsAvgPct).toFixed(0)}% 덜 썼어요.`;
    }
    insights.push({ type: v.ok ? 'good' : 'warn', html: `<b>${title}</b> ${body}` });
  }
  const overspent = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest > x.avg * 1.3)
    .sort((a, b) => (b.latest - b.avg) - (a.latest - a.avg));
  overspent.slice(0, 2).forEach(o => {
    const pct = ((o.latest - o.avg) / o.avg) * 100;
    insights.push({ type: 'warn', html: `<b>${o.name}</b> 지출이 최근 3개월 평균보다 <b>${pct.toFixed(0)}%</b> 늘었어요 (${formatCompactWon(o.latest)}원 vs 평균 ${formatCompactWon(o.avg)}원).` });
  });
  const improved = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest < x.avg * 0.7 && x.latest > 0)
    .sort((a, b) => (a.latest - a.avg) - (b.latest - b.avg));
  if (improved.length) {
    const top = improved[0];
    const pct = ((top.avg - top.latest) / top.avg) * 100;
    insights.push({ type: 'good', html: `<b>${top.name}</b> 지출을 최근 3개월 평균보다 <b>${pct.toFixed(0)}%</b> 줄였어요. 잘하고 있어요.` });
  }
  const budgetOver = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], budget: (state.budgets && state.budgets[name]) || d.catAvg3[name] }))
    .filter(x => x.budget > 0 && x.latest > x.budget)
    .sort((a, b) => (b.latest - b.budget) - (a.latest - a.budget));
  if (budgetOver.length) {
    const b = budgetOver[0];
    insights.push({ type: 'warn', html: `<b>${b.name}</b> 예산 <b>${formatCompactWon(b.budget)}원</b>을 <b>${formatCompactWon(b.latest - b.budget)}원</b> 초과했어요 (실제 ${formatCompactWon(b.latest)}원).` });
  }
  return insights;
}

const valueLabelPlugin = {
  id: 'valueLabelPlugin',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const horizontal = chart.options && chart.options.indexAxis === 'y';
    chart.data.datasets.forEach((dataset, dsIndex) => {
      if (dataset.hideLabel) return;
      const meta = chart.getDatasetMeta(dsIndex);
      if (!meta || meta.hidden) return;
      meta.data.forEach((element, index) => {
        const value = dataset.data[index];
        if (value === null || value === undefined || value === 0) return;
        const pos = element.tooltipPosition ? element.tooltipPosition() : element;
        ctx.save();
        ctx.font = "600 10px 'IBM Plex Mono', monospace";
        ctx.fillStyle = dataset.labelColor || '#c7cddb';
        if (horizontal) {
          ctx.textAlign = value >= 0 ? 'left' : 'right';
          ctx.textBaseline = 'middle';
          const offsetX = dataset.labelOffset !== undefined ? dataset.labelOffset : (value >= 0 ? 6 : -6);
          ctx.fillText(formatCompactWon(value), pos.x + offsetX, pos.y);
        } else {
          ctx.textAlign = 'center';
          const isLine = chart.config.type === 'line' || dataset.type === 'line';
          const offset = dataset.labelOffset !== undefined ? dataset.labelOffset : (isLine ? -8 : (value >= 0 ? -6 : 14));
          ctx.fillText(formatCompactWon(value), pos.x, pos.y + offset);
        }
        ctx.restore();
      });
    });
  }
};

const stackTotalLabelPlugin = {
  id: 'stackTotalLabelPlugin',
  afterDatasetsDraw(chart) {
    const { ctx, data } = chart;
    const meta0 = chart.getDatasetMeta(0);
    if (!meta0) return;
    data.labels.forEach((_, i) => {
      let sum = 0, topY = null;
      data.datasets.forEach((ds, dsIdx) => {
        const meta = chart.getDatasetMeta(dsIdx);
        if (!meta || meta.hidden) return;
        const v = ds.data[i] || 0;
        sum += v;
        const el = meta.data[i];
        if (el) {
          const pos = el.tooltipPosition ? el.tooltipPosition() : el;
          if (topY === null || pos.y < topY) topY = pos.y;
        }
      });
      if (!sum || topY === null) return;
      const xEl = meta0.data[i];
      if (!xEl) return;
      const xPos = xEl.tooltipPosition ? xEl.tooltipPosition() : xEl;
      ctx.save();
      ctx.font = "600 10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = '#c7cddb';
      ctx.textAlign = 'center';
      ctx.fillText(formatCompactWon(sum), xPos.x, topY - 6);
      ctx.restore();
    });
  }
};

function avgOf(values) {
  const nums = (values || []).filter(v => v !== null && v !== undefined);
  return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
}

function avgLinePlugin(values, opts) {
  opts = opts || {};
  const avg = avgOf(values);
  return {
    id: 'avgLinePlugin_' + Math.random().toString(36).slice(2),
    afterDatasetsDraw(chart) {
      const yScale = chart.scales.y;
      const xScale = chart.scales.x;
      if (!yScale || !xScale) return;
      const yPixel = yScale.getPixelForValue(avg);
      const ctx = chart.ctx;
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = 'rgba(233,231,223,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(xScale.left, yPixel);
      ctx.lineTo(xScale.right, yPixel);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "600 10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = '#d7d3c4';
      ctx.textAlign = 'left';
      ctx.fillText(`평균 ${formatCompactWon(avg)}`, xScale.left + 4, yPixel - 5);
      ctx.restore();
    }
  };
}

function legendWithValues(formatFn) {
  return {
    display: true, position: 'bottom',
    labels: {
      color: '#eae8e0', font: { family: 'IBM Plex Mono', size: 10 }, boxWidth: 10, padding: 10,
      generateLabels: (chart) => {
        const ds = chart.data.datasets[0];
        return chart.data.labels.map((label, i) => ({
          text: `${label}  ${(formatFn || formatCompactWon)(ds.data[i])}${formatFn ? '' : '원'}`,
          fillStyle: Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor,
          index: i
        }));
      }
    }
  };
}

function paddedRange(values) {
  const max = Math.max(0, ...values);
  const min = Math.min(0, ...values);
  const span = (max - min) || 1;
  return { min: min === 0 ? 0 : min - span * 0.08, max: max + span * 0.22 };
}

        <button class="btn small" id="retry-btn" style="margin-left:auto;flex-shrink:0;">다시 시도</button>
      </div>`;
    document.getElementById('retry-btn').addEventListener('click', () => fetchLive(true));
  } else {
    slot.innerHTML = '';
  }
}

function destroyPageCharts() {
  Object.values(state.charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  state.charts = {};
}

function renderPage() {
  const data = state.data;
  const d = computeDerived(data);
  destroyPageCharts();
  const container = document.getElementById('page-content');
  if (state.page === 'assets') renderAssetsPage(container, data, d);
  else if (state.page === 'income') renderIncomePage(container, data, d);
  else if (state.page === 'expense') renderExpensePage(container, data, d);
  else if (state.page === 'investment') renderInvestmentPage(container, data, d);
  else if (state.page === 'savings') renderSavingsPage(container, data, d);
  else renderHomePage(container, data, d);
}

function renderAll() {
  renderBanner();
  setSyncState(state.source === 'live' ? 'live' : state.lastError ? 'err' : 'snapshot');
  renderPage();
}

/* ---------------- 홈 인사이트 (매주 월요일 갱신) ---------------- */

function mondayKey(date) {
  const dt = new Date(date);
  const day = (dt.getDay() + 6) % 7;
  dt.setDate(dt.getDate() - day);
  dt.setHours(0, 0, 0, 0);
  return dt.toISOString().slice(0, 10);
}

const INSIGHT_WEIGHT = { warn: 3, info: 2, good: 1 };

function computePriorityInsights(data, d) {
  const all = [
    ...generateInsights(data, d, state.goals),
    ...computeIncomeInsights(data, d),
    ...computeExpenseInsights(data, d),
    ...computeSavingsHomeInsights(data, d)
  ];
  return all
    .sort((a, b) => (INSIGHT_WEIGHT[b.type] || 0) - (INSIGHT_WEIGHT[a.type] || 0))
    .slice(0, 3);
}

function computeSavingsHomeInsights(data, d) {
  // 저축 페이지 인사이트 중 비상금 관련 부분만 재사용 (자산 카테고리 데이터 없이도 안전하게 동작)
  const insights = [];
  const target = state.goals.emergencyFundTarget;
  if (d.emergencyFund < target) {
    insights.push({ type: 'warn', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표(${formatCompactWon(target)}원)에 못 미쳐요.` });
  }
  return insights;
}

async function renderWeeklyInsights(panelId, cacheKey, title, computeFn) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  panel.innerHTML = `
    <div class="panel-title"><div><span class="eyebrow">INSIGHTS</span>${title}</div></div>
    <div class="empty-state">불러오는 중…</div>
  `;
  const weekKey = mondayKey(new Date());
  let insights = null;
  try {
    const res = await window.storage.get(cacheKey, false);
    if (res && res.value) {
      const obj = JSON.parse(res.value);
      if (obj.week === weekKey) insights = obj.insights;
    }
  } catch (e) { /* no cached insights yet */ }
  if (!insights) {
    try { insights = (computeFn() || []).slice(0, 3); } catch (e) { insights = []; }
    try { await window.storage.set(cacheKey, JSON.stringify({ week: weekKey, insights }), false); } catch (e) {}
  }
  if (!document.getElementById(panelId)) return; // page navigated away
  panel.innerHTML = `
    <div class="panel-title"><div><span class="eyebrow">INSIGHTS</span>${title}</div></div>
    ${insights.map(i => `<div class="insight ${i.type}"><span class="dot"></span><span>${i.html}</span></div>`).join('') || '<div class="empty-state">표시할 인사이트가 없어요.</div>'}
  `;
}

function computeAssetsInsights(data, d) {
  const insights = [];
  const latestDecomp = d.decomposition[d.decomposition.length - 1];
  if (latestDecomp && latestDecomp.netSavings !== null) {
    if (latestDecomp.totalDelta < 0 && latestDecomp.netSavings > 0) {
      insights.push({ type: 'info', html: `이번 달은 저축(수입-지출)으로 <b>${formatCompactWon(latestDecomp.netSavings)}원</b>을 남겼지만, 총자산은 오히려 <b>${formatCompactWon(Math.abs(latestDecomp.totalDelta))}원</b> 줄었어요. 투자·연금 평가액이 약 <b>${formatCompactWon(Math.abs(latestDecomp.marketOther))}원</b> 빠진 것으로 추정돼요.` });
    } else if (latestDecomp.marketOther > 0) {
      insights.push({ type: 'good', html: `이번 달 자산 증가분 중 저축 유입은 <b>${formatCompactWon(latestDecomp.netSavings)}원</b>, 투자·연금 평가 상승분은 약 <b>${formatCompactWon(latestDecomp.marketOther)}원</b>으로 추정돼요.` });
    } else if (latestDecomp.marketOther < 0 && latestDecomp.totalDelta > 0) {
      insights.push({ type: 'info', html: `이번 달은 투자·연금 평가액이 약 <b>${formatCompactWon(Math.abs(latestDecomp.marketOther))}원</b> 빠졌지만, 저축 유입(<b>${formatCompactWon(latestDecomp.netSavings)}원</b>)이 이를 상쇄하고도 남아 총자산은 늘었어요.` });
    }
  }
  if (d.totalAssets > 0) {
    const sorted = Object.entries(d.allocation).sort((a, b) => b[1] - a[1]);
    if (sorted.length) {
      const [topCat, topAmt] = sorted[0];
      const pct = (topAmt / d.totalAssets) * 100;
      if (pct >= 65) {
        insights.push({ type: 'info', html: `전체 자산의 <b>${pct.toFixed(0)}%</b>가 ${topCat}에 몰려 있어요. 분산이 필요한지 한 번 점검해보세요.` });
      }
    }
    const cashPct = (d.emergencyFund / d.totalAssets) * 100;
    if (d.emergencyFund < state.goals.emergencyFundTarget) {
      insights.push({ type: 'warn', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표(${formatCompactWon(state.goals.emergencyFundTarget)}원)에 못 미쳐요.` });
    } else {
      insights.push({ type: 'good', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>(전체 자산의 ${cashPct.toFixed(0)}%)으로 목표를 충족하고 있어요.` });
    }
  }
  return insights;
}

/* ---------------- shared: ledger table helpers ---------------- */

function majorTagClass(major) {
  if (major.includes('수입')) return 'income';
  if (major.includes('지출')) return 'expense';
  return 'transfer';
}

function buildLedgerRowsHtml(rows) {
  if (!rows.length) return '<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:20px;">표시할 내역이 없어요.</td></tr>';
  return rows.map(r => {
    const cls = majorTagClass(r.major);
    return `<tr>
      <td>${r.date}</td>
      <td><span class="tag-pill ${cls}">${r.major || '-'}</span></td>
      <td>${r.minor || '-'}</td>
      <td>${r.item || '-'}</td>
      <td>${r.vendor || ''}</td>
      <td class="amt ${cls}">${formatWon(r.amount)}</td>
    </tr>`;
  }).join('');
}

/* ---------------- shared: advanced table (search / filter / sort / group) ---------------- */

function initTableState(key, opts) {
  opts = opts || {};
  if (!state.tableState) state.tableState = {};
  if (!state.tableState[key]) {
    state.tableState[key] = {
      group: opts.defaultGroup || 'none', sort: opts.defaultSort || 'date-desc',
      q: '', majorFilter: opts.majorFilter || 'all', pageSize: opts.pageSize || 30,
      page: 1, openGroups: {}
    };
  }
  return state.tableState[key];
}

function advancedTableRows(ts, allRows) {
  let rows = allRows;
  if (ts.majorFilter !== 'all') rows = rows.filter(r => r.major.includes(ts.majorFilter));
  if (ts.q.trim()) {
    const q = ts.q.trim().toLowerCase();
    rows = rows.filter(r => (r.item + r.vendor + r.memo + r.minor).toLowerCase().includes(q));
  }
  return [...rows].sort((a, b) => {
    if (ts.sort === 'date-desc') return ledgerDateKey(b.date) - ledgerDateKey(a.date);
    if (ts.sort === 'date-asc') return ledgerDateKey(a.date) - ledgerDateKey(b.date);
    if (ts.sort === 'amount-desc') return b.amount - a.amount;
    if (ts.sort === 'amount-asc') return a.amount - b.amount;
    return 0;
  });
}

function renderAdvancedTable(key, allRows, opts) {
  opts = opts || {};
  const ts = initTableState(key, opts);
  const box = document.getElementById(key);
  if (!box) return;
  const groupOptions = opts.groupOptions || [['none', '그룹 없음'], ['category', '카테고리별'], ['month', '월별']];
  const majorOptions = opts.majorOptions || [['all', '전체'], ['수입', '수입'], ['지출', '지출'], ['이체', '이체']];

  box.innerHTML = `
    <div class="table-controls">
      <input type="text" class="at-search" placeholder="검색" value="${ts.q}" />
      ${majorOptions.length > 1 ? `<select class="at-major">${majorOptions.map(([v, l]) => `<option value="${v}" ${ts.majorFilter === v ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
      <select class="at-sort">
        <option value="date-desc" ${ts.sort === 'date-desc' ? 'selected' : ''}>최신순</option>
        <option value="date-asc" ${ts.sort === 'date-asc' ? 'selected' : ''}>오래된순</option>
        <option value="amount-desc" ${ts.sort === 'amount-desc' ? 'selected' : ''}>금액 많은순</option>
        <option value="amount-asc" ${ts.sort === 'amount-asc' ? 'selected' : ''}>금액 적은순</option>
      </select>
      <select class="at-group">${groupOptions.map(([v, l]) => `<option value="${v}" ${ts.group === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <div class="table-meta at-meta"></div>
    <div class="at-content"></div>
  `;
  box.querySelector('.at-search').addEventListener('input', (e) => { ts.q = e.target.value; ts.page = 1; renderAdvancedTableBody(key, allRows, opts); });
  const majorSel = box.querySelector('.at-major');
  if (majorSel) majorSel.addEventListener('change', (e) => { ts.majorFilter = e.target.value; ts.page = 1; renderAdvancedTableBody(key, allRows, opts); });
  box.querySelector('.at-sort').addEventListener('change', (e) => { ts.sort = e.target.value; renderAdvancedTableBody(key, allRows, opts); });
  box.querySelector('.at-group').addEventListener('change', (e) => { ts.group = e.target.value; renderAdvancedTableBody(key, allRows, opts); });

  renderAdvancedTableBody(key, allRows, opts);
}

function renderAdvancedTableBody(key, allRows, opts) {
  const ts = state.tableState[key];
  const box = document.getElementById(key);
  if (!box || !ts) return;
  const rows = advancedTableRows(ts, allRows);
  const metaEl = box.querySelector('.at-meta');
  const contentEl = box.querySelector('.at-content');
  const sum = rows.reduce((a, r) => a + (r.major.includes('지출') ? -Math.abs(r.amount) : r.amount), 0);
  metaEl.textContent = `총 ${rows.length.toLocaleString()}건 · 합계 ${formatWon(sum)}`;

  if (ts.group === 'none') {
    const totalPages = Math.max(1, Math.ceil(rows.length / ts.pageSize));
    if (ts.page > totalPages) ts.page = totalPages;
    const start = (ts.page - 1) * ts.pageSize;
    const pageRows = rows.slice(start, start + ts.pageSize);
    contentEl.innerHTML = `
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>날짜</th><th>분류</th><th>소분류</th><th>항목</th><th>사용처</th><th style="text-align:right">금액</th></tr></thead>
          <tbody>${buildLedgerRowsHtml(pageRows)}</tbody>
        </table>
      </div>
      <div class="pager">
        <button class="at-prev" ${ts.page <= 1 ? 'disabled' : ''}>‹ 이전</button>
        <span>${ts.page} / ${totalPages}</span>
        <button class="at-next" ${ts.page >= totalPages ? 'disabled' : ''}>다음 ›</button>
      </div>`;
    const prevBtn = contentEl.querySelector('.at-prev');
    const nextBtn = contentEl.querySelector('.at-next');
    if (prevBtn) prevBtn.addEventListener('click', () => { ts.page--; renderAdvancedTableBody(key, allRows, opts); });
    if (nextBtn) nextBtn.addEventListener('click', () => { ts.page++; renderAdvancedTableBody(key, allRows, opts); });
  } else {
    const groups = {};
    rows.forEach(r => {
      const gKey = ts.group === 'category' ? (r.minor || '기타') : (ledgerMonthKey(r.date) || '기타');
      if (!groups[gKey]) groups[gKey] = { rows: [], total: 0 };
      groups[gKey].rows.push(r);
      groups[gKey].total += (r.major.includes('지출') ? -Math.abs(r.amount) : r.amount);
    });
    const groupKeys = Object.keys(groups).sort((a, b) => ts.group === 'month' ? (a < b ? 1 : -1) : Math.abs(groups[b].total) - Math.abs(groups[a].total));
    contentEl.innerHTML = groupKeys.map(gKey => `
      <details class="at-group" ${ts.openGroups[gKey] ? 'open' : ''} data-gkey="${gKey}">
        <summary class="at-group-summary"><span>${gKey}</span><span>${formatWon(groups[gKey].total)} · ${groups[gKey].rows.length}건</span></summary>
        <div class="table-scroll" style="max-height:280px;">
          <table class="data-table">
            <thead><tr><th>날짜</th><th>분류</th><th>소분류</th><th>항목</th><th>사용처</th><th style="text-align:right">금액</th></tr></thead>
            <tbody>${buildLedgerRowsHtml(groups[gKey].rows)}</tbody>
          </table>
        </div>
      </details>
    `).join('') || '<div class="empty-state">표시할 내역이 없어요.</div>';
    contentEl.querySelectorAll('.at-group').forEach(el => {
      el.addEventListener('toggle', () => { ts.openGroups[el.dataset.gkey] = el.open; });
    });
  }
}

function sliceByRange(arr, range) {
  if (range === 'all' || !range) return arr;
  const n = parseInt(range, 10);
  return arr.slice(-n);
}

/* ---------------- page: 지출 ---------------- */

function computeTopVendors(expenseLedger, limit) {
  const map = {};
  expenseLedger.forEach(r => {
    const name = r.vendor || r.item || '기타';
    map[name] = (map[name] || 0) + r.amount;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, limit || 10);
}

function filterLedgerByRange(ledger, months, range) {
  if (range === 'all' || !range) return ledger;
  const keep = new Set(sliceByRange(months, range).map(pivotMonthToLedgerKey));
  return ledger.filter(r => keep.has(ledgerMonthKey(r.date)));
}

function pctLabelPlugin(getLabel) {
  return {
    id: 'pctLabelPlugin_' + Math.random().toString(36).slice(2),
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      if (!meta) return;
      const ctx = chart.ctx;
      meta.data.forEach((el, i) => {
        const label = getLabel(i);
        if (label === null || label === undefined) return;
        const pos = el.tooltipPosition ? el.tooltipPosition() : el;
        ctx.save();
        ctx.font = "600 10px 'IBM Plex Mono', monospace";
        ctx.fillStyle = '#eae8e0';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, pos.x + 6, pos.y);
        ctx.restore();
      });
    }
  };
}

/* ---------------- 카테고리별 예산 (사용자 편집 가능) ---------------- */

function pivotYearMonth(m) {
  const match = (m || '').match(/(\d{4})-(\d{1,2})월/);
  return match ? { year: match[1], month: parseInt(match[2], 10) } : { year: '', month: 0 };
}

function renderCategoryBudgetPanel(data, d) {
  const panel = document.getElementById('panel-cat-budget');
  const catNames = Object.keys(data.expenseCategories);
  if (state.expenseMonthIdx === undefined || state.expenseMonthIdx === null) {
    state.expenseMonthIdx = d.latestPivotIdx;
  }
  const idx = state.expenseMonthIdx;
  const curYM = pivotYearMonth(data.months[idx]);
  const years = [...new Set(data.months.map(m => pivotYearMonth(m).year))];
  const monthsInYear = data.months.map((m, i) => ({ i, ...pivotYearMonth(m) })).filter(x => x.year === curYM.year);
  const yearOptions = years.map(y => `<option value="${y}" ${y === curYM.year ? 'selected' : ''}>${y}</option>`).join('');
  const monthOptions = monthsInYear.map(x => `<option value="${x.i}" ${x.i === idx ? 'selected' : ''}>${x.month}월</option>`).join('');

  const rows = catNames.map(name => {
    const vals = data.expenseCategories[name];
    const cur = vals[idx] || 0;
    const window3 = [vals[idx - 1] || 0, vals[idx - 2] || 0, vals[idx - 3] || 0];
    const guide = avgOf(window3);
    const budget = (state.budgets && state.budgets[name] !== undefined && state.budgets[name] !== null && state.budgets[name] !== '')
      ? Number(state.budgets[name]) : guide;
    return { name, cur, guide, budget };
  }).filter(r => r.cur > 0 || r.guide > 0 || r.budget > 0).sort((a, b) => b.cur - a.cur);

  panel.innerHTML = `
    <div class="panel-title">
      <div><span class="eyebrow">BUDGET</span>카테고리별 예산 가이드</div>
      <div class="month-nav">
        <select id="cat-budget-year">${yearOptions}</select>
        <select id="cat-budget-month">${monthOptions}</select>
        <button class="btn small" id="cat-budget-thismonth">이번달</button>
      </div>
    </div>
    ${rows.length ? `<div class="chart-wrap" style="height:${Math.max(160, rows.length * 34)}px;"><canvas id="chart-cat-budget"></canvas></div>` : ''}
    <div id="cat-budget-list"></div>
    ${!rows.length ? '<div class="empty-state">해당 월 데이터가 없어요.</div>' : ''}
  `;

  if (rows.length) {
    const pcts = rows.map(r => r.budget > 0 ? (r.cur / r.budget) * 100 : 0);
    const maxPct = Math.max(...pcts, 100);
    const ctx = document.getElementById('chart-cat-budget');
    state.charts.catBudget = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: rows.map(r => r.name),
        datasets: [{ data: pcts.map(p => Math.min(p, maxPct)), backgroundColor: pcts.map(p => p > 100 ? 'rgba(193,72,63,0.85)' : 'rgba(201,162,39,0.85)'), borderRadius: 3 }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 50 } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${rows[c.dataIndex].name}: ${pcts[c.dataIndex].toFixed(0)}% (${formatCompactWon(rows[c.dataIndex].cur)}원 / 예산 ${formatCompactWon(rows[c.dataIndex].budget)}원)` } } },
        scales: {
          x: { min: 0, max: maxPct * 1.15, ticks: { ...MONO_TICK, callback: (v) => v + '%' }, grid: GRID_FAINT },
          y: { ticks: MONO_TICK, grid: { display: false } }
        }
      },
      plugins: [pctLabelPlugin((i) => pcts[i] !== undefined ? pcts[i].toFixed(0) + '%' : null)]
    });
  }

  document.getElementById('cat-budget-list').innerHTML = rows.map(r => {
    const remaining = r.budget - r.cur;
    const over = remaining < 0;
    return `<div class="acct-row">
      <span class="acct-name">${r.name}${over ? '<span class="cat-tag">예산 초과</span>' : ''}</span>
      <span class="acct-amt" style="color:${over ? 'var(--red)' : 'var(--green)'}">${over ? formatCompactWon(Math.abs(remaining)) + '원 초과' : formatCompactWon(remaining) + '원 남음'}</span>
      <input type="number" class="budget-input" data-cat="${r.name}" value="${Math.round(r.budget)}" step="10000" />
    </div>`;
  }).join('');

  const yearSel = document.getElementById('cat-budget-year');
  const monthSel = document.getElementById('cat-budget-month');
  yearSel.addEventListener('change', () => {
    const y = yearSel.value;
    const firstInYear = data.months.map((m, i) => ({ i, ...pivotYearMonth(m) })).filter(x => x.year === y)[0];
    if (firstInYear) state.expenseMonthIdx = firstInYear.i;
    renderCategoryBudgetPanel(data, d);
  });
  monthSel.addEventListener('change', () => { state.expenseMonthIdx = parseInt(monthSel.value, 10); renderCategoryBudgetPanel(data, d); });
  document.getElementById('cat-budget-thismonth').addEventListener('click', () => {
    const curKey = currentPivotMonthKeyString();
    let targetIdx = data.months.indexOf(curKey);
    if (targetIdx === -1) targetIdx = d.latestPivotIdx;
    state.expenseMonthIdx = targetIdx;
    renderCategoryBudgetPanel(data, d);
  });
  panel.querySelectorAll('.budget-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const cat = inp.dataset.cat;
      const val = parseFloat(inp.value);
      state.budgets[cat] = isNaN(val) ? undefined : val;
      saveBudgets();
      renderCategoryBudgetPanel(data, d);
    });
  });
}

function getFixedItemsForMonth(ledger, monthKey) {
  return ledger
    .filter(r => r.fixed && r.major.includes('지출') && ledgerMonthKey(r.date) === monthKey)
    .sort((a, b) => b.amount - a.amount);
}

function renderFixedBreakdown(ledger, monthKey, monthLabel) {
  const box = document.getElementById('fixed-breakdown');
  if (!box) return;
  const items = getFixedItemsForMonth(ledger, monthKey);
  box.innerHTML = `
    <div class="settings-note" style="margin-top:12px;margin-bottom:6px;">${monthLabel || monthKey} 고정비 내역</div>
    ${items.map(r => `<div class="acct-row">
      <span class="acct-name">${r.item}${r.vendor ? `<div class="acct-cat">${r.vendor}</div>` : ''}</span>
      <span class="acct-amt">${formatWon(r.amount)}</span>
    </div>`).join('') || '<div class="empty-state">해당 월 고정비 내역이 없어요.</div>'}
  `;
}

          { type: 'bar', data: currentSeries.map(s => s.total), backgroundColor: 'rgba(201,162,39,0.75)', borderRadius: 3, labelColor: '#e9dba8' }
        ]

      options: {
        responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } },

          if (!elements.length) return;
          const i = elements[0].index;

        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${formatWon(c.raw)}` } } },
        scales: { x: { ticks: MONO_TICK, grid: { display: false } }, y: { ticks: { ...MONO_TICK, callback: (v) => formatCompactWon(v) }, grid: GRID_FAINT } }
      },

    drawFixedTrend();

/* ---------------- page: 투자 ---------------- */

function computeInvestmentInsights(data, d, cumSeries, tagAgg) {
  const insights = [];
  const latest = cumSeries[cumSeries.length - 1];
  if (latest && latest.cumContribution > 0) {
    const gain = latest.balance - latest.cumContribution;
    const gainPct = (gain / latest.cumContribution) * 100;
    insights.push({ type: gain >= 0 ? 'good' : 'warn', html: `누적 투자 원금 <b>${formatCompactWon(latest.cumContribution)}원</b> 대비 평가액은 <b>${formatCompactWon(latest.balance)}원</b>, 누적 손익은 <b>${gain >= 0 ? '+' : ''}${formatCompactWon(gain)}원 (${gainPct.toFixed(1)}%)</b>이에요.` });
  }
  if (tagAgg.length) {
    const totalProfit = tagAgg.reduce((a, [, v]) => a + Math.max(v, 0), 0);
    const [topTag, topVal] = tagAgg[0];
    if (totalProfit > 0 && topVal > 0) {
      const pct = (topVal / totalProfit) * 100;
      if (pct >= 25) {
        insights.push({ type: 'info', html: `실현 수익의 <b>${pct.toFixed(0)}%</b>가 "<b>${topTag}</b>" 태그 종목에서 나왔어요. 특정 테마에 수익이 쏠려 있어요.` });
      }
    }
    const losers = tagAgg.filter(([, v]) => v < 0).sort((a, b) => a[1] - b[1]);
    if (losers.length) {
      insights.push({ type: 'warn', html: `"<b>${losers[0][0]}</b>" 태그 종목에서 누적 <b>${formatWon(losers[0][1])}</b>의 손실이 났어요.` });
    }
  }
  return insights;
}

function computeSavingsInsights(data, d, latestSaving, latestPension, months, byMonthCat) {
  const insights = [];
  const target = state.goals.emergencyFundTarget;
  if (d.emergencyFund < target) {
    insights.push({ type: 'warn', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표(${formatCompactWon(target)}원)에 못 미쳐요.` });
  } else {
    insights.push({ type: 'good', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표를 충족하고 있어요.` });
  }
  if (months.length >= 7) {
    const first = (byMonthCat[months[months.length - 7]] && byMonthCat[months[months.length - 7]]['연금 자산']) || 0;
    const last = latestPension;
    if (first > 0) {
      const growth = ((last - first) / first) * 100;
      insights.push({ type: 'info', html: `연금 자산이 최근 6개월간 <b>${growth >= 0 ? '+' : ''}${growth.toFixed(1)}%</b> 변화했어요 (은퇴 대비 장기 자산이라 단기 변동은 크게 신경 쓰지 않아도 돼요).` });
    }
  }
  const total = latestSaving + latestPension;
  if (total > 0) {
    const savingPct = (latestSaving / total) * 100;
    insights.push({ type: 'info', html: `저축·연금 합계 중 <b>${savingPct.toFixed(0)}%</b>가 유동성 있는 저축 자산(CMA·청약 등)이고, 나머지는 연금이에요.` });
  }
  return insights;
}

      responsive: true, maintainAspectRatio: false, layout: { padding: { top: 16 } },
      plugins: { legend: { position: 'bottom', labels: { color: '#9aa3b6', font: { family: 'IBM Plex Mono', size: 10 } } }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${formatWon(c.raw)}` } } },
      scales: { x: { stacked: true, ticks: MONO_TICK, grid: { display: false } }, y: { stacked: true, ticks: { ...MONO_TICK, callback: (v) => formatCompactWon(v) }, grid: GRID_FAINT } }
    },
    plugins: [stackTotalLabelPlugin]
  });

  renderAdvancedTable('savings-table', savingsLedger, { majorOptions: [['all', '전체'], ['이체', '이체']], defaultGroup: 'none' });
}

async function loadBudgets() {
  try {
    const res = await window.storage.get('category-budgets', false);
    if (res && res.value) state.budgets = JSON.parse(res.value);
  } catch (e) { /* no saved budgets yet */ }
  state.budgetsLoaded = true;
}

async function saveBudgets() {
  try { await window.storage.set('category-budgets', JSON.stringify(state.budgets), false); } catch (e) {}
}

/* ---------------- fetch & init ---------------- */

async function fetchCsvRows(gid) {
  const res = await fetch(csvUrlFor(gid), { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} (gid ${gid})`);
  const text = await res.text();
  if (text.trim().startsWith('<')) throw new Error(`시트 접근 권한이 없어요 (gid ${gid})`);
  const parsed = Papa.parse(text, { skipEmptyLines: false });
  return parsed.data.map(r => r.map(c => (c === null || c === undefined) ? '' : String(c)));
}

async function fetchAllTabsAndMerge() {
  const results = await Promise.allSettled(TAB_GIDS.map(fetchCsvRows));
  const failures = results.filter(r => r.status === 'rejected');
  const rowSets = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (rowSets.length === 0) {
    throw new Error(failures[0] ? failures[0].reason.message : '탭을 하나도 불러오지 못했어요');
  }

  let assetRows = [], ledger = [], investmentTags = [], goals = [];
  for (const rows of rowSets) {
    try {
      const ar = parseAssetsFromRows(rows);
      if (ar.length > assetRows.length) assetRows = ar;
    } catch (e) {}
    try {
      const lg = parseLedgerFromRows(rows);
      if (lg.length > ledger.length) ledger = lg;
    } catch (e) {}
    try {
      const tags = parseInvestmentTagsFromRows(rows);
      if (tags.length > investmentTags.length) investmentTags = tags;
    } catch (e) {}
    try {
      const gl = parseGoalsFromRows(rows);
      if (gl.length > goals.length) goals = gl;
    } catch (e) {}
  }

  // 가계부(M) 피벗 탭은 폐기되어, 정상 파싱된 가계부(D) 원장에서 월별 카테고리 요약을 직접 집계한다.
  const pivot = buildPivotFromLedger(ledger);

  const fetchFailNote = failures.length
    ? ` (${failures.length}개 탭 fetch 실패: ${failures.map(f => f.reason.message).join(', ')})`
    : ' (탭은 모두 불러왔지만 그 안에서 못 찾음)';

  if (!pivot) throw new Error('가계부(D) 원장에서 카테고리 요약을 계산하지 못했습니다' + fetchFailNote);
  if (assetRows.length < 5) throw new Error('자산 현황표를 찾지 못했습니다' + fetchFailNote);

  const data = {
    months: pivot.months, incomeTotal: pivot.incomeTotal, expenseTotal: pivot.expenseTotal,
    expenseCategories: pivot.expenseCategories, incomeCategories: pivot.incomeCategories, transferCategories: pivot.transferCategories,
    assetRows, ledger, investmentTags, goals
  };

  if (failures.length) {
    data._partialWarning = `${failures.length}개 탭을 못 불러왔지만(${failures.map(f => f.reason.message).join(', ')}), 나머지 데이터로 표시 중이에요.`;
  }
  return data;
}

function applySuggestedGoals(data) {
  const d0 = computeDerived(data);
  const sug = computeSuggestedGoals(data, d0);
  state.goals.savingsRateTarget = sug.suggestedSavings;
  state.goals.emergencyFundTarget = sug.suggestedEmergency;
}

async function fetchLive(manual) {
  setSyncState('loading');
  try {
    const data = await fetchAllTabsAndMerge();
    state.data = data;
    state.source = 'live';
    state.lastError = data._partialWarning || null;
    state.lastSync = new Date();
    applySuggestedGoals(state.data);
    renderAll();
  } catch (e) {
    console.error('live sync failed', e);
    state.lastError = e.message || String(e);
    if (!state.data) {
      state.data = SNAPSHOT_DATA;
      state.source = 'snapshot';
    }
    renderAll();
  }
}

async function init() {
  renderShell();
  await loadBudgets();
  state.data = SNAPSHOT_DATA;
  state.source = 'snapshot';
  applySuggestedGoals(state.data);
  renderAll();
  fetchLive(false);
}

init();

</script>
