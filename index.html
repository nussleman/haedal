<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MY 자산 통장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e121a;
  --bg-2:#141a25;
  --panel:#171e2b;
  --panel-2:#1e2635;
  --border:rgba(233,231,223,0.09);
  --border-strong:rgba(233,231,223,0.16);
  --paper:#f3ecd9;
  --paper-2:#ece2c6;
  --ink:#231d10;
  --ink-dim:#5a5138;
  --gold:#c9a227;
  --gold-soft:#e0c766;
  --red:#c1483f;
  --red-soft:rgba(193,72,63,0.16);
  --green:#4c8c6b;
  --green-soft:rgba(76,140,107,0.16);
  --text:#eae8e0;
  --text-dim:#9aa3b6;
  --text-faint:#6b7385;
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(76,140,107,0.06), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:1080px;
  margin:0 auto;
  padding:28px 20px 80px;
}
::selection{background:var(--gold);color:#1a1508;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand .mark{
  font-family:var(--serif);
  font-weight:900;
  font-size:15px;
  letter-spacing:0.14em;
  color:var(--gold-soft);
  border:1px solid var(--border-strong);
  padding:3px 8px;
  border-radius:3px;
}
.brand h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  margin:0;
  letter-spacing:-0.01em;
}
.sync-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
}
.sync-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--text-faint);
  box-shadow:0 0 0 3px transparent;
  transition:all .3s;
}
.sync-dot.live{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.sync-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.sync-dot.loading{background:var(--gold);animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.btn{
  font-family:var(--sans);
  font-weight:500;
  font-size:12.5px;
  background:var(--panel-2);
  color:var(--text);
  border:1px solid var(--border-strong);
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.btn:hover{border-color:var(--gold-soft);}
.btn:active{transform:scale(0.97);}
.btn.small{padding:5px 9px;font-size:11.5px;}

/* ---------- hero / stamp ---------- */
.hero{
  position:relative;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:16px;
  padding:34px 30px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
  overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
  border:1px solid rgba(0,0,0,0.06);
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(transparent, transparent 27px, rgba(35,29,16,0.05) 28px);
  pointer-events:none;
}
.hero-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
.hero-amount{
  font-family:var(--serif);
  font-weight:900;
  font-size:clamp(34px,5.4vw,54px);
  color:var(--ink);
  line-height:1.05;
  letter-spacing:-0.01em;
  position:relative;
}
.hero-delta{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:var(--mono);
  font-size:13.5px;
  font-weight:600;
  padding:4px 10px;
  border-radius:20px;
}
.hero-delta.down{background:var(--red-soft);color:#8a2f28;}
.hero-delta.up{background:var(--green-soft);color:#2b5c42;}
.hero-sub{
  margin-top:14px;
  font-size:12.5px;
  color:var(--ink-dim);
  font-family:var(--sans);
  max-width:420px;
  line-height:1.6;
}
.stamp{
  width:118px;height:118px;
  border-radius:50%;
  border:2.5px solid var(--red);
  color:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transform:rotate(-9deg);
  opacity:0.9;
  font-family:var(--serif);
  position:relative;
  flex-shrink:0;
}
.stamp::before{
  content:'';
  position:absolute;inset:6px;
  border:1px solid var(--red);
  border-radius:50%;
  opacity:0.55;
}
.stamp .s-top{font-size:10px;letter-spacing:0.1em;font-weight:700;margin-bottom:2px;}
.stamp .s-mid{font-size:19px;font-weight:900;}
.stamp .s-bot{font-size:9px;letter-spacing:0.08em;margin-top:2px;font-family:var(--mono);}

/* ---------- grid / panels ---------- */
.grid{
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:16px;
  margin-top:16px;
}
@media (max-width:820px){
  .grid{grid-template-columns:1fr;}
  .hero{grid-template-columns:1fr;text-align:left;}
  .stamp{transform:rotate(-6deg);}
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 20px 22px;
}
.panel-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:15.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 14px;
}
.panel-title .eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:0.1em;
  font-weight:400;
  display:block;
  margin-bottom:3px;
}
.full{grid-column:1 / -1;}

/* ---------- ledger table (Monthly Review mirror) ---------- */
.ledger-group{margin-bottom:4px;}
.ledger-group-name{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--gold-soft);
  letter-spacing:0.08em;
  padding:10px 0 6px;
  border-bottom:1px dashed var(--border-strong);
}
.ledger-row{
  display:grid;
  grid-template-columns:1fr auto auto 28px;
  gap:10px;
  align-items:baseline;
  padding:9px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
}
.ledger-row:last-child{border-bottom:none;}
.ledger-item{color:var(--text);}
.ledger-current{font-family:var(--mono);text-align:right;color:var(--text);}
.ledger-target{font-family:var(--mono);text-align:right;color:var(--text-faint);font-size:12px;}
.ledger-verdict{text-align:center;font-size:13px;}
.ledger-verdict.ok{color:var(--green);}
.ledger-verdict.no{color:var(--red);}

/* ---------- insights ---------- */
.insight{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
  line-height:1.55;
}
.insight:last-child{border-bottom:none;}
.insight .dot{
  flex-shrink:0;
  margin-top:5px;
  width:6px;height:6px;
  border-radius:50%;
}
.insight.warn .dot{background:var(--red);}
.insight.good .dot{background:var(--green);}
.insight.info .dot{background:var(--gold);}
.insight b{color:var(--gold-soft);font-weight:600;}

/* ---------- chart wrap ---------- */
.chart-wrap{position:relative;height:230px;}
.chart-wrap.tall{height:270px;}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* ---------- range toggle ---------- */
.range-toggle{display:flex;gap:4px;}
.range-toggle button{
  font-family:var(--mono);font-size:10.5px;
  background:transparent;border:1px solid var(--border-strong);
  color:var(--text-dim);padding:3px 8px;border-radius:5px;cursor:pointer;
}
.range-toggle button.active{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600;}

/* ---------- allocation list ---------- */
.alloc-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;font-size:12.5px;
}
.alloc-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.alloc-name{flex:1;color:var(--text-dim);}
.alloc-pct{font-family:var(--mono);color:var(--text);width:46px;text-align:right;}
.alloc-amt{font-family:var(--mono);color:var(--text-faint);width:100px;text-align:right;font-size:11.5px;}

/* ---------- settings ---------- */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px dotted var(--border);gap:10px;
}
.settings-row:last-child{border-bottom:none;}
.settings-row label{font-size:12.5px;color:var(--text-dim);}
.settings-row input{
  width:110px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:12.5px;
  border-radius:6px;padding:6px 8px;text-align:right;
}
.settings-note{font-size:11px;color:var(--text-faint);line-height:1.6;margin-top:10px;}

/* ---------- category bars ---------- */
.cat-row{margin:12px 0;}
.cat-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.cat-row-top .amt{font-family:var(--mono);color:var(--text-dim);}
.cat-bar-track{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.cat-row.over .cat-bar-fill{background:linear-gradient(90deg,var(--red),#d9756c);}
.cat-tag{font-family:var(--mono);font-size:10px;color:var(--red);margin-left:6px;}

/* ---------- banner ---------- */
.banner{
  display:flex;align-items:center;gap:10px;
  background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:10px;padding:11px 14px;margin-bottom:14px;
  font-size:12.5px;color:var(--text-dim);
}
.banner.err{border-color:rgba(193,72,63,0.4);color:#e3a29c;}
.banner button{margin-left:auto;}

/* ---------- footer ---------- */
.footer{
  margin-top:26px;
  text-align:center;
  font-size:11.5px;
  color:var(--text-faint);
  font-family:var(--mono);
  line-height:1.9;
}
.footer a{color:var(--gold-soft);text-decoration:none;}
.footer a:hover{text-decoration:underline;}

.empty-state{
  font-size:12.5px;color:var(--text-faint);
  text-align:center;padding:20px 0;
}

.skeleton{
  background:linear-gradient(90deg,var(--panel-2) 25%,rgba(255,255,255,0.06) 37%,var(--panel-2) 63%);
  background-size:400% 100%;
  animation:sk 1.4s ease infinite;
  border-radius:6px;
}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

</style>
</head>

function parseWon(s) {
  if (s === null || s === undefined) return null;

  if (s === '' || s === '-' || s === '₩ -' || s === '₩-') return 0;
  if (!/[\d]/.test(s)) return null;

}

  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  return (neg ? '-₩' : '₩') + abs.toLocaleString('ko-KR');
}

function formatCompactWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;

  let out;
  if (abs >= 100000000) out = (abs / 100000000).toFixed(2).replace(/\.00$/, '') + '억';

function parseReviewFromRows(rows) {
  const compactOf = (row) => row.map(c => (c || '').trim()).filter(c => c !== '');

  let achievement = null, reviewMonth = null;
  for (const row of rows) {
    const c = compactOf(row);
    if (c.includes('달성')) {
      const idx = c.indexOf('달성');
      if (c[idx + 1]) achievement = c[idx + 1];
    }
    if (c.includes('리뷰 월') && c.length > 0) {
      reviewMonth = c[c.length - 1];
    }
  }

  let headerIdx = -1;
  for (let r = 0; r < rows.length; r++) {
    const c = compactOf(rows[r]);
    if (c.includes('구분') && c.includes('항목') && c.includes('현황') && c.includes('목표')) {
      headerIdx = r; break;
    }
  }

  const items = [];
  if (headerIdx !== -1) {
    for (let r = headerIdx + 1; r < rows.length && r < headerIdx + 40; r++) {
      const c = compactOf(rows[r]);
      if (c.length === 0) continue;
      if (['구분', '항목', '현황', '목표', '판정', '갭'].includes(c[0])) continue;
      const group = cleanLabel(c[0]);
      const item = c[1] || null;
      const current = c[2] || null;
      if (!item) continue;
      let target = null, verdict = null, gap = null;
      for (const v of c.slice(3)) {
        if (v === '❌' || v === '✅') verdict = v;
        else if (/^₩/.test(v) || /^[\d.]+%$/.test(v)) {
          if (target === null) target = v; else gap = v;
        }
      }
      items.push({ group, item, current, target, verdict, gap });
    }
  }

  return { reviewMonth, achievement, items };
}

function parseAllFromCsv(csvText) {
  const parsed = Papa.parse(csvText, { skipEmptyLines: false });
  const rows = parsed.data.map(r => r.map(c => (c === null || c === undefined) ? '' : String(c)));
  const pivot = parsePivotFromRows(rows);
  const assetRows = parseAssetsFromRows(rows);
  const review = parseReviewFromRows(rows);
  if (!pivot.incomeTotal || !pivot.expenseTotal) throw new Error('수입/지출 합계를 찾지 못했습니다');
  if (assetRows.length < 5) throw new Error('자산 현황표를 찾지 못했습니다');
  return {
    months: pivot.months,
    incomeTotal: pivot.incomeTotal,
    expenseTotal: pivot.expenseTotal,
    expenseCategories: pivot.expenseCategories,
    assetRows,
    review
  };
}

/* ---------------- derived analysis ---------------- */

function computeDerived(data) {
  const byMonth = {};
  data.assetRows.forEach(r => {
    if (r.amount === null) return;
    byMonth[r.date] = (byMonth[r.date] || 0) + r.amount;
  });
  const assetMonths = Object.keys(byMonth).sort((a, b) => assetMonthKey(a) - assetMonthKey(b));
  const latestMonth = assetMonths[assetMonths.length - 1];
  const prevMonth = assetMonths[assetMonths.length - 2];
  const totalAssets = byMonth[latestMonth] || 0;
  const prevTotalAssets = prevMonth ? byMonth[prevMonth] : null;
  const deltaAssets = prevTotalAssets !== null ? totalAssets - prevTotalAssets : null;
  const deltaPct = (prevTotalAssets && prevTotalAssets !== 0) ? (deltaAssets / Math.abs(prevTotalAssets)) * 100 : null;

  const allocation = {};
  data.assetRows.filter(r => r.date === latestMonth).forEach(r => {
    if (r.amount === null) return;
    allocation[r.category] = (allocation[r.category] || 0) + r.amount;
  });

  const cashLike = (allocation['현금 자산'] || 0) + (allocation['저축 자산'] || 0);

  const cashflow = data.months.map((m, i) => {
    const income = data.incomeTotal[i];
    const expense = data.expenseTotal[i];
    if (!income || income <= 0) return null;
    const savingsRate = ((income - expense) / income) * 100;
    return { month: m, income, expense, savingsRate };
  }).filter(Boolean);

  const catNames = Object.keys(data.expenseCategories);
  const latestPivotIdx = (() => {
    for (let i = data.months.length - 1; i >= 0; i--) {
      if (data.incomeTotal[i] && data.incomeTotal[i] > 0) return i;
    }
    return data.months.length - 1;
  })();
  const catLatest = {};
  const catAvg3 = {};
  catNames.forEach(name => {
    const vals = data.expenseCategories[name];
    catLatest[name] = vals[latestPivotIdx] || 0;
    const window3 = [vals[latestPivotIdx - 1] || 0, vals[latestPivotIdx - 2] || 0, vals[latestPivotIdx - 3] || 0];
    catAvg3[name] = window3.reduce((a, b) => a + b, 0) / 3;
  });

  return {
    byMonth, assetMonths, latestMonth, prevMonth, totalAssets, prevTotalAssets, deltaAssets, deltaPct,
    allocation, cashLike, cashflow, catNames, catLatest, catAvg3, latestPivotIdx
  };
}

function generateInsights(data, d, goals) {
  const insights = [];
  const latestCf = d.cashflow[d.cashflow.length - 1];
  const prevCf = d.cashflow[d.cashflow.length - 2];

  if (latestCf) {
    if (latestCf.savingsRate < goals.savingsRateTarget) {
      insights.push({
        type: 'warn',
        html: `이번 달 저축률이 <b>${latestCf.savingsRate.toFixed(1)}%</b>로 목표(${goals.savingsRateTarget}%)보다 ${(goals.savingsRateTarget - latestCf.savingsRate).toFixed(1)}%p 낮아요. 지출 상위 항목을 먼저 점검해보세요.`
      });
    } else {
      insights.push({
        type: 'good',
        html: `이번 달 저축률 <b>${latestCf.savingsRate.toFixed(1)}%</b>로 목표(${goals.savingsRateTarget}%)를 달성했어요.`
      });
    }
  }

  const last3 = d.cashflow.slice(-3);
  const prev3 = d.cashflow.slice(-6, -3);
  if (last3.length === 3 && prev3.length === 3) {
    const avgLast3 = last3.reduce((a, c) => a + c.savingsRate, 0) / 3;
    const avgPrev3 = prev3.reduce((a, c) => a + c.savingsRate, 0) / 3;
    if (avgLast3 < avgPrev3 - 3) {
      insights.push({
        type: 'warn',
        html: `최근 3개월 평균 저축률(${avgLast3.toFixed(1)}%)이 이전 3개월(${avgPrev3.toFixed(1)}%)보다 낮아지는 추세예요.`
      });
    }
  }

  if (d.totalAssets > 0) {
    const sorted = Object.entries(d.allocation).sort((a, b) => b[1] - a[1]);
    if (sorted.length) {
      const [topCat, topAmt] = sorted[0];
      const pct = (topAmt / d.totalAssets) * 100;
      if (pct >= 65) {
        insights.push({
          type: 'info',
          html: `전체 자산의 <b>${pct.toFixed(0)}%</b>가 ${topCat}에 몰려 있어요. 분산이 필요한지 한 번 점검해보세요.`
        });
      }
    }
    const cashPct = (d.cashLike / d.totalAssets) * 100;
    if (d.cashLike < goals.emergencyFundTarget) {
      insights.push({
        type: 'warn',
        html: `현금성 자산(현금+저축)이 <b>${formatCompactWon(d.cashLike)}원</b>으로 비상금 목표(${formatCompactWon(goals.emergencyFundTarget)}원)에 못 미쳐요.`
      });
    } else {
      insights.push({
        type: 'good',
        html: `현금성 자산이 <b>${formatCompactWon(d.cashLike)}원</b>(전체의 ${cashPct.toFixed(0)}%)으로 비상금 목표를 충족하고 있어요.`
      });
    }
  }

  const overspent = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest > x.avg * 1.3)
    .sort((a, b) => (b.latest - b.avg) - (a.latest - a.avg));
  if (overspent.length) {
    const top = overspent[0];
    const pct = ((top.latest - top.avg) / top.avg) * 100;
    insights.push({
      type: 'warn',
      html: `<b>${top.name}</b> 지출이 최근 3개월 평균보다 ${pct.toFixed(0)}% 늘었어요 (${formatCompactWon(top.latest)}원 vs 평균 ${formatCompactWon(top.avg)}원).`
    });
  }

  if (data.review && data.review.items && data.review.items.length) {
    const failed = data.review.items.filter(i => i.verdict === '❌').length;
    const total = data.review.items.filter(i => i.verdict).length;
    if (total > 0) {
      insights.push({
        type: failed > total / 2 ? 'warn' : 'info',
        html: `이번 달 목표 판정 항목 ${total}개 중 <b>${total - failed}개 달성</b>했어요.`
      });
    }
    const dq = data.review.items.find(i => i.item && i.item.includes('재분류 미입력'));
    if (dq && dq.current && parseInt(dq.current) > 0) {
      insights.push({
        type: 'info',
        html: `미분류 거래가 <b>${dq.current}건</b> 있어요. 분류를 정리하면 카테고리 분석이 더 정확해져요.`
      });
    }
  }

  return insights;
}

  const maxVal = Math.max(...rows.map(r => Math.max(r.latest, r.avg)), 1);
  panel.innerHTML = `
    <div class="panel-title"><div><span class="eyebrow">SPENDING</span>카테고리별 지출 패턴 (이번 달 vs 최근 3개월 평균)</div></div>
    ${rows.map(r => {
      const over = r.avg > 0 && r.latest > r.avg * 1.3;
      const pct = (r.latest / maxVal) * 100;
      return `
        <div class="cat-row ${over ? 'over' : ''}">
          <div class="cat-row-top">
            <span>${r.name}${over ? '<span class="cat-tag">평균 초과</span>' : ''}</span>
            <span class="amt">${formatCompactWon(r.latest)}원 <span style="color:var(--text-faint)">/ 평균 ${formatCompactWon(r.avg)}원</span></span>
          </div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
        </div>`;
    }).join('') || '<div class="empty-state">지출 카테고리 데이터가 없어요.</div>'}
  `;
}

function renderSettings() {
  const panel = document.getElementById('panel-settings');
  panel.innerHTML = `
    <div class="panel-title"><div><span class="eyebrow">GOALS</span>내 목표 설정</div></div>
    <div class="settings-row">
      <label>저축률 목표 (%)</label>
      <input type="number" id="goal-savings" value="${state.goals.savingsRateTarget}" min="0" max="100" />
    </div>
    <div class="settings-row">
      <label>비상금(현금성자산) 목표</label>
      <input type="number" id="goal-emergency" value="${state.goals.emergencyFundTarget}" step="100000" />
    </div>
    <div class="settings-note">여기서 설정한 목표는 위 가이드 문구 계산에만 쓰이고, 이 브라우저에만 저장돼요. 시트 자체의 Monthly Review 목표값은 그대로 시트에서 관리돼요.</div>
  `;
  const savingsInput = document.getElementById('goal-savings');
  const emergencyInput = document.getElementById('goal-emergency');
  const commit = () => {
    state.goals.savingsRateTarget = parseFloat(savingsInput.value) || 0;
    state.goals.emergencyFundTarget = parseFloat(emergencyInput.value) || 0;
    saveGoals();
    renderInsights(state.data, computeDerived(state.data));
  };
  savingsInput.addEventListener('change', commit);
  emergencyInput.addEventListener('change', commit);
}

function renderAbout() {
  const panel = document.getElementById('panel-about');
  panel.innerHTML = `
    <div class="panel-title"><div><span class="eyebrow">SOURCE</span>데이터 안내</div></div>
    <div class="insight info"><span class="dot"></span><span>총자산·자산배분은 시트의 <b>월별 자산 스냅샷표</b>를, 저축률·지출은 <b>카테고리별 월 합계표</b>를, 목표 리뷰는 <b>Monthly Review 패널</b>을 그대로 불러와요.</span></div>
    <div class="insight info"><span class="dot"></span><span>시트를 수정한 뒤 새로고침 버튼을 누르면 즉시 반영돼요. 페이지를 새로 열 때도 자동으로 최신 값을 불러와요.</span></div>
    <div class="insight warn"><span class="dot"></span><span>실시간 동기화가 안 되면, 시트 공유 설정을 "링크가 있는 모든 사용자 - 뷰어"로 바꿔주세요. 로그인 없이도 브라우저가 직접 데이터를 읽어와요.</span></div>
  `;
}

function renderAll() {
  const data = state.data;
  const d = computeDerived(data);
  renderBanner();
  setSyncState(state.source === 'live' ? 'live' : state.lastError ? 'err' : 'snapshot');
  renderHero(d);
  renderReview(data);
  renderInsights(data, d);
  renderAllocation(d);
  renderTrend(d);
  renderCashflow(data, d);
  renderCategory(d);
  renderSettings();
  renderAbout();
}

/* ---------------- storage ---------------- */

async function loadGoals() {
  try {
    const res = await window.storage.get('goals', false);
    if (res && res.value) {
      const g = JSON.parse(res.value);
      state.goals = { ...state.goals, ...g };
    }
  } catch (e) { /* no saved goals yet */ }
}

async function saveGoals() {
  try { await window.storage.set('goals', JSON.stringify(state.goals), false); } catch (e) {}
}

/* ---------------- fetch & init ---------------- */

async function fetchLive(manual) {
  setSyncState('loading');
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    if (text.trim().startsWith('<')) throw new Error('시트 접근 권한이 없어요');
    const parsed = parseAllFromCsv(text);
    state.data = parsed;
    state.source = 'live';
    state.lastError = null;
    state.lastSync = new Date();
    renderAll();
  } catch (e) {
    console.error('live sync failed', e);
    state.lastError = e.message || String(e);
    if (!state.data) {
      state.data = SNAPSHOT_DATA;
      state.source = 'snapshot';
    } else if (manual) {
      state.source = state.source === 'live' ? 'live' : 'snapshot';
    }
    renderAll();
  }
}

async function init() {
  renderShell();
  await loadGoals();
  state.data = SNAPSHOT_DATA;
  state.source = 'snapshot';
  renderAll();
  fetchLive(false);
}

init();

</script>
</body>
</html>
