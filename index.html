<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>해달 — 당신의 자산관리 파트너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e121a;
  --bg-2:#141a25;
  --panel:#171e2b;
  --panel-2:#1e2635;
  --border:rgba(233,231,223,0.09);
  --border-strong:rgba(233,231,223,0.16);
  --paper:#f3ecd9;
  --paper-2:#ece2c6;
  --ink:#231d10;
  --ink-dim:#5a5138;
  --gold:#c9a227;
  --gold-soft:#e0c766;
  --red:#c1483f;
  --red-soft:rgba(193,72,63,0.16);
  --green:#4c8c6b;
  --green-soft:rgba(76,140,107,0.16);
  --text:#eae8e0;
  --text-dim:#9aa3b6;
  --text-faint:#6b7385;
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(76,140,107,0.06), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:none;
  width:100%;
  margin:0 auto;
  padding:0 clamp(16px, 2.5vw, 40px) 80px;
  box-sizing:border-box;
}
::selection{background:var(--gold);color:#1a1508;}

/* ---------- sticky header ---------- */
.site-header{
  position:sticky;
  top:0;
  z-index:100;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    var(--bg);
  padding-top:28px;
  margin:0 calc(-1 * clamp(16px, 2.5vw, 40px));
  padding-left:clamp(16px, 2.5vw, 40px);
  padding-right:clamp(16px, 2.5vw, 40px);
  border-bottom:1px solid var(--border);
}
#page-content{padding-top:22px;display:flex;flex-direction:column;gap:16px;}
.grid-top{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch;}
.col-stack{display:flex;flex-direction:column;gap:16px;}
@media (max-width:820px){.grid-top{grid-template-columns:1fr;}}

/* ---------- top bar ---------- */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand .mark{
  font-size:22px;
  line-height:1;
}
.brand h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .tagline{
  font-family:var(--sans);
  font-size:11.5px;
  color:var(--text-faint);
  font-weight:400;
  letter-spacing:0.01em;
}
.sync-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
}
.sync-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--text-faint);
  box-shadow:0 0 0 3px transparent;
  transition:all .3s;
}
.sync-dot.live{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.sync-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.sync-dot.loading{background:var(--gold);animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.btn{
  font-family:var(--sans);
  font-weight:500;
  font-size:12.5px;
  background:var(--panel-2);
  color:var(--text);
  border:1px solid var(--border-strong);
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.btn:hover{border-color:var(--gold-soft);}
.btn:active{transform:scale(0.97);}
.btn.small{padding:5px 9px;font-size:11.5px;}

/* ---------- hero / stamp ---------- */
.hero{
  position:relative;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:16px;
  padding:34px 30px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
  overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
  border:1px solid rgba(0,0,0,0.06);
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(transparent, transparent 27px, rgba(35,29,16,0.05) 28px);
  pointer-events:none;
}
.hero-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
.hero-amount{
  font-family:var(--serif);
  font-weight:900;
  font-size:clamp(34px,5.4vw,54px);
  color:var(--ink);
  line-height:1.05;
  letter-spacing:-0.01em;
  position:relative;
}
.hero-delta{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:var(--mono);
  font-size:13.5px;
  font-weight:600;
  padding:4px 10px;
  border-radius:20px;
}
.hero-delta.down{background:var(--red-soft);color:#8a2f28;}
.hero-delta.up{background:var(--green-soft);color:#2b5c42;}
.hero-sub{
  margin-top:14px;
  font-size:12.5px;
  color:var(--ink-dim);
  font-family:var(--sans);
  max-width:420px;
  line-height:1.6;
}
.stamp{
  width:118px;height:118px;
  border-radius:50%;
  border:2.5px solid var(--red);
  color:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transform:rotate(-9deg);
  opacity:0.9;
  font-family:var(--serif);
  position:relative;
  flex-shrink:0;
}
.stamp::before{
  content:'';
  position:absolute;inset:6px;
  border:1px solid var(--red);
  border-radius:50%;
  opacity:0.55;
}
.stamp .s-top{font-size:10px;letter-spacing:0.1em;font-weight:700;margin-bottom:2px;}
.stamp .s-mid{font-size:19px;font-weight:900;}
.stamp .s-bot{font-size:9px;letter-spacing:0.08em;margin-top:2px;font-family:var(--mono);}

/* ---------- grid / panels ---------- */
.grid{
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:16px;
  margin-top:16px;
}
@media (max-width:820px){
  .grid{grid-template-columns:1fr;}
  .hero{grid-template-columns:1fr;text-align:left;}
  .stamp{transform:rotate(-6deg);}
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 20px 22px;
}
.panel-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:15.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  row-gap:8px;
  margin:0 0 14px;
}
.panel-title .eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:0.1em;
  font-weight:400;
  display:block;
  margin-bottom:3px;
}
.full{grid-column:1 / -1;}

/* ---------- ledger table (Monthly Review mirror) ---------- */
.ledger-group{margin-bottom:4px;}
.ledger-group-name{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--gold-soft);
  letter-spacing:0.08em;
  padding:10px 0 6px;
  border-bottom:1px dashed var(--border-strong);
}
.ledger-row{
  display:grid;
  grid-template-columns:1fr auto auto 28px;
  gap:10px;
  align-items:baseline;
  padding:9px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
}
.ledger-row:last-child{border-bottom:none;}
.ledger-item{color:var(--text);}
.ledger-current{font-family:var(--mono);text-align:right;color:var(--text);}
.ledger-target{font-family:var(--mono);text-align:right;color:var(--text-faint);font-size:12px;}
.ledger-verdict{text-align:center;font-size:13px;}
.ledger-verdict.ok{color:var(--green);}
.ledger-verdict.no{color:var(--red);}

/* ---------- insights ---------- */
.insight{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
  line-height:1.55;
}
.insight:last-child{border-bottom:none;}
.insight .dot{
  flex-shrink:0;
  margin-top:5px;
  width:6px;height:6px;
  border-radius:50%;
}
.insight.warn .dot{background:var(--red);}
.insight.good .dot{background:var(--green);}
.insight.info .dot{background:var(--gold);}
.insight b{color:var(--gold-soft);font-weight:600;}

/* ---------- chart wrap ---------- */
.chart-wrap{position:relative;height:230px;}
.chart-wrap.tall{height:270px;}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* ---------- range toggle ---------- */
.range-toggle{display:flex;gap:4px;}
.range-toggle button{
  font-family:var(--mono);font-size:10.5px;
  background:transparent;border:1px solid var(--border-strong);
  color:var(--text-dim);padding:3px 8px;border-radius:5px;cursor:pointer;
}
.range-toggle button.active{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600;}

/* ---------- allocation list ---------- */
.alloc-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;font-size:12.5px;
}
.alloc-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.alloc-name{flex:1;color:var(--text-dim);}
.alloc-pct{font-family:var(--mono);color:var(--text);width:46px;text-align:right;}
.alloc-amt{font-family:var(--mono);color:var(--text);width:auto;text-align:right;font-size:12px;}

/* ---------- settings ---------- */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px dotted var(--border);gap:10px;
}
.settings-row:last-child{border-bottom:none;}
.settings-row label{font-size:12.5px;color:var(--text-dim);}
.settings-row input{
  width:110px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:12.5px;
  border-radius:6px;padding:6px 8px;text-align:right;
}
.settings-note{font-size:11px;color:var(--text-faint);line-height:1.6;margin-top:10px;}

/* ---------- category bars ---------- */
.cat-row{margin:12px 0;}
.cat-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.cat-row-top .amt{font-family:var(--mono);color:var(--text-dim);}
.cat-bar-track{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.cat-row.over .cat-bar-fill{background:linear-gradient(90deg,var(--red),#d9756c);}
.cat-tag{font-family:var(--mono);font-size:10px;color:var(--red);margin-left:6px;}
.budget-input-compact{
  width:66px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:10px;
  border-radius:4px;padding:1px 4px;text-align:right;
}
.budget-row-compact{display:flex;align-items:center;gap:14px;padding:5px 0;flex-wrap:nowrap;}
.b-name{flex:0 0 auto;width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text);}
.b-bar-track{flex:1 1 auto;min-width:20px;height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;}
.b-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
.b-bar-fill.over{background:linear-gradient(90deg,var(--red),#d9756c);}
.b-figures{flex:0 0 210px;font-family:var(--mono);font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.subhead{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;margin-bottom:8px;}
.pie-legend-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;}
.pie-legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.pie-legend-name{flex:1;color:var(--text);}
.pie-legend-val{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
.month-nav select{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:5px 8px;
}
.income-cat-btns{
  display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;
}
.income-cat-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--sans);font-size:11px;border-radius:20px;padding:4px 11px;cursor:pointer;
  transition:all .15s;
}
.income-cat-btn:hover{border-color:var(--border-strong);color:var(--text);}
.income-cat-btn.active{background:var(--gold-soft);border-color:var(--gold-soft);color:#1a1408;font-weight:600;}
.overlay-toggles{display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;}
.overlay-toggles label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);cursor:pointer;}
.overlay-toggles input[type="checkbox"]{accent-color:var(--gold-soft);cursor:pointer;}
.compact-stat-value{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--text);margin-top:4px;}
#top-expenses-body{padding-left:18px;}
.month-nav-select-standalone{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:6px 10px;margin:8px 0 12px;
  display:block;width:auto;max-width:280px;
}
@media (max-width:820px){
  #top-expenses-body{padding-left:0;}
}
@media (max-width:520px){
  .b-name{width:44px;}
  .b-figures{flex-basis:150px;font-size:9px;}
}

/* ---------- banner ---------- */
.banner{
  display:flex;align-items:center;gap:10px;
  background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:10px;padding:11px 14px;margin-bottom:14px;
  font-size:12.5px;color:var(--text-dim);
}
.banner.err{border-color:rgba(193,72,63,0.4);color:#e3a29c;}
.banner button{margin-left:auto;}

/* ---------- footer ---------- */
.footer{
  margin-top:26px;
  text-align:center;
  font-size:11.5px;
  color:var(--text-faint);
  font-family:var(--mono);
  line-height:1.9;
}
.footer a{color:var(--gold-soft);text-decoration:none;}
.footer a:hover{text-decoration:underline;}

.empty-state{
  font-size:12.5px;color:var(--text-faint);
  text-align:center;padding:20px 0;
}

.skeleton{
  background:linear-gradient(90deg,var(--panel-2) 25%,rgba(255,255,255,0.06) 37%,var(--panel-2) 63%);
  background-size:400% 100%;
  animation:sk 1.4s ease infinite;
  border-radius:6px;
}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 이번달(now) 페이지 ---------- */
.now-progress{display:flex;align-items:center;gap:12px;margin-top:2px;}
.now-progress-track{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
.now-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
.now-progress-text{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
.now-kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dotted var(--border);font-size:12.5px;color:var(--text-dim);}
.now-kv:last-child{border-bottom:none;}
.now-kv b{font-family:var(--mono);color:var(--text);font-weight:600;}
.now-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.now-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text-dim);border-radius:9px;padding:7px 11px;cursor:pointer;font-family:var(--sans);font-size:12px;text-align:left;line-height:1.35;transition:border-color .15s,color .15s;}
.now-chip em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
.now-chip span{display:block;font-family:var(--mono);font-size:11px;color:var(--text);margin-top:2px;}
.now-chip:hover{border-color:var(--gold-soft);color:var(--text);}
.now-chip.active{border-color:var(--gold);color:var(--gold-soft);background:rgba(201,162,39,0.10);}
.now-chip.future{opacity:.4;}
@media (max-width:600px){
  .now-progress{flex-wrap:wrap;}
  .now-chip{flex:1 1 calc(50% - 8px);}
}

/* ---------- 오늘(today) 페이지 ---------- */
.month-nav input[type="date"]{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;color-scheme:dark;
}
.cal-cell.real{border-style:dashed;border-color:var(--gold-soft);}
.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.today-date{font-family:var(--serif);font-weight:800;font-size:25px;line-height:1.2;color:var(--text);}
.today-date .today-dow{color:var(--gold-soft);}
.today-date small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--text-faint);letter-spacing:.04em;margin-top:6px;}
.today-verdict{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.55;margin-top:2px;}
.today-verdict.good{color:var(--green);}
.today-verdict.warn{color:var(--red);}
.today-verdict.neutral{color:var(--gold-soft);}
.allow-track{height:9px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin-top:10px;}
.allow-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),#6fa88a);transition:width .3s;}
.allow-fill.over{background:linear-gradient(90deg,var(--red),#d9756c);}
.allow-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:6px;}
.streak-badge{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--border-strong);color:var(--text-dim);margin-top:10px;}
.streak-badge.on{border-color:rgba(76,140,107,0.45);color:var(--green);background:var(--green-soft);}
.dow-row{display:flex;gap:5px;margin-top:12px;}
.dow-cell{flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:7px 2px;background:var(--panel-2);}
.dow-cell.sel{border-color:var(--gold);}
.dow-cell.future{opacity:.35;}
.dow-cell em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
.dow-cell span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text);margin-top:3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;}
.cal-dow{font-family:var(--mono);font-size:10px;color:var(--text-faint);text-align:center;padding-bottom:2px;}
.cal-cell{min-height:52px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;
  cursor:pointer;transition:border-color .15s;font:inherit;}
.cal-cell.blank{border-color:transparent;background:transparent;cursor:default;}
.cal-cell.future{opacity:.3;cursor:default;}
.cal-cell:hover:not(.blank):not(.future){border-color:var(--gold-soft);}
.cal-cell.sel{border-color:var(--gold);background:rgba(201,162,39,0.12);}
.cal-day{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.cal-cell.sel .cal-day{color:var(--gold-soft);}
.cal-amt{font-family:var(--mono);font-size:9px;color:var(--text-faint);line-height:1.2;}
.cal-amt.zero{color:var(--green);}
.fixed-due{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--border);font-size:12.5px;}
.fixed-due:last-child{border-bottom:none;}
.fixed-due .dday{font-family:var(--mono);font-size:10px;flex-shrink:0;width:46px;text-align:center;padding:3px 0;border-radius:5px;background:var(--panel-2);color:var(--text-dim);}
.fixed-due .dday.soon{background:rgba(201,162,39,0.18);color:var(--gold-soft);}
.fixed-due .dday.late{background:var(--red-soft);color:#d9756c;}
.fixed-due .nm{flex:1;color:var(--text);}
.fixed-due .nm small{display:block;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.fixed-due .amt2{font-family:var(--mono);color:var(--text);}
@media (max-width:600px){
  .today-date{font-size:21px;}
  .cal-cell{min-height:44px;}
  .cal-amt{font-size:8px;}
}

/* ---------- 캘린더 페이지 ---------- */
.mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.mcal-head{margin-top:14px;margin-bottom:6px;}
.mcal-dow{font-family:var(--mono);font-size:12px;color:var(--text-faint);text-align:center;}
.mcal-dow.sat{color:#7c9bc9;}
.mcal-dow.sun{color:#c1483f;}
.mcal-cell{
  min-height:106px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);
  padding:8px 8px 9px;display:flex;flex-direction:column;gap:3px;cursor:pointer;
  transition:border-color .15s;text-align:left;overflow:hidden;
}
.mcal-cell.blank{border-color:transparent;background:transparent;cursor:default;}
.mcal-cell.future{opacity:.35;cursor:default;}
.mcal-cell:hover:not(.blank):not(.future){border-color:var(--gold-soft);}
.mcal-cell.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.mcal-cell.real{border-style:dashed;border-color:var(--gold-soft);}
.mcal-daynum{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;}
.mcal-daynum.sat{color:#7c9bc9;}
.mcal-daynum.sun{color:#c1483f;}
.mcal-daynum .cnt{font-size:10.5px;font-weight:400;color:var(--text-faint);}
.mcal-line{display:flex;justify-content:space-between;gap:5px;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:nowrap;font-variant-numeric:tabular-nums;}
.mcal-line i{font-style:normal;opacity:.75;}
.mcal-line.inc{color:#7fbf9c;}
.mcal-line.exp{color:#e08a82;}
.mcal-line.trf{color:var(--gold-soft);}
.mcal-none{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}
.mcal-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:12px;}
.mcal-legend span{display:flex;align-items:center;gap:5px;}
.mcal-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;font-style:normal;}
.dow-avg-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;}
.dow-avg-row .nm{width:22px;font-family:var(--mono);font-size:11px;color:var(--text-dim);flex-shrink:0;}
.dow-avg-row .fig{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);width:86px;text-align:right;flex-shrink:0;}
@media (max-width:1180px){
  .mcal-line{font-size:12px;}
  .mcal-line i{display:none;}
}
@media (max-width:820px){
  .mcal-cell{min-height:92px;padding:6px 5px;}
  .mcal-line{font-size:11px;}
  .mcal-daynum{font-size:15px;}
  .mcal-daynum .cnt{display:none;}
}
@media (max-width:600px){
  .mcal-grid{gap:4px;}
  .mcal-cell{min-height:80px;padding:5px 4px;}
  .mcal-line{font-size:10px;}
  .mcal-daynum{font-size:13.5px;}
}

/* ---------- 구조 페이지 (자산 증식 엔진) ---------- */
.eng-board{display:flex;align-items:stretch;gap:9px;margin-top:16px;}
.eng-stage{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:7px;}
.eng-stage-head{display:flex;align-items:baseline;gap:7px;padding-bottom:5px;border-bottom:1px solid var(--border-strong);}
.eng-stage-head span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);}
.eng-stage-head b{font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--text);}
.eng-arrow{flex:0 0 12px;display:flex;align-items:center;justify-content:center;color:var(--gold-soft);font-size:14px;opacity:.65;padding-top:26px;}
.eng-node{border:1px solid var(--border);border-radius:10px;background:var(--panel-2);padding:8px 9px 9px;display:flex;flex-direction:column;gap:4px;}
.eng-node.leak{border-color:rgba(193,72,63,.3);}
.eng-node.zero{opacity:.55;}
.eng-node-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.eng-node-top .nm{font-size:12.5px;font-weight:600;color:var(--text);}
.eng-node-top .pct{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.eng-amt{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);}
.eng-amt.inc{color:#7fbf9c;}
.eng-amt.exp{color:#e08a82;}
.eng-amt.trf{color:var(--gold-soft);}
.eng-amt.stk{color:#8fb4dd;}
.eng-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden;}
.eng-bar i{display:block;height:100%;border-radius:3px;background:var(--gold-soft);}
.eng-bar i.exp{background:#e08a82;}
.eng-bar i.inc{background:#7fbf9c;}
.eng-bar i.stk{background:#8fb4dd;}
.eng-sub{font-family:var(--mono);font-size:10px;color:var(--text-faint);line-height:1.5;}
.eng-act{margin-top:3px;border-radius:7px;padding:6px 7px;font-size:11px;line-height:1.55;
  border:1px dashed rgba(201,162,39,.42);background:rgba(201,162,39,.07);color:var(--gold-soft);}
.eng-act b{color:var(--text);}
.eng-act .rk{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  background:rgba(201,162,39,.22);color:var(--gold-soft);border-radius:4px;padding:1px 4px;margin-right:5px;}
.eng-act.p1{border-style:solid;border-color:var(--gold);background:rgba(201,162,39,.17);}
.eng-act.p1 .rk{background:var(--gold);color:#1a1508;font-weight:600;}
.eng-act.risk{border-color:rgba(193,72,63,.45);background:rgba(193,72,63,.10);color:#e39a93;}
.eng-act.risk .rk{background:rgba(193,72,63,.3);color:#f0b8b2;}
.eng-loop{margin-top:16px;border:1px solid var(--border);border-radius:11px;
  background:linear-gradient(90deg,rgba(201,162,39,.11),rgba(76,140,107,.07));padding:12px 14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.eng-loop .ic{font-size:18px;color:var(--gold-soft);flex-shrink:0;}
.eng-loop .tx{flex:1 1 320px;font-size:12.5px;line-height:1.75;color:var(--text-dim);}
.eng-loop .tx b{color:var(--text);}
.eng-split{display:flex;height:10px;border-radius:5px;overflow:hidden;flex:1 1 180px;min-width:140px;background:rgba(255,255,255,.05);}
.eng-split i{display:block;height:100%;}
.eng-cross{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap;}
.eng-cross .lb{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex:0 0 auto;}
.eng-cross .tr{flex:1 1 200px;height:8px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden;position:relative;}
.eng-cross .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--gold-soft));}
.act-imp{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--gold-soft);}
.act-ctrl{font-family:var(--mono);font-size:10px;border-radius:5px;padding:2px 6px;}
.act-ctrl.hi{background:var(--green-soft);color:#8fd0ac;}
.act-ctrl.mid{background:rgba(201,162,39,.18);color:var(--gold-soft);}
.act-ctrl.lo{background:rgba(255,255,255,.05);color:var(--text-faint);}
.chk-row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.chk-row:last-child{border-bottom:none;}
.chk-row .mk{flex:0 0 46px;font-family:var(--mono);font-size:10px;text-align:center;border-radius:5px;padding:3px 0;margin-top:1px;}
.chk-row .mk.ok{background:var(--green-soft);color:#8fd0ac;}
.chk-row .mk.no{background:var(--red-soft);color:#e39a93;}
.chk-row .mk.na{background:rgba(255,255,255,.05);color:var(--text-faint);}
.chk-row .nm{flex:1 1 auto;min-width:0;line-height:1.5;}
.chk-row .nm i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:3px;}
.chk-row .fig{flex:0 0 auto;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text);line-height:1.5;}
.chk-row .fig em{display:block;font-style:normal;font-size:10px;color:var(--text-faint);margin-top:2px;}
@media (max-width:1000px){
  .eng-board{flex-direction:column;}
  .eng-arrow{padding-top:0;transform:rotate(90deg);}
}

/* ---------- nav ---------- */
.navbar{
  display:flex;gap:6px;margin:16px 0 0;
  overflow-x:auto;
}
.nav-btn{
  font-family:var(--sans);font-weight:500;font-size:13px;
  background:transparent;border:none;color:var(--text-dim);
  padding:9px 14px;cursor:pointer;position:relative;white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:color .15s;
}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);font-weight:700;}

/* ---------- stat cards ---------- */
.stat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px;
}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:15px 16px;
}
.stat-card .label{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.05em;}
.stat-card .value{font-family:var(--serif);font-weight:800;font-size:21px;margin-top:5px;color:var(--text);}
.stat-card .sub{font-size:11px;color:var(--text-dim);margin-top:4px;font-family:var(--mono);}
.stat-card .sub.up{color:var(--green);}
.stat-card .sub.down{color:var(--red);}

/* ---------- data table (가계부) ---------- */
.table-controls{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
}
.table-controls input[type="text"]{
  flex:1;min-width:160px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:8px 10px;
}
.table-controls select{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:8px 10px;
}
.table-meta{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{
  text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid var(--border-strong);
  position:sticky;top:0;background:var(--panel);
}
.data-table tbody td{
  padding:9px 8px;border-bottom:1px dotted var(--border);color:var(--text-dim);
  white-space:nowrap;
}
.data-table tbody tr:hover td{background:rgba(255,255,255,0.02);}
.data-table td.amt{font-family:var(--mono);text-align:right;}
.data-table td.amt.income{color:var(--green);}
.data-table td.amt.expense{color:var(--red);}
.data-table td.amt.transfer{color:var(--gold-soft);}
.table-scroll{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
.tag-pill{
  display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;
}
.tag-pill.income{background:var(--green-soft);color:#2b5c42;}
.tag-pill.expense{background:var(--red-soft);color:#8a2f28;}
.tag-pill.transfer{background:rgba(201,162,39,0.18);color:#8a6c15;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.pager button{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;}
.pager button:disabled{opacity:.35;cursor:default;}

/* ---------- account list (투자 페이지) ---------- */
.acct-row{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--border);font-size:12.5px;
}
.acct-row:last-child{border-bottom:none;}
.acct-name{flex:1;color:var(--text);}
.acct-cat{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.acct-amt{font-family:var(--mono);color:var(--text);}

/* ---------- gauge ---------- */
.gauge-wrap{position:relative;height:150px;margin-top:4px;}
.gauge-wrap canvas{width:100% !important;height:100% !important;}
.gauge-label{
  position:absolute;left:0;right:0;top:60%;text-align:center;pointer-events:none;
}
.gauge-value{font-family:var(--serif);font-weight:800;font-size:26px;}
.gauge-target{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:2px;}

/* ---------- category flex (pie + bars) ---------- */
.cat-flex{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
.cat-flex .pie-col{width:200px;flex-shrink:0;}
.cat-flex .bars-col{flex:1;min-width:220px;}
@media (max-width:600px){
  .cat-flex .pie-col{width:100%;}
}

/* ---------- 3-column grid variant (home allocation/trend/gauge row) ---------- */
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:820px){
  .grid-3{grid-template-columns:1fr;}
}
.grid-4{grid-template-columns:1.3fr 1fr 1fr 1fr;}
/* ---------- 토스 실시간 패널 ---------- */
.grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:820px){
  .grid-2{grid-template-columns:1fr;}
}
.chart-label{font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.pie-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px;}
.ghost-btn{
  font-family:var(--sans);font-size:12px;color:var(--text-dim);
  background:transparent;border:1px solid var(--border-strong);
  border-radius:6px;padding:6px 14px;cursor:pointer;
}
.ghost-btn:hover{color:var(--text);border-color:var(--gold-soft);}
@media (max-width:820px){
  .grid-4{grid-template-columns:1fr;}
}

/* ---------- checklist checkbox accent ---------- */
.fixed-check{accent-color:var(--gold);}

/* ---------- goal hero ---------- */
.goal-bars{margin-top:16px;max-width:420px;}
.goal-bar-row{display:flex;justify-content:space-between;font-size:12.5px;font-family:var(--mono);color:var(--ink);margin-bottom:4px;}
.goal-bar-row span:first-child{font-family:var(--sans);color:var(--ink-dim);}

/* ---------- month nav ---------- */
.month-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.month-nav select{flex-shrink:0;}
.month-nav button{
  flex-shrink:0;white-space:nowrap;
}
.month-nav button:not(.btn){
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;
}
.month-nav button:disabled{opacity:.3;cursor:default;}
.month-nav .month-label{font-family:var(--mono);font-size:13px;min-width:64px;text-align:center;}

/* ---------- callout / verdict box ---------- */
.callout{
  border-radius:12px;padding:16px 18px;margin-bottom:16px;
  border:1px solid var(--border-strong);
}
.callout.good{background:rgba(76,140,107,0.1);border-color:rgba(76,140,107,0.35);}
.callout.warn{background:rgba(193,72,63,0.1);border-color:rgba(193,72,63,0.35);}
.callout-title{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:6px;}
.callout-body{font-size:13px;line-height:1.6;color:var(--text-dim);}

/* ---------- advanced table (group/sort/filter) ---------- */
.at-group{
  border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;
}
.at-group-summary{
  list-style:none;cursor:pointer;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-family:var(--mono);color:var(--text);
  background:var(--panel-2);
}
.at-group-summary::-webkit-details-marker{display:none;}
.at-group-summary span:first-child{font-family:var(--sans);color:var(--text-dim);}

/* ---------- goal cards ---------- */
.goal-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.goal-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;}
.goal-card.ok{background:rgba(76,140,107,0.10);border-color:rgba(76,140,107,0.45);}
.goal-card.no{background:rgba(193,72,63,0.10);border-color:rgba(193,72,63,0.45);}
.goal-card.active{background:rgba(201,162,39,0.08);border-color:rgba(201,162,39,0.4);}
.goal-card.pending{background:var(--panel-2);border-color:var(--border);opacity:0.85;}
.goal-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;flex-wrap:wrap;gap:5px;}
.goal-card-chips{display:flex;gap:5px;flex-wrap:wrap;}
.goal-chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.goal-chip-period{background:rgba(201,162,39,0.14);color:var(--gold-soft);}
.goal-chip-cat{background:rgba(91,143,199,0.16);color:#9dc2e8;}
.goal-chip-status{font-weight:600;}
.goal-chip-status.ok{background:rgba(76,140,107,0.18);color:#8fd0ac;}
.goal-chip-status.no{background:rgba(193,72,63,0.18);color:#eb9891;}
.goal-chip-status.active{background:rgba(201,162,39,0.2);color:var(--gold-soft);}
.goal-chip-status.pending{background:rgba(154,163,182,0.14);color:var(--text-dim);}
.goal-chip-status.neutral{background:rgba(154,163,182,0.14);color:var(--text-dim);}
.goal-card-item{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35;}
.goal-card-target{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:3px;}

.goal-progress{margin-top:8px;}
.goal-progress-track{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.goal-progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
.goal-progress-fill.good{background:linear-gradient(90deg,var(--green),#6fb08c);}
.goal-progress-fill.bad{background:linear-gradient(90deg,var(--red),#d9756c);}
.goal-progress-figures{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:4px;}
.mini-goal-head{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.05em;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.mini-goal-list{margin-top:6px;}
.mini-goal-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;}
.mini-goal-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);flex-shrink:0;}
.mini-goal-text{flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-goal-period{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.vendor-hover-tip{
  display:none;position:fixed;z-index:999;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);pointer-events:auto;
  max-width:280px;font-size:11.5px;
}
.vtip-title{font-family:var(--serif);font-weight:700;font-size:12.5px;color:var(--text);margin-bottom:6px;}
.vtip-scroll{max-height:220px;overflow-y:auto;}
.vtip-row{display:flex;gap:8px;padding:3px 0;color:var(--text-dim);white-space:nowrap;}
.vtip-date{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.vtip-item{flex:1;overflow:hidden;text-overflow:ellipsis;}
.vtip-amt{font-family:var(--mono);font-size:10.5px;color:var(--red);flex-shrink:0;}
.vtip-empty{color:var(--text-faint);font-size:11px;}

/* 한도형(지출/고정비): 얇은 사용률 바 + 인라인 텍스트 */
.goal-cap{margin-top:8px;display:flex;align-items:center;gap:8px;}
.goal-cap-track{flex:1;height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;}
.goal-cap-fill{height:100%;border-radius:2px;background:var(--gold-soft);}
.goal-cap-fill.over{background:var(--red);}
.goal-cap-text{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);white-space:nowrap;}

/* 비율형(현금비율 등): 바 없이 현재→목표 숫자 비교 배지 */
.goal-ratio{margin-top:8px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;}
.goal-ratio-current{font-weight:700;font-size:15px;}
.goal-ratio-arrow{color:var(--text-faint);font-size:11px;}
.goal-ratio-target{color:var(--text-dim);}

</style>

/* ---------------- helpers ---------------- */

function cleanLabel(s) {
  if (!s) return '';
  s = s.replace(/^\[merged\]\s*/, '');
  s = s.replace(/^[^\uAC00-\uD7A3A-Za-z0-9]+/, '');
  return s.trim();
}

function parseWon(s) {
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (s === '' || s === '-' || s === '₩ -' || s === '₩-') return 0;
  if (!/[\d]/.test(s)) return null;
  const neg = s.includes('(') || /^-/.test(s.replace(/[₩\s]/g, ''));
  /* 통화기호·공백·천단위 콤마만 제거하고 소수점은 남긴다.
     예전에는 [^\d]를 전부 제거해서 "17857.14286"이 1,785,714,286원이 됐다. */
  const cleaned = s.replace(/[^\d.]/g, '');
  if (cleaned === '' || cleaned === '.') return null;
  const v = parseFloat(cleaned);
  if (isNaN(v)) return null;
  return Math.round(neg ? -v : v);
}

function formatWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  return (neg ? '-₩' : '₩') + abs.toLocaleString('ko-KR');
}

function formatCompactWon(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const abs = Math.abs(n);
  let out;
  if (abs >= 100000000) out = (abs / 100000000).toFixed(2).replace(/\.00$/, '') + '억';
  else if (abs >= 10000) out = Math.round(abs / 10000).toLocaleString() + '만';
  else out = Math.round(abs).toLocaleString();
  return (neg ? '-' : '') + out;
}

function wonComma(n) {
  if (n === null || n === undefined || isNaN(n)) return '0';
  return Math.round(Math.abs(n)).toLocaleString('ko-KR');
}

function pivotMonthKey(s) {
  const m = s.match(/(\d{4})-(\d{1,2})월/);
  if (!m) return 0;
  return parseInt(m[1]) * 100 + parseInt(m[2]);
}
function assetMonthKey(s) {

function parseAssetsFromRows(rows) {
  const dateRe = /^\d{2}년\s*\d{2}월$/;
  const assetRows = [];
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let j = 0; j < row.length; j++) {
      const cell = (row[j] || '').trim();
      if (dateRe.test(cell)) {
        if (j + 3 < row.length) {
          const cat = cleanLabel(row[j + 1] || '');
          const acct = (row[j + 2] || '').trim();
          const amt = parseWon(row[j + 3]);
          if (cat && amt !== null) {
            assetRows.push({ date: cell, category: cat, account: acct, amount: amt });
          }
        }
        break;
      }
    }
  }
  return assetRows;
}

/* 지수_S&P500 탭: 년월 / 종가 두 컬럼.
   구글 시트가 "2023-03"을 날짜로 해석해버리므로 gviz/tq CSV에서는
   "2023. 3. 1" 형태로 내려온다. 원문 문자열/날짜/한글표기 모두 받는다.
   컬럼은 항상 헤더명으로 찾는다 — 컬럼이 추가돼도 안 깨지게. */
function normIndexMonthKey(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})[.\-/년]\s*(\d{1,2})/);          // 2023-03 / 2023. 3. 1 / 2023년 3월
  if (m) return `${m[1]}-${String(parseInt(m[2], 10)).padStart(2, '0')}`;
  m = s.match(/^(\d{2})년\s*(\d{1,2})월/);                   // 23년 03월
  if (m) return `${2000 + parseInt(m[1], 10)}-${String(parseInt(m[2], 10)).padStart(2, '0')}`;
  return null;
}

function parseIndexFromRows(rows) {
  let headerRowIdx = -1, monthCol = -1, closeCol = -1;
  for (let r = 0; r < rows.length && r < 30; r++) {
    const row = (rows[r] || []).map(c => cleanLabel(c || ''));
    const mi = row.findIndex(c => c === '년월' || c === '월' || c === '기준월');
    const ci = row.findIndex(c => c === '종가' || c === '지수' || c === '가격');
    if (mi !== -1 && ci !== -1) { headerRowIdx = r; monthCol = mi; closeCol = ci; break; }
  }
  if (headerRowIdx === -1) return {};

  const out = {};
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const key = normIndexMonthKey(row[monthCol]);
    if (!key) continue;
    const v = parseFloat(String(row[closeCol] || '').replace(/[^0-9.\-]/g, ''));
    if (!isFinite(v) || v <= 0) continue;
    out[key] = v;
  }
  return out;
}

/* 목표 탭: 시기 / 구분 / 목표 / 상태 / 달성한 날 / 메모 컬럼 구조.
   "시기"와 "상태"가 함께 있는 행만 헤더로 인정한다 — 가계부(D)의
   헤더(날짜,대분류,소분류,항목,사용처,금액,메모,재분류,고정비)에는
   이 두 단어가 없어서, 다른 탭을 잘못 목표로 오인할 위험이 없다. */
function parseGoalsFromRows(rows) {
  let headerRowIdx = -1, headerCols = [];
  for (let r = 0; r < rows.length; r++) {
    const row = (rows[r] || []).map(c => cleanLabel(c || ''));
    if (row.includes('시기') && row.includes('상태')) { headerRowIdx = r; headerCols = row; break; }
  }
  if (headerRowIdx === -1) return [];

  const colIdxs = [];
  headerCols.forEach((name, i) => { if (name) colIdxs.push({ name, i }); });

  const goals = [];
  for (let r = headerRowIdx + 1; r < rows.length && r < headerRowIdx + 500; r++) {
    const row = rows[r] || [];
    const obj = {};
    let hasAny = false;
    colIdxs.forEach(({ name, i }) => {
      const v = (row[i] || '').trim();
      if (v) hasAny = true;
      obj[name] = v;
    });
    if (!hasAny) continue;
    goals.push(obj);
  }
  return goals;
}

function goalStatusClass(status) {
  if (!status) return '';
  const s = String(status);
  if (/(완료|달성|✅|done|complete)/i.test(s)) return 'ok';
  if (/(지연|실패|❌|미달|보류)/i.test(s)) return 'no';
  if (/(진행)/i.test(s)) return 'active';
  if (/(대기|예정)/i.test(s)) return 'pending';
  return '';
}

/* 목표 문구에서 흔한 패턴(총자산 N억, 비상금 N만원, 월 지출/고정비 N만원, 현금비율 N%)을
   인식해서 실제 데이터(d)의 현재 값과 비교해 진행 상황을 계산한다.
   invert:true 인 항목(지출/고정비처럼 "적을수록 좋음")은 "초과/여유"로 표시하고,
   나머지(자산 쌓기, 비상금 모으기 등)는 0~100% 진행 바로 표시한다. */
const GOAL_METRIC_MATCHERS = [
  { re: /비상금\s*([\d,]+)\s*만원/, target: (m) => parseFloat(m[1].replace(/,/g, '')) * 10000, current: (d) => d.emergencyFund, invert: false, type: 'accumulation' },
  { re: /총자산\s*([\d.]+)\s*억/, target: (m) => parseFloat(m[1]) * 100000000, current: (d) => d.totalAssets, invert: false, type: 'accumulation' },
  { re: /고정비\s*([\d,]+)\s*만원/, target: (m) => parseFloat(m[1].replace(/,/g, '')) * 10000, current: (d, extra) => extra.latestFixed, invert: true, type: 'cap' },
  { re: /(?:월\s*)?지출\s*([\d,]+)\s*만원/, target: (m) => parseFloat(m[1].replace(/,/g, '')) * 10000, current: (d) => (d.cashflow.length ? d.cashflow[d.cashflow.length - 1].expense : 0), invert: true, type: 'cap' },
  { re: /현금\s*비율.*?(\d+(?:\.\d+)?)\s*%/, target: (m) => parseFloat(m[1]), current: (d) => (d.totalAssets ? (d.emergencyFund / d.totalAssets) * 100 : 0), invert: false, isPct: true, type: 'ratio' }
];

function computeGoalProgress(title, d, extra) {
  if (!title) return null;
  for (const m of GOAL_METRIC_MATCHERS) {
    const match = title.match(m.re);
    if (!match) continue;
    const target = m.target(match);
    const current = m.current(d, extra || {});
    if (target === null || target === undefined || isNaN(target)) continue;
    return { current, target, invert: !!m.invert, isPct: !!m.isPct, type: m.type };
  }
  return null;
}

function renderGoalProgressLine(p) {
  const fmt = (v) => p.isPct ? `${v.toFixed(1)}%` : `${formatCompactWon(v)}원`;
  const good = p.invert ? p.current <= p.target : p.current >= p.target;
  const remaining = p.target - p.current;

  if (p.type === 'ratio') {
    // 비율형: 바 없이 현재값 → 목표값을 숫자로 직접 비교
    return `
      <div class="goal-ratio">
        <span class="goal-ratio-current" style="color:${good ? 'var(--green)' : 'var(--text)'}">${fmt(p.current)}</span>
        <span class="goal-ratio-arrow">→</span>
        <span class="goal-ratio-target">목표 ${fmt(p.target)}</span>
      </div>
    `;
  }

  if (p.type === 'cap') {
    // 한도형(지출·고정비): 얇은 사용률 바 + 한 줄 텍스트. 두꺼운 축적 바와 시각적으로 구분
    const pct = p.target ? Math.min((p.current / p.target) * 100, 100) : 0;
    const remainLabel = remaining >= 0 ? `${fmt(remaining)} 여유` : `${fmt(Math.abs(remaining))} 초과`;
    return `
      <div class="goal-cap">
        <div class="goal-cap-track"><div class="goal-cap-fill ${good ? '' : 'over'}" style="width:${pct}%"></div></div>
        <span class="goal-cap-text" style="color:${good ? 'var(--text-dim)' : 'var(--red)'}">${fmt(p.current)} / ${fmt(p.target)} · ${remainLabel}</span>
      </div>
    `;
  }

  // 축적형(총자산·비상금 등): 두꺼운 진행 바
  const pct = p.target ? Math.min((p.current / p.target) * 100, 100) : 0;
  const remainLabel = remaining > 0 ? `${fmt(remaining)} 남음` : '달성!';
  return `
    <div class="goal-progress">
      <div class="goal-progress-track"><div class="goal-progress-fill ${good ? 'good' : 'bad'}" style="width:${pct}%"></div></div>
      <div class="goal-progress-figures">
        <span>${fmt(p.current)} / ${fmt(p.target)}</span>
        <span style="color:${good ? 'var(--green)' : 'var(--red)'}">${remainLabel}</span>
      </div>
    </div>
  `;
}

/* 시트의 불리언 열은 "TRUE"/"FALSE" 문자열로 export된다.
   !!"FALSE" === true 이므로 반드시 값으로 판정해야 한다. */
function isTruthyFlag(v) {
  return /^(true|1|y|yes|참|o|on|v|✓)$/i.test(String(v === null || v === undefined ? '' : v).trim());
}

function parseLedgerFromRows(rows) {
  let r0 = -1, c0 = -1, header = null;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r] || [];
    for (let c = 0; c < row.length - 3; c++) {
      if ((row[c] || '').trim() === '날짜' && (row[c + 1] || '').trim() === '대분류'
        && (row[c + 2] || '').trim() === '소분류' && (row[c + 3] || '').trim() === '항목') {
        r0 = r; c0 = c; header = row; break;
      }
    }
    if (r0 !== -1) break;
  }
  if (r0 === -1) return [];

  /* 열 위치를 고정 오프셋이 아니라 헤더 이름으로 찾는다.
     (기존에는 고정비를 c0+9에서 읽었는데 시트에 '후회하는 소비'·'회사 환급' 열이
      추가되면서 실제 고정비는 c0+10으로 밀려 있었고, 그 결과 고정비가 항상 false였다.) */
  const norm = (s) => String(s || '').replace(/\s+/g, '').trim();
  const findCol = (matchers, fallback) => {
    for (const m of matchers) {
      for (let c = c0; c < header.length; c++) {
        const h = norm(header[c]);
        if (!h) continue;
        if (typeof m === 'string' ? h === m : m.test(h)) return c;
      }
    }
    return fallback;
  };
  const COL = {
    amount: findCol(['금액'], c0 + 5),
    vendor: findCol([/^사용처/, /브랜드/], c0 + 6),
    memo: findCol(['내용', '메모'], c0 + 7),
    reclass: findCol(['재분류', '후회하는소비'], c0 + 8),
    refund: findCol([/^회사환급/], -1),
    fixed: findCol([/^고정비/], -1)
  };

  const dateRe = /^\d{4}\.\s*\d{1,2}\.\s*\d{1,2}$/;
  const ledger = [];
  let missStreak = 0;
  for (let r = r0 + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const dateCell = (row[c0] || '').trim();
    if (!dateRe.test(dateCell)) {
      missStreak++;
      if (missStreak > 25) break;
      continue;
    }
    missStreak = 0;
    const major = cleanLabel(row[c0 + 1] || '');
    const minor = cleanLabel(row[c0 + 2] || '');
    const item = (row[c0 + 3] || '').trim();
    const amount = parseWon(row[COL.amount]);
    const vendor = cleanLabel(row[COL.vendor] || '');
    const memo = (row[COL.memo] || '').trim();
    const reclass = (row[COL.reclass] || '').trim();
    const fixed = COL.fixed >= 0 ? isTruthyFlag(row[COL.fixed]) : false;
    const refund = COL.refund >= 0 ? (parseWon(row[COL.refund]) || 0) : 0;
    if (amount === null || amount === 0) continue;
    ledger.push({ date: dateCell, major, minor, item, amount, vendor, memo, reclass, fixed, refund });
  }
  return ledger;
}

/* 가계부(M) 피벗 탭은 Google Sheets 병합 셀이 gviz CSV export에서
   깨져 나오는 문제가 있어(월 헤더 행이 빈 문자열로 export됨),
   parsePivotFromRows가 못 찾을 때가 있다. 이미 정상 파싱되는
   가계부(D) 일별 원장(ledger)에서 동일한 모양의 요약을 직접
   집계해서 그 자리를 대체한다. */
function buildPivotFromLedger(ledger) {
  if (!ledger || !ledger.length) return null;

  const monthOf = (dateCell) => {
    const m = dateCell.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    if (!m) return null;
    return `${m[1]}-${parseInt(m[2], 10)}월`;
  };

  const monthSet = new Set();
  ledger.forEach(r => { const mk = monthOf(r.date); if (mk) monthSet.add(mk); });
  const months = Array.from(monthSet).sort((a, b) => pivotMonthKey(a) - pivotMonthKey(b));
  if (months.length === 0) return null;
  const monthIdx = {};
  months.forEach((m, i) => { monthIdx[m] = i; });
  const zeros = () => months.map(() => 0);

  const incomeTotal = zeros(), expenseTotal = zeros();
  const expenseCategories = {}, incomeCategories = {}, transferCategories = {};

  ledger.forEach(r => {
    const mk = monthOf(r.date);
    if (!mk) return;
    const idx = monthIdx[mk];
    if (idx === undefined) return;
    const amt = r.amount || 0;
    if (r.major === '지출') {
      if (!expenseCategories[r.minor]) expenseCategories[r.minor] = zeros();
      expenseCategories[r.minor][idx] += amt;
      expenseTotal[idx] += amt;
    } else if (r.major === '수입') {
      if (!incomeCategories[r.minor]) incomeCategories[r.minor] = zeros();
      incomeCategories[r.minor][idx] += amt;
      incomeTotal[idx] += amt;
    } else if (r.major === '이체') {
      if (!transferCategories[r.minor]) transferCategories[r.minor] = zeros();
      transferCategories[r.minor][idx] += amt;
    }
  });

  return { months, incomeTotal, expenseTotal, expenseCategories, incomeCategories, transferCategories };
}

/* 분류 탭: 구분,이름,,주식_카테고리,고정비 여부,수입,지출 같은 넓은 분류표.
   "이름"과 "주식_카테고리" 컬럼이 함께 있는 행을 찾아 종목명 → 주식 카테고리 매핑을 만든다. */
function parseStockCategoryFromRows(rows) {
  let headerRowIdx = -1, headerCols = [];
  for (let r = 0; r < rows.length; r++) {
    const row = (rows[r] || []).map(c => cleanLabel(c || ''));
    if (row.includes('이름') && row.includes('주식_카테고리')) { headerRowIdx = r; headerCols = row; break; }
  }
  if (headerRowIdx === -1) return {};
  const nameIdx = headerCols.indexOf('이름');
  const catIdx = headerCols.indexOf('주식_카테고리');
  const map = {};
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const name = (row[nameIdx] || '').trim();
    const cat = (row[catIdx] || '').trim();
    if (name && cat) map[name] = cat;
  }
  return map;
}

function parseInvestmentTagsFromRows(rows) {
  let r0 = -1, c0 = -1;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length - 6; c++) {
      if (row[c] === '국내/해외' && row[c + 1] === '태그' && row[c + 2] === '종목' && row[c + 3] === '판매수익') {
        r0 = r; c0 = c; break;
      }
    }
    if (r0 !== -1) break;
  }
  if (r0 === -1) return [];
  const out = [];
  let missStreak = 0;
  for (let r = r0 + 1; r < rows.length && r < r0 + 500; r++) {
    const row = rows[r] || [];
    const stock = (row[c0 + 2] || '').trim();
    const total = parseWon(row[c0 + 6]);
    const pctCell = (row[c0 + 7] || '').trim();
    const looksValid = stock && total !== null && (pctCell === '' || /%$/.test(pctCell));
    if (!looksValid) {
      missStreak++;
      if (missStreak > 15) break;
      continue;
    }
    missStreak = 0;
    const tagRaw = cleanLabel(row[c0 + 1] || '');
    const tags = tagRaw ? tagRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
    let stockName = cleanLabel(stock);
    if (stockName.includes('›')) stockName = stockName.split('›').pop().trim();
    out.push({
      stock: stockName, tags,
      sale: parseWon(row[c0 + 3]) || 0, dividend: parseWon(row[c0 + 4]) || 0, interest: parseWon(row[c0 + 5]) || 0,
      total
    });
  }
  return out;
}

function aggregateByTag(tagRows) {
  const map = {};
  tagRows.forEach(r => {
    const tags = r.tags.length ? r.tags : ['미분류'];
    tags.forEach(t => { map[t] = (map[t] || 0) + r.total; });
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

/* ---------------- derived analysis ---------------- */

function computeDerived(data) {
  const byMonth = {};
  data.assetRows.forEach(r => {
    if (r.amount === null) return;
    byMonth[r.date] = (byMonth[r.date] || 0) + r.amount;
  });
  const assetMonths = Object.keys(byMonth).sort((a, b) => assetMonthKey(a) - assetMonthKey(b));
  const latestMonth = assetMonths[assetMonths.length - 1];
  const prevMonth = assetMonths[assetMonths.length - 2];
  const totalAssets = byMonth[latestMonth] || 0;
  const prevTotalAssets = prevMonth ? byMonth[prevMonth] : null;
  const deltaAssets = prevTotalAssets !== null ? totalAssets - prevTotalAssets : null;
  const deltaPct = (prevTotalAssets && prevTotalAssets !== 0) ? (deltaAssets / Math.abs(prevTotalAssets)) * 100 : null;

  const allocation = {};
  data.assetRows.filter(r => r.date === latestMonth).forEach(r => {
    if (r.amount === null) return;
    allocation[r.category] = (allocation[r.category] || 0) + r.amount;
  });

  const cashLike = (allocation['현금 자산'] || 0) + (allocation['저축 자산'] || 0);
  const normAcct = s => (s || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const cmaRow = data.assetRows.find(r => r.date === latestMonth && normAcct(r.account) === 'NHCMA');
  const emergencyFund = cmaRow ? cmaRow.amount : 0;

  const displayAllocation = {};
  Object.entries(allocation).forEach(([cat, amt]) => {
    const g = DISPLAY_GROUP[cat] || cat;
    displayAllocation[g] = (displayAllocation[g] || 0) + amt;
  });

  const cashflow = data.months.map((m, i) => {
    const income = data.incomeTotal[i];
    const expense = data.expenseTotal[i];
    if (!income || income <= 0) return null;
    const savingsRate = ((income - expense) / income) * 100;
    return { month: m, income, expense, savingsRate };
  }).filter(Boolean);

  const catNames = Object.keys(data.expenseCategories);
  const latestPivotIdx = (() => {
    for (let i = data.months.length - 1; i >= 0; i--) {
      if (data.incomeTotal[i] && data.incomeTotal[i] > 0) return i;
    }
    return data.months.length - 1;
  })();
  const catLatest = {};
  const catAvg3 = {};
  catNames.forEach(name => {
    const vals = data.expenseCategories[name];
    catLatest[name] = vals[latestPivotIdx] || 0;
    const window3 = [vals[latestPivotIdx - 1] || 0, vals[latestPivotIdx - 2] || 0, vals[latestPivotIdx - 3] || 0];
    catAvg3[name] = window3.reduce((a, b) => a + b, 0) / 3;
  });

  const cashByKey = {};
  data.months.forEach((m, i) => {
    cashByKey[pivotMonthKey(m)] = { income: data.incomeTotal[i] || 0, expense: data.expenseTotal[i] || 0 };
  });
  const decomposition = [];
  for (let i = 1; i < assetMonths.length; i++) {
    const curM = assetMonths[i], prevM = assetMonths[i - 1];
    const totalDelta = byMonth[curM] - byMonth[prevM];
    const cf = cashByKey[assetMonthKey(curM)];
    const netSavings = cf ? (cf.income - cf.expense) : null;
    const marketOther = netSavings !== null ? totalDelta - netSavings : null;
    decomposition.push({ month: curM, label: assetMonthLabel(curM), totalDelta, netSavings, marketOther });
  }

  return {
    byMonth, assetMonths, latestMonth, prevMonth, totalAssets, prevTotalAssets, deltaAssets, deltaPct,
    allocation, displayAllocation, cashLike, emergencyFund, cashflow, catNames, catLatest, catAvg3, latestPivotIdx, decomposition
  };
}

function daysInMonthFromLabel(label) {
  const m = (label || '').match(/(\d{4})-(\d{1,2})/);
  if (!m) return 30;
  return new Date(parseInt(m[1]), parseInt(m[2]), 0).getDate();
}

function computeSuggestedGoals(data, d) {
  const last12 = d.cashflow.slice(-12);
  const avgRate = last12.length ? last12.reduce((a, c) => a + c.savingsRate, 0) / last12.length : 40;
  const suggestedSavings = Math.max(0, Math.round(avgRate / 5) * 5);
  const last3Expense = d.cashflow.slice(-3).map(c => c.expense);
  const avgExpense = last3Expense.length ? last3Expense.reduce((a, b) => a + b, 0) / last3Expense.length : 0;
  const suggestedEmergency = Math.max(500000, Math.round((avgExpense * 3) / 100000) * 100000);
  return { suggestedSavings, suggestedEmergency, avgRate, avgExpense };
}

function ledgerMonthKey(dateStr) {
  const m = (dateStr || '').match(/(\d{4})\.\s*(\d{1,2})/);
  if (!m) return null;
  return `${m[1]}-${m[2].padStart(2, '0')}`;
}

function getFixedItems(ledger) {
  const map = {};
  ledger.filter(r => r.fixed && r.major.includes('지출')).forEach(r => {
    const key = r.item + '|' + r.vendor;
    if (!map[key]) map[key] = { item: r.item, vendor: r.vendor, minor: r.minor, occurrences: [] };
    map[key].occurrences.push({ date: r.date, amount: r.amount });
  });
  return Object.values(map).map(g => {
    g.occurrences.sort((a, b) => ledgerDateKey(b.date) - ledgerDateKey(a.date));
    const latest = g.occurrences[0];
    const avg = g.occurrences.reduce((a, o) => a + o.amount, 0) / g.occurrences.length;
    return { item: g.item, vendor: g.vendor, minor: g.minor, latestAmount: latest.amount, latestDate: latest.date, count: g.occurrences.length, avg };
  }).sort((a, b) => b.latestAmount - a.latestAmount);
}

function getFixedMonthlyTrend(ledger) {
  const byMonth = {};
  ledger.filter(r => r.fixed && r.major.includes('지출')).forEach(r => {
    const key = ledgerMonthKey(r.date);
    if (!key) return;
    byMonth[key] = (byMonth[key] || 0) + r.amount;
  });
  return Object.keys(byMonth).sort().map(k => ({ month: k, total: byMonth[k] }));
}

function getStockProfit(ledger) {
  const map = {};
  ledger.filter(r => r.minor === '투자 수익').forEach(r => {
    let name = r.vendor || '기타';
    if (name.includes('›')) name = name.split('›').pop().trim();
    if (!name) name = '기타';
    map[name] = (map[name] || 0) + r.amount;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function getInvestmentIncomeMonthly(ledger) {
  const byMonthItem = {};
  const items = new Set();
  ledger.filter(r => r.minor === '투자 수익').forEach(r => {
    const key = ledgerMonthKey(r.date);
    if (!key) return;
    byMonthItem[key] = byMonthItem[key] || {};
    byMonthItem[key][r.item] = (byMonthItem[key][r.item] || 0) + r.amount;
    items.add(r.item);
  });
  const months = Object.keys(byMonthItem).sort();
  return { months, items: [...items], byMonthItem };
}

/* ---------------- local checklist storage (fixed-cost tracker) ---------------- */

function currentMonthKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

    if (res && res.value) return JSON.parse(res.value);
  } catch (e) { /* nothing saved yet */ }

function generateInsights(data, d, goals) {
  const insights = [];

  const latestDecomp = d.decomposition[d.decomposition.length - 1];
  if (latestDecomp && latestDecomp.netSavings !== null) {
    if (latestDecomp.totalDelta < 0 && latestDecomp.netSavings > 0) {
      insights.push({
        type: 'info',
        html: `이번 달은 저축(수입-지출)으로 <b>${formatCompactWon(latestDecomp.netSavings)}원</b>을 남겼지만, 총자산은 오히려 <b>${formatCompactWon(Math.abs(latestDecomp.totalDelta))}원</b> 줄었어요. 투자·연금 평가액이 약 <b>${formatCompactWon(Math.abs(latestDecomp.marketOther))}원</b> 빠진 것으로 추정돼요.`
      });
    } else if (latestDecomp.marketOther > 0) {
      insights.push({
        type: 'good',
        html: `이번 달 자산 증가분 중 저축 유입은 <b>${formatCompactWon(latestDecomp.netSavings)}원</b>, 투자·연금 평가 상승분은 약 <b>${formatCompactWon(latestDecomp.marketOther)}원</b>으로 추정돼요.`
      });
    } else if (latestDecomp.marketOther < 0 && latestDecomp.totalDelta > 0) {
      insights.push({
        type: 'info',
        html: `이번 달은 투자·연금 평가액이 약 <b>${formatCompactWon(Math.abs(latestDecomp.marketOther))}원</b> 빠졌지만, 저축 유입(<b>${formatCompactWon(latestDecomp.netSavings)}원</b>)이 이를 상쇄하고도 남아 총자산은 늘었어요.`
      });
    }
  }
  const latestCf = d.cashflow[d.cashflow.length - 1];

  if (latestCf) {
    const srRounded = Math.round(latestCf.savingsRate * 10) / 10;
    if (srRounded < goals.savingsRateTarget) {
      insights.push({
        type: 'warn',
        html: `이번 달 저축률이 <b>${latestCf.savingsRate.toFixed(1)}%</b>로 최근 평균 기반 추정 목표(${goals.savingsRateTarget}%)보다 ${(goals.savingsRateTarget - latestCf.savingsRate).toFixed(1)}%p 낮아요. 지출 상위 항목을 먼저 점검해보세요.`
      });
    } else {
      insights.push({
        type: 'good',
        html: `이번 달 저축률 <b>${latestCf.savingsRate.toFixed(1)}%</b>로 최근 평균 기반 추정 목표(${goals.savingsRateTarget}%)를 달성했어요.`
      });
    }
  }

  const last3 = d.cashflow.slice(-3);
  const prev3 = d.cashflow.slice(-6, -3);
  if (last3.length === 3 && prev3.length === 3) {
    const avgLast3 = last3.reduce((a, c) => a + c.savingsRate, 0) / 3;
    const avgPrev3 = prev3.reduce((a, c) => a + c.savingsRate, 0) / 3;
    if (avgLast3 < avgPrev3 - 3) {
      insights.push({
        type: 'warn',
        html: `최근 3개월 평균 저축률(${avgLast3.toFixed(1)}%)이 이전 3개월(${avgPrev3.toFixed(1)}%)보다 낮아지는 추세예요.`
      });
    }
  }

  if (d.totalAssets > 0) {
    const sorted = Object.entries(d.allocation).sort((a, b) => b[1] - a[1]);
    if (sorted.length) {
      const [topCat, topAmt] = sorted[0];
      const pct = (topAmt / d.totalAssets) * 100;
      if (pct >= 65) {
        insights.push({
          type: 'info',
          html: `전체 자산의 <b>${pct.toFixed(0)}%</b>가 ${topCat}에 몰려 있어요. 분산이 필요한지 한 번 점검해보세요.`
        });
      }
    }
    const cashPct = (d.emergencyFund / d.totalAssets) * 100;
    if (d.emergencyFund < goals.emergencyFundTarget) {
      insights.push({
        type: 'warn',
        html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표(${formatCompactWon(goals.emergencyFundTarget)}원)에 못 미쳐요.`
      });
    } else {
      insights.push({
        type: 'good',
        html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>(전체 자산의 ${cashPct.toFixed(0)}%)으로 목표를 충족하고 있어요.`
      });
    }
  }

  const overspent = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest > x.avg * 1.3)
    .sort((a, b) => (b.latest - b.avg) - (a.latest - a.avg));
  if (overspent.length) {
    const top = overspent[0];
    const pct = ((top.latest - top.avg) / top.avg) * 100;
    insights.push({
      type: 'warn',
      html: `<b>${top.name}</b> 지출이 최근 3개월 평균보다 ${pct.toFixed(0)}% 늘었어요 (${formatCompactWon(top.latest)}원 vs 평균 ${formatCompactWon(top.avg)}원).`
    });
  }

  return insights;
}

function median(nums) {
  if (!nums.length) return 0;
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function computeIncomeInsights(data, d) {
  const insights = [];
  const salary = data.incomeCategories['근로소득'] || [];
  const paired = data.months.map((m, i) => ({ m, v: salary[i] })).filter(x => x.v && x.v > 0);
  if (paired.length >= 8) {
    const last6 = paired.slice(-6).map(x => x.v);
    const prev6 = paired.slice(-12, -6).map(x => x.v);
    const medLast6 = median(last6);
    if (prev6.length >= 3) {
      const medPrev6 = median(prev6);
      const growth = medPrev6 ? ((medLast6 - medPrev6) / medPrev6) * 100 : 0;
      if (Math.abs(growth) <= 15) {
        insights.push({ type: growth < 3 ? 'warn' : 'good', html: growth < 3
          ? `최근 6개월 근로소득(중앙값 기준)이 이전 6개월 대비 <b>${growth >= 0 ? '+' : ''}${growth.toFixed(1)}%</b>로 거의 정체돼 있어요. 연봉 협상, 이직, 승진 등으로 <b>주 수입원 자체를 올리는 방법</b>을 고려해볼 시점이에요.`
          : `최근 6개월 근로소득(중앙값 기준)이 이전 6개월보다 <b>+${growth.toFixed(1)}%</b> 늘었어요.` });
      } else if (growth < -15) {
        insights.push({ type: 'info', html: `최근 6개월 근로소득 중앙값이 이전 6개월보다 <b>${growth.toFixed(1)}%</b> 낮아요. 보너스처럼 특정 달에 몰린 금액이 비교 구간에 껴 있을 수도 있으니, 실제 월급 변화인지 한 번 확인해보세요.` });
      } else {
        insights.push({ type: 'good', html: `최근 6개월 근로소득(중앙값 기준)이 이전 6개월보다 <b>+${growth.toFixed(1)}%</b> 크게 늘었어요.` });
      }
    }
  }

  const other = data.incomeCategories['그 외'] || [];
  const investInc = data.incomeCategories['투자 수익'] || [];
  const idx = d.latestPivotIdx;
  const totalLatest = data.incomeTotal[idx] || 0;
  const otherLatest = other[idx] || 0;
  const otherPct = totalLatest ? (otherLatest / totalLatest) * 100 : 0;
  if (totalLatest > 0 && otherPct < 5) {
    insights.push({ type: 'info', html: `이번 달 수입의 <b>${otherPct.toFixed(1)}%</b>만 부수입·기타 수입이에요. 근로소득 하나에 의존하는 구조라, 부수입 파이프라인을 하나 더 만들어두면 소득 충격에 덜 흔들려요.` });
  }

  const last3Expense = d.cashflow.slice(-3).map(c => c.expense);
  const avgExpense3 = last3Expense.length ? last3Expense.reduce((a, b) => a + b, 0) / last3Expense.length : 0;
  const last3Income = d.cashflow.slice(-3).map(c => c.income);
  const avgIncome3 = last3Income.length ? last3Income.reduce((a, b) => a + b, 0) / last3Income.length : 0;
  const target = state.goals.savingsRateTarget;
  if (avgExpense3 > 0 && target < 100) {
    const neededIncome = avgExpense3 / (1 - target / 100);
    if (avgIncome3 > 0 && avgIncome3 < neededIncome) {
      insights.push({ type: 'info', html: `현재 지출 수준(월평균 ${formatCompactWon(avgExpense3)}원)을 유지하면서 저축률 목표 ${target}%를 채우려면, 월 수입이 최소 약 <b>${formatCompactWon(neededIncome)}원</b>은 되어야 해요 (현재 평균 ${formatCompactWon(avgIncome3)}원).` });
    }
  }

  const investPaired = data.months.map((m, i) => ({ m, v: investInc[i] })).filter(x => x.v);
  if (investPaired.length >= 6) {
    const last3 = investPaired.slice(-3).reduce((a, x) => a + x.v, 0);
    if (last3 > 0) {
      insights.push({ type: 'good', html: `최근 3개월 투자 수익(배당·매매·이자 합)이 총 <b>${formatCompactWon(last3)}원</b>이에요. 투자자산이 조금씩 현금흐름에 기여하고 있어요.` });
    }
  }

  return insights;
}

function computeExpenseVerdict(data, d) {
  const latest = d.cashflow[d.cashflow.length - 1];
  if (!latest) return null;
  const target = state.goals.savingsRateTarget;
  const ok = latest.savingsRate >= target;
  const last3 = d.cashflow.slice(-4, -1);
  const avg3Expense = last3.length ? last3.reduce((a, c) => a + c.expense, 0) / last3.length : null;
  const vsAvgPct = avg3Expense ? ((latest.expense - avg3Expense) / avg3Expense) * 100 : null;
  return { month: latest.month, income: latest.income, expense: latest.expense, savingsRate: latest.savingsRate, target, ok, avg3Expense, vsAvgPct };
}

function amtPct(amt, pct) {
  return `${formatCompactWon(amt)}원 (${pct.toFixed(1)}%)`;
}

function pivotMonthToLedgerKey(m) {
  const match = (m || '').match(/(\d{4})-(\d{1,2})월/);
  if (!match) return null;
  return `${match[1]}-${match[2].padStart(2, '0')}`;
}

function computeExpenseInsights(data, d) {
  const insights = [];
  const v = computeExpenseVerdict(data, d);
  if (v) {
    const title = v.ok ? `${v.month} 지출, 잘 관리하고 있어요.` : `${v.month} 지출, 목표보다 빠듯했어요.`;
    let body = `총 지출 ${formatWon(v.expense)} · 저축률 ${v.savingsRate.toFixed(1)}% (목표 ${v.target}%).`;
    if (v.vsAvgPct !== null) {
      body += v.vsAvgPct >= 0 ? ` 최근 3개월 평균보다 ${v.vsAvgPct.toFixed(0)}% 더 썼어요.` : ` 최근 3개월 평균보다 ${Math.abs(v.vsAvgPct).toFixed(0)}% 덜 썼어요.`;
    }
    insights.push({ type: v.ok ? 'good' : 'warn', html: `<b>${title}</b> ${body}` });
  }
  const overspent = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest > x.avg * 1.3)
    .sort((a, b) => (b.latest - b.avg) - (a.latest - a.avg));
  overspent.slice(0, 2).forEach(o => {
    const pct = ((o.latest - o.avg) / o.avg) * 100;
    insights.push({ type: 'warn', html: `<b>${o.name}</b> 지출이 최근 3개월 평균보다 <b>${pct.toFixed(0)}%</b> 늘었어요 (${formatCompactWon(o.latest)}원 vs 평균 ${formatCompactWon(o.avg)}원).` });
  });
  const improved = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], avg: d.catAvg3[name] }))
    .filter(x => x.avg > 0 && x.latest < x.avg * 0.7 && x.latest > 0)
    .sort((a, b) => (a.latest - a.avg) - (b.latest - b.avg));
  if (improved.length) {
    const top = improved[0];
    const pct = ((top.avg - top.latest) / top.avg) * 100;
    insights.push({ type: 'good', html: `<b>${top.name}</b> 지출을 최근 3개월 평균보다 <b>${pct.toFixed(0)}%</b> 줄였어요. 잘하고 있어요.` });
  }
  const budgetOver = d.catNames
    .map(name => ({ name, latest: d.catLatest[name], budget: (state.budgets && state.budgets[name]) || d.catAvg3[name] }))
    .filter(x => x.budget > 0 && x.latest > x.budget)
    .sort((a, b) => (b.latest - b.budget) - (a.latest - a.budget));
  if (budgetOver.length) {
    const b = budgetOver[0];
    insights.push({ type: 'warn', html: `<b>${b.name}</b> 예산 <b>${formatCompactWon(b.budget)}원</b>을 <b>${formatCompactWon(b.latest - b.budget)}원</b> 초과했어요 (실제 ${formatCompactWon(b.latest)}원).` });
  }
  return insights;
}

const valueLabelPlugin = {
  id: 'valueLabelPlugin',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const horizontal = chart.options && chart.options.indexAxis === 'y';
    chart.data.datasets.forEach((dataset, dsIndex) => {
      if (dataset.hideLabel) return;
      const meta = chart.getDatasetMeta(dsIndex);
      if (!meta || meta.hidden) return;
      meta.data.forEach((element, index) => {
        const value = dataset.data[index];
        if (value === null || value === undefined || value === 0) return;
        const pos = element.tooltipPosition ? element.tooltipPosition() : element;
        ctx.save();
        ctx.font = "600 10px 'IBM Plex Mono', monospace";
        ctx.fillStyle = dataset.labelColor || '#c7cddb';
        const fmtLabel = dataset.labelFormatter || formatCompactWon;
        if (horizontal) {
          ctx.textAlign = value >= 0 ? 'left' : 'right';
          ctx.textBaseline = 'middle';
          const offsetX = dataset.labelOffset !== undefined ? dataset.labelOffset : (value >= 0 ? 6 : -6);
          ctx.fillText(fmtLabel(value), pos.x + offsetX, pos.y);
        } else {
          ctx.textAlign = 'center';
          const isLine = chart.config.type === 'line' || dataset.type === 'line';
          const offset = dataset.labelOffset !== undefined ? dataset.labelOffset : (isLine ? -8 : (value >= 0 ? -6 : 14));
          ctx.fillText(fmtLabel(value), pos.x, pos.y + offset);
        }
        ctx.restore();
      });
    });
  }
};

const stackTotalLabelPlugin = {
  id: 'stackTotalLabelPlugin',
  afterDatasetsDraw(chart) {
    const { ctx, data } = chart;
    const meta0 = chart.getDatasetMeta(0);
    if (!meta0) return;
    data.labels.forEach((_, i) => {
      let sum = 0, topY = null;
      data.datasets.forEach((ds, dsIdx) => {
        const meta = chart.getDatasetMeta(dsIdx);
        if (!meta || meta.hidden) return;
        const v = ds.data[i] || 0;
        sum += v;
        const el = meta.data[i];
        if (el) {
          const pos = el.tooltipPosition ? el.tooltipPosition() : el;
          if (topY === null || pos.y < topY) topY = pos.y;
        }
      });
      if (!sum || topY === null) return;
      const xEl = meta0.data[i];
      if (!xEl) return;
      const xPos = xEl.tooltipPosition ? xEl.tooltipPosition() : xEl;
      ctx.save();
      ctx.font = "600 10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = '#c7cddb';
      ctx.textAlign = 'center';
      ctx.fillText(formatCompactWon(sum), xPos.x, topY - 6);
      ctx.restore();
    });
  }
};

function avgOf(values) {
  const nums = (values || []).filter(v => v !== null && v !== undefined);
  return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
}

function avgLinePlugin(values, opts) {
  opts = opts || {};
  const avg = avgOf(values);
  return {
    id: 'avgLinePlugin_' + Math.random().toString(36).slice(2),
    afterDatasetsDraw(chart) {
      const yScale = chart.scales.y;
      const xScale = chart.scales.x;
      if (!yScale || !xScale) return;
      const yPixel = yScale.getPixelForValue(avg);
      const ctx = chart.ctx;
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = 'rgba(233,231,223,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(xScale.left, yPixel);
      ctx.lineTo(xScale.right, yPixel);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "600 10px 'IBM Plex Mono', monospace";
      ctx.fillStyle = '#d7d3c4';
      ctx.textAlign = 'left';
      ctx.fillText(`평균 ${formatCompactWon(avg)}`, xScale.left + 4, yPixel - 5);
      ctx.restore();
    }
  };
}

function legendWithValues(formatFn) {
  return {
    display: true, position: 'bottom',
    labels: {
      color: '#eae8e0', font: { family: 'IBM Plex Mono', size: 10 }, boxWidth: 10, padding: 10,
      generateLabels: (chart) => {
        const ds = chart.data.datasets[0];
        return chart.data.labels.map((label, i) => ({
          text: `${label}  ${(formatFn || formatCompactWon)(ds.data[i])}${formatFn ? '' : '원'}`,
          fillStyle: Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor,
          index: i
        }));
      }
    }
  };
}

function paddedRange(values) {
  const max = Math.max(0, ...values);
  const min = Math.min(0, ...values);
  const span = (max - min) || 1;
  return { min: min === 0 ? 0 : min - span * 0.08, max: max + span * 0.22 };
}
