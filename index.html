/* ---------------- 카테고리별 예산 가이드 + 이번 달 주요 지출 (같은 연월 기준, 동시 업데이트) ---------------- */

function pivotYearMonth(m) {
  const match = (m || '').match(/(\d{4})-(\d{1,2})월/);
  return match ? { year: match[1], month: parseInt(match[2], 10) } : { year: '', month: 0 };
}

function renderExpenseMonthSection(data, d) {
  if (state.expenseMonthIdx === undefined || state.expenseMonthIdx === null) {
    state.expenseMonthIdx = d.latestPivotIdx;
  }
  const idx = state.expenseMonthIdx;
  const navSlot = document.getElementById('expense-month-nav-slot');
  if (navSlot) navSlot.innerHTML = renderMonthNavControls(idx, data, d);
  bindMonthNavControls(data, d);
  renderCategoryBudgetPanel(data, d);
  renderTopExpensesPanel(data, d);
}

function setExpenseMonthIdx(idx, data, d) {
  state.expenseMonthIdx = idx;
  renderExpenseMonthSection(data, d);
}

function renderMonthNavControls(idx, data, d) {
  const curYM = pivotYearMonth(data.months[idx]);
  const years = [...new Set(data.months.map(m => pivotYearMonth(m).year))];
  const monthsInYear = data.months.map((m, i) => ({ i, ...pivotYearMonth(m) })).filter(x => x.year === curYM.year);
  const yearOptions = years.map(y => `<option value="${y}" ${y === curYM.year ? 'selected' : ''}>${y}</option>`).join('');
  const monthOptions = monthsInYear.map(x => `<option value="${x.i}" ${x.i === idx ? 'selected' : ''}>${x.month}월</option>`).join('');
  return `
    <div class="month-nav">
      <select id="expense-month-year">${yearOptions}</select>
      <select id="expense-month-month">${monthOptions}</select>
      <button class="btn small" id="expense-month-thismonth">이번달</button>
    </div>
  `;
}

function bindMonthNavControls(data, d) {
  const yearSel = document.getElementById('expense-month-year');
  const monthSel = document.getElementById('expense-month-month');
  const thisBtn = document.getElementById('expense-month-thismonth');
  if (yearSel) yearSel.addEventListener('change', () => {
    const y = yearSel.value;
    const firstInYear = data.months.map((m, i) => ({ i, ...pivotYearMonth(m) })).filter(x => x.year === y)[0];
    if (firstInYear) setExpenseMonthIdx(firstInYear.i, data, d);
  });
  if (monthSel) monthSel.addEventListener('change', () => setExpenseMonthIdx(parseInt(monthSel.value, 10), data, d));
  if (thisBtn) thisBtn.addEventListener('click', () => {
    const curKey = currentPivotMonthKeyString();
    let targetIdx = data.months.indexOf(curKey);
    if (targetIdx === -1) targetIdx = d.latestPivotIdx;
    setExpenseMonthIdx(targetIdx, data, d);
  });
}

function renderCategoryBudgetPanel(data, d) {
  const body = document.getElementById('cat-budget-body');
  if (!body) return;
  const catNames = Object.keys(data.expenseCategories);
  const idx = state.expenseMonthIdx;

  const rows = catNames.map(name => {
    const vals = data.expenseCategories[name];
    const cur = vals[idx] || 0;
    const window3 = [vals[idx - 1] || 0, vals[idx - 2] || 0, vals[idx - 3] || 0];
    const guide = avgOf(window3);
    const budget = (state.budgets && state.budgets[name] !== undefined && state.budgets[name] !== null && state.budgets[name] !== '')
      ? Number(state.budgets[name]) : guide;
    return { name, cur, guide, budget };
  }).filter(r => r.cur > 0 || r.guide > 0 || r.budget > 0).sort((a, b) => b.cur - a.cur);

  body.innerHTML = `
    <div class="subhead">BUDGET · 카테고리별 예산 가이드</div>
    ${rows.map(r => {
      const remaining = r.budget - r.cur;
      const over = remaining < 0;
      const pct = r.budget > 0 ? (r.cur / r.budget) * 100 : 0;
      return `<div class="budget-row-compact ${over ? 'over' : ''}" title="${r.name}">
        <span class="b-name">${r.name}</span>
        <div class="b-bar-track"><div class="b-bar-fill ${over ? 'over' : ''}" style="width:${Math.min(pct, 100)}%"></div></div>
        <span class="b-pct">${pct.toFixed(0)}%</span>
        <span class="b-figures">${wonComma(r.cur)}/<input type="text" inputmode="numeric" class="budget-input-compact" data-cat="${r.name}" value="${wonComma(r.budget)}" />원</span>
        <span class="b-remaining" style="color:${over ? 'var(--red)' : 'var(--green)'}">${over ? '-' + wonComma(Math.abs(remaining)) : wonComma(remaining)}</span>
      </div>`;
    }).join('') || '<div class="empty-state">해당 월 데이터가 없어요.</div>'}
  `;

  body.querySelectorAll('.budget-input-compact').forEach(inp => {
    inp.addEventListener('click', (e) => e.stopPropagation());
    inp.addEventListener('change', () => {
      const cat = inp.dataset.cat;
      const raw = inp.value.replace(/[^0-9]/g, '');
      const val = raw === '' ? undefined : parseFloat(raw);
      state.budgets[cat] = val;
      saveBudgets();
      renderCategoryBudgetPanel(data, d);
    });
  });
}

function renderTopExpensesPanel(data, d) {
  const body = document.getElementById('top-expenses-body');
  if (!body) return;
  const idx = state.expenseMonthIdx;
  const monthKey = pivotMonthToLedgerKey(data.months[idx]);
  const expenseLedger = data.ledger.filter(r => r.major.includes('지출'));
  const topExpenses = expenseLedger.filter(r => ledgerMonthKey(r.date) === monthKey).sort((a, b) => b.amount - a.amount).slice(0, 10);

  body.innerHTML = `
    <div class="subhead">TOP 10 · ${pivotMonthLabel(data.months[idx])} 주요 지출</div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>날짜</th><th>소분류</th><th>항목</th><th>사용처</th><th style="text-align:right">금액</th></tr></thead>
        <tbody>${topExpenses.length ? topExpenses.map(r => `<tr><td>${r.date}</td><td>${r.minor}</td><td>${r.item}</td><td>${r.vendor || ''}</td><td class="amt expense">${formatWon(r.amount)}</td></tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-faint);padding:20px;">해당 월 지출 내역이 없어요.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ---------------- 고정비 관리 ---------------- */

function getFixedItemsForMonth(ledger, monthKey) {
  return ledger
    .filter(r => r.fixed && r.major.includes('지출') && ledgerMonthKey(r.date) === monthKey)
    .sort((a, b) => b.amount - a.amount);
}

function renderFixedBreakdown(ledger, monthKey, monthLabel) {
  const box = document.getElementById('fixed-breakdown');
  if (!box) return;
  const items = getFixedItemsForMonth(ledger, monthKey);
  box.innerHTML = `
    <div class="settings-note" style="margin-top:12px;margin-bottom:6px;">${monthLabel || monthKey} 고정비 내역</div>
    ${items.map(r => `<div class="acct-row">

function computeInvestmentInsights(data, d, cumSeries, tagAgg) {
  const insights = [];
  const latest = cumSeries[cumSeries.length - 1];
  if (latest && latest.cumContribution > 0) {
    const gain = latest.balance - latest.cumContribution;
    const gainPct = (gain / latest.cumContribution) * 100;
    insights.push({ type: gain >= 0 ? 'good' : 'warn', html: `누적 투자 원금 <b>${formatCompactWon(latest.cumContribution)}원</b> 대비 평가액은 <b>${formatCompactWon(latest.balance)}원</b>, 누적 손익은 <b>${gain >= 0 ? '+' : ''}${formatCompactWon(gain)}원 (${gainPct.toFixed(1)}%)</b>이에요.` });
  }
  if (tagAgg.length) {
    const totalProfit = tagAgg.reduce((a, [, v]) => a + Math.max(v, 0), 0);
    const [topTag, topVal] = tagAgg[0];
    if (totalProfit > 0 && topVal > 0) {
      const pct = (topVal / totalProfit) * 100;
      if (pct >= 25) {
        insights.push({ type: 'info', html: `실현 수익의 <b>${pct.toFixed(0)}%</b>가 "<b>${topTag}</b>" 태그 종목에서 나왔어요. 특정 테마에 수익이 쏠려 있어요.` });
      }
    }
    const losers = tagAgg.filter(([, v]) => v < 0).sort((a, b) => a[1] - b[1]);
    if (losers.length) {
      insights.push({ type: 'warn', html: `"<b>${losers[0][0]}</b>" 태그 종목에서 누적 <b>${formatWon(losers[0][1])}</b>의 손실이 났어요.` });
    }
  }
  return insights;
}

function computeSavingsInsights(data, d, latestSaving, latestPension, months, byMonthCat) {
  const insights = [];
  const target = state.goals.emergencyFundTarget;
  if (d.emergencyFund < target) {
    insights.push({ type: 'warn', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표(${formatCompactWon(target)}원)에 못 미쳐요.` });
  } else {
    insights.push({ type: 'good', html: `비상금(NH-CMA)이 <b>${formatCompactWon(d.emergencyFund)}원</b>으로 목표를 충족하고 있어요.` });
  }
  if (months.length >= 7) {
    const first = (byMonthCat[months[months.length - 7]] && byMonthCat[months[months.length - 7]]['연금 자산']) || 0;
    const last = latestPension;
    if (first > 0) {
      const growth = ((last - first) / first) * 100;
      insights.push({ type: 'info', html: `연금 자산이 최근 6개월간 <b>${growth >= 0 ? '+' : ''}${growth.toFixed(1)}%</b> 변화했어요 (은퇴 대비 장기 자산이라 단기 변동은 크게 신경 쓰지 않아도 돼요).` });
    }
  }
  const total = latestSaving + latestPension;
  if (total > 0) {
    const savingPct = (latestSaving / total) * 100;
    insights.push({ type: 'info', html: `저축·연금 합계 중 <b>${savingPct.toFixed(0)}%</b>가 유동성 있는 저축 자산(CMA·청약 등)이고, 나머지는 연금이에요.` });
  }
  return insights;
}

        <div class="stat-card"><div class="label">합계</div><div class="value" style="color:#5b8fc7">${formatCompactWon(total)}원</div></div>
        ${cmaAmount !== null ? `<div class="stat-card"><div class="label">비상금 (NH-CMA)</div><div class="value">${formatCompactWon(cmaAmount)}원</div></div>` : ''}
      </div>
      <div class="panel">
        <div class="panel-title"><div><span class="eyebrow">${latestMonth || ''}</span>계좌별 잔액</div></div>
        ${accountList.map(([name, v]) => {
          const pct = total ? (v.amount / total) * 100 : 0;
          return `<div class="acct-row">
            <span class="alloc-swatch" style="background:${v.category === '저축 자산' ? '#5b8fc7' : '#9b7fc2'}"></span>
            <span class="acct-name">${name}<div class="acct-cat">${v.category}</div></span>
            <span class="acct-amt">${amtPct(v.amount, pct)}</span>
          </div>`;
        }).join('') || '<div class="empty-state">계좌 데이터가 없어요.</div>'}
      </div>
    </div>
    <div class="panel full">
      <div class="panel-title">
        <div><span class="eyebrow">HISTORY</span>저축·연금 자산 추이</div>
        <div class="range-toggle" id="sav-trend-range-toggle"></div>
      </div>
      <div class="chart-wrap tall"><canvas id="chart-sav-trend"></canvas></div>
      <div class="chart-legend">
        <span><i style="background:#5b8fc7"></i>저축 자산</span>
        <span><i style="background:#9b7fc2"></i>연금 자산</span>
      </div>
    </div>
    <div class="panel full">
      <div class="panel-title">
        <div><span class="eyebrow">CONTRIBUTIONS</span>월별 저축·연금 이체 금액</div>
        <div class="range-toggle" id="sav-contrib-range-toggle"></div>
      </div>
      <div class="chart-wrap"><canvas id="chart-sav-contrib"></canvas></div>
    </div>
    <div class="panel full">
      <div class="panel-title"><div><span class="eyebrow">RECORDS</span>저축·연금 관련 내역</div></div>
      <div id="savings-table"></div>
    </div>
  `;

  renderWeeklyInsights('panel-savings-insights', 'weekly-insights-savings', '저축 인사이트', () => computeSavingsInsights(data, d, latestSaving, latestPension, months, byMonthCat));

  const drawSavTrend = () => {
    const monthsSlice = sliceByRange(months, state.savTrendRange);
    if (state.charts.savTrend) state.charts.savTrend.destroy();
    const trendCtx = document.getElementById('chart-sav-trend');
    state.charts.savTrend = new Chart(trendCtx, {
      type: 'line',
      data: {
        labels: monthsSlice.map(assetMonthLabel),
        datasets: [
          { label: '저축 자산', data: monthsSlice.map(m => (byMonthCat[m] && byMonthCat[m]['저축 자산']) || 0), borderColor: '#5b8fc7', backgroundColor: 'transparent', tension: 0.3, pointRadius: 2, labelColor: '#a9c3e0' },
          { label: '연금 자산', data: monthsSlice.map(m => (byMonthCat[m] && byMonthCat[m]['연금 자산']) || 0), borderColor: '#9b7fc2', backgroundColor: 'transparent', tension: 0.3, pointRadius: 2, labelColor: '#cbb8e0' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${formatWon(c.raw)}` } } },
        scales: { x: { ticks: MONO_TICK, grid: { display: false } }, y: { ticks: { ...MONO_TICK, callback: (v) => formatCompactWon(v) }, grid: GRID_FAINT } }
      },
      plugins: [valueLabelPlugin]
    });
  };
  function onSavTrendRangePick(v) {
    state.savTrendRange = v === 'all' ? 'all' : parseInt(v, 10);
    bindRangeToggle('sav-trend-range-toggle', RANGE_OPTIONS, state.savTrendRange, onSavTrendRangePick);
    drawSavTrend();
  }
  bindRangeToggle('sav-trend-range-toggle', RANGE_OPTIONS, state.savTrendRange, onSavTrendRangePick);
  drawSavTrend();

  const drawSavContrib = () => {
    const monthsSlice = sliceByRange(data.months, state.savContribRange);
    const n = monthsSlice.length;
    if (state.charts.savContrib) state.charts.savContrib.destroy();
    const contribCtx = document.getElementById('chart-sav-contrib');
    state.charts.savContrib = new Chart(contribCtx, {
      type: 'bar',
      data: {
        labels: monthsSlice.map(pivotMonthLabel),
        datasets: transferNames.map((name, i) => ({ label: name === '비상금' ? '저축(CMA 등)' : name, data: data.transferCategories[name].slice(-n).map(v => v || 0), backgroundColor: ['#5b8fc7', '#9b7fc2'][i % 2], stack: 's' }))
      },
      options: {
        responsive: true, maintainAspectRatio: false, layout: { padding: { top: 16 } },
        plugins: { legend: { position: 'bottom', labels: { color: '#9aa3b6', font: { family: 'IBM Plex Mono', size: 10 } } }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${formatWon(c.raw)}` } } },
        scales: { x: { stacked: true, ticks: MONO_TICK, grid: { display: false } }, y: { stacked: true, ticks: { ...MONO_TICK, callback: (v) => formatCompactWon(v) }, grid: GRID_FAINT } }
      },
      plugins: [stackTotalLabelPlugin]
    });
  };
  function onSavContribRangePick(v) {
    state.savContribRange = v === 'all' ? 'all' : parseInt(v, 10);
    bindRangeToggle('sav-contrib-range-toggle', RANGE_OPTIONS, state.savContribRange, onSavContribRangePick);
    drawSavContrib();
  }
  bindRangeToggle('sav-contrib-range-toggle', RANGE_OPTIONS, state.savContribRange, onSavContribRangePick);
  drawSavContrib();

  renderAdvancedTable('savings-table', savingsLedger, { majorOptions: [['all', '전체'], ['이체', '이체']], defaultGroup: 'none' });
}

async function loadBudgets() {
  try {
    const res = await window.storage.get('category-budgets', false);
    if (res && res.value) state.budgets = JSON.parse(res.value);
  } catch (e) { /* no saved budgets yet */ }
  state.budgetsLoaded = true;
}

async function saveBudgets() {
  try { await window.storage.set('category-budgets', JSON.stringify(state.budgets), false); } catch (e) {}
}

/* ---------------- fetch & init ---------------- */

async function fetchCsvRows(gid) {
  const res = await fetch(csvUrlFor(gid), { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} (gid ${gid})`);
  let text = await res.text();
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // gviz/tq 응답 맨 앞의 UTF-8 BOM 제거
  if (text.trim().startsWith('<')) throw new Error(`시트 접근 권한이 없어요 (gid ${gid})`);
  const parsed = Papa.parse(text, { skipEmptyLines: false });
  return parsed.data.map(r => r.map(c => (c === null || c === undefined) ? '' : String(c).replace(/^\uFEFF/, '')));
}

async function fetchAllTabsAndMerge() {
  const results = await Promise.allSettled(TAB_GIDS.map(fetchCsvRows));
  const failures = results.filter(r => r.status === 'rejected');
  const rowSets = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (rowSets.length === 0) {
    throw new Error(failures[0] ? failures[0].reason.message : '탭을 하나도 불러오지 못했어요');
  }

  let assetRows = [], ledger = [], investmentTags = [], goals = [], stockCategoryMap = {};
  for (const rows of rowSets) {
    try {
      const ar = parseAssetsFromRows(rows);
      if (ar.length > assetRows.length) assetRows = ar;
    } catch (e) {}
    try {
      const lg = parseLedgerFromRows(rows);
      if (lg.length > ledger.length) ledger = lg;
    } catch (e) {}
    try {
      const tags = parseInvestmentTagsFromRows(rows);
      if (tags.length > investmentTags.length) investmentTags = tags;
    } catch (e) {}
    try {
      const gl = parseGoalsFromRows(rows);
      if (gl.length > goals.length) goals = gl;
    } catch (e) {}
    try {
      const scm = parseStockCategoryFromRows(rows);
      if (Object.keys(scm).length > Object.keys(stockCategoryMap).length) stockCategoryMap = scm;
    } catch (e) {}
  }

  // 가계부(M) 피벗 탭은 폐기되어, 정상 파싱된 가계부(D) 원장에서 월별 카테고리 요약을 직접 집계한다.
  const pivot = buildPivotFromLedger(ledger);

  const fetchFailNote = failures.length
    ? ` (${failures.length}개 탭 fetch 실패: ${failures.map(f => f.reason.message).join(', ')})`
    : ' (탭은 모두 불러왔지만 그 안에서 못 찾음)';

  if (!pivot) throw new Error('가계부(D) 원장에서 카테고리 요약을 계산하지 못했습니다' + fetchFailNote);
  if (assetRows.length < 5) throw new Error('자산 현황표를 찾지 못했습니다' + fetchFailNote);

  const data = {
    months: pivot.months, incomeTotal: pivot.incomeTotal, expenseTotal: pivot.expenseTotal,
    expenseCategories: pivot.expenseCategories, incomeCategories: pivot.incomeCategories, transferCategories: pivot.transferCategories,
    assetRows, ledger, investmentTags, goals, stockCategoryMap
  };

  if (failures.length) {
    data._partialWarning = `${failures.length}개 탭을 못 불러왔지만(${failures.map(f => f.reason.message).join(', ')}), 나머지 데이터로 표시 중이에요.`;
  }
  return data;
}

function applySuggestedGoals(data) {
  const d0 = computeDerived(data);
  const sug = computeSuggestedGoals(data, d0);
  state.goals.savingsRateTarget = sug.suggestedSavings;
  state.goals.emergencyFundTarget = sug.suggestedEmergency;
}

async function fetchLive(manual) {
  setSyncState('loading');
  try {
    const data = await fetchAllTabsAndMerge();
    state.data = data;
    state.source = 'live';
    state.lastError = data._partialWarning || null;
    state.lastSync = new Date();
    applySuggestedGoals(state.data);
    renderAll();
  } catch (e) {
    console.error('live sync failed', e);
    state.lastError = e.message || String(e);
    if (!state.data) {
      state.data = SNAPSHOT_DATA;
      state.source = 'snapshot';
    }
    renderAll();
  }
}

async function init() {
  renderShell();
  await loadBudgets();
  state.data = SNAPSHOT_DATA;
  state.source = 'snapshot';
  applySuggestedGoals(state.data);
  renderAll();
  fetchLive(false);
}

init();

</script>
