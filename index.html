<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>해달 — 당신의 자산관리 파트너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e121a;
  --bg-2:#141a25;
  --panel:#171e2b;
  --panel-2:#1e2635;
  --border:rgba(233,231,223,0.09);
  --border-strong:rgba(233,231,223,0.16);
  --paper:#f3ecd9;
  --paper-2:#ece2c6;
  --ink:#231d10;
  --ink-dim:#5a5138;
  --gold:#c9a227;
  --gold-soft:#e0c766;
  --red:#c1483f;
  --red-soft:rgba(193,72,63,0.16);
  --green:#4c8c6b;
  --green-soft:rgba(76,140,107,0.16);
  /* 순저축·순액 전용 색 — 수입(초록)과 헷갈리지 않게 청록 계열로 분리 */
  --net:#39a8bd;
  --net-soft:rgba(57,168,189,0.16);
  --text:#eae8e0;
  --text-dim:#9aa3b6;
  --text-faint:#6b7385;
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(76,140,107,0.06), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:none;
  width:100%;
  margin:0 auto;
  padding:0 clamp(16px, 2.5vw, 40px) 80px;
  box-sizing:border-box;
}
::selection{background:var(--gold);color:#1a1508;}

/* ---------- sticky header ---------- */
.site-header{
  position:sticky;
  top:0;
  z-index:100;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
    var(--bg);
  padding-top:28px;
  margin:0 calc(-1 * clamp(16px, 2.5vw, 40px));
  padding-left:clamp(16px, 2.5vw, 40px);
  padding-right:clamp(16px, 2.5vw, 40px);
}
#page-content{padding-top:22px;display:flex;flex-direction:column;gap:16px;}
.grid-top{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch;}
.col-stack{display:flex;flex-direction:column;gap:16px;}
@media (max-width:820px){.grid-top{grid-template-columns:1fr;}}

/* ---------- top bar ---------- */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.brand .mark{
  font-size:22px;
  line-height:1;
}
.brand h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  margin:0;
  letter-spacing:-0.01em;
}
.brand .tagline{
  font-family:var(--sans);
  font-size:11.5px;
  color:var(--text-faint);
  font-weight:400;
  letter-spacing:0.01em;
}
.sync-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--text-dim);
}
.sync-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--text-faint);
  box-shadow:0 0 0 3px transparent;
  transition:all .3s;
}
.sync-dot.live{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.sync-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
.sync-dot.loading{background:var(--gold);animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.btn{
  font-family:var(--sans);
  font-weight:500;
  font-size:12.5px;
  background:var(--panel-2);
  color:var(--text);
  border:1px solid var(--border-strong);
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.btn:hover{border-color:var(--gold-soft);}
.btn:active{transform:scale(0.97);}
.btn.small{padding:5px 9px;font-size:11.5px;}

/* ---------- hero / stamp ---------- */
.hero{
  position:relative;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:16px;
  padding:34px 30px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;
  align-items:center;
  overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
  border:1px solid rgba(0,0,0,0.06);
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(transparent, transparent 27px, rgba(35,29,16,0.05) 28px);
  pointer-events:none;
}
.hero-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
.hero-amount{
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(34px,5.4vw,54px);
  color:var(--ink);
  line-height:1.05;
  letter-spacing:-0.01em;
  position:relative;
}
.hero-delta{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:var(--mono);
  font-size:13.5px;
  font-weight:600;
  padding:4px 10px;
  border-radius:20px;
}
.hero-delta.down{background:var(--red-soft);color:#8a2f28;}
.hero-delta.up{background:var(--green-soft);color:#2b5c42;}
.hero-sub{
  margin-top:14px;
  font-size:12.5px;
  color:var(--ink-dim);
  font-family:var(--sans);
  max-width:420px;
  line-height:1.6;
}
.stamp{
  width:118px;height:118px;
  border-radius:50%;
  border:2.5px solid var(--red);
  color:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transform:rotate(-9deg);
  opacity:0.9;
  font-family:var(--sans);
  position:relative;
  flex-shrink:0;
}
.stamp::before{
  content:'';
  position:absolute;inset:6px;
  border:1px solid var(--red);
  border-radius:50%;
  opacity:0.55;
}
.stamp .s-top{font-size:10px;letter-spacing:0.1em;font-weight:700;margin-bottom:2px;}
.stamp .s-mid{font-size:19px;font-weight:900;}
.stamp .s-bot{font-size:9px;letter-spacing:0.08em;margin-top:2px;font-family:var(--mono);}

/* ---------- grid / panels ---------- */
.grid{
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:16px;
  margin-top:16px;
}
@media (max-width:820px){
  .grid{grid-template-columns:1fr;}
  .hero{grid-template-columns:1fr;text-align:left;}
  .stamp{transform:rotate(-6deg);}
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px 20px 22px;
}
.panel-title{
  font-family:var(--sans);
  font-weight:700;
  font-size:15.5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  row-gap:8px;
  margin:0 0 14px;
}
.panel-title .eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:0.1em;
  font-weight:400;
  display:block;
  margin-bottom:3px;
}
.full{grid-column:1 / -1;}

/* ---------- ledger table (Monthly Review mirror) ---------- */
.ledger-group{margin-bottom:4px;}
.ledger-group-name{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--gold-soft);
  letter-spacing:0.08em;
  padding:10px 0 6px;
  border-bottom:1px dashed var(--border-strong);
}
.ledger-row{
  display:grid;
  grid-template-columns:1fr auto auto 28px;
  gap:10px;
  align-items:baseline;
  padding:9px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
}
.ledger-row:last-child{border-bottom:none;}
.ledger-item{color:var(--text);}
.ledger-current{font-family:var(--mono);text-align:right;color:var(--text);}
.ledger-target{font-family:var(--mono);text-align:right;color:var(--text-faint);font-size:12px;}
.ledger-verdict{text-align:center;font-size:13px;}
.ledger-verdict.ok{color:var(--green);}
.ledger-verdict.no{color:var(--red);}

/* ---------- insights ---------- */
.insight{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px dotted var(--border);
  font-size:13px;
  line-height:1.55;
}
.insight:last-child{border-bottom:none;}
.insight .dot{
  flex-shrink:0;
  margin-top:5px;
  width:6px;height:6px;
  border-radius:50%;
}
.insight.warn .dot{background:var(--red);}
.insight.good .dot{background:var(--green);}
.insight.info .dot{background:var(--gold);}
.insight b{color:var(--gold-soft);font-weight:600;}

/* ---------- chart wrap ---------- */
.chart-wrap{position:relative;height:230px;}
.chart-wrap.tall{height:270px;}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* ---------- range toggle ---------- */
.range-toggle{display:flex;gap:4px;}
.range-toggle button{
  font-family:var(--mono);font-size:10.5px;
  background:transparent;border:1px solid var(--border-strong);
  color:var(--text-dim);padding:3px 8px;border-radius:5px;cursor:pointer;
}
.range-toggle button.active{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600;}
.range-toggle.mini button{font-size:9.5px;padding:2px 6px;}

/* ---------- allocation list ---------- */
.alloc-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;font-size:12.5px;
}
.alloc-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.alloc-name{flex:1;color:var(--text-dim);}
.alloc-pct{font-family:var(--mono);color:var(--text);width:46px;text-align:right;}
.alloc-amt{font-family:var(--mono);color:var(--text);width:auto;text-align:right;font-size:12px;}

/* ---------- settings ---------- */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px dotted var(--border);gap:10px;
}
.settings-row:last-child{border-bottom:none;}
.settings-row label{font-size:12.5px;color:var(--text-dim);}
.settings-row input{
  width:110px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:12.5px;
  border-radius:6px;padding:6px 8px;text-align:right;
}
/* 보조 설명 문구 — 흐름표 인사이트(.fm-ins)와 같은 톤으로 통일 */
.settings-note{position:relative;font-size:12px;color:var(--text-dim);line-height:1.65;
  margin-top:12px;padding-left:13px;}
.settings-note:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--text-faint);}
.settings-note b{color:var(--text);font-weight:600;}
/* 버튼·입력이 들어 있는 안내줄은 불릿 없이 */
.settings-note:has(button),.settings-note:has(input),.settings-note:has(pre){padding-left:0;}
.settings-note:has(button):before,.settings-note:has(input):before,.settings-note:has(pre):before{display:none;}

/* ---------- category bars ---------- */
.cat-row{margin:12px 0;}
.cat-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.cat-row-top .amt{font-family:var(--mono);color:var(--text-dim);}
.cat-bar-track{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.cat-row.over .cat-bar-fill{background:linear-gradient(90deg,var(--red),#d9756c);}
.cat-tag{font-family:var(--mono);font-size:10px;color:var(--red);margin-left:6px;}
.budget-input-compact{
  width:66px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--mono);font-size:10px;
  border-radius:4px;padding:1px 4px;text-align:right;
}
.budget-row-compact{display:flex;align-items:center;gap:14px;padding:5px 0;flex-wrap:nowrap;}
.b-name{flex:0 0 auto;width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text);}
.b-bar-track{flex:1 1 auto;min-width:20px;height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;}
.b-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
.b-bar-fill.over{background:linear-gradient(90deg,var(--red),#d9756c);}
.b-figures{flex:0 0 210px;font-family:var(--mono);font-size:10px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.subhead{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;margin-bottom:8px;}
.pie-legend-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px;}
.pie-legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.pie-legend-name{flex:1;color:var(--text);}
.pie-legend-val{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
.month-nav select{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:5px 8px;
}
.income-cat-btns{
  display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;
}
.income-cat-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--sans);font-size:11px;border-radius:20px;padding:4px 11px;cursor:pointer;
  transition:all .15s;
}
.income-cat-btn:hover{border-color:var(--border-strong);color:var(--text);}
.income-cat-btn.active{background:var(--gold-soft);border-color:var(--gold-soft);color:#1a1408;font-weight:600;}
.overlay-toggles{display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;}
.overlay-toggles label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);cursor:pointer;}
.overlay-toggles input[type="checkbox"]{accent-color:var(--gold-soft);cursor:pointer;}
.compact-stat-value{font-family:var(--sans);font-weight:800;font-size:22px;color:var(--text);margin-top:4px;}
#top-expenses-body{padding-left:18px;}
.month-nav-select-standalone{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:6px 10px;margin:8px 0 12px;
  display:block;width:auto;max-width:280px;
}
@media (max-width:820px){
  #top-expenses-body{padding-left:0;}
}
@media (max-width:520px){
  .b-name{width:44px;}
  .b-figures{flex-basis:150px;font-size:9px;}
}

/* ---------- banner ---------- */
.banner{
  display:flex;align-items:center;gap:10px;
  background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:10px;padding:11px 14px;margin-bottom:14px;
  font-size:12.5px;color:var(--text-dim);
}
.banner.err{border-color:rgba(193,72,63,0.4);color:#e3a29c;}
.banner button{margin-left:auto;}

/* ---------- footer ---------- */
.footer{
  margin-top:26px;
  text-align:center;
  font-size:11.5px;
  color:var(--text-faint);
  font-family:var(--mono);
  line-height:1.9;
}
.footer a{color:var(--gold-soft);text-decoration:none;}
.footer a:hover{text-decoration:underline;}

.empty-state{
  font-size:12.5px;color:var(--text-faint);
  text-align:center;padding:20px 0;
}

.skeleton{
  background:linear-gradient(90deg,var(--panel-2) 25%,rgba(255,255,255,0.06) 37%,var(--panel-2) 63%);
  background-size:400% 100%;
  animation:sk 1.4s ease infinite;
  border-radius:6px;
}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 이번달(now) 페이지 ---------- */
.now-progress{display:flex;align-items:center;gap:12px;margin-top:2px;}
.now-progress-track{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
.now-progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
.now-progress-text{font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
.now-kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dotted var(--border);font-size:12.5px;color:var(--text-dim);}
.now-kv:last-child{border-bottom:none;}
.now-kv b{font-family:var(--mono);color:var(--text);font-weight:600;}
.now-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.now-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text-dim);border-radius:9px;padding:7px 11px;cursor:pointer;font-family:var(--sans);font-size:12px;text-align:left;line-height:1.35;transition:border-color .15s,color .15s;}
.now-chip em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
.now-chip span{display:block;font-family:var(--mono);font-size:11px;color:var(--text);margin-top:2px;}
.now-chip:hover{border-color:var(--gold-soft);color:var(--text);}
.now-chip.active{border-color:var(--gold);color:var(--gold-soft);background:rgba(201,162,39,0.10);}
.now-chip.future{opacity:.4;}
@media (max-width:600px){
  .now-progress{flex-wrap:wrap;}
  .now-chip{flex:1 1 calc(50% - 8px);}
}

/* ---------- 오늘(today) 페이지 ---------- */
.month-nav input[type="date"]{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;color-scheme:dark;
}
.cal-cell.real{border-style:dashed;border-color:var(--gold-soft);}
.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.today-datewrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
/* 오늘 탭: 패널 밖으로 뺀 날짜 헤더 */
.page-daybar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:2px 2px 0;}
.page-daybar .day-title{font-family:var(--sans);font-weight:800;font-size:30px;line-height:1.15;color:var(--text);letter-spacing:-.01em;}
.page-daybar .day-title .today-dow{color:var(--gold-soft);}
.page-daybar .today-verdict{flex:1 1 260px;min-width:220px;}
@media (max-width:820px){.page-daybar .day-title{font-size:23px;}}
/* 캘린더 상세: 수입/지출/이체 구분 헤더 */
.dtl-group{margin-top:10px;}
.dtl-group:first-child{margin-top:0;}
.dtl-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:5px 8px;border-radius:7px;margin-bottom:5px;}
.dtl-group-head b{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;}
.dtl-group-head.income{background:var(--green-soft);color:#8fd0ac;}
.dtl-group-head.expense{background:var(--red-soft);color:#e39a93;}
.dtl-group-head.transfer{background:rgba(201,162,39,0.16);color:var(--gold-soft);}
.dtl-group .table-scroll{border:none;border-radius:0;}
.dtl-group table{border-left:2px solid var(--border-strong);}
.dtl-group.income table{border-left-color:rgba(76,140,107,0.5);}
.dtl-group.expense table{border-left-color:rgba(193,72,63,0.5);}
.dtl-group.transfer table{border-left-color:rgba(201,162,39,0.5);}
.budget-basis{font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--text-faint);margin-top:9px;}
.budget-basis b{color:var(--gold-soft);font-weight:600;}
.budget-basis em{font-style:normal;color:var(--text-dim);}
.today-date{font-family:var(--sans);font-weight:800;font-size:25px;line-height:1.2;color:var(--text);}
.today-date .today-dow{color:var(--gold-soft);}
.today-date small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--text-faint);letter-spacing:.04em;margin-top:6px;}
.today-verdict{font-family:var(--sans);font-weight:700;font-size:15px;line-height:1.55;margin-top:2px;}
.today-verdict.good{color:var(--green);}
.today-verdict.warn{color:var(--red);}
.today-verdict.neutral{color:var(--gold-soft);}
.allow-track{height:9px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin-top:10px;}
.allow-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),#6fa88a);transition:width .3s;}
.allow-fill.over{background:linear-gradient(90deg,var(--red),#d9756c);}
.allow-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:6px;}
.streak-badge{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--border-strong);color:var(--text-dim);margin-top:10px;}
.streak-badge.on{border-color:rgba(76,140,107,0.45);color:var(--green);background:var(--green-soft);}
.dow-row{display:flex;gap:5px;margin-top:12px;}
.dow-cell{flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:7px 2px;background:var(--panel-2);}
.dow-cell.sel{border-color:var(--gold);}
.dow-cell.future{opacity:.35;}
.dow-cell em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
.dow-cell span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--text);margin-top:3px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;}
.cal-dow{font-family:var(--mono);font-size:10px;color:var(--text-faint);text-align:center;padding-bottom:2px;}
.cal-cell{min-height:52px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;
  cursor:pointer;transition:border-color .15s;font:inherit;}
.cal-cell.blank{border-color:transparent;background:transparent;cursor:default;}
.cal-cell.future{opacity:.3;cursor:default;}
.cal-cell:hover:not(.blank):not(.future){border-color:var(--gold-soft);}
.cal-cell.sel{border-color:var(--gold);background:rgba(201,162,39,0.12);}
.cal-day{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.cal-cell.sel .cal-day{color:var(--gold-soft);}
.cal-amt{font-family:var(--mono);font-size:9px;color:var(--text-faint);line-height:1.2;}
.cal-amt.zero{color:var(--green);}
.fixed-due{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--border);font-size:12.5px;}
.fixed-due:last-child{border-bottom:none;}
.fixed-due .dday{font-family:var(--mono);font-size:10px;flex-shrink:0;width:46px;text-align:center;padding:3px 0;border-radius:5px;background:var(--panel-2);color:var(--text-dim);}
.fixed-due .dday.soon{background:rgba(201,162,39,0.18);color:var(--gold-soft);}
.fixed-due .dday.late{background:var(--red-soft);color:#d9756c;}
.fixed-due .nm{flex:1;color:var(--text);}
.fixed-due .nm small{display:block;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.fixed-due .amt2{font-family:var(--mono);color:var(--text);}
@media (max-width:600px){
  .today-date{font-size:21px;}
  .cal-cell{min-height:44px;}
  .cal-amt{font-size:8px;}
}

/* ---------- 캘린더 페이지 ---------- */
.mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.mcal-head{margin-top:14px;margin-bottom:6px;}
.mcal-dow{font-family:var(--mono);font-size:12px;color:var(--text-faint);text-align:center;}
.mcal-dow.sat{color:#7c9bc9;}
.mcal-dow.sun{color:#c1483f;}
.mcal-cell{
  min-height:106px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);
  padding:8px 8px 9px;display:flex;flex-direction:column;gap:3px;cursor:pointer;
  transition:border-color .15s;text-align:left;overflow:hidden;
}
.mcal-cell.blank{border-color:transparent;background:transparent;cursor:default;}
.mcal-cell.future{opacity:.35;cursor:default;}
.mcal-cell:hover:not(.blank):not(.future){border-color:var(--gold-soft);}
.mcal-cell.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.mcal-cell.real{border-style:dashed;border-color:var(--gold-soft);}
.mcal-daynum{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;}
.mcal-daynum.sat{color:#7c9bc9;}
.mcal-daynum.sun{color:#c1483f;}
.mcal-daynum .cnt{font-size:10.5px;font-weight:400;color:var(--text-faint);}
.mcal-line{display:flex;justify-content:space-between;gap:5px;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:nowrap;font-variant-numeric:tabular-nums;}
.mcal-line i{font-style:normal;opacity:.75;}
.mcal-line.inc{color:#7fbf9c;}
.mcal-line.exp{color:#e08a82;}
.mcal-line.trf{color:var(--gold-soft);}
.mcal-none{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}
.mcal-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:12px;}
.mcal-legend span{display:flex;align-items:center;gap:5px;}
.mcal-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;font-style:normal;}
.dow-avg-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;}
.dow-avg-row .nm{width:22px;font-family:var(--mono);font-size:11px;color:var(--text-dim);flex-shrink:0;}
.dow-avg-row .fig{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);width:86px;text-align:right;flex-shrink:0;}
@media (max-width:1180px){
  .mcal-line{font-size:12px;}
  .mcal-line i{display:none;}
}
@media (max-width:820px){
  .mcal-cell{min-height:92px;padding:6px 5px;}
  .mcal-line{font-size:11px;}
  .mcal-daynum{font-size:15px;}
  .mcal-daynum .cnt{display:none;}
}
@media (max-width:600px){
  .mcal-grid{gap:4px;}
  .mcal-cell{min-height:80px;padding:5px 4px;}
  .mcal-line{font-size:10px;}
  .mcal-daynum{font-size:13.5px;}
}

/* ---------- 구조 페이지 (자산 증식 엔진) ---------- */
.eng-board{display:flex;align-items:stretch;gap:9px;margin-top:16px;}
.eng-stage{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:7px;}
.eng-stage-head{display:flex;align-items:baseline;gap:7px;padding-bottom:5px;border-bottom:1px solid var(--border-strong);}
.eng-stage-head span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);}
.eng-stage-head b{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--text);}
.eng-arrow{flex:0 0 12px;display:flex;align-items:center;justify-content:center;color:var(--gold-soft);font-size:14px;opacity:.65;padding-top:26px;}
.eng-node{border:1px solid var(--border);border-radius:10px;background:var(--panel-2);padding:8px 9px 9px;display:flex;flex-direction:column;gap:4px;}
.eng-node.leak{border-color:rgba(193,72,63,.3);}
.eng-node.zero{opacity:.55;}
.eng-node-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.eng-node-top .nm{font-size:12.5px;font-weight:600;color:var(--text);}
.eng-node-top .pct{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.eng-amt{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);}
.eng-amt.inc{color:#7fbf9c;}
.eng-amt.exp{color:#e08a82;}
.eng-amt.trf{color:var(--gold-soft);}
.eng-amt.stk{color:#8fb4dd;}
.eng-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden;}
.eng-bar i{display:block;height:100%;border-radius:3px;background:var(--gold-soft);}
.eng-bar i.exp{background:#e08a82;}
.eng-bar i.inc{background:#7fbf9c;}
.eng-bar i.stk{background:#8fb4dd;}
.eng-sub{font-family:var(--mono);font-size:10px;color:var(--text-faint);line-height:1.5;}
.eng-act{margin-top:3px;border-radius:7px;padding:6px 7px;font-size:11px;line-height:1.55;
  border:1px dashed rgba(201,162,39,.42);background:rgba(201,162,39,.07);color:var(--gold-soft);}
.eng-act b{color:var(--text);}
.eng-act .rk{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.05em;
  background:rgba(201,162,39,.22);color:var(--gold-soft);border-radius:4px;padding:1px 4px;margin-right:5px;}
.eng-act.p1{border-style:solid;border-color:var(--gold);background:rgba(201,162,39,.17);}
.eng-act.p1 .rk{background:var(--gold);color:#1a1508;font-weight:600;}
.eng-act.risk{border-color:rgba(193,72,63,.45);background:rgba(193,72,63,.10);color:#e39a93;}
.eng-act.risk .rk{background:rgba(193,72,63,.3);color:#f0b8b2;}
.eng-loop{margin-top:16px;border:1px solid var(--border);border-radius:11px;
  background:linear-gradient(90deg,rgba(201,162,39,.11),rgba(76,140,107,.07));padding:12px 14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.eng-loop .ic{font-size:18px;color:var(--gold-soft);flex-shrink:0;}
.eng-loop .tx{flex:1 1 320px;font-size:12.5px;line-height:1.75;color:var(--text-dim);}
.eng-loop .tx b{color:var(--text);}
.eng-split{display:flex;height:10px;border-radius:5px;overflow:hidden;flex:1 1 180px;min-width:140px;background:rgba(255,255,255,.05);}
.eng-split i{display:block;height:100%;}
.eng-cross{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap;}
.eng-cross .lb{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex:0 0 auto;}
.eng-cross .tr{flex:1 1 200px;height:8px;border-radius:4px;background:rgba(255,255,255,.05);overflow:hidden;position:relative;}
.eng-cross .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--gold-soft));}
.act-imp{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--gold-soft);}
.act-ctrl{font-family:var(--mono);font-size:10px;border-radius:5px;padding:2px 6px;}
.act-ctrl.hi{background:var(--green-soft);color:#8fd0ac;}
.act-ctrl.mid{background:rgba(201,162,39,.18);color:var(--gold-soft);}
.act-ctrl.lo{background:rgba(255,255,255,.05);color:var(--text-faint);}
.chk-row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.chk-row:last-child{border-bottom:none;}
.chk-row .mk{flex:0 0 46px;font-family:var(--mono);font-size:10px;text-align:center;border-radius:5px;padding:3px 0;margin-top:1px;}
.chk-row .mk.ok{background:var(--green-soft);color:#8fd0ac;}
.chk-row .mk.no{background:var(--red-soft);color:#e39a93;}
.chk-row .mk.na{background:rgba(255,255,255,.05);color:var(--text-faint);}
.chk-row .nm{flex:1 1 auto;min-width:0;line-height:1.5;}
.chk-row .nm i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:3px;}
.chk-row .fig{flex:0 0 auto;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text);line-height:1.5;}
.chk-row .fig em{display:block;font-style:normal;font-size:10px;color:var(--text-faint);margin-top:2px;}
@media (max-width:1000px){
  .eng-board{flex-direction:column;}
  .eng-arrow{padding-top:0;transform:rotate(90deg);}
}


/* ---------- 전체 로그인 게이트 ---------- */
#lockscreen{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(76,140,107,0.07), transparent 55%),
    var(--bg);
  padding:24px;
}
.lock-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:13px;}
.lock-mark{font-size:34px;line-height:1;margin-bottom:2px;}
.lock-card h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;}
.lock-card .sub{font-size:13px;color:var(--text-dim);margin:-7px 0 6px;line-height:1.6;}

/* ---------- 공용 입력 요소 ---------- */
.en-in{
  width:100%;height:42px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;
  background:var(--bg-2);color:var(--text);font-family:var(--sans);font-size:14.5px;
}
.en-in:focus{outline:none;border-color:var(--gold);}
.en-in::placeholder,.en-catsearch::placeholder{color:#8a94a8;opacity:1;}
.en-lab{display:block;font-size:11px;color:var(--text-dim);margin:0 0 5px;letter-spacing:.02em;}
.en-cta{
  width:100%;height:46px;border:0;border-radius:9px;background:var(--gold);color:#1a1508;
  font-family:var(--sans);font-weight:700;font-size:14.5px;cursor:pointer;
}
.en-cta:active{transform:scale(.99);}
.en-cta:disabled{opacity:.45;cursor:default;}
.en-kbd{font-family:var(--mono);font-size:10px;background:rgba(26,21,8,0.18);border-radius:4px;
  padding:2px 5px;line-height:1;font-weight:600;margin-left:3px;}
.en-err{font-size:12.5px;color:var(--red);min-height:17px;margin:0;}

/* ---------- 네비 우측 기록 버튼 ---------- */
.navrow{display:flex;align-items:flex-end;gap:16px;}
.navrow .navbar{flex:1 1 auto;min-width:0;scrollbar-width:none;-ms-overflow-style:none;}
.navrow .navbar::-webkit-scrollbar{display:none;height:0;width:0;}
.entry-open{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  height:36px;padding:0 14px;margin-bottom:6px;
  background:var(--gold);color:#1a1508;border:0;border-radius:8px;
  font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer;
  transition:filter .15s, transform .1s;
}
.entry-open:hover{filter:brightness(1.08);}
.entry-open:active{transform:scale(.97);}
.entry-open .plus{font-size:15px;line-height:1;}
.entry-open kbd{
  font-family:var(--mono);font-size:10px;background:rgba(26,21,8,0.18);
  border-radius:4px;padding:2px 5px;line-height:1;font-weight:600;
}
@media(max-width:720px){ .entry-open kbd{display:none;} .entry-open{padding:0 11px;} }

/* ---------- 입력 오버레이 ---------- */
#en-ov{position:fixed;inset:0;z-index:150;background:rgba(8,11,17,0.74);
  display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px 16px;}
#en-ov[hidden]{display:none;}
.en-modal{width:100%;max-width:740px;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:15px;padding:16px 18px 18px;margin:auto;}
.en-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.en-head h3{font-family:var(--serif);font-size:16px;margin:0;font-weight:700;}
.en-x{background:none;border:0;color:var(--text-faint);font-size:20px;cursor:pointer;line-height:1;padding:2px 5px;}
.en-x:hover{color:var(--text);}
.en-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,268px);gap:18px;align-items:start;}
@media(max-width:700px){.en-two{grid-template-columns:1fr;gap:14px;}}
.en-side{border-left:1px solid var(--border);padding-left:18px;}
@media(max-width:700px){.en-side{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:13px;}}

/* ---------- 입력 필드 ---------- */
.en-fld{margin-bottom:11px;position:relative;}
.en-money{display:flex;align-items:center;gap:8px;background:var(--bg-2);
  border:1px solid var(--border-strong);border-radius:8px;padding:0 12px;height:52px;}
.en-money:focus-within{border-color:var(--gold);}
.en-amt{flex:1;min-width:0;border:0;background:none;padding:0;color:var(--text);
  font-family:var(--mono);font-size:26px;font-weight:600;text-align:right;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;height:100%;}
.en-amt:focus{outline:none;}
.en-amt::placeholder{color:var(--text-faint);opacity:.4;}
.en-amt.neg{color:var(--red);}
.en-won{font-family:var(--mono);font-size:14px;color:var(--text-faint);}
.en-kind-badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;
  font-size:11.5px;font-weight:700;font-family:var(--sans);white-space:nowrap;}
.en-kind-badge.지출{background:var(--red-soft);color:var(--red);}
.en-kind-badge.수입{background:var(--green-soft);color:var(--green);}
.en-kind-badge.이체{background:var(--net-soft);color:var(--net);}
.en-kind-badge.none{background:var(--bg-2);color:var(--text-faint);}

/* ---------- 자동완성 드롭다운 ---------- */
.en-ac{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:3px;
  background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;
  max-height:250px;overflow-y:auto;box-shadow:0 10px 26px rgba(0,0,0,0.45);}
.en-ac[hidden]{display:none;}
.en-ac-item{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;
  border-bottom:1px solid var(--border);}
.en-ac-item:last-child{border-bottom:0;}
.en-ac-item:hover,.en-ac-item.on{background:rgba(201,162,39,0.12);}
.en-ac-item .nm{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.en-ac-item .ct{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
.en-ac-item mark{background:none;color:var(--gold-soft);font-weight:700;}

/* ---------- 분류 칩 ---------- */
.en-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;}
.en-chip{min-height:48px;border:1px solid var(--border);border-radius:9px;background:var(--bg-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;padding:4px 2px;font-family:var(--sans);position:relative;}
.en-chip:hover{border-color:var(--border-strong);}
.en-chip .e{font-size:13px;line-height:1;}
.en-chip .t{font-size:10.5px;color:var(--text-dim);text-align:center;line-height:1.2;word-break:keep-all;}
.en-chip .k{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;}
.en-chip .k.지출{background:var(--red);}.en-chip .k.수입{background:var(--green);}.en-chip .k.이체{background:var(--net);}
.en-chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);}
.en-chip[aria-pressed="true"] .t{color:#1a1508;font-weight:700;}
.en-catsearch{width:100%;height:32px;padding:0 10px;margin-bottom:5px;
  border:1px solid var(--border);border-radius:7px;background:var(--bg-2);color:var(--text);
  font-family:var(--sans);font-size:12.5px;}
.en-catsearch:focus{outline:none;border-color:var(--gold);}
.en-more{max-height:0;overflow:hidden;transition:max-height .18s ease;}
.en-more.open{max-height:340px;margin-top:5px;overflow-y:auto;}
.en-grouplab{font-family:var(--mono);font-size:10px;color:var(--text-faint);
  letter-spacing:.1em;margin:8px 2px 4px;}

/* ---------- 토글 ---------- */
.en-tgs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0;}
.en-tg{height:36px;border:1px solid var(--border-strong);border-radius:7px;background:var(--bg-2);
  cursor:pointer;font-family:var(--sans);font-size:11.5px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;gap:3px;padding:0;line-height:1;white-space:nowrap;}
.en-tg[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1508;font-weight:700;}
.en-tg-good{border-color:rgba(76,140,107,0.5);color:var(--green);}
.en-tg-bad{border-color:rgba(193,72,63,0.5);color:var(--red);}
.en-tg-good[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
.en-tg-bad[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;}

/* ---------- 방금 기록 (사이드) ---------- */
.en-row{display:flex;align-items:center;gap:8px;padding:7px 2px;
  border-bottom:1px solid var(--border);}
.en-row:last-child{border-bottom:0;}
.en-row .m{flex:1;min-width:0;}
.en-row .l1{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.en-row .l2{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:3px;letter-spacing:.01em;}
.en-row .l2 .dv{color:var(--text-faint);margin:0 5px;}
.en-row .l1{font-weight:500;}
.en-row .v{font-family:var(--mono);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;}
.en-row .v.지출{color:var(--red);}.en-row .v.수입{color:var(--green);}.en-row .v.이체{color:var(--net);}
.en-del{background:none;border:0;color:transparent;font-size:15px;cursor:pointer;padding:1px 3px;line-height:1;}
.en-row:hover .en-del{color:var(--text-faint);}
.en-del:hover{color:var(--red);}
.en-empty{font-size:12.5px;color:var(--text-faint);padding:12px 2px;}
.en-sub{font-size:11px;color:var(--text-faint);margin:0 0 7px;}

/* ---------- 전체 내역 ---------- */
.lg-wrap{max-width:1040px;margin:0 auto;}
.lg-stick{position:sticky;top:var(--hdr-h,0px);z-index:30;background:var(--bg);
  padding:30px 0 0;margin-bottom:2px;}
.lg-bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;}
.lg-grp{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;}
.lg-grp.grow{flex:1 1 190px;min-width:150px;}
.lg-glab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  color:var(--text-faint);padding-left:3px;}
.lg-gin{display:flex;gap:4px;align-items:center;padding:3px;border-radius:9px;
  background:var(--panel);border:1px solid var(--border);}
.lg-grp.grow .lg-gin{flex:1;}
.lg-bar .en-in{height:26px;font-size:12px;width:auto;flex:0 0 auto;padding:0 8px;
  background:transparent;border-color:transparent;border-radius:6px;}
.lg-bar .en-in:focus{background:var(--panel-2);border-color:var(--border-strong);}
.lg-bar .grow{flex:1 1 auto;min-width:0;}
.lg-bar select.en-in{cursor:pointer;color-scheme:dark;}
.lg-grp.cat{flex:0 1 230px;min-width:170px;}
.lg-grp.cat .lg-gin{width:100%;}
.lg-reset{height:34px;background:transparent;border:1px solid var(--border);
  border-radius:9px;color:var(--text-faint);font-family:var(--sans);font-size:12px;
  padding:0 13px;cursor:pointer;white-space:nowrap;}
.lg-reset:hover{border-color:var(--border-strong);color:var(--text);background:var(--panel-2);}

/* 종류 : 아래 표에 쓰는 색 칩과 같은 언어 */
.lg-kinds{gap:2px;}
.lg-kinds button{background:transparent;border:1px solid transparent;border-radius:6px;
  cursor:pointer;font-family:var(--mono);font-size:11px;padding:4px 9px;color:var(--text-faint);
  line-height:1.2;}
.lg-kinds button:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.lg-kinds button.on{background:var(--panel-2);border-color:var(--border-strong);color:var(--text);font-weight:600;}
.lg-kinds button.kd.지출{color:#c98a84;}
.lg-kinds button.kd.수입{color:#7fc0a0;}
.lg-kinds button.kd.이체{color:#7ed0de;}
.lg-kinds button.kd.지출.on{background:var(--red-soft);border-color:rgba(193,72,63,.5);color:#e39189;}
.lg-kinds button.kd.수입.on{background:var(--green-soft);border-color:rgba(76,140,107,.5);color:#8fd0af;}
.lg-kinds button.kd.이체.on{background:var(--net-soft);border-color:rgba(57,168,189,.5);color:#7ed0de;}

/* 분류 : 검색해서 고른다 */
.lg-catpick{position:relative;}
.lg-catpick .en-in{font-size:12px;}
.lg-catpick .en-in.picked{color:var(--gold-soft);font-family:var(--mono);font-size:11px;}
.lg-catx{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;
  border:0;color:var(--text-faint);font-size:14px;cursor:pointer;line-height:1;padding:2px 4px;}
.lg-catx:hover{color:var(--red);}
.lg-catdrop{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;
  background:var(--panel);border:1px solid var(--border-strong);border-radius:9px;
  max-height:300px;overflow-y:auto;padding:5px;box-shadow:0 10px 26px rgba(0,0,0,.45);
  scrollbar-width:thin;min-width:250px;}
.lg-cathead{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--text-faint);
  padding:7px 7px 4px;}
.lg-catopt{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:6px;
  cursor:pointer;font-size:12px;color:var(--text-dim);}
.lg-catopt:hover,.lg-catopt.on{background:var(--panel-2);color:var(--text);}
.lg-catopt .em{width:15px;text-align:center;flex:0 0 auto;}
.lg-catopt .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lg-catopt .tx b{color:var(--text);font-weight:600;}
.lg-catempty{padding:11px 8px;font-size:11.5px;color:var(--text-faint);}
.lg-quick{display:flex;gap:2px;}
.lg-quick button{background:transparent;border:0;color:var(--text-faint);
  border-radius:14px;padding:5px 10px;cursor:pointer;font-family:var(--sans);font-size:11.5px;}
.lg-quick button:hover{color:var(--text);}
.lg-quick button.on{background:var(--gold);color:#1a1508;font-weight:700;}
.lg-sum{display:flex;gap:22px;align-items:baseline;margin:14px 2px 0;flex-wrap:wrap;}
.lg-sum span.k{font-size:10.5px;color:var(--text-faint);margin-right:6px;}
.lg-sum span.v{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}

/* 열 머리글 */
.lg-cols{display:flex;align-items:center;gap:9px;height:28px;padding:0 12px;
  margin-top:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.06em;}
/* 머리글도 행과 똑같이 flex 중앙정렬 — 텍스트 폭과 버튼 폭이 달라도 세로줄이 어긋나지 않는다 */
.lg-cols .f,.lg-cols .g,.lg-line .f,.lg-line .g{
  display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;}
.lg-cols .f,.lg-cols .g{font-size:9px;letter-spacing:.02em;}
.lg-cols .k{white-space:nowrap;}

/* 날짜 그룹 */
.lg-day{display:flex;align-items:baseline;gap:8px;margin:14px 4px 5px;}
.lg-day .d{font-family:var(--mono);font-size:12px;color:var(--gold-soft);font-weight:600;}
.lg-day .w{font-size:11px;color:var(--text-dim);}
.lg-day .s{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-dim);
  font-variant-numeric:tabular-nums;}
.lg-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}

/* 행 : 표의 열처럼 폭 고정 */
.lg-line{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;
  border-bottom:1px solid var(--border);position:relative;}
.lg-card .lg-line:last-child{border-bottom:0;}
.lg-line:hover{background:var(--panel-2);}
/* 종류를 왼쪽 띠로 한 번, 분류 앞 배지로 한 번 더 알린다 */
.lg-line:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.lg-line.k-지출:before{background:var(--red);}
.lg-line.k-수입:before{background:var(--green);}
.lg-line.k-이체:before{background:var(--net);}
.lg-line .k,.lg-cols .k{flex:0 0 40px;}
.lg-line .e,.lg-cols .e{flex:0 0 16px;font-size:12px;line-height:1;text-align:center;}
.lg-line .c,.lg-cols .c{flex:0 0 168px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lg-line .c .ct{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lg-kd{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.02em;
  border-radius:4px;padding:2px 5px;line-height:1.15;}
.lg-kd.지출{background:var(--red-soft);color:#e39189;}
.lg-kd.수입{background:var(--green-soft);color:#7fc0a0;}
.lg-kd.이체{background:var(--net-soft);color:#7ed0de;}
.lg-line .n,.lg-cols .n{flex:1 1 auto;min-width:0;font-size:12.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lg-line .mm,.lg-cols .mm{flex:0 0 148px;min-width:0;font-size:11.5px;color:var(--text-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-left:1px solid var(--border);padding-left:10px;}
.lg-line .f,.lg-cols .f{flex:0 0 62px;font-size:10px;color:var(--text-dim);}
.lg-line .g,.lg-cols .g{flex:0 0 62px;}
.lg-line .f{gap:4px;}
.lg-tg{background:none;border:0;cursor:pointer;font-size:11px;line-height:1;padding:0;
  width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;opacity:.22;filter:grayscale(1);}
.lg-tg:hover{opacity:.6;background:rgba(255,255,255,0.05);}
.lg-tg.on{opacity:1;filter:none;}
.lg-gb{background:none;border:1px solid transparent;cursor:pointer;border-radius:11px;
  font-family:var(--mono);font-size:9.5px;padding:0 8px;color:var(--text-faint);
  height:20px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;}
.lg-gb:hover{border-color:var(--border-strong);}
.lg-gb.good{background:var(--green-soft);color:#7fc0a0;}
.lg-gb.bad{background:var(--red-soft);color:#e39189;}
.lg-line .v,.lg-cols .v{flex:0 0 110px;font-family:var(--mono);font-size:12.5px;font-weight:500;
  font-variant-numeric:tabular-nums;text-align:right;}
.lg-line .v.지출{color:var(--red);}.lg-line .v.수입{color:var(--green);}.lg-line .v.이체{color:var(--net);}
.lg-line .x,.lg-cols .x{flex:0 0 16px;background:none;border:0;color:transparent;font-size:15px;
  cursor:pointer;padding:0;line-height:1;}
.lg-line:hover .x{color:var(--text-faint);}
.lg-line .x:hover{color:var(--red);}
/* 더블클릭 인라인 수정 */
/* 비어 있는 칸은 높이가 0이 되어 더블클릭이 닿지 않는다 — 최소 높이를 준다 */
.lg-line [data-ed]{cursor:text;border-radius:5px;min-height:22px;display:flex;align-items:center;}
.lg-line .c[data-ed]{display:flex;}
.lg-line .v[data-ed]{justify-content:flex-end;}
.lg-ph{color:var(--text-faint);opacity:0;font-style:normal;transition:opacity .12s;}
.lg-line:hover .lg-ph{opacity:.45;}
.lg-line [data-ed]:hover{box-shadow:inset 0 0 0 1px var(--border-strong);}
.lg-line [data-ed].editing{box-shadow:inset 0 0 0 1px var(--gold-soft);}
.lg-ed{width:100%;min-width:0;background:var(--bg-2);border:0;outline:0;color:var(--text);
  font-family:var(--sans);font-size:12px;height:24px;padding:0 5px;border-radius:5px;}
.lg-ed.mono{font-family:var(--mono);text-align:right;}
.lg-ed.sel{cursor:pointer;color-scheme:dark;font-family:var(--mono);font-size:11px;}
@media(max-width:820px){
  .lg-line .c,.lg-cols .c,.lg-line .mm,.lg-cols .mm,.lg-line .g,.lg-cols .g{display:none;}
  .lg-line .f,.lg-cols .f{flex:0 0 42px;}
  .lg-grp.cat{flex:1 1 100%;}
  .lg-line .v,.lg-cols .v{flex:0 0 96px;}
  .lg-line .x{color:var(--text-faint);}
}

.lg-acnew{grid-template-columns:auto 1fr;border-bottom:1px solid var(--border);
  margin-bottom:3px;padding-bottom:8px;}
.lg-acnew .gp{background:rgba(201,162,39,.18);color:var(--gold-soft);}
.lg-acnew .nm{color:var(--gold-soft);}
.en-ac-item .gp{font-family:var(--mono);font-size:9px;color:var(--text-faint);
  background:rgba(255,255,255,0.05);border-radius:4px;padding:2px 5px;margin-right:6px;
  flex:0 0 auto;white-space:nowrap;}
/* 사용처 앞에 붙는 그룹 — 이 가게가 어느 갈래인지 표에서 바로 보이게 */
.lg-mg{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);
  background:rgba(255,255,255,0.05);border-radius:4px;padding:2px 5px;margin-right:6px;
  font-style:normal;white-space:nowrap;}
.lg-mg.none{opacity:.5;}

/* 드래그로 날짜 옮기기 */
.lg-line{cursor:default;}
.lg-line.dragging{opacity:.35;}
.lg-dg{border-radius:11px;transition:background .12s,box-shadow .12s;}
.lg-dg.over{background:rgba(201,162,39,0.07);box-shadow:inset 0 0 0 1px var(--gold-soft);}
.lg-dg.over .lg-day .d{color:var(--gold);}

/* 사용처 자동완성 */
.lg-acbox{position:fixed;z-index:400;min-width:260px;max-width:380px;
  background:var(--panel);border:1px solid var(--border-strong);border-radius:9px;padding:4px;
  max-height:280px;overflow-y:auto;box-shadow:0 10px 26px rgba(0,0,0,.45);scrollbar-width:thin;}
.lg-acitem{display:grid;grid-template-columns:auto 1fr;gap:2px 7px;padding:6px 8px;border-radius:6px;
  cursor:pointer;font-size:12px;color:var(--text-dim);}
.lg-acitem:hover,.lg-acitem.on{background:var(--panel-2);}
.lg-acitem .gp{font-family:var(--mono);font-size:9px;color:var(--text-faint);
  background:rgba(255,255,255,0.05);border-radius:4px;padding:2px 5px;align-self:center;white-space:nowrap;}
.lg-acitem .gp.none{opacity:.45;}
.lg-acitem .nm{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lg-acitem .nm mark{background:rgba(201,162,39,.28);color:var(--gold-soft);border-radius:2px;}
.lg-acitem .ct{grid-column:2;font-family:var(--mono);font-size:10px;color:var(--text-faint);
  display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lg-dr .nm,.lg-line .n{position:relative;}

/* 지출이 아닌 행의 Good/Bad 자리 */
.lg-na{color:var(--text-faint);opacity:.35;font-size:12px;}
.lg-gb.off{opacity:.3;cursor:default;}
.lg-gb.off:hover{border-color:transparent;}
/* 초안 행의 분류 검색 */
.lg-cpick{position:relative;flex:1;min-width:0;display:block;}
.lg-cpick .lg-ed{width:100%;}
.lg-cpdrop{min-width:250px;}
.lg-catopt .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-faint);}
#mg-gdrop{max-height:340px;}

/* ---------- 전체 내역 › 사용처 ---------- */
.lg-shell{padding-top:26px;}
.mg-stick{position:sticky;top:var(--hdr-h,0px);z-index:30;background:var(--bg);padding-top:4px;}
.mg-bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin:16px 0 12px;}
#mg-cols [data-s]{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;}
#mg-cols .cn,#mg-cols .sm,#mg-cols .lt{justify-content:flex-end;}
#mg-cols [data-s]:hover{color:var(--text);}
#mg-cols .ar{color:var(--gold-soft);font-size:8px;line-height:1;}
.mg-row .gp{display:flex;align-items:center;gap:3px;overflow:hidden;}
.mg-row .gp .lg-mg{margin-right:0;}
.mg-groups{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;max-height:96px;overflow-y:auto;
  scrollbar-width:thin;}
.mg-cols{margin-top:0;}
.mg-card{margin-top:0;}
.mg-cols .gp,.mg-row .gp{flex:0 0 122px;}
.mg-cols .nm,.mg-row .nm{flex:1 1 auto;min-width:0;}
.mg-cols .ct,.mg-row .ct{flex:0 0 232px;min-width:0;}
.mg-cols .cn,.mg-row .cn{flex:0 0 56px;text-align:right;}
.mg-cols .sm,.mg-row .sm{flex:0 0 104px;text-align:right;}
.mg-cols .lt,.mg-row .lt{flex:0 0 60px;text-align:right;}
.mg-row{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;
  border-bottom:1px solid var(--border);}
.mg-card .mg-row:last-child{border-bottom:0;}
.mg-row:hover{background:var(--panel-2);}
.mg-row .nm{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mg-row .ct{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);
  display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;}
.mg-row .ct .dim{color:var(--text-faint);}
.mg-row .cn,.mg-row .sm,.mg-row .lt{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);
  font-variant-numeric:tabular-nums;}
.mg-row .lt{color:var(--text-faint);}
.mg-row .mix{color:var(--gold-soft);margin-left:5px;font-size:14px;line-height:0;}
.mg-row [data-me]{cursor:text;border-radius:5px;min-height:22px;display:flex;align-items:center;}
.mg-row [data-me]:hover{box-shadow:inset 0 0 0 1px var(--border-strong);}
.mg-row [data-me].editing{box-shadow:inset 0 0 0 1px var(--gold-soft);}
@media(max-width:820px){
  .mg-cols .ct,.mg-row .ct,.mg-cols .sm,.mg-row .sm,.mg-cols .lt,.mg-row .lt{display:none;}
  .mg-cols .gp,.mg-row .gp{flex:0 0 90px;}
}

/* 새 기록 : 표 위에 행을 쌓아 한 번에 넣는다 */
.lg-add{margin-top:10px;}
.lg-addbtn{width:100%;background:transparent;border:1px dashed var(--border-strong);
  border-radius:10px;color:var(--text-faint);font-family:var(--sans);font-size:12px;
  padding:9px 0;cursor:pointer;transition:.15s;}
.lg-addbtn:hover{border-color:var(--gold-soft);color:var(--gold-soft);background:rgba(201,162,39,.05);}
.lg-addbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px;}
.lg-addbar .t{font-size:12px;color:var(--text-dim);}
.lg-addbar .t b{color:var(--gold-soft);font-family:var(--mono);}
.lg-addbar .hint{font-size:10.5px;color:var(--text-faint);margin-right:auto;}
.lg-addbar kbd{font-family:var(--mono);font-size:9.5px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:4px;padding:1px 4px;color:var(--text-dim);}
.lg-addghost{background:transparent;border:1px solid var(--border);border-radius:7px;
  color:var(--text-faint);font-family:var(--sans);font-size:11.5px;padding:5px 10px;cursor:pointer;}
.lg-addghost:hover{border-color:var(--border-strong);color:var(--text);}
.lg-addsave{background:var(--gold);border:0;border-radius:7px;color:#1a1508;font-weight:700;
  font-family:var(--sans);font-size:11.5px;padding:6px 14px;cursor:pointer;}
.lg-addsave:disabled{opacity:.5;cursor:default;}
.lg-drs{background:var(--panel);border:1px solid var(--gold-soft);border-radius:10px;overflow:visible;}
.lg-dr{display:flex;align-items:center;gap:9px;padding:5px 12px;
  border-bottom:1px solid var(--border);}
.lg-drs .lg-dr:last-child{border-bottom:0;}
.lg-dr.bad{background:rgba(193,72,63,.08);}
.lg-dr .dt{flex:0 0 116px;}
.lg-dr .ck{flex:0 0 208px;display:flex;align-items:center;gap:6px;min-width:0;}
.lg-dr .ck .lg-kd{flex:0 0 auto;}
.lg-dr .ck select{flex:1;min-width:0;}
.lg-dr .nm{flex:1 1 auto;min-width:0;}
.lg-dr .no{flex:0 0 148px;min-width:0;}
.lg-dr .tg{flex:0 0 62px;display:flex;gap:4px;justify-content:center;align-items:center;}
.lg-dr .gb{flex:0 0 62px;display:flex;justify-content:center;align-items:center;}
.lg-dr .am{flex:0 0 110px;}
.lg-dr .x{flex:0 0 16px;background:none;border:0;color:var(--text-faint);font-size:15px;
  cursor:pointer;padding:0;line-height:1;}
.lg-dr .x:hover{color:var(--red);}
.lg-dr .lg-ed{background:var(--panel-2);height:26px;}
.lg-dr .lg-ed:focus{background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--gold-soft);}
.lg-dr .lg-kd:empty:before,.lg-dr .lg-kd:not([class*="지"]):not([class*="수"]):not([class*="이"]){
  background:rgba(255,255,255,.06);color:var(--text-faint);}
.lg-drerr{font-size:11.5px;color:#e39189;margin:8px 2px 0;}
.lg-dayadd{background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--text-faint);font-size:12px;line-height:1;width:18px;height:18px;
  cursor:pointer;padding:0;opacity:0;transition:opacity .12s;}
.lg-day:hover .lg-dayadd{opacity:1;}
.lg-dayadd:hover{border-color:var(--gold-soft);color:var(--gold-soft);}
@media(max-width:820px){
  .lg-dr{flex-wrap:wrap;gap:5px;padding:9px 10px;}
  .lg-dr .dt{flex:0 0 110px;}
  .lg-dr .ck{flex:1 1 100%;}
  .lg-dr .no{display:none;}
  .lg-dr .nm{flex:1 1 120px;}
  .lg-dayadd{opacity:1;}
}

.lg-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:16px 4px 0;}
.lg-pager{display:flex;gap:4px;}
.lg-pager button{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  border-radius:6px;min-width:28px;height:26px;cursor:pointer;font-family:var(--mono);font-size:11.5px;padding:0 8px;}
.lg-pager button:hover:not(:disabled){border-color:var(--border-strong);color:var(--text);}
.lg-pager button:disabled{opacity:.3;cursor:default;}

#en-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--gold);
  color:#1a1508;padding:10px 17px;border-radius:9px;font-size:13px;font-weight:700;opacity:0;
  transition:.2s ease;pointer-events:none;z-index:250;}
#en-toast.on{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion:reduce){#en-ov *,.en-more{transition:none !important;}}

/* ---------- nav ---------- */
.navbar{
  display:flex;align-items:stretch;gap:22px;
  margin:26px 0 0;
  overflow-x:auto;scrollbar-width:thin;
  border-bottom:2px solid var(--border-strong);
}
.navbar::-webkit-scrollbar{height:5px;}
.navbar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}
.nav-group{display:flex;align-items:center;gap:1px;flex:0 0 auto;}
/* 상위 탭 = 누르는 버튼이 아니라 '분류 라벨'. 하이라이트 없이 형태로만 구분한다. */
.nav-group-label{
  font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.08em;
  color:var(--text-faint);white-space:nowrap;
  padding:3px 9px;margin-right:9px;border-radius:5px;
  background:var(--panel-2);border:1px solid var(--border);
}
.nav-div{flex:0 0 auto;width:1px;background:var(--border);margin:8px 0;}
.nav-btn{
  font-family:var(--sans);font-weight:500;font-size:13px;
  background:transparent;border:none;color:var(--text-faint);
  padding:9px 12px 10px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;
}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);font-weight:700;}
@media (max-width:900px){
  .navbar{gap:14px;margin-top:18px;}
  .nav-group-label{font-size:10px;padding:2px 7px;margin-right:6px;}
  .nav-btn{font-size:12.5px;padding:8px 9px 9px;}
}

/* ---------- stat cards ---------- */
.stat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px;
}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:15px 16px;
}
.stat-card.clickable{cursor:pointer;transition:border-color .15s ease,background .15s ease;}
.stat-card.clickable:hover{border-color:var(--border-strong);background:rgba(255,255,255,0.025);}
.stat-card.clickable .label:after{content:' ›';color:var(--text-faint);font-weight:700;}
.stat-card .label{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.05em;}
.stat-card .value{font-family:var(--sans);font-weight:800;font-size:21px;margin-top:5px;color:var(--text);}
.stat-card .sub{position:relative;font-size:12px;color:var(--text-dim);margin-top:9px;
  font-family:var(--sans);line-height:1.65;padding-left:13px;}
.stat-card .sub:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--text-faint);}
.stat-card .sub b{color:var(--text);font-weight:600;}
.stat-card .sub + .sub{margin-top:3px;}
/* 흐름표 인사이트(.fm-ins)와 동일한 톤 */
.stat-card .sub.up{color:#a8d8bf;}
.stat-card .sub.up:before{background:#7fc0a0;}
.stat-card .sub.down{color:#e6b48f;}
.stat-card .sub.down:before{background:#d9884f;}
.stat-card.sel{border-color:var(--gold-soft);background:rgba(201,162,39,0.06);}
.stat-card.sel .label{color:var(--gold-soft);}
.stat-card .value + .sub{margin-top:10px;}

/* ---------- data table (가계부) ---------- */
.table-controls{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
}
.table-controls input[type="text"]{
  flex:1;min-width:160px;background:var(--panel-2);border:1px solid var(--border-strong);
  color:var(--text);font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:8px 10px;
}
.table-controls select{
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  font-family:var(--sans);font-size:12.5px;border-radius:7px;padding:8px 10px;
}
.table-meta{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{
  text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid var(--border-strong);
  position:sticky;top:0;background:var(--panel);
}
.data-table tbody td{
  padding:9px 8px;border-bottom:1px dotted var(--border);color:var(--text-dim);
  white-space:nowrap;
}
.data-table tbody tr:hover td{background:rgba(255,255,255,0.02);}
.data-table td.amt{font-family:var(--mono);text-align:right;}
.data-table td.amt.income{color:var(--green);}
.data-table td.amt.expense{color:var(--red);}
.data-table td.amt.transfer{color:var(--gold-soft);}
.table-scroll{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
.tag-pill{
  display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;
}
.tag-pill.income{background:var(--green-soft);color:#2b5c42;}
.tag-pill.expense{background:var(--red-soft);color:#8a2f28;}
.tag-pill.transfer{background:rgba(201,162,39,0.18);color:#8a6c15;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
.pager button{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;}
.pager button:disabled{opacity:.35;cursor:default;}

/* ---------- account list (투자 페이지) ---------- */
.acct-row{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--border);font-size:12.5px;
}
.acct-row:last-child{border-bottom:none;}
.acct-name{flex:1;color:var(--text);}
.acct-cat{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
.acct-amt{font-family:var(--mono);color:var(--text);}

/* ---------- gauge ---------- */
.gauge-wrap{position:relative;height:150px;margin-top:4px;}
.gauge-wrap canvas{width:100% !important;height:100% !important;}
.gauge-label{
  position:absolute;left:0;right:0;top:60%;text-align:center;pointer-events:none;
}
.gauge-value{font-family:var(--sans);font-weight:800;font-size:26px;}
.gauge-target{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:2px;}

/* ---------- category flex (pie + bars) ---------- */
.cat-flex{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;}
.cat-flex .pie-col{width:200px;flex-shrink:0;}
.cat-flex .bars-col{flex:1;min-width:220px;}
@media (max-width:600px){
  .cat-flex .pie-col{width:100%;}
}

/* ---------- 3-column grid variant (home allocation/trend/gauge row) ---------- */
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:820px){
  .grid-3{grid-template-columns:1fr;}
}
.grid-4{grid-template-columns:1.3fr 1fr 1fr 1fr;}
/* ---------- 토스 실시간 패널 ---------- */
.grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:820px){
  .grid-2{grid-template-columns:1fr;}
}
.chart-label{font-size:11.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.pie-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;}
.ghost-btn{
  font-family:var(--sans);font-size:12px;color:var(--text-dim);
  background:transparent;border:1px solid var(--border-strong);
  border-radius:6px;padding:6px 14px;cursor:pointer;
}
.ghost-btn:hover{color:var(--text);border-color:var(--gold-soft);}
@media (max-width:820px){
  .grid-4{grid-template-columns:1fr;}
}

/* ---------- checklist checkbox accent ---------- */
.fixed-check{accent-color:var(--gold);}

/* ---------- goal hero ---------- */
.goal-bars{margin-top:16px;max-width:420px;}
.goal-bar-row{display:flex;justify-content:space-between;font-size:12.5px;font-family:var(--mono);color:var(--ink);margin-bottom:4px;}
.goal-bar-row span:first-child{font-family:var(--sans);color:var(--ink-dim);}

/* ---------- month nav ---------- */
.month-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.month-nav select{flex-shrink:0;}
.month-nav button{
  flex-shrink:0;white-space:nowrap;
}
.month-nav button:not(.btn){
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;
}
.month-nav button:disabled{opacity:.3;cursor:default;}
.month-nav .month-label{font-family:var(--mono);font-size:13px;min-width:64px;text-align:center;}

/* ---------- callout / verdict box ---------- */
.callout{
  border-radius:12px;padding:16px 18px;margin-bottom:16px;
  border:1px solid var(--border-strong);
}
.callout.good{background:rgba(76,140,107,0.1);border-color:rgba(76,140,107,0.35);}
.callout.warn{background:rgba(193,72,63,0.1);border-color:rgba(193,72,63,0.35);}
.callout-title{font-family:var(--sans);font-weight:700;font-size:15px;margin-bottom:6px;}
.callout-body{font-size:13px;line-height:1.6;color:var(--text-dim);}

/* ---------- advanced table (group/sort/filter) ---------- */
.at-group{
  border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;
}
.at-group-summary{
  list-style:none;cursor:pointer;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-family:var(--mono);color:var(--text);
  background:var(--panel-2);
}
.at-group-summary::-webkit-details-marker{display:none;}
.at-group-summary span:first-child{font-family:var(--sans);color:var(--text-dim);}

/* ---------- goal cards ---------- */
.goal-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.goal-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;}
.goal-card.ok{background:rgba(76,140,107,0.10);border-color:rgba(76,140,107,0.45);}
.goal-card.no{background:rgba(193,72,63,0.10);border-color:rgba(193,72,63,0.45);}
.goal-card.active{background:rgba(201,162,39,0.08);border-color:rgba(201,162,39,0.4);}
.goal-card.pending{background:var(--panel-2);border-color:var(--border);opacity:0.85;}
.goal-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;flex-wrap:wrap;gap:5px;}
.goal-card-chips{display:flex;gap:5px;flex-wrap:wrap;}
.goal-chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:2px 7px;border-radius:20px;white-space:nowrap;}
.goal-chip-period{background:rgba(201,162,39,0.14);color:var(--gold-soft);}
.goal-chip-cat{background:rgba(91,143,199,0.16);color:#9dc2e8;}
.goal-chip-status{font-weight:600;}
.goal-chip-status.ok{background:rgba(76,140,107,0.18);color:#8fd0ac;}
.goal-chip-status.no{background:rgba(193,72,63,0.18);color:#eb9891;}
.goal-chip-status.active{background:rgba(201,162,39,0.2);color:var(--gold-soft);}
.goal-chip-status.pending{background:rgba(154,163,182,0.14);color:var(--text-dim);}
.goal-chip-status.neutral{background:rgba(154,163,182,0.14);color:var(--text-dim);}
.goal-card-item{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35;}
.goal-card-target{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:3px;}

.goal-progress{margin-top:8px;}
.goal-progress-track{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.goal-progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s;}
.goal-progress-fill.good{background:linear-gradient(90deg,var(--green),#6fb08c);}
.goal-progress-fill.bad{background:linear-gradient(90deg,var(--red),#d9756c);}
.goal-progress-figures{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:4px;}
.mini-goal-head{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.05em;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.mini-goal-list{margin-top:6px;}
.mini-goal-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;}
.mini-goal-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);flex-shrink:0;}
.mini-goal-text{flex:1;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-goal-period{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.vendor-hover-tip{
  display:none;position:fixed;z-index:999;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);pointer-events:auto;
  max-width:280px;font-size:11.5px;
}
.vtip-title{font-family:var(--sans);font-weight:700;font-size:12.5px;color:var(--text);margin-bottom:6px;}
.vtip-scroll{max-height:220px;overflow-y:auto;}
.vtip-row{display:flex;gap:8px;padding:3px 0;color:var(--text-dim);white-space:nowrap;}
.vtip-date{font-family:var(--mono);font-size:10px;color:var(--text-faint);flex-shrink:0;}
.vtip-item{flex:1;overflow:hidden;text-overflow:ellipsis;}
.vtip-amt{font-family:var(--mono);font-size:10.5px;color:var(--red);flex-shrink:0;}
.vtip-empty{color:var(--text-faint);font-size:11px;}

/* 한도형(지출/고정비): 얇은 사용률 바 + 인라인 텍스트 */
.goal-cap{margin-top:8px;display:flex;align-items:center;gap:8px;}
.goal-cap-track{flex:1;height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;}
.goal-cap-fill{height:100%;border-radius:2px;background:var(--gold-soft);}
.goal-cap-fill.over{background:var(--red);}
.goal-cap-text{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);white-space:nowrap;}

/* 비율형(현금비율 등): 바 없이 현재→목표 숫자 비교 배지 */
.goal-ratio{margin-top:8px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;}
.goal-ratio-current{font-weight:700;font-size:15px;}
.goal-ratio-arrow{color:var(--text-faint);font-size:11px;}
.goal-ratio-target{color:var(--text-dim);}


/* =====================================================================
   v2 — 밀도 · 가독성 오버홀
   ===================================================================== */

:root{
  --text-dim:#a9b2c4;
  --text-faint:#8892a6;
  --gap:10px;
}
body{font-variant-numeric:tabular-nums;}

/* ---------- 화면 밀도 ---------- */
#app{padding:0 clamp(12px,1.6vw,26px) 36px;}
.site-header{padding-top:12px;}
.topbar{margin-bottom:0;gap:12px;align-items:center;}
.brand .mark{font-size:19px;}
.brand h1{font-size:18px;}
.brand .tagline{display:none;}
.sync-box{font-size:11.5px;}
.navbar{margin:26px 0 0;gap:22px;}
.nav-btn{padding:9px 12px;font-size:13px;}
#page-content{padding-top:12px;gap:var(--gap);}

.panel{
  padding:12px 13px 13px;
  border-radius:11px;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.panel-title{
  font-size:13.5px;
  margin:0 0 9px;
  gap:8px;
  row-gap:6px;
  align-items:center;
  flex-shrink:0;
}
.panel-title .ptag{
  font-family:var(--mono);font-style:normal;font-size:10.5px;
  color:var(--text-faint);font-weight:400;letter-spacing:.02em;
}
.panel-title .eyebrow{display:none;}

/* ---------- 12칼럼 그리드 ---------- */
.g{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);align-items:stretch;}
.g>.s2{grid-column:span 2}
.g>.s3{grid-column:span 3}
.g>.s4{grid-column:span 4}
.g>.s5{grid-column:span 5}
.g>.s6{grid-column:span 6}
.g>.s7{grid-column:span 7}
.g>.s8{grid-column:span 8}
.g>.s9{grid-column:span 9}
.g>.s10{grid-column:span 10}
.g>.s11{grid-column:span 11}
.g>.s12,.g>.full{grid-column:1 / -1}
.g>*{grid-column:span 12;min-width:0;}
.g>.stat-grid,.g>div>.stat-grid{margin-bottom:0;height:100%;}
/* 패널 안에 다른 내용이 같이 있으면 스탯 그리드를 세로로 늘리지 않는다 (불필요한 공백 방지) */
.g>div>.stat-grid:not(:only-child){height:auto;align-content:start;}
#asset-stats{display:flex;}
#asset-stats .stat-grid{flex:1;width:100%;}
@media (max-width:1240px){
  .g>.s2,.g>.s3{grid-column:span 4}
  .g>.s4,.g>.s5,.g>.s7,.g>.s8{grid-column:span 6}
}
@media (max-width:900px){
  .g>.s2,.g>.s3,.g>.s4,.g>.s5,.g>.s6,.g>.s7,.g>.s8,.g>.s9,.g>.s10,.g>.s11{grid-column:1 / -1}
}
.grid,.grid-top{gap:var(--gap);margin-top:0;}

/* ---------- 카드 내부를 꽉 채우기 ---------- */
.chart-wrap{height:auto;flex:1 1 auto;min-height:148px;}
.chart-wrap.tall{min-height:182px;}
.chart-legend{margin-top:7px;font-size:10.5px;gap:11px;flex-shrink:0;}

/* ---------- 스탯 카드 ---------- */
.stat-grid{
  gap:8px;margin-bottom:var(--gap);
  grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
}
.stat-card{padding:10px 11px;border-radius:9px;}
.stat-card .label{font-size:11px;letter-spacing:0;color:var(--text-faint);}
.stat-card .value{font-size:19px;margin-top:3px;line-height:1.15;}
.stat-card .sub{font-size:11px;margin-top:7px;}

/* ---------- 정렬되는 표/행 ---------- */
.acct-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:6px 0;font-size:12.5px;align-items:center;}
.acct-row>.acct-name{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.acct-cat{font-size:10.5px;}
.acct-amt{text-align:right;white-space:nowrap;}
.alloc-row{padding:6px 0;font-size:12.5px;}
.alloc-pct{width:52px;}
.now-kv{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;font-size:12.5px;}
.chk-row{padding:7px 0;font-size:12.5px;}
.fixed-due{padding:7px 0;}
.data-table{font-size:12px;}
.data-table thead th{padding:6px 7px;font-size:11px;}
.data-table tbody td{padding:6px 7px;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.data-table td.amt{white-space:nowrap;}
.table-scroll{max-height:340px;}
.b-name{width:76px;font-size:12px;}
.b-figures{flex-basis:186px;font-size:11px;}
.budget-row-compact{gap:10px;padding:4px 0;}
.budget-input-compact{font-size:11px;width:62px;}
.subhead{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
#top-expenses-body{padding-left:0;}

/* ---------- 작은 글씨 하한선 ---------- */
.eng-sub,.goal-chip,.now-chip em,.cal-amt,.mcal-none,.dow-cell em,
.goal-progress-figures,.goal-cap-text,.mini-goal-period,.act-ctrl,
.chk-row .nm i,.chk-row .fig em,.eng-node-top .pct,.eng-stage-head span,
.vtip-date,.vtip-amt,.tag-pill,.alloc-amt{font-size:10.5px;}
.settings-note{font-size:11.5px;margin-top:10px;padding-left:12px;}
.empty-state{padding:14px 0;font-size:12px;}

/* ---------- 버튼 · 컨트롤 ---------- */
.range-toggle button{font-size:11px;padding:4px 9px;}
.btn.small{padding:5px 10px;font-size:11.5px;}
.month-nav{gap:6px;}
.month-nav button:not(.btn){width:28px;height:28px;}
.month-nav select,.month-nav input[type="date"]{padding:5px 8px;font-size:12px;}
.income-cat-btn{font-size:11.5px;padding:4px 12px;}
.income-cat-btns{gap:4px;margin-bottom:8px;}
.month-nav-select-standalone{margin:0 0 8px;padding:5px 9px;}

/* ---------- 원본 내역: 기본 접힘 ---------- */
.rawbox{
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
}
.rawbox>summary{
  list-style:none;cursor:pointer;padding:11px 13px;
  font-family:var(--sans);font-weight:700;font-size:13px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.rawbox>summary::-webkit-details-marker{display:none;}
.rawbox>summary::after{content:'＋ 펼치기';font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--text-faint);}
.rawbox[open]>summary::after{content:'− 접기';}
.rawbox>summary:hover{color:var(--text);}
.rawbox>.rawbody{padding:0 13px 13px;}

/* ---------- 캘린더 · 엔진 미세조정 ---------- */
.mcal-cell{min-height:88px;padding:6px 7px;}
.mcal-daynum{font-size:15px;margin-bottom:2px;}
.mcal-line{font-size:12px;}
.cal-cell{min-height:46px;}
.eng-node{padding:7px 8px 8px;}
.eng-amt{font-size:14px;}
.eng-board{margin-top:10px;gap:7px;}
.eng-loop{margin-top:10px;padding:10px 12px;}
.eng-loop .tx{font-size:12px;line-height:1.65;}
.eng-cross{margin-top:9px;}

/* ---------- 목표 카드 ---------- */
.goal-card-grid{grid-template-columns:repeat(auto-fit,minmax(198px,1fr));gap:8px;}
.goal-card{padding:11px 12px;}
.goal-card-item{font-size:13.5px;margin-bottom:4px;}
.goal-card-target{font-size:10.5px;}
.insight{padding:8px 0;font-size:12.5px;line-height:1.5;}

/* ---------- 사이트 푸터 ---------- */
.footer{margin-top:18px;font-size:11px;line-height:1.7;}

/* ---------- 요약 스트립 ---------- */
.note-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;}
.note-strip>span{
  background:var(--panel-2);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;font-size:11.5px;line-height:1.55;color:var(--text-faint);
}
.note-strip em{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;}
.note-strip b{display:block;font-family:var(--mono);font-size:14px;color:var(--text);margin:2px 0 3px;font-weight:600;}


/* ---------- 행 정렬: 칸이 딱딱 맞도록 ---------- */
.chk-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:start;}
.chk-row .fig{min-width:96px;}
.fixed-due{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;}
.fixed-due .amt2{text-align:right;white-space:nowrap;}
.dow-avg-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;}
.dow-avg-row .fig{width:auto;min-width:88px;}
.mini-goal-row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:7px;align-items:center;}
.pie-legend-row{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:7px;align-items:center;}
.pie-legend-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.alloc-row{display:grid;grid-template-columns:10px minmax(0,1fr) 52px auto;gap:8px;align-items:center;}
.ledger-row{padding:7px 0;}
.goal-progress-figures,.allow-legend{font-size:10.5px;}
.chart-legend{row-gap:4px;}
.now-chip{padding:6px 9px;font-size:11.5px;}
.now-chip-row{margin-top:10px;gap:6px;}

/* 패널 안 본문이 남는 공간을 채우도록 */
.panel>[id$="-body"],.panel>[id$="-list"]{min-width:0;}
.table-scroll{border-radius:8px;}

.mininote{margin-top:9px;font-size:11px;color:var(--text-faint);line-height:1.6;}
.mininote>summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);list-style:none;}
.mininote>summary::-webkit-details-marker{display:none;}
.mininote>summary::before{content:'ⓘ ';}
.mininote>summary:hover{color:var(--text-dim);}

/* ---------- 세부 탭 ---------- */
.subnav{display:flex;gap:4px;flex-wrap:wrap;}
.subnav button{
  font-family:var(--sans);font-weight:500;font-size:12.5px;
  background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  padding:7px 15px;border-radius:8px;cursor:pointer;transition:all .15s;
}
.subnav button:hover{color:var(--text);border-color:var(--border-strong);}
.subnav button.active{background:var(--gold);border-color:var(--gold);color:#1a1508;font-weight:700;}
/* 2단 하위 탭 (예: 자산 › 투자 안쪽) — 1단과 헷갈리지 않게 약하게 */
.subnav.sub2{margin-top:-2px;}
.subnav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.subnav-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.subnav.sub2 button{background:transparent;border-color:transparent;font-size:12px;padding:5px 11px;border-radius:20px;}
.subnav.sub2 button:hover{background:var(--panel-2);border-color:var(--border);}
.subnav.sub2 button.active{background:rgba(201,162,39,0.16);border-color:rgba(201,162,39,0.45);color:var(--gold-soft);font-weight:600;}

/* 홈에 편입된 구조 섹션 */
#home-structure{display:flex;flex-direction:column;gap:var(--gap);}
#home-structure:empty{display:none;}

/* ---------- 증식 구조: 진단 + 할 일 ---------- */
.st-diag{justify-content:flex-start;}
