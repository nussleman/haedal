<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>해달 가계부</title>

<!-- iOS 홈 화면 앱 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="해달 가계부" />
<meta name="theme-color" content="#0e121a" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.png" />
<link rel="manifest" href='data:application/manifest+json,{"name":"해달 가계부","short_name":"가계부","start_url":"https://nussleman.github.io/haedal/gagyebu.html","scope":"https://nussleman.github.io/haedal/","display":"standalone","background_color":"%230e121a","theme_color":"%230e121a","icons":[{"src":"https://nussleman.github.io/haedal/icon.png","sizes":"512x512","type":"image/png","purpose":"any"}]}' />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0e121a; --bg-2:#141a25; --panel:#171e2b; --panel-2:#1e2635;
  --border:rgba(233,231,223,0.09); --border-strong:rgba(233,231,223,0.16);
  --text:#eae8e0; --text-dim:#a9b2c4; --text-faint:#8892a6;
  --accent:#c9a227; --accent-text:#e8c96a; --ink-on-accent:#1a1508;
  --income:#4c8c6b; --income-text:#7fc0a0; --income-bg:rgba(76,140,107,0.16);
  --expense:#c1483f; --expense-text:#e08a82; --expense-bg:rgba(193,72,63,0.16);
  --transfer:#39a8bd; --transfer-text:#7ed0de; --transfer-bg:rgba(57,168,189,0.18);
  --save:#7b7fd0; --save-text:#a8abe6; --save-bg:rgba(123,127,208,0.18);
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'Noto Serif KR',serif;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  --vvh:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
/* 화면을 통째로 고정해 두고 안쪽만 굴린다.
   이렇게 해야 스크롤·키보드에 따라 하단 메뉴가 오르락내리락하지 않는다. */
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  position:fixed;left:0;right:0;top:0;bottom:0;
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;}
/* 키보드가 올라온 동안에만 실제 보이는 높이로 줄인다.
   평소에는 bottom:0 으로 화면 맨 아래에 딱 붙는다. */
body.kb{bottom:auto;height:var(--vvh);}

button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;touch-action:manipulation;}
button{cursor:pointer;}
.mono{font-family:var(--mono);}

/* ---------- 상단바 ---------- */
.top{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--border);
  padding:10px 14px;padding-top:calc(10px + var(--top));
  display:flex;align-items:center;gap:8px;}
.top h1{font-family:var(--serif);font-size:17px;margin:0;font-weight:700;}
.top .sub{font-size:11px;color:var(--text-faint);margin-left:2px;}
.top .sp{margin-left:auto;}
.burger{width:38px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:transparent;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5px;}
.burger i{display:block;width:16px;height:1.6px;background:var(--text-dim);border-radius:2px;}
.burger:active i{background:var(--accent-text);}
.topbtn{height:32px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:transparent;color:var(--text-faint);font-size:12px;}

/* ---------- 본문 ---------- */
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 14px 22px;}
main>.inner{max-width:560px;margin:0 auto;}

/* ---------- 아래 고정 영역(키패드 · 저장 · 검색) ---------- */
#dock{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--border);padding:8px 14px 10px;}
#dock:empty{display:none;padding:0;border-top:0;}
#dock .inner{max-width:560px;margin:0 auto;}

/* ---------- 탭바 ---------- */
/* 홈 인디케이터만 피하고 그 외 여백은 두지 않는다 — 화면 맨 아래에 붙어 보이게 */
.tabbar{flex:0 0 auto;display:flex;align-items:center;gap:4px;
  background:var(--bg-2);border-top:1px solid var(--border);
  padding-bottom:max(2px, calc(var(--bot) - 22px));}
.tabbar button.tb{flex:1;background:none;border:0;padding:5px 0 1px;color:var(--text-faint);
  font-size:10px;line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tabbar button.tb .g{font-size:16px;line-height:1;}
.tabbar button.tb.on{color:var(--accent-text);}
.tabbar.ctx{background:var(--panel);}
.tabbar .back{flex:0 0 auto;width:31px;height:31px;margin:3px 2px 3px 8px;border-radius:50%;
  border:1px solid var(--border-strong);background:var(--bg-2);color:var(--text);font-size:15px;line-height:1;}
body.kb .tabbar{display:none;}

/* ---------- 공통 ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;}
.row{display:flex;align-items:center;gap:8px;}
.lab{font-size:12px;color:var(--text-faint);margin:14px 2px 6px;display:block;}
.lab:first-child{margin-top:2px;}
.in{width:100%;height:44px;padding:0 12px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r-md);color:var(--text);}
.in:focus{outline:none;border-color:var(--accent);}
.seg{display:flex;gap:5px;}
.seg button{flex:1;height:36px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--bg-2);color:var(--text-dim);font-size:13.5px;font-weight:500;padding:0;}
.seg button.on{border-color:transparent;font-weight:700;}
.seg button.on[data-k="지출"]{background:var(--expense-bg);color:var(--expense-text);border-color:var(--expense);}
.seg button.on[data-k="수입"]{background:var(--income-bg);color:var(--income-text);border-color:var(--income);}
.seg button.on[data-k="이체"]{background:var(--transfer-bg);color:var(--transfer-text);border-color:var(--transfer);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{height:34px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:var(--bg-2);color:var(--text-dim);font-size:13px;display:inline-flex;align-items:center;gap:5px;}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink-on-accent);font-weight:700;}
.chip.sm{height:30px;font-size:12px;padding:0 10px;}
.chip.sv.on{background:var(--save);border-color:var(--save);color:#fff;}
.tog{height:34px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:transparent;color:var(--text-faint);font-size:13px;}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-text);background:rgba(201,162,39,.1);}
.tog.g[aria-pressed="true"]{border-color:var(--income);color:var(--income-text);background:var(--income-bg);}
.tog.b[aria-pressed="true"]{border-color:var(--expense);color:var(--expense-text);background:var(--expense-bg);}
.empty{text-align:center;color:var(--text-faint);font-size:13px;padding:22px 0;}
.err{color:var(--expense-text);font-size:13px;min-height:0;margin:4px 2px 0;}
.err:empty{margin:0;}

/* ---------- 금액 · 키패드 ---------- */
.amt{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  padding:12px 16px;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;}
.amt b{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-0.5px;}
.amt.zero b{color:var(--text-faint);}
.amt.neg b{color:var(--expense-text);}
.amt.sv b{color:var(--save-text);}
.amt span{font-size:15px;color:var(--text-faint);}
/* ---------- 기록: 한 번에 한 칸 ----------
   위쪽은 지금까지 넣은 것이 줄로 쌓이기만 하고, 손은 아래 도크에서만 움직인다. */
.stack{padding:4px 0 8px;}
.srow{display:flex;align-items:baseline;gap:14px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--border);
  padding:15px 2px;text-align:left;color:var(--text);font-family:var(--sans);}
.srow:last-child{border-bottom:0;}
.srow .sk{flex:0 0 46px;font-size:12px;color:var(--text-faint);}
.srow .sv{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srow .sv.num{font-family:var(--mono);}
.srow .sv.ph{color:var(--text-faint);}
.srow.cur .sv{color:var(--accent-text);}
.srow.cur .sk{color:var(--accent-text);}

/* 도크 안 후보 줄 — 가로로 흘려서 자리를 아낀다 */
.sugs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
.sugs::-webkit-scrollbar{display:none;}
.sugs button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:transparent;color:var(--text-dim);
  font-size:14px;white-space:nowrap;font-family:var(--sans);}
.sugs button.on{border-color:var(--accent);color:var(--accent-text);}
.sugs button.mut{color:var(--text-faint);}
.sugs.v{flex-direction:column;overflow:visible;gap:0;padding-bottom:6px;}
.sugs.v button{height:44px;border:0;border-bottom:1px solid var(--border);
  border-radius:0;text-align:left;padding:0 2px;display:flex;align-items:center;gap:10px;}
.sugs.v button .ct{margin-left:auto;font-size:12px;color:var(--text-faint);}
.drow{display:flex;gap:6px;}
.drow .in{flex:1;}
.drow .go{flex:0 0 66px;height:44px;border:0;border-radius:var(--r-md);
  background:var(--accent);color:var(--ink-on-accent);font-weight:700;font-size:15px;}
.drow .go:disabled{background:var(--panel-2);color:var(--text-faint);}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.pad button{height:46px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel-2);
  font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);}
.pad button:active{background:var(--accent);color:var(--ink-on-accent);}
.pad button.fn{font-family:var(--sans);font-size:15px;color:var(--text-dim);background:var(--bg-2);}
.save{width:100%;height:48px;margin-top:8px;border:0;border-radius:var(--r-md);
  background:var(--accent);color:var(--ink-on-accent);font-size:16px;font-weight:700;}
.save:disabled{opacity:.45;}
.save.sv{background:var(--save);color:#fff;}
.save.inline{margin-top:14px;}

/* ---------- 기록 ---------- */
.steplab{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);margin:13px 2px 7px;}
.steplab b{width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--ink-on-accent);
  font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
.mlist{display:flex;flex-direction:column;gap:5px;margin-top:2px;}
.mrow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--panel);text-align:left;width:100%;}
.mrow:active{background:var(--panel-2);}
.mrow .nm{flex:1 1 auto;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .ct{flex:0 0 auto;font-size:11px;color:var(--text-faint);font-family:var(--mono);
  max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .n{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--text-faint);opacity:.75;}
.mrow mark{background:none;color:var(--accent-text);font-weight:700;}
.newmerch{width:100%;height:40px;border-radius:var(--r-md);
  border:1px dashed var(--accent);background:rgba(201,162,39,.08);color:var(--accent-text);font-size:13.5px;}
.skip{width:100%;height:34px;margin-top:10px;border:0;background:transparent;
  color:var(--text-faint);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;}
.stepbar{display:flex;align-items:center;gap:8px;}
.backchip{flex:1 1 auto;min-width:0;height:38px;padding:0 12px;border-radius:var(--r-md);
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text);
  font-size:14.5px;font-weight:500;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kindpill{flex:0 0 auto;height:38px;padding:0 12px;display:inline-flex;align-items:center;border-radius:var(--r-md);
  font-size:13.5px;font-weight:700;}
.kindpill.e{background:var(--expense-bg);color:var(--expense-text);}
.kindpill.i{background:var(--income-bg);color:var(--income-text);}
.kindpill.t{background:var(--transfer-bg);color:var(--transfer-text);}
.kindpill.s{background:var(--save-bg);color:var(--save-text);}
.ochips{margin-top:8px;}
.ochips .chip{font-family:var(--mono);}
.catpick{width:100%;height:44px;padding:0 13px;display:flex;align-items:center;gap:7px;
  border-radius:var(--r-md);border:1px dashed var(--border-strong);background:var(--bg-2);
  color:var(--text-faint);font-size:14.5px;}
.catpick.on{border-style:solid;border-color:var(--accent);color:var(--text);background:var(--panel);}
.catpick i{margin-left:auto;font-style:normal;font-size:11px;color:var(--text-faint);}
details.more{margin-top:12px;border-top:1px solid var(--border);padding-top:9px;}
details.more summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--text-faint);padding:3px 2px;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::after{content:' ▾';}
details.more[open] summary::after{content:' ▴';}

/* ---------- 월 이동 · 요약 ---------- */
.mnav{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px;}
.mnav button{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--bg-2);color:var(--text-dim);font-size:16px;line-height:1;}
.mnav b{font-family:var(--mono);font-size:15px;min-width:112px;text-align:center;}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.sum3 div{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 9px;text-align:center;}
.sum3 span{display:block;font-size:10.5px;color:var(--text-faint);margin-bottom:2px;}
.sum3 b{font-family:var(--mono);font-size:14.5px;}
.sum3 b.i{color:var(--income-text);} .sum3 b.e{color:var(--expense-text);} .sum3 b.n{color:var(--accent-text);}
.sum3 b.s{color:var(--save-text);}

/* ---------- 내역 (컴팩트) ---------- */
.day{margin-top:12px;}
.day:first-child{margin-top:2px;}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px 4px;
  font-size:11px;color:var(--text-faint);}
.day .dh b{font-family:var(--mono);}
.list{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.it{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border);}
.it:last-child{border-bottom:0;}
.it:active{background:var(--panel-2);}
.it .em{width:20px;text-align:center;font-size:14px;flex:0 0 20px;}
.it .tx{flex:1 1 auto;min-width:0;}
.it .t1{font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.it .t2{font-size:10.5px;line-height:1.3;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.it .v{font-family:var(--mono);font-size:13.5px;flex:0 0 auto;white-space:nowrap;}
.it .v.e{color:var(--expense-text);} .it .v.i{color:var(--income-text);}
.it .v.t{color:var(--transfer-text);} .it .v.s{color:var(--save-text);}
.mk{font-size:9.5px;color:var(--text-faint);margin-left:3px;}

/* ---------- 오늘 ---------- */
.hero{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  padding:16px 16px 14px;text-align:center;}
.hero .k{font-size:12px;color:var(--text-faint);}
.hero .v{font-family:var(--mono);font-size:34px;font-weight:600;margin-top:2px;color:var(--expense-text);}
.hero .s{font-size:12px;color:var(--text-faint);margin-top:3px;}
.pace{display:flex;gap:6px;margin-top:10px;}
.pace div{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
  padding:8px 9px;text-align:center;}
.pace span{display:block;font-size:10.5px;color:var(--text-faint);}
.pace b{font-family:var(--mono);font-size:14px;}

/* ---------- 시트 ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(6,9,14,.72);display:flex;align-items:flex-end;}
.sheet[hidden]{display:none;}
.sheet .box{width:100%;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  border-top:1px solid var(--border-strong);padding:14px 14px calc(var(--bot) + 18px);}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.sheet .sh h3{margin:0;font-size:16px;font-family:var(--serif);}
.sheet .x{margin-left:auto;background:none;border:0;color:var(--text-faint);font-size:22px;line-height:1;padding:2px 6px;}
.del{width:100%;height:42px;margin-top:9px;border-radius:var(--r-md);border:1px solid rgba(193,72,63,.5);
  background:transparent;color:var(--expense-text);font-size:14px;}

/* ---------- 요약 막대 ---------- */
.bar{margin-top:8px;}
.bar:first-child{margin-top:0;}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.bar .bl b{font-family:var(--mono);color:var(--text-dim);}
.bar .bt{height:6px;border-radius:4px;background:var(--bg-2);overflow:hidden;}
.bar .bf{height:100%;border-radius:4px;background:var(--expense);}
.mini{display:flex;align-items:flex-end;gap:5px;height:74px;margin-top:8px;}
.mini div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
.mini i{width:100%;background:var(--expense);border-radius:3px 3px 0 0;display:block;min-height:2px;}
.mini span{font-size:9px;color:var(--text-faint);font-family:var(--mono);}

/* ---------- 목록 관리 ---------- */
.mgtool{display:flex;gap:6px;align-items:center;margin-bottom:9px;}
.mgtool .in{height:40px;}
.mgadd{flex:0 0 auto;height:40px;padding:0 13px;border-radius:var(--r-md);border:1px solid var(--accent);
  background:rgba(201,162,39,.1);color:var(--accent-text);font-size:14px;font-weight:700;}
.dbrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;}
.dbrow:last-child{border-bottom:0;}
.dbrow:active{background:var(--panel-2);}
.dbrow .em{flex:0 0 20px;text-align:center;font-size:14px;}
.dbrow .nm{flex:1 1 auto;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dbrow .sub{font-size:10.5px;color:var(--text-faint);}
.dbrow .tag{flex:0 0 auto;font-size:10px;color:var(--text-faint);font-family:var(--mono);}
.dbrow.off .nm{color:var(--text-faint);text-decoration:line-through;}
.mgnote{font-size:12px;color:var(--text-faint);margin:0 2px 10px;}

/* ---------- 로그인 ---------- */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(22px + var(--top)) 22px calc(22px + var(--bot));}
#lock .box{width:100%;max-width:340px;text-align:center;}
#lock .mark{font-family:var(--serif);font-size:40px;color:var(--accent-text);}
#lock h2{font-family:var(--serif);font-size:20px;margin:6px 0 4px;}
#lock p{font-size:13px;color:var(--text-faint);margin:0 0 18px;}
#lock .in{margin-bottom:8px;text-align:left;}
#lock button{width:100%;height:48px;border:0;border-radius:var(--r-md);background:var(--accent);
  color:var(--ink-on-accent);font-size:16px;font-weight:700;margin-top:6px;}

/* ---------- 토스트 ---------- */
/* 저장 버튼·키패드를 가리지 않도록 위쪽에 띄운다 */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + var(--top));
  z-index:120;background:var(--accent);color:var(--ink-on-accent);font-size:13px;font-weight:700;
  padding:9px 16px;border-radius:var(--r-pill);opacity:0;pointer-events:none;transition:opacity .2s;
  box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:88vw;text-align:center;}
#toast.on{opacity:1;}
</style>
</head>
<body>
<div class="top" id="top" hidden></div>
<main id="main"><div class="empty" style="padding-top:70px;">불러오는 중…</div></main>
<div id="dock"></div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>

<script>
/* ================= 해달 가계부 (모바일) =================
   해달 대시보드와 같은 Supabase 를 쓴다. 기록·수정·삭제가 바로 DB 에 반영되고,
   대시보드는 그 값을 그대로 읽는다. 로그인한 본인 행만 보인다(RLS).

   화면 구조
     기본 탭 : 기록 · 오늘 · 내역 · 요약
     ☰ 전체메뉴로 들어가면 하단이 '← 뒤로 · 사용처 · 분류 · 계좌'로 바뀐다(토스증권 방식).
   기록 화면 위쪽에서 지출·수입·이체를 고른다. */

const SB_URL  = 'https://rjxmrpifrhybucexuvli.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqeG1ycGlmcmh5YnVjZXh1dmxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NjU1OTAsImV4cCI6MjEwMTE0MTU5MH0.xSzE02pjZYqbx9nPLb8RVsQF9w7hJHEx2cO0JDOLLSU';

let SB = null;
async function sb() {
  if (SB) return SB;
  const mod = await import('https://esm.sh/@supabase/supabase-js@2');
  SB = mod.createClient(SB_URL, SB_ANON);
  return SB;
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const comma = (n) => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const todayKey = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const monthOf = (k) => String(k).slice(0, 7);
const nowMonth = () => monthOf(todayKey());
const shiftMonth = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const monthLabel = (m) => `${m.slice(0, 4)}년 ${+m.slice(5, 7)}월`;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const dayLabel = (k) => { const d = new Date(k + 'T00:00:00'); return `${+k.slice(5, 7)}월 ${+k.slice(8, 10)}일 (${DOW[d.getDay()]})`; };
const monthRange = (m) => [m + '-01', shiftMonth(m, 1) + '-01'];

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

/* 키보드가 올라와도 화면 아래가 흔들리지 않게 실제 보이는 높이를 직접 잡아 준다 */
(function fixViewport() {
  const vv = window.visualViewport;
  const set = () => {
    if (!vv) return;
    const kb = (window.innerHeight - vv.height) > 120;
    document.documentElement.style.setProperty('--vvh', vv.height + 'px');
    document.body.style.top = kb ? vv.offsetTop + 'px' : '0px';
    document.body.classList.toggle('kb', kb);
  };
  if (vv) { vv.addEventListener('resize', set); vv.addEventListener('scroll', set); }
  window.addEventListener('orientationchange', () => setTimeout(set, 250));
  set();
})();

const S = {
  ctx: 'main',              /* main | menu */
  tab: 'add',               /* main: add|today|list|sum   menu: merch|cat|acct */
  cats: [], merchants: [], merchStats: {},
  month: nowMonth(), tx: [],
  listFilter: 'all',
  loaded: false,
  d: null,                  /* 기록 입력값 */
  edit: null,               /* 기록 수정 */
  mg: { q: '', catKind: '지출', edit: null, busy: false }
};
/* step 1 사용처 → 2 분류 → 3 금액 → 4 날짜·기록.
   kind(지출·수입·이체)는 분류 안에 들어있으므로 따로 고르지 않는다.
   계좌는 저장하지 않으므로 화면에서도 뺐다. */
function freshDraft() {
  return { step: 1, reach: 1, kind: '지출', amount: '', neg: false, catId: null, cat: null,
           merchant: '', noMerch: false, note: '', noteOpen: false, date: todayKey(),
           good: null, fixed: false, co: false, focusMerch: false };
}
const STEP_KEYS = ['사용처', '분류', '금액', '날짜'];
S.d = freshDraft();

/* ---------------- 기준 데이터 ---------------- */
async function loadRefs() {
  const c = await sb();
  const [cats, merch, recent] = await Promise.all([
    c.from('categories').select('id,kind,category,subcategory,emoji_kind,emoji_category,sort_order,is_active').order('sort_order'),
    c.from('merchants').select('id,name,merchant_group,is_fixed').order('name'),
    c.from('transactions').select('merchant,category_id,date,amount').not('merchant', 'is', null).order('date', { ascending: false }).limit(1200)
  ]);
  if (cats.error) throw new Error(cats.error.message);
  S.cats = (cats.data || []).filter(x => x.is_active !== false);
  S.allCats = cats.data || [];
  S.merchants = merch.data || [];
  buildMerchStats(recent.data || []);
  S.loaded = true;
}

/* 사용처별 통계 — 얼마나 자주 썼는지, '가장 많이 쓴' 분류, 자주 찍은 금액.
   고르면 분류(=수입·지출·이체)가 자동으로 따라오고 금액도 한 번에 넣을 수 있다.
   웹과 같은 기준으로 최빈 분류를 쓴다 — 한 번의 예외 때문에 종류가 바뀌면 안 되니까. */
function buildMerchStats(recent) {
  const st = {};
  recent.forEach(r => {
    const n = (r.merchant || '').trim();
    if (!n) return;
    const o = st[n] || (st[n] = { name: n, count: 0, catCnt: {}, catId: null, amounts: [], last: r.date });
    o.count++;
    if (r.category_id) o.catCnt[r.category_id] = (o.catCnt[r.category_id] || 0) + 1;
    const a = Math.abs(Number(r.amount) || 0);
    if (a) o.amounts.push(a);
    if (!o.last || r.date > o.last) o.last = r.date;
  });
  Object.values(st).forEach(o => {
    let best = null, n = -1;
    Object.keys(o.catCnt).forEach(cid => { if (o.catCnt[cid] > n) { n = o.catCnt[cid]; best = Number(cid); } });
    o.catId = best;
  });
  /* 사용처 표에만 있고 아직 기록이 없는 것도 목록에 띄운다 */
  S.merchants.forEach(x => { if (!st[x.name]) st[x.name] = { name: x.name, count: 0, catCnt: {}, catId: null, amounts: [], last: '' }; });
  S.merchStats = st;
}

async function loadMonth() {
  const c = await sb();
  const [from, to] = monthRange(S.month);
  const tx = await c.from('transactions')
    .select('id,date,category_id,amount,merchant,merchant_group,note,good_bad,is_fixed,company_paid')
    .gte('date', from).lt('date', to).order('date', { ascending: false }).order('id', { ascending: false });
  S.tx = tx.data || [];
}

const catById = (id) => S.cats.find(x => x.id === id) || (S.allCats || []).find(x => x.id === id);
const kindOf = (id) => { const c = catById(id); return c ? c.kind : '지출'; };
const kindCls = (k) => k === '수입' ? 'i' : k === '이체' ? 't' : 'e';
const catLabel = (id) => { const c = catById(id); return c ? `${c.category} › ${c.subcategory}` : '분류 없음'; };
const catEmoji = (id) => { const c = catById(id); return (c && (c.emoji_category || c.emoji_kind)) || '·'; };
const merchOf = (name) => S.merchants.find(x => x.name === name);

/* ================= 화면 뼈대 ================= */
const MAIN_TABS = [['add', '✏️', '기록'], ['today', '☀️', '오늘'], ['list', '📒', '내역'], ['sum', '📊', '요약']];
const MENU_TABS = [['merch', '🏷️', '사용처'], ['cat', '🗂️', '분류'], ['acct', '🏦', '계좌']];

function render() {
  const top = $('#top');
  top.hidden = false;
  top.innerHTML = S.ctx === 'menu'
    ? `<h1>전체메뉴</h1><span class="sub">목록 관리</span><span class="sp"></span>
       <button class="topbtn" id="t-out">로그아웃</button>`
    : `<h1>해달 가계부</h1><span class="sp"></span>
       <button class="burger" id="t-menu" aria-label="전체메뉴"><i></i><i></i><i></i></button>`;
  const mb = $('#t-menu');
  if (mb) mb.addEventListener('click', () => { S.ctx = 'menu'; S.tab = 'merch'; render(); });
  const ob = $('#t-out');
  if (ob) ob.addEventListener('click', async () => { (await sb()).auth.signOut(); location.reload(); });

  const bar = $('#tabbar');
  bar.hidden = false;
  bar.className = 'tabbar' + (S.ctx === 'menu' ? ' ctx' : '');
  const tabs = S.ctx === 'menu' ? MENU_TABS : MAIN_TABS;
  bar.innerHTML = (S.ctx === 'menu' ? '<button class="back" id="tb-back" aria-label="뒤로">←</button>' : '')
    + tabs.map(([id, g, l]) =>
      `<button class="tb" data-t="${id}" class="${S.tab === id ? 'on' : ''}"><span class="g">${g}</span>${l}</button>`).join('');
  $$('.tb', bar).forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  bar.onclick = (e) => {
    if (e.target.closest('#tb-back')) { S.ctx = 'main'; S.tab = 'add'; render(); return; }
    const b = e.target.closest('button[data-t]'); if (!b) return;
    S.tab = b.dataset.t; scrollTop(); render();
  };
  renderTab();
}
function scrollTop() { const m = $('#main'); if (m) m.scrollTop = 0; }

function renderTab() {
  const m = $('#main');
  const dock = $('#dock');
  if (!m) return;
  dock.innerHTML = '';
  m.innerHTML = '<div class="inner"></div>';
  const inner = $('.inner', m);
  if (S.ctx === 'menu') {
    if (S.tab === 'cat') renderCatDB(inner);
    else if (S.tab === 'acct') renderAcctDB(inner);
    else renderMerchDB(inner);
    return;
  }
  if (S.tab === 'add') renderAdd(inner, dock);
  else if (S.tab === 'today') renderToday(inner);
  else if (S.tab === 'list') renderList(inner);
  else renderSum(inner);
}

/* ---------------- 키패드 ---------------- */
function padHtml(id) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
  return `<div class="pad" id="${id}">
    ${keys.map(k => `<button data-k="${k}">${k}</button>`).join('')}
    <button class="fn" data-k="00">00</button>
    <button data-k="0">0</button>
    <button class="fn" data-k="del">⌫</button>
  </div>`;
}
function bindPad(id, get, set, after) {
  const el = $('#' + id); if (!el) return;
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const k = b.dataset.k;
    let v = get();
    if (k === 'del') v = v.slice(0, -1);
    else if (v.length < 11) v = (v === '' && k === '00') ? '' : v + k;
    set(v.replace(/^0+(?=\d)/, ''));
    after();
  });
}
function amtHtml(v, neg, cls) {
  return `<div class="amt ${v ? '' : 'zero'} ${neg ? 'neg' : ''} ${cls || ''}">
    <b>${neg && v ? '−' : ''}${v ? Number(v).toLocaleString('ko-KR') : '0'}</b><span>원</span></div>`;
}
/* 키패드를 누를 때 화면 전체를 다시 그리면 메모 같은 입력칸의 한글 조합이 끊긴다.
   그래서 금액 표시와 저장 버튼만 갈아 끼운다. */
function paintAmtBox(sel, v, neg, cls) {
  const box = $(sel);
  if (!box) return;
  box.className = 'amt' + (v ? '' : ' zero') + (neg ? ' neg' : '') + (cls ? ' ' + cls : '');
  box.innerHTML = `<b>${neg && v ? '−' : ''}${v ? Number(v).toLocaleString('ko-KR') : '0'}</b><span>원</span>`;
}
function todayStat() {
  const k = todayKey();
  const rows = S.tx.filter(r => r.date === k);
  return { n: rows.length, exp: rows.reduce((a, r) => a + (kindOf(r.category_id) === '지출' ? Number(r.amount) : 0), 0) };
}

/* 사용처를 고르면 지난번 분류를 그대로 데려온다 — 분류가 정해지면 종류도 같이 정해진다 */
function pickMerch(name) {
  const d = S.d;
  d.merchant = name;
  d.noMerch = !name;
  const st = S.merchStats[name];
  if (st && st.catId && catById(st.catId)) {
    const c = catById(st.catId);
    d.kind = c.kind; d.cat = c.category; d.catId = st.catId;
  }
  const mm = merchOf(name);
  if (mm && mm.is_fixed) d.fixed = true;
  d.step = d.catId ? 3 : 2;     // 분류가 이미 잡혔으면 건너뛴다
  renderTab();
}

function goStep(n) { S.d.step = n; S.d.focusMerch = (n === 1); renderTab(); }

/* 그 사용처에서 자주 찍었던 금액 */
function oftenAmounts() {
  const st = S.merchStats[S.d.merchant.trim()];
  if (!st || !st.amounts.length) return [];
  const cnt = {};
  st.amounts.forEach(a => { cnt[a] = (cnt[a] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1] || b[0] - a[0]).slice(0, 4).map(x => Number(x[0]));
}

function dateLabel(k) {
  const t = todayKey();
  if (k === t) return '오늘';
  const d0 = new Date(t + 'T00:00:00'), d1 = new Date(k + 'T00:00:00');
  const g = Math.round((d0 - d1) / 86400000);
  if (g === 1) return '어제';
  if (g === 2) return '그저께';
  return dayLabel(k);
}
function shiftDay(n) {
  const dt = new Date();
  dt.setDate(dt.getDate() + n);
  dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
  return dt.toISOString().slice(0, 10);
}

/* ---------------- 기록 ---------------- */
function renderAdd(m, dock) {
  const d = S.d;
  /* 되돌아가도 이미 넣은 뒷줄은 그대로 보이게 — 도달한 최대 단계까지 그린다 */
  d.reach = Math.max(d.reach || 1, d.step);
  const val = [
    d.noMerch ? '사용처 없음' : d.merchant.trim(),
    d.catId ? catLabel(d.catId) : '',
    d.amount ? comma(d.neg ? -Number(d.amount) : Number(d.amount)) + '원' : '',
    dateLabel(d.date)
  ];
  const tags = [d.neg ? '환불' : '', d.fixed ? '고정비' : '', d.co ? '회사' : '',
                d.good === 'Good' ? '좋은 지출' : d.good === 'Bad' ? '아쉬운 지출' : '',
                d.note.trim()].filter(Boolean);

  m.innerHTML = `<div class="stack">
    ${STEP_KEYS.map((k, i) => {
      const n = i + 1;
      if (n > d.reach) return '';
      const filled = !!val[i];
      return `<button class="srow${n === d.step ? ' cur' : ''}" data-s="${n}">
        <span class="sk">${k}</span>
        <span class="sv${i >= 2 ? ' num' : ''}${filled ? '' : ' ph'}">${esc(filled ? val[i] : '…')}</span>
      </button>`;
    }).join('')}
    ${d.reach === 4 && tags.length
      ? `<button class="srow" data-s="4"><span class="sk">표시</span>
           <span class="sv">${esc(tags.join(' · '))}</span></button>` : ''}
  </div>
  <p class="err" id="f-err"></p>`;

  m.querySelectorAll('[data-s]').forEach(b =>
    b.addEventListener('click', () => goStep(Number(b.dataset.s))));

  if (d.step === 1) return dockMerch(dock);
  if (d.step === 2) return dockCat(dock);
  if (d.step === 3) return dockAmount(dock);
  return dockDate(dock);
}

/* --- 1. 사용처 --- */
function dockMerch(dock) {
  const d = S.d;
  dock.innerHTML = `<div class="inner">
    <div class="sugs v" id="f-sugs"></div>
    <div class="drow">
      <input class="in" id="f-merch" placeholder="사용처" autocomplete="off"
             autocapitalize="off" enterkeyhint="next" value="${esc(d.merchant)}">
      <button class="go" id="f-mgo">다음</button>
    </div>
  </div>`;
  paintMerchSugs();

  const mi = $('#f-merch');
  /* 한글은 여러 input 이벤트로 한 글자가 조합된다 — 입력칸은 다시 그리지 않고 목록만 간다 */
  const sync = () => { d.merchant = mi.value; paintMerchSugs(); };
  mi.addEventListener('input', sync);
  mi.addEventListener('compositionupdate', sync);
  mi.addEventListener('compositionend', sync);
  mi.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    pickMerch(mi.value.trim());
  });
  $('#f-mgo').addEventListener('click', () => pickMerch($('#f-merch').value.trim()));
  if (d.focusMerch) { d.focusMerch = false; setTimeout(() => { const e2 = $('#f-merch'); if (e2) e2.focus(); }, 30); }
}

function paintMerchSugs() {
  const host = $('#f-sugs');
  if (!host) return;
  const q = S.d.merchant.trim().toLowerCase();
  let list = Object.values(S.merchStats);
  if (q) list = list.filter(x => x.name.toLowerCase().includes(q));
  list = list.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ko')).slice(0, 5);
  const exact = q && list.some(x => x.name.toLowerCase() === q);

  host.innerHTML =
    list.map(x => `<button data-m="${esc(x.name)}">${esc(x.name)}
        ${x.catId ? `<span class="ct">${esc(catLabel(x.catId))}</span>` : ''}</button>`).join('')
    + (q && !exact ? `<button data-m="${esc(S.d.merchant.trim())}">'${esc(S.d.merchant.trim())}' 새로</button>` : '')
    + `<button data-m="" class="mut">사용처 없이</button>`;
  host.querySelectorAll('[data-m]').forEach(b =>
    b.addEventListener('click', () => pickMerch(b.dataset.m)));
}

/* --- 2. 분류 --- */
function dockCat(dock) {
  const d = S.d;
  const cur = d.catId ? catById(d.catId) : null;
  const groups = [...new Set(S.cats.map(c => c.category))];
  const openGroup = d.cat || (cur ? cur.category : groups[0]);
  const subs = S.cats.filter(c => c.category === openGroup);

  dock.innerHTML = `<div class="inner">
    <div class="sugs" id="f-groups">${groups.map(g =>
      `<button data-g="${esc(g)}" class="${g === openGroup ? 'on' : ''}">${esc(g)}</button>`).join('')}</div>
    <div class="sugs" id="f-subs">${subs.map(c =>
      `<button data-c="${c.id}" class="${d.catId === c.id ? 'on' : ''}">${esc(c.subcategory)}</button>`).join('')}</div>
  </div>`;

  $$('[data-g]', dock).forEach(b => b.addEventListener('click', () => { d.cat = b.dataset.g; renderTab(); }));
  $$('[data-c]', dock).forEach(b => b.addEventListener('click', () => {
    d.catId = Number(b.dataset.c);
    const c = catById(d.catId);
    if (c) { d.kind = c.kind; d.cat = c.category; }
    d.step = 3; renderTab();
  }));
}

/* --- 3. 금액 --- */
function dockAmount(dock) {
  const d = S.d;
  const often = oftenAmounts();
  dock.innerHTML = `<div class="inner">
    ${often.length ? `<div class="sugs">${often.map(a =>
      `<button data-a="${a}">${comma(a)}</button>`).join('')}</div>` : ''}
    ${padHtml('pad1')}

  </div>`;

  $$('[data-a]', dock).forEach(b => b.addEventListener('click', () => {
    d.amount = b.dataset.a; d.step = 4; renderTab();
  }));

}

/* --- 4. 날짜 · 기록 --- */
function dockDate(dock) {
  const d = S.d;
  const days = [[0, '오늘'], [-1, '어제'], [-2, '그저께']];
  dock.innerHTML = `<div class="inner">
    <div class="sugs">
      ${days.map(([n, l]) => `<button data-d="${n}" class="${d.date === shiftDay(n) ? 'on' : ''}">${l}</button>`).join('')}
      <button data-t="neg" class="${d.neg ? 'on' : 'mut'}">환불</button>
      <button data-t="fixed" class="${d.fixed ? 'on' : 'mut'}">고정비</button>
      <button data-t="co" class="${d.co ? 'on' : 'mut'}">회사</button>
      <button data-t="good" class="${d.good === 'Good' ? 'on' : 'mut'}">좋은</button>
      <button data-t="bad" class="${d.good === 'Bad' ? 'on' : 'mut'}">아쉬운</button>
      <button data-t="note" class="${d.noteOpen || d.note ? 'on' : 'mut'}">메모</button>
    </div>
    ${d.noteOpen ? `<input class="in" id="f-note" placeholder="메모" value="${esc(d.note)}" style="margin-bottom:8px;">` : ''}
    <button class="save" id="f-save">기록하기</button>
  </div>`;

  $$('[data-d]', dock).forEach(b => b.addEventListener('click', () => {
    d.date = shiftDay(Number(b.dataset.d)); renderTab();
  }));
  $$('[data-t]', dock).forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.t;
    if (t === 'neg') d.neg = !d.neg;
    else if (t === 'fixed') d.fixed = !d.fixed;
    else if (t === 'co') d.co = !d.co;
    else if (t === 'good') d.good = d.good === 'Good' ? null : 'Good';
    else if (t === 'bad') d.good = d.good === 'Bad' ? null : 'Bad';
    else if (t === 'note') d.noteOpen = !d.noteOpen;
    renderTab();
  }));
  const nt = $('#f-note');
  if (nt) { nt.addEventListener('input', (e) => { d.note = e.target.value; }); nt.focus(); }
  $('#f-save').addEventListener('click', saveDraft);
}

async function saveDraft() {
  const d = S.d;
  const n = Number(d.amount || 0);
  const err = $('#f-err');
  if (!n) { err.textContent = '금액을 넣으세요.'; d.step = 3; renderTab(); return; }
  if (!d.catId) { err.textContent = '분류를 고르세요.'; d.step = 2; renderTab(); return; }
  err.textContent = '';
  const btn = $('#f-save'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const c = await sb();
    const g = merchOf(d.merchant.trim());
    const { error } = await c.from('transactions').insert({
      date: d.date,
      category_id: d.catId,
      amount: d.neg ? -n : n,
      merchant: d.merchant.trim() || null,
      merchant_group: g ? g.merchant_group : null,
      note: d.note.trim() || null,
      good_bad: d.good,
      company_paid: d.co,
      is_fixed: d.fixed
    });
    if (error) throw new Error(error.message);
    const nm = d.merchant.trim();
    if (nm) {
      const o = S.merchStats[nm] || (S.merchStats[nm] = { name: nm, count: 0, catCnt: {}, catId: null, amounts: [], last: d.date });
      o.count++; o.catCnt[d.catId] = (o.catCnt[d.catId] || 0) + 1; o.catId = d.catId;
      o.amounts.unshift(n); o.last = d.date;
    }
    toast(comma(n) + '원 기록했습니다');
    const keep = { date: d.date, kind: d.kind };
    S.d = freshDraft();
    S.d.date = keep.date; S.d.kind = keep.kind; S.d.focusMerch = true;   // 사용처 칸으로 되돌아간다
    if (monthOf(keep.date) !== S.month) S.month = monthOf(keep.date);
    await loadMonth();
    renderTab();
  } catch (e) {
    err.textContent = '저장하지 못했습니다 — ' + (e.message || e);
    btn.disabled = false;
  }
}

/* ---------------- 오늘 ---------------- */

  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

      <div><span>하루 평균</span><b>${comma(perDay)}</b></div>

  $$('[data-tx]', m).forEach(b => b.addEventListener('click', () => openEdit(Number(b.dataset.tx))));
}

/* ---------------- 내역 ---------------- */
function monthTotals() {
  let inc = 0, exp = 0;
  S.tx.forEach(r => {
    const k = kindOf(r.category_id);
    if (k === '수입') inc += Number(r.amount);
    else if (k === '지출') exp += Number(r.amount);
  });
  return { inc, exp, net: inc - exp };
}

function mnavHtml() {
  return `<div class="mnav">
    <button data-mn="-1">‹</button><b>${monthLabel(S.month)}</b><button data-mn="1">›</button>
  </div>`;
}
function bindMnav(m) {
  $$('[data-mn]', m).forEach(b => b.addEventListener('click', async () => {
    S.month = shiftMonth(S.month, Number(b.dataset.mn));
    await loadMonth(); renderTab();
  }));
}

const LIST_FILTERS = [['all', '전체'], ['지출', '지출'], ['수입', '수입'], ['이체', '이체']];

function renderList(m) {
  const t = monthTotals();
  const f = S.listFilter;
  const items = S.tx.filter(r => f === 'all' || kindOf(r.category_id) === f);
  const days = [...new Set(items.map(r => r.date))].sort().reverse();

  m.innerHTML = `
    ${mnavHtml()}
    <div class="sum3">
      <div><span>수입</span><b class="i">${comma(t.inc)}</b></div>
      <div><span>지출</span><b class="e">${comma(t.exp)}</b></div>
      <div><span>순액</span><b class="n">${comma(t.net)}</b></div>
    </div>
    <div class="chips" style="margin-bottom:4px;">${LIST_FILTERS.map(([v, l]) =>
      `<button class="chip sm ${f === v ? 'on' : ''}" data-f="${v}">${l}</button>`).join('')}</div>
    ${days.length ? days.map(dk => {
      const rows = items.filter(r => r.date === dk);
      const dayExp = rows.reduce((a, r) => a + (kindOf(r.category_id) === '지출' ? Number(r.amount) : 0), 0);
      return `<div class="day">
        <div class="dh"><span>${dayLabel(dk)}</span><b>${dayExp ? '지출 ' + comma(dayExp) : ''}</b></div>
        <div class="list">${rows.map(r => txRow(r)).join('')}</div>
      </div>`;
    }).join('') : '<div class="empty">기록이 없습니다.</div>'}`;

  bindMnav(m);
  $$('[data-f]', m).forEach(b => b.addEventListener('click', () => { S.listFilter = b.dataset.f; scrollTop(); renderTab(); }));
  $$('[data-tx]', m).forEach(b => b.addEventListener('click', () => openEdit(Number(b.dataset.tx))));
}

function txRow(r, withDate) {
  const k = kindOf(r.category_id);
  const marks = (r.is_fixed ? '<span class="mk">📌</span>' : '') + (r.company_paid ? '<span class="mk">🏢</span>' : '')
    + (r.good_bad === 'Good' ? '<span class="mk">👍</span>' : r.good_bad === 'Bad' ? '<span class="mk">👎</span>' : '');
  const sub = (withDate ? r.date.slice(5).replace('-', '.') + ' · ' : '') + catLabel(r.category_id) + (r.note ? ' · ' + r.note : '');
  return `<div class="it" data-tx="${r.id}">
    <span class="em">${catEmoji(r.category_id)}</span>
    <span class="tx">
      <div class="t1">${esc(r.merchant || catLabel(r.category_id))}${marks}</div>
      <div class="t2">${esc(sub)}</div>
    </span>
    <span class="v ${kindCls(k)}">${k === '지출' ? '−' : k === '수입' ? '+' : ''}${comma(Math.abs(Number(r.amount)))}</span>
  </div>`;
}
/* ---------------- 기록 수정 시트 ---------------- */
function sheetOpen(html) {
  const sh = $('#sheet');
  sh.hidden = false;
  sh.innerHTML = html;
  sh.onclick = (e) => { if (e.target === sh) sheetClose(); };
}
function sheetClose() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; S.edit = null; S.mg.edit = null; }

function openEdit(id) {
  const r = S.tx.find(x => x.id === id);
  if (!r) return;
  S.edit = { ...r, amount: String(Math.abs(Number(r.amount))), neg: Number(r.amount) < 0 };
  drawEdit();
}

function drawEdit() {
  const e = S.edit;
  const c = catById(e.category_id);
  const kind = c ? c.kind : '지출';
  const cats = S.cats.filter(x => x.kind === kind);
  const groups = [...new Set(cats.map(x => x.category))];
  const openGroup = e._g || (c ? c.category : groups[0]);
  const subs = cats.filter(x => x.category === openGroup);

  sheetOpen(`
    <div class="box">
      <div class="sh"><h3>기록 수정</h3><button class="x" id="e-x">×</button></div>
      ${amtHtml(e.amount, e.neg)}
      <div style="margin-top:9px;">${padHtml('pad2')}</div>
      <span class="lab">분류</span>
      <div class="chips">${groups.map(g =>
        `<button class="chip sm" data-eg="${esc(g)}" ${g === openGroup ? 'style="border-color:var(--accent);color:var(--accent-text);"' : ''}>${esc(g)}</button>`).join('')}</div>
      <div class="chips" style="margin-top:7px;">${subs.map(x =>
        `<button class="chip ${e.category_id === x.id ? 'on' : ''}" data-ec="${x.id}">${x.emoji_category || ''} ${esc(x.subcategory)}</button>`).join('')}</div>
      <span class="lab">사용처</span>
      <input class="in" id="e-merch" value="${esc(e.merchant || '')}">
      <span class="lab">날짜</span>
      <input class="in" type="date" id="e-date" value="${e.date}">
      <span class="lab">메모</span>
      <input class="in" id="e-note" value="${esc(e.note || '')}">
      <div class="row" style="margin-top:9px;flex-wrap:wrap;gap:6px;">
        <button class="tog" id="e-neg" aria-pressed="${!!e.neg}">− 환불</button>
        <button class="tog" id="e-fx" aria-pressed="${!!e.is_fixed}">📌 고정비</button>
        <button class="tog" id="e-co" aria-pressed="${!!e.company_paid}">🏢 회사</button>
        <button class="tog g" id="e-good" aria-pressed="${e.good_bad === 'Good'}">👍</button>
        <button class="tog b" id="e-bad" aria-pressed="${e.good_bad === 'Bad'}">👎</button>
      </div>
      <button class="save inline" id="e-save">저장</button>
      <button class="del" id="e-del">삭제</button>
    </div>`);

  bindPad('pad2', () => e.amount, (v) => { e.amount = v; }, () => paintAmtBox('#sheet .amt', e.amount, e.neg, ''));
  $('#e-x').addEventListener('click', sheetClose);
  $$('[data-eg]').forEach(b => b.addEventListener('click', () => { e._g = b.dataset.eg; drawEdit(); }));
  $$('[data-ec]').forEach(b => b.addEventListener('click', () => { e.category_id = Number(b.dataset.ec); drawEdit(); }));
  $('#e-merch').addEventListener('input', (x) => { e.merchant = x.target.value; });
  $('#e-date').addEventListener('change', (x) => { e.date = x.target.value; });
  $('#e-note').addEventListener('input', (x) => { e.note = x.target.value; });
  $('#e-neg').addEventListener('click', () => { e.neg = !e.neg; drawEdit(); });
  $('#e-fx').addEventListener('click', () => { e.is_fixed = !e.is_fixed; drawEdit(); });
  $('#e-co').addEventListener('click', () => { e.company_paid = !e.company_paid; drawEdit(); });
  $('#e-good').addEventListener('click', () => { e.good_bad = e.good_bad === 'Good' ? null : 'Good'; drawEdit(); });
  $('#e-bad').addEventListener('click', () => { e.good_bad = e.good_bad === 'Bad' ? null : 'Bad'; drawEdit(); });
  $('#e-save').addEventListener('click', saveEdit);
  $('#e-del').addEventListener('click', delEdit);
}

async function saveEdit() {
  const e = S.edit;
  const n = Number(e.amount || 0);
  if (!n) { toast('금액을 입력하세요'); return; }
  const btn = $('#e-save'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const g = merchOf((e.merchant || '').trim());
    const { error } = await (await sb()).from('transactions').update({
      date: e.date, category_id: e.category_id, amount: e.neg ? -n : n,
      merchant: (e.merchant || '').trim() || null,
      merchant_group: g ? g.merchant_group : null,
      note: (e.note || '').trim() || null,
      good_bad: e.good_bad || null, is_fixed: !!e.is_fixed, company_paid: !!e.company_paid
    }).eq('id', e.id);
    if (error) throw new Error(error.message);
    sheetClose(); await loadMonth(); renderTab(); toast('수정했습니다');
  } catch (err) {
    toast('저장 실패 — ' + (err.message || err));
    btn.disabled = false; btn.textContent = '저장';
  }
}
async function delEdit() {
  if (!confirm('이 기록을 삭제할까요?')) return;
  try {
    const { error } = await (await sb()).from('transactions').delete().eq('id', S.edit.id);
    if (error) throw new Error(error.message);
    sheetClose(); await loadMonth(); renderTab(); toast('삭제했습니다');
  } catch (e) { toast('삭제 실패 — ' + (e.message || e)); }
}

/* ---------------- 요약 ---------------- */
let SUM6 = null;
async function loadSum6() {
  const c = await sb();
  const from = shiftMonth(S.month, -5) + '-01';
  const to = shiftMonth(S.month, 1) + '-01';
  const { data } = await c.from('transactions').select('date,category_id,amount').gte('date', from).lt('date', to);
  const by = {};
  (data || []).forEach(r => {
    if (kindOf(r.category_id) !== '지출') return;
    const m = monthOf(r.date);
    by[m] = (by[m] || 0) + Number(r.amount);
  });
  SUM6 = { by, months: Array.from({ length: 6 }, (_, i) => shiftMonth(S.month, -5 + i)) };
}

function renderSum(m) {
  const t = monthTotals();
  const rate = t.inc > 0 ? Math.round((t.inc - t.exp) / t.inc * 100) : null;
  const byCat = {};
  S.tx.forEach(r => {
    if (kindOf(r.category_id) !== '지출') return;
    const c = catById(r.category_id);
    const k = c ? c.category : '기타';
    byCat[k] = (byCat[k] || 0) + Number(r.amount);
  });
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const max = top.length ? top[0][1] : 1;
  const fixed = S.tx.reduce((a, r) => a + (r.is_fixed && kindOf(r.category_id) === '지출' ? Number(r.amount) : 0), 0);

  m.innerHTML = `
    ${mnavHtml()}
    <div class="sum3">
      <div><span>수입</span><b class="i">${comma(t.inc)}</b></div>
      <div><span>지출</span><b class="e">${comma(t.exp)}</b></div>
      <div><span>순액</span><b class="n">${comma(t.net)}</b></div>
    </div>
    <div class="sum3" style="grid-template-columns:repeat(3,1fr);">
      <div><span>저축률</span><b class="n">${rate === null ? '—' : rate + '%'}</b></div>
      <div><span>고정비</span><b class="e">${comma(fixed)}</b></div>
      <div><span>변동비</span><b class="e">${comma(t.exp - fixed)}</b></div>
    </div>

    <span class="lab">지출 많은 분류</span>
    <div class="card">${top.length ? top.map(([k, v]) => `
      <div class="bar"><div class="bl"><span>${esc(k)}</span><b>${comma(v)}</b></div>
      <div class="bt"><div class="bf" style="width:${Math.round(v / max * 100)}%"></div></div></div>`).join('')
      : '<div class="empty">지출 기록이 없습니다.</div>'}</div>

    <span class="lab">최근 6개월 지출</span>
    <div class="card" id="sum6"><div class="empty">불러오는 중…</div></div>`;
  bindMnav(m);

  loadSum6().then(() => {
    const host = $('#sum6');
    if (!host || !SUM6) return;
    const vals = SUM6.months.map(x => SUM6.by[x] || 0);
    const mx = Math.max(1, ...vals);
    host.innerHTML = `<div class="mini">${SUM6.months.map((x, i) => `
      <div><i style="height:${Math.max(2, Math.round(vals[i] / mx * 60))}px;${x === S.month ? 'background:var(--accent)' : ''}"></i>
      <span>${x.slice(5)}월</span></div>`).join('')}</div>
      <div style="text-align:center;font-size:11px;color:var(--text-faint);margin-top:7px;font-family:var(--mono);">
        평균 ${comma(vals.reduce((a, b) => a + b, 0) / vals.length)}원</div>`;
  }).catch(() => {});
}

/* ================= 전체메뉴 : 목록 관리 =================
   사용처·분류·계좌는 가계부를 쓰다 보면 계속 손보게 되는 것들이라
   웹까지 가지 않고 폰에서 바로 고칠 수 있게 둔다. 웹의 '목록'과 같은 표를 본다. */

function mgToolbar(placeholder, addLabel) {
  return `<div class="mgtool">
    <input class="in" id="mg-q" placeholder="${placeholder}" autocomplete="off" value="${esc(S.mg.q)}">
    <button class="mgadd" id="mg-add">＋ ${addLabel}</button>
  </div>`;
}
/* 여기서도 검색칸은 다시 그리지 않는다 — 한글 조합이 끊기지 않게 목록만 갈아 끼운다 */
function bindMgToolbar(m, onAdd, paint) {
  const q = $('#mg-q', m);
  const sync = () => { S.mg.q = q.value; paint(); };
  q.addEventListener('input', sync);
  q.addEventListener('compositionupdate', sync);
  q.addEventListener('compositionend', sync);
  $('#mg-add', m).addEventListener('click', onAdd);
}

/* ---- 사용처 ---- */
function renderMerchDB(m) {
  m.innerHTML = `
    ${mgToolbar('사용처 · 그룹 검색', '추가')}
    <p class="mgnote">등록된 ${S.merchants.length}곳. 고정비로 지정하면 그 사용처의 기록이 고정비로 잡힙니다.</p>
    <div id="mg-list"></div>`;

  const paint = () => {
    const host = $('#mg-list'); if (!host) return;
    const q = S.mg.q.trim().toLowerCase();
    const rows = S.merchants
      .filter(r => !q || r.name.toLowerCase().includes(q) || String(r.merchant_group || '').toLowerCase().includes(q))
      .sort((a, b) => (S.merchStats[b.name] ? S.merchStats[b.name].count : 0) - (S.merchStats[a.name] ? S.merchStats[a.name].count : 0)
        || a.name.localeCompare(b.name, 'ko'));
    host.innerHTML = rows.length ? `<div class="list">${rows.map(r => {
      const st = S.merchStats[r.name];
      return `<button class="dbrow" data-mid="${r.id}">
        <span class="em">${r.is_fixed ? '📌' : '🏷️'}</span>
        <span class="nm">${esc(r.name)}
          ${r.merchant_group || (st && st.catId) ? `<div class="sub">${
            [r.merchant_group ? esc(r.merchant_group) : '', st && st.catId ? esc(catLabel(st.catId)) : ''].filter(Boolean).join(' · ')}</div>` : ''}</span>
        <span class="tag">${st && st.count ? st.count + '건' : ''}</span>
      </button>`;
    }).join('')}</div>` : '<div class="empty">사용처가 없습니다.</div>';
    $$('[data-mid]', host).forEach(b => b.addEventListener('click', () =>
      editMerch(S.merchants.find(x => x.id === Number(b.dataset.mid)))));
  };

  paint();
  bindMgToolbar(m, () => editMerch(null), paint);
}

function editMerch(row) {
  const e = row ? { ...row } : { id: null, name: S.mg.q.trim(), merchant_group: '', is_fixed: false };
  const groups = [...new Set(S.merchants.map(x => x.merchant_group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
  sheetOpen(`
    <div class="box">
      <div class="sh"><h3>${row ? '사용처 수정' : '사용처 추가'}</h3><button class="x" id="g-x">×</button></div>
      <span class="lab">이름</span>
      <input class="in" id="g-name" value="${esc(e.name)}" placeholder="예: 매머드커피">
      <span class="lab">그룹 <span style="opacity:.7">— 선택</span></span>
      <input class="in" id="g-group" value="${esc(e.merchant_group || '')}" placeholder="예: 카페" list="g-groups">
      <datalist id="g-groups">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      <div class="row" style="margin-top:12px;">
        <button class="tog" id="g-fx" aria-pressed="${!!e.is_fixed}">📌 고정비 사용처</button>
      </div>
      <p class="err" id="g-err"></p>
      <button class="save inline" id="g-save">저장</button>
      ${row ? '<button class="del" id="g-del">삭제</button>' : ''}
    </div>`);
  $('#g-x').addEventListener('click', sheetClose);
  $('#g-fx').addEventListener('click', () => {
    e.is_fixed = !e.is_fixed;
    $('#g-fx').setAttribute('aria-pressed', String(e.is_fixed));
  });
  $('#g-save').addEventListener('click', async () => {
    const name = $('#g-name').value.trim();
    const group = $('#g-group').value.trim();
    if (!name) { $('#g-err').textContent = '이름을 입력하세요.'; return; }
    const btn = $('#g-save'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const c = await sb();
      const payload = { name, merchant_group: group || null, is_fixed: !!e.is_fixed };
      const { error } = e.id
        ? await c.from('merchants').update(payload).eq('id', e.id)
        : await c.from('merchants').insert(payload);
      if (error) throw new Error(error.message);
      sheetClose(); await reloadRefs(); toast('저장했습니다');
    } catch (err) {
      $('#g-err').textContent = '저장하지 못했습니다 — ' + (err.message || err);
      btn.disabled = false; btn.textContent = '저장';
    }
  });
  const del = $('#g-del');
  if (del) del.addEventListener('click', async () => {
    if (!confirm(`'${e.name}'을(를) 사용처 목록에서 지울까요?\n이미 기록된 내역은 그대로 남습니다.`)) return;
    try {
      const { error } = await (await sb()).from('merchants').delete().eq('id', e.id);
      if (error) throw new Error(error.message);
      sheetClose(); await reloadRefs(); toast('삭제했습니다');
    } catch (err) { toast('삭제 실패 — ' + (err.message || err)); }
  });
}

/* ---- 분류 ---- */
const CAT_KINDS = ['지출', '수입', '이체', '자산'];
function renderCatDB(m) {
  m.innerHTML = `
    ${mgToolbar('분류 · 세부분류 검색', '추가')}
    <div class="chips" style="margin-bottom:9px;">${CAT_KINDS.map(k =>
      `<button class="chip sm ${S.mg.catKind === k ? 'on' : ''}" data-ck="${k}">${k}</button>`).join('')}</div>
    <div id="mg-list"></div>`;

  const paint = () => {
    const host = $('#mg-list'); if (!host) return;
    const q = S.mg.q.trim().toLowerCase();
    const rows = (S.allCats || [])
      .filter(r => r.kind === S.mg.catKind)
      .filter(r => !q || (r.category + ' ' + r.subcategory).toLowerCase().includes(q))
      .sort((a, b) => (a.sort_order - b.sort_order) || a.category.localeCompare(b.category, 'ko'));
    host.innerHTML = rows.length ? `<div class="list">${rows.map(r => `
      <button class="dbrow ${r.is_active === false ? 'off' : ''}" data-cid="${r.id}">
        <span class="em">${r.emoji_category || r.emoji_kind || '·'}</span>
        <span class="nm">${esc(r.subcategory)}<div class="sub">${esc(r.category)}</div></span>
        <span class="tag">${r.sort_order}</span>
      </button>`).join('')}</div>` : '<div class="empty">분류가 없습니다.</div>';
    $$('[data-cid]', host).forEach(b => b.addEventListener('click', () =>
      editCat((S.allCats || []).find(x => x.id === Number(b.dataset.cid)))));
  };

  paint();
  bindMgToolbar(m, () => editCat(null), paint);
  $$('[data-ck]', m).forEach(b => b.addEventListener('click', () => {
    S.mg.catKind = b.dataset.ck;
    $$('[data-ck]', m).forEach(x => x.classList.toggle('on', x.dataset.ck === S.mg.catKind));
    paint();
  }));
}

function editCat(row) {
  const e = row ? { ...row } : {
    id: null, kind: S.mg.catKind, category: '', subcategory: S.mg.q.trim(),
    emoji_kind: '', emoji_category: '', sort_order: 0, is_active: true
  };
  const cats = [...new Set((S.allCats || []).filter(x => x.kind === e.kind).map(x => x.category))].sort((a, b) => a.localeCompare(b, 'ko'));
  sheetOpen(`
    <div class="box">
      <div class="sh"><h3>${row ? '분류 수정' : '분류 추가'}</h3><button class="x" id="g-x">×</button></div>
      <span class="lab">종류</span>
      <div class="chips">${CAT_KINDS.map(k =>
        `<button class="chip sm ${e.kind === k ? 'on' : ''}" data-gk="${k}">${k}</button>`).join('')}</div>
      <span class="lab">분류</span>
      <input class="in" id="g-cat" value="${esc(e.category)}" placeholder="예: 식비" list="g-cats">
      <datalist id="g-cats">${cats.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      <span class="lab">세부분류</span>
      <input class="in" id="g-sub" value="${esc(e.subcategory)}" placeholder="예: 카페">
      <div class="row" style="margin-top:12px;gap:8px;">
        <label style="flex:1;font-size:12px;color:var(--text-faint);">이모지
          <input class="in" id="g-emo" value="${esc(e.emoji_category || '')}" style="margin-top:4px;"></label>
        <label style="flex:1;font-size:12px;color:var(--text-faint);">순서
          <input class="in" id="g-sort" type="number" inputmode="numeric" value="${Number(e.sort_order) || 0}" style="margin-top:4px;"></label>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="tog" id="g-act" aria-pressed="${e.is_active !== false}">사용</button>
      </div>
      <p class="err" id="g-err"></p>
      <button class="save inline" id="g-save">저장</button>
      ${row ? '<button class="del" id="g-del">삭제</button>' : ''}
    </div>`);
  $('#g-x').addEventListener('click', sheetClose);
  $$('[data-gk]').forEach(b => b.addEventListener('click', () => {
    e.kind = b.dataset.gk;
    $$('[data-gk]').forEach(x => x.classList.toggle('on', x.dataset.gk === e.kind));
  }));
  $('#g-act').addEventListener('click', () => {
    e.is_active = e.is_active === false ? true : false;
    $('#g-act').setAttribute('aria-pressed', String(e.is_active !== false));
  });
  $('#g-save').addEventListener('click', async () => {
    const payload = {
      kind: e.kind,
      category: $('#g-cat').value.trim(),
      subcategory: $('#g-sub').value.trim(),
      emoji_category: $('#g-emo').value.trim() || null,
      sort_order: Number($('#g-sort').value) || 0,
      is_active: e.is_active !== false
    };
    if (!payload.category || !payload.subcategory) { $('#g-err').textContent = '분류와 세부분류를 입력하세요.'; return; }
    const btn = $('#g-save'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const c = await sb();
      const { error } = e.id
        ? await c.from('categories').update(payload).eq('id', e.id)
        : await c.from('categories').insert(payload);
      if (error) throw new Error(error.message);
      sheetClose(); await reloadRefs(); toast('저장했습니다');
    } catch (err) {
      $('#g-err').textContent = '저장하지 못했습니다 — ' + (err.message || err);
      btn.disabled = false; btn.textContent = '저장';
    }
  });
  const del = $('#g-del');
  if (del) del.addEventListener('click', async () => {
    if (!confirm(`'${e.category} › ${e.subcategory}'를 삭제할까요?\n이 분류로 기록된 내역이 있으면 지워지지 않습니다 — 그럴 땐 '사용'을 꺼두세요.`)) return;
    try {
      const { error } = await (await sb()).from('categories').delete().eq('id', e.id);
      if (error) throw new Error(error.message);
      sheetClose(); await reloadRefs(); toast('삭제했습니다');
    } catch (err) { toast('삭제하지 못했습니다 — 기록이 남아 있는 분류입니다'); }
  });
}

/* ---- 계좌 ---- */
const ACCT_CLASSES = ['현금 자산', '투자 자산', '저축 자산', '연금 자산'];
async function loadAccounts(force) {
  if (S.accounts && !force) return;
  const { data } = await (await sb()).from('accounts')
    .select('id,name,asset_class,sort_order,note,is_active').order('sort_order');
  S.accounts = data || [];
}
function renderAcctDB(m) {
  if (!S.accounts) {
    m.innerHTML = '<div class="empty">불러오는 중…</div>';
    loadAccounts().then(() => renderTab()).catch(() => { m.innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; });
    return;
  }
  m.innerHTML = `
    ${mgToolbar('계좌 검색', '추가')}
    <p class="mgnote">자산 스냅샷에 적는 계좌 목록입니다.</p>
    <div id="mg-list"></div>`;

  const paint = () => {
    const host = $('#mg-list'); if (!host) return;
    const q = S.mg.q.trim().toLowerCase();
    const rows = S.accounts.filter(r => !q || (r.name + ' ' + r.asset_class).toLowerCase().includes(q));
    host.innerHTML = rows.length ? `<div class="list">${rows.map(r => `
      <button class="dbrow ${r.is_active === false ? 'off' : ''}" data-aid="${r.id}">
        <span class="em">🏦</span>
        <span class="nm">${esc(r.name)}<div class="sub">${esc(r.asset_class)}${r.note ? ' · ' + esc(r.note) : ''}</div></span>
        <span class="tag">${r.sort_order}</span>
      </button>`).join('')}</div>` : '<div class="empty">계좌가 없습니다.</div>';
    $$('[data-aid]', host).forEach(b => b.addEventListener('click', () =>
      editAcct(S.accounts.find(x => x.id === Number(b.dataset.aid)))));
  };

  paint();
  bindMgToolbar(m, () => editAcct(null), paint);
}
function editAcct(row) {
  const e = row ? { ...row } : { id: null, name: S.mg.q.trim(), asset_class: '현금 자산', sort_order: 0, note: '', is_active: true };
  sheetOpen(`
    <div class="box">
      <div class="sh"><h3>${row ? '계좌 수정' : '계좌 추가'}</h3><button class="x" id="g-x">×</button></div>
      <span class="lab">계좌 이름</span>
      <input class="in" id="g-name" value="${esc(e.name)}" placeholder="예: 토스뱅크 생활비">
      <span class="lab">분류</span>
      <div class="chips">${ACCT_CLASSES.map(k =>
        `<button class="chip sm ${e.asset_class === k ? 'on' : ''}" data-ac="${k}">${k}</button>`).join('')}</div>
      <div class="row" style="margin-top:12px;gap:8px;">
        <label style="flex:1;font-size:12px;color:var(--text-faint);">순서
          <input class="in" id="g-sort" type="number" inputmode="numeric" value="${Number(e.sort_order) || 0}" style="margin-top:4px;"></label>
      </div>
      <span class="lab">메모</span>
      <input class="in" id="g-note" value="${esc(e.note || '')}" placeholder="선택">
      <div class="row" style="margin-top:12px;">
        <button class="tog" id="g-act" aria-pressed="${e.is_active !== false}">사용</button>
      </div>
      <p class="err" id="g-err"></p>
      <button class="save inline" id="g-save">저장</button>
      ${row ? '<button class="del" id="g-del">삭제</button>' : ''}
    </div>`);
  $('#g-x').addEventListener('click', sheetClose);
  $$('[data-ac]').forEach(b => b.addEventListener('click', () => {
    e.asset_class = b.dataset.ac;
    $$('[data-ac]').forEach(x => x.classList.toggle('on', x.dataset.ac === e.asset_class));
  }));
  $('#g-act').addEventListener('click', () => {
    e.is_active = e.is_active === false ? true : false;
    $('#g-act').setAttribute('aria-pressed', String(e.is_active !== false));
  });
  $('#g-save').addEventListener('click', async () => {
    const payload = {
      name: $('#g-name').value.trim(), asset_class: e.asset_class,
      sort_order: Number($('#g-sort').value) || 0,
      note: $('#g-note').value.trim() || null, is_active: e.is_active !== false
    };
    if (!payload.name) { $('#g-err').textContent = '계좌 이름을 입력하세요.'; return; }
    const btn = $('#g-save'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const c = await sb();
      const { error } = e.id
        ? await c.from('accounts').update(payload).eq('id', e.id)
        : await c.from('accounts').insert(payload);
      if (error) throw new Error(error.message);
      sheetClose(); await loadAccounts(true); renderTab(); toast('저장했습니다');
    } catch (err) {
      $('#g-err').textContent = '저장하지 못했습니다 — ' + (err.message || err);
      btn.disabled = false; btn.textContent = '저장';
    }
  });
  const del = $('#g-del');
  if (del) del.addEventListener('click', async () => {
    if (!confirm(`'${e.name}' 계좌를 삭제할까요?`)) return;
    try {
      const { error } = await (await sb()).from('accounts').delete().eq('id', e.id);
      if (error) throw new Error(error.message);
      sheetClose(); await loadAccounts(true); renderTab(); toast('삭제했습니다');
    } catch (err) { toast('삭제하지 못했습니다 — 스냅샷에 쓰인 계좌입니다'); }
  });
}

async function reloadRefs() {
  await loadRefs();
  renderTab();
}

/* ---------------- 로그인 · 시작 ---------------- */
function showLock(msg) {
  const el = document.createElement('div');
  el.id = 'lock';
  el.innerHTML = `
    <div class="box">
      <div class="mark">해</div>
      <h2>해달 가계부</h2>
      <p>${esc(msg || '로그인하고 시작하세요.')}</p>
      <input class="in" id="lk-em" type="email" placeholder="이메일" autocomplete="username" inputmode="email">
      <input class="in" id="lk-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <p class="err" id="lk-err"></p>
      <button id="lk-go">로그인</button>
    </div>`;
  document.body.appendChild(el);
  const go = async () => {
    const email = $('#lk-em').value.trim(), password = $('#lk-pw').value;
    if (!email || !password) { $('#lk-err').textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    $('#lk-go').disabled = true; $('#lk-err').textContent = '';
    const { error } = await (await sb()).auth.signInWithPassword({ email, password });
    $('#lk-go').disabled = false;
    if (error) { $('#lk-err').textContent = '로그인하지 못했습니다.'; return; }
    el.remove();
    start();
  };
  $('#lk-go').addEventListener('click', go);
  $('#lk-pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function start() {
  $('#main').innerHTML = '<div class="empty" style="padding-top:70px;">불러오는 중…</div>';
  try {
    await loadRefs();
    await loadMonth();
    render();
  } catch (e) {
    $('#main').innerHTML = `<div class="empty" style="padding-top:60px;">불러오지 못했습니다.<br>${esc(e.message || e)}</div>`;
  }
}

(async () => {
  let c;
  try { c = await sb(); }
  catch (e) { $('#main').innerHTML = '<div class="empty" style="padding-top:80px;">네트워크를 확인하고 다시 열어주세요.</div>'; return; }
  const { data } = await c.auth.getSession();
  if (data.session) start(); else showLock();
  c.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT') location.reload(); });
})();
</script>
