<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>해달 가계부</title>

<!-- iOS 홈 화면 앱 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="해달 가계부" />
<meta name="theme-color" content="#0e121a" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.png" />
<link rel="manifest" href='data:application/manifest+json,{"name":"해달 가계부","short_name":"가계부","start_url":"https://nussleman.github.io/haedal/gagyebu.html","scope":"https://nussleman.github.io/haedal/","display":"standalone","background_color":"%230e121a","theme_color":"%230e121a","icons":[{"src":"https://nussleman.github.io/haedal/icon.png","sizes":"512x512","type":"image/png","purpose":"any"}]}' />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0e121a; --bg-2:#141a25; --panel:#171e2b; --panel-2:#1e2635;
  --border:rgba(233,231,223,0.09); --border-strong:rgba(233,231,223,0.16);
  --text:#eae8e0; --text-dim:#a9b2c4; --text-faint:#8892a6;
  --accent:#c9a227; --accent-text:#e8c96a; --ink-on-accent:#1a1508;
  --income:#4c8c6b; --income-text:#7fc0a0; --income-bg:rgba(76,140,107,0.16);
  --expense:#c1483f; --expense-text:#e08a82; --expense-bg:rgba(193,72,63,0.16);
  --transfer:#39a8bd; --transfer-text:#7ed0de; --transfer-bg:rgba(57,168,189,0.18);
  --save:#7b7fd0; --save-text:#a8abe6; --save-bg:rgba(123,127,208,0.18);
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'Noto Serif KR',serif;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  --tabh:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;}

button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;touch-action:manipulation;}
button{cursor:pointer;}
.mono{font-family:var(--mono);}

/* ---------- 상단바 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,18,26,0.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:10px 14px;padding-top:calc(10px + var(--top));
  display:flex;align-items:center;gap:8px;}
/* 금액은 분류를 고르는 동안에도 계속 보이도록 상단에 고정한다 */
.stick{position:sticky;top:calc(46px + var(--top));z-index:30;background:var(--bg);
  margin:0 -14px;padding:0 14px 10px;}
.stick .amt{margin-top:0;}
.top h1{font-family:var(--serif);font-size:17px;margin:0;font-weight:700;}
.top .sp{margin-left:auto;}
.top .mini{background:none;border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text-faint);font-size:12px;padding:4px 9px;}

/* ---------- 본문 · 탭바 ---------- */
main{padding:14px 14px calc(var(--tabh) + var(--bot) + 78px);max-width:560px;margin:0 auto;}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(20,26,37,0.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);
  padding-bottom:var(--bot);}
.tabbar button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--text-faint);
  font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tabbar button .g{font-size:19px;line-height:1;}
.tabbar button.on{color:var(--accent-text);}

/* ---------- 공통 ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;}
.row{display:flex;align-items:center;gap:8px;}
.lab{font-size:12px;color:var(--text-faint);margin:14px 2px 6px;display:block;}
.in{width:100%;height:44px;padding:0 12px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r-md);color:var(--text);}
.in:focus{outline:none;border-color:var(--accent);}
textarea.in{height:64px;padding:10px 12px;resize:none;line-height:1.5;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;height:38px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--bg-2);color:var(--text-dim);font-size:14px;font-weight:500;}
.seg button.on{border-color:transparent;font-weight:700;}
.seg button.on[data-k="지출"]{background:var(--expense-bg);color:var(--expense-text);border-color:var(--expense);}
.seg button.on[data-k="수입"]{background:var(--income-bg);color:var(--income-text);border-color:var(--income);}
.seg button.on[data-k="이체"]{background:var(--transfer-bg);color:var(--transfer-text);border-color:var(--transfer);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{height:34px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:var(--bg-2);color:var(--text-dim);font-size:13px;display:inline-flex;align-items:center;gap:5px;}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink-on-accent);font-weight:700;}
.chip.sm{height:30px;font-size:12px;padding:0 10px;}
.tog{height:34px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:transparent;color:var(--text-faint);font-size:13px;}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-text);background:rgba(201,162,39,.1);}
.tog.g[aria-pressed="true"]{border-color:var(--income);color:var(--income-text);background:var(--income-bg);}
.tog.b[aria-pressed="true"]{border-color:var(--expense);color:var(--expense-text);background:var(--expense-bg);}
.empty{text-align:center;color:var(--text-faint);font-size:13px;padding:26px 0;}
.err{color:var(--expense-text);font-size:13px;min-height:18px;margin:6px 2px 0;}

/* ---------- 금액 · 키패드 ---------- */
.amt{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  padding:14px 16px;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;margin-top:10px;}
.amt b{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-0.5px;}
.amt.zero b{color:var(--text-faint);}
.amt.neg b{color:var(--expense-text);}
.amt span{font-size:15px;color:var(--text-faint);}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;}
.pad button{height:52px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel-2);
  font-family:var(--mono);font-size:21px;font-weight:600;color:var(--text);}
.pad button:active{background:var(--accent);color:var(--ink-on-accent);}
.pad button.fn{font-family:var(--sans);font-size:15px;color:var(--text-dim);background:var(--bg-2);}
.save{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;
  bottom:calc(var(--tabh) + var(--bot) + 10px);z-index:45;height:50px;
  border:0;border-radius:var(--r-md);background:var(--accent);color:var(--ink-on-accent);
  font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.55);}
.save.inline{position:static;transform:none;width:100%;max-width:none;box-shadow:none;margin-top:14px;}
.save:disabled{opacity:.5;}
.save.sv{background:var(--save);color:#fff;}

/* ---------- 기록 : 사용처 → 금액 ---------- */
.steplab{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);margin:16px 2px 8px;}
.steplab b{width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--ink-on-accent);
  font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
.in.big{height:50px;font-size:17px;}
.mchips{margin-top:12px;max-height:none;}
.mchips .chip{max-width:100%;}
.chip i{font-style:normal;font-family:var(--mono);font-size:10px;opacity:.6;}
.newmerch{width:100%;height:42px;margin-top:8px;border-radius:var(--r-md);
  border:1px dashed var(--accent);background:rgba(201,162,39,.08);color:var(--accent-text);font-size:14px;}
.skip{width:100%;height:38px;margin-top:14px;border:0;background:transparent;
  color:var(--text-faint);font-size:13px;text-decoration:underline;text-underline-offset:3px;}
.todaybox{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:11px 14px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);font-size:13px;color:var(--text-dim);}
.todaybox b{font-family:var(--mono);color:var(--expense-text);}
.stepbar{display:flex;align-items:center;gap:8px;margin-top:4px;}
.backchip{flex:1 1 auto;min-width:0;height:40px;padding:0 13px;border-radius:var(--r-md);
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text);
  font-size:15px;font-weight:500;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kindpill{flex:0 0 auto;height:40px;padding:0 13px;display:inline-flex;align-items:center;border-radius:var(--r-md);
  font-size:14px;font-weight:700;}
.kindpill.e{background:var(--expense-bg);color:var(--expense-text);}
.kindpill.i{background:var(--income-bg);color:var(--income-text);}
.kindpill.t{background:var(--transfer-bg);color:var(--transfer-text);}
.ochips{margin-top:9px;}
.ochips .chip{font-family:var(--mono);}
.catrow{margin-top:14px;}
.catpick{width:100%;height:46px;padding:0 14px;display:flex;align-items:center;gap:7px;
  border-radius:var(--r-md);border:1px dashed var(--border-strong);background:var(--bg-2);
  color:var(--text-faint);font-size:15px;}
.catpick.on{border-style:solid;border-color:var(--accent);color:var(--text);background:var(--panel);}
.catpick i{margin-left:auto;font-style:normal;font-size:11px;color:var(--text-faint);}
details.more{margin-top:14px;border-top:1px solid var(--border);padding-top:10px;}
details.more summary{list-style:none;cursor:pointer;font-size:13px;color:var(--text-faint);padding:4px 2px;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::after{content:' ▾';}
details.more[open] summary::after{content:' ▴';}

/* ---------- 월 이동 · 요약 ---------- */
.mnav{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:12px;}
.mnav button{width:36px;height:36px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--bg-2);color:var(--text-dim);font-size:17px;line-height:1;}
.mnav b{font-family:var(--mono);font-size:16px;min-width:118px;text-align:center;}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px;}
.sum3 div{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 10px;text-align:center;}
.sum3 span{display:block;font-size:11px;color:var(--text-faint);margin-bottom:3px;}
.sum3 b{font-family:var(--mono);font-size:15px;}
.sum3 b.i{color:var(--income-text);} .sum3 b.e{color:var(--expense-text);} .sum3 b.n{color:var(--accent-text);}

/* ---------- 내역 ---------- */
.day{margin-top:16px;}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:0 3px 6px;
  font-size:12px;color:var(--text-faint);}
.day .dh b{font-family:var(--mono);}
.list{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
.it{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);}
.it:last-child{border-bottom:0;}
.it:active{background:var(--panel-2);}
.it .em{width:26px;text-align:center;font-size:16px;flex:0 0 26px;}
.it .tx{flex:1 1 auto;min-width:0;}
.it .t1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.it .t2{font-size:11px;color:var(--text-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.it .v{font-family:var(--mono);font-size:14px;flex:0 0 auto;white-space:nowrap;}
.it .v.e{color:var(--expense-text);} .it .v.i{color:var(--income-text);}
.it .v.t{color:var(--transfer-text);} .it .v.s{color:var(--save-text);}
.mk{font-size:10px;color:var(--text-faint);margin-left:4px;}

/* ---------- 시트(수정) ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(6,9,14,.72);display:flex;align-items:flex-end;}
.sheet[hidden]{display:none;}
.sheet .box{width:100%;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  border-top:1px solid var(--border-strong);padding:14px 14px calc(var(--bot) + 18px);}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.sheet .sh h3{margin:0;font-size:16px;font-family:var(--serif);}
.sheet .x{margin-left:auto;background:none;border:0;color:var(--text-faint);font-size:22px;line-height:1;padding:2px 6px;}
.del{width:100%;height:44px;margin-top:10px;border-radius:var(--r-md);border:1px solid rgba(193,72,63,.5);
  background:transparent;color:var(--expense-text);font-size:14px;}

/* ---------- 요약 막대 ---------- */
.bar{margin-top:9px;}
.bar .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.bar .bl b{font-family:var(--mono);color:var(--text-dim);}
.bar .bt{height:7px;border-radius:4px;background:var(--bg-2);overflow:hidden;}
.bar .bf{height:100%;border-radius:4px;background:var(--expense);}
.mini{display:flex;align-items:flex-end;gap:5px;height:78px;margin-top:10px;}
.mini div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
.mini i{width:100%;background:var(--expense);border-radius:3px 3px 0 0;display:block;min-height:2px;}
.mini span{font-size:9px;color:var(--text-faint);font-family:var(--mono);}

/* ---------- 로그인 ---------- */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(22px + var(--top)) 22px calc(22px + var(--bot));}
#lock .box{width:100%;max-width:340px;text-align:center;}
#lock .mark{font-family:var(--serif);font-size:40px;color:var(--accent-text);}
#lock h2{font-family:var(--serif);font-size:20px;margin:6px 0 4px;}
#lock p{font-size:13px;color:var(--text-faint);margin:0 0 18px;}
#lock .in{margin-bottom:8px;text-align:left;}
#lock button{width:100%;height:48px;border:0;border-radius:var(--r-md);background:var(--accent);
  color:var(--ink-on-accent);font-size:16px;font-weight:700;margin-top:6px;}

/* ---------- 토스트 ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--bot) + 22px);
  z-index:120;background:var(--accent);color:var(--ink-on-accent);font-size:13px;font-weight:700;
  padding:9px 16px;border-radius:var(--r-pill);opacity:0;pointer-events:none;transition:opacity .2s;
  box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:88vw;text-align:center;}
#toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabbar" id="tabbar" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>

<script>
/* ================= 해달 가계부 (모바일) =================
   해달 대시보드와 같은 Supabase 를 쓴다. 기록·수정·삭제가 바로 DB 에 반영되고,
   대시보드는 그 값을 그대로 읽는다. 로그인한 본인 행만 보인다(RLS). */

const SB_URL  = 'https://rjxmrpifrhybucexuvli.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqeG1ycGlmcmh5YnVjZXh1dmxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NjU1OTAsImV4cCI6MjEwMTE0MTU5MH0.xSzE02pjZYqbx9nPLb8RVsQF9w7hJHEx2cO0JDOLLSU';

const SAVE_KINDS = ['얻어먹음', '참았음', '할인·쿠폰', '더 싼 걸로', '기타'];
const SAVE_EMOJI = { '얻어먹음': '🫶', '참았음': '✊', '할인·쿠폰': '🏷️', '더 싼 걸로': '🔁', '기타': '💧' };

let SB = null;
async function sb() {
  if (SB) return SB;
  const mod = await import('https://esm.sh/@supabase/supabase-js@2');
  SB = mod.createClient(SB_URL, SB_ANON);
  return SB;
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const comma = (n) => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const todayKey = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const monthOf = (k) => String(k).slice(0, 7);
const nowMonth = () => monthOf(todayKey());
const shiftMonth = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const monthLabel = (m) => `${m.slice(0, 4)}년 ${+m.slice(5, 7)}월`;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const dayLabel = (k) => { const d = new Date(k + 'T00:00:00'); return `${+k.slice(5, 7)}월 ${+k.slice(8, 10)}일 (${DOW[d.getDay()]})`; };
const monthRange = (m) => [m + '-01', shiftMonth(m, 1) + '-01'];

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

const S = {
  tab: 'add',
  cats: [], merchants: [], merchStats: {},
  month: nowMonth(), tx: [], sav: [], savAll: [],
  loaded: false, busy: false,
  d: null,   /* 기록 입력값 */
  s: null,   /* 아낀 돈 입력값 */
  edit: null
};
function freshDraft() { return { step: 1, kind: '지출', amount: '', neg: false, catId: null, cat: null, catOpen: false, moreOpen: false, merchant: '', note: '', date: todayKey(), good: null, fixed: false, co: false }; }
function freshSave() { return { amount: '', kind: '참았음', title: '', note: '', date: todayKey() }; }
S.d = freshDraft(); S.s = freshSave();

/* ---------------- 기준 데이터 ---------------- */
async function loadRefs() {
  const c = await sb();
  const [cats, merch, recent] = await Promise.all([
    c.from('categories').select('id,kind,category,subcategory,emoji_kind,emoji_category,sort_order,is_active').order('sort_order'),
    c.from('merchants').select('name,merchant_group,is_fixed').order('name'),
    c.from('transactions').select('merchant,category_id,date,amount').not('merchant', 'is', null).order('date', { ascending: false }).limit(800)
  ]);
  if (cats.error) throw new Error(cats.error.message);
  S.cats = (cats.data || []).filter(x => x.is_active !== false);
  S.merchants = merch.data || [];
  /* 사용처별 통계 — 얼마나 자주 썼는지, 마지막 분류, 자주 찍은 금액.
     고르면 분류가 자동으로 따라오고 금액도 한 번에 넣을 수 있다. */
  const st = {};
  (recent.data || []).forEach(r => {
    const n = (r.merchant || '').trim();
    if (!n) return;
    const o = st[n] || (st[n] = { name: n, count: 0, catId: null, amounts: [], last: r.date });
    o.count++;
    if (!o.catId) o.catId = r.category_id;
    const a = Math.abs(Number(r.amount) || 0);
    if (a) o.amounts.push(a);
  });
  /* 사용처 표에만 있고 아직 기록이 없는 것도 목록에 띄운다 */
  S.merchants.forEach(x => { if (!st[x.name]) st[x.name] = { name: x.name, count: 0, catId: null, amounts: [], last: '' }; });
  S.merchStats = st;
  S.loaded = true;
}

async function loadMonth() {
  const c = await sb();
  const [from, to] = monthRange(S.month);
  const [tx, sv, all] = await Promise.all([
    c.from('transactions').select('id,date,category_id,amount,merchant,merchant_group,note,good_bad,is_fixed,company_paid')
      .gte('date', from).lt('date', to).order('date', { ascending: false }).order('id', { ascending: false }),
    c.from('savings_log').select('id,date,amount,kind,title,note')
      .gte('date', from).lt('date', to).order('date', { ascending: false }).order('id', { ascending: false }),
    c.from('savings_log').select('amount')
  ]);
  S.tx = tx.data || [];
  S.sav = sv.data || [];
  S.savAll = all.data || [];
}

const catById = (id) => S.cats.find(x => x.id === id);
const kindOf = (id) => { const c = catById(id); return c ? c.kind : '지출'; };
const kindCls = (k) => k === '수입' ? 'i' : k === '이체' ? 't' : 'e';
const catLabel = (id) => { const c = catById(id); return c ? `${c.category} › ${c.subcategory}` : '분류 없음'; };
const catEmoji = (id) => { const c = catById(id); return (c && (c.emoji_category || c.emoji_kind)) || '·'; };

/* ================= 화면 ================= */
function render() {
  const app = $('#app');
  app.innerHTML = `
    <div class="top">
      <h1>해달 가계부</h1>
      <span class="sp"></span>
      <button class="mini" id="out">로그아웃</button>
    </div>
    <main id="main"></main>`;
  $('#out').addEventListener('click', async () => { (await sb()).auth.signOut(); location.reload(); });

  const bar = $('#tabbar');
  bar.hidden = false;
  const tabs = [['add', '✏️', '기록'], ['list', '📒', '내역'], ['save', '🪙', '아낀 돈'], ['sum', '📊', '요약']];
  bar.innerHTML = tabs.map(([id, g, l]) =>
    `<button data-t="${id}" class="${S.tab === id ? 'on' : ''}"><span class="g">${g}</span>${l}</button>`).join('');
  bar.onclick = (e) => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    S.tab = b.dataset.t; window.scrollTo(0, 0); render();
  };
  renderTab();
}

function renderTab() {
  const m = $('#main');
  if (!m) return;
  if (S.tab === 'add') renderAdd(m);
  else if (S.tab === 'list') renderList(m);
  else if (S.tab === 'save') renderSave(m);
  else renderSum(m);
}

/* ---------------- 키패드 ---------------- */
function padHtml(id) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
  return `<div class="pad" id="${id}">
    ${keys.map(k => `<button data-k="${k}">${k}</button>`).join('')}
    <button class="fn" data-k="00">00</button>
    <button data-k="0">0</button>
    <button class="fn" data-k="del">⌫</button>
  </div>`;
}
function bindPad(id, get, set, after) {
  $('#' + id).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const k = b.dataset.k;
    let v = get();
    if (k === 'del') v = v.slice(0, -1);
    else if (v.length < 11) v = (v === '' && k === '00') ? '' : v + k;
    set(v.replace(/^0+(?=\d)/, ''));
    after();
  });
}
function amtHtml(v, neg, cls) {
  return `<div class="amt ${v ? '' : 'zero'} ${neg ? 'neg' : ''} ${cls || ''}">
    <b>${neg && v ? '−' : ''}${v ? Number(v).toLocaleString('ko-KR') : '0'}</b><span>원</span></div>`;
}

/* ---------------- 기록 : 사용처 → 금액 → 저장 ----------------
   폰에서 가장 자주 하는 일이라, 두 걸음으로 끝나게 만든다.
   ① 사용처를 고르면 지난번에 쓰던 분류가 따라오고
   ② 금액만 찍으면 저장. 나머지(날짜·메모·표시)는 접어 둔다. */
function renderAdd(m) {
  const d = S.d;
  if (d.step === 2) return renderAddAmount(m);

  const q = d.merchant.trim().toLowerCase();
  let list = Object.values(S.merchStats);
  if (q) list = list.filter(x => x.name.toLowerCase().includes(q));
  list = list.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ko')).slice(0, 18);
  const exact = q && list.some(x => x.name.toLowerCase() === q);
  const t = todayStat();

  m.innerHTML = `
    <div class="seg">
      ${['지출', '수입', '이체'].map(k => `<button data-k="${k}" class="${d.kind === k ? 'on' : ''}">${k}</button>`).join('')}
    </div>

    <div class="steplab"><b>1</b> 어디에 썼나요?</div>
    <input class="in big" id="f-merch" placeholder="사용처 검색 · 입력" autocomplete="off"
           autocapitalize="off" value="${esc(d.merchant)}">

    ${q && !exact ? `<button class="newmerch" id="f-newmerch">＋ '${esc(d.merchant.trim())}' 새 사용처로 쓰기</button>` : ''}

    <div class="chips mchips">
      ${list.map(x => `<button class="chip" data-m="${esc(x.name)}">${esc(x.name)}${
        x.count ? `<i>${x.count}</i>` : ''}</button>`).join('') || '<div class="empty">사용처 기록이 없습니다. 위에 직접 입력하세요.</div>'}
    </div>

    <button class="skip" id="f-nomerch">사용처 없이 기록 →</button>

    ${t.n ? `<div class="todaybox" id="f-today">
      <span>오늘 ${t.n}건</span><b>${comma(t.exp)}원</b></div>` : ''}`;

  $$('.seg button', m).forEach(b => b.addEventListener('click', () => {
    d.kind = b.dataset.k; d.catId = null; d.cat = null; renderTab();
  }));

  const mi = $('#f-merch');
  mi.addEventListener('input', () => { d.merchant = mi.value; renderTab(); requestAnimationFrame(() => { const e = $('#f-merch'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }); });
  mi.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const name = d.merchant.trim();
    if (name) pickMerch(name);
  });

  $$('[data-m]', m).forEach(b => b.addEventListener('click', () => pickMerch(b.dataset.m)));
  const nm = $('#f-newmerch');
  if (nm) nm.addEventListener('click', () => pickMerch(d.merchant.trim()));
  $('#f-nomerch').addEventListener('click', () => { d.merchant = ''; goAmount(); });
  const tb = $('#f-today');
  if (tb) tb.addEventListener('click', () => { S.tab = 'list'; render(); });
}

function todayStat() {
  const k = todayKey();
  const rows = S.tx.filter(r => r.date === k);
  return { n: rows.length, exp: rows.reduce((a, r) => a + (kindOf(r.category_id) === '지출' ? Number(r.amount) : 0), 0) };
}

/* 사용처를 고르면 지난번 분류를 그대로 데려온다 */
function pickMerch(name) {
  const d = S.d;
  d.merchant = name;
  const st = S.merchStats[name];
  if (st && st.catId && catById(st.catId)) {
    const c = catById(st.catId);
    d.kind = c.kind; d.cat = c.category; d.catId = st.catId;
  }
  goAmount();
}
function goAmount() { S.d.step = 2; S.d.catOpen = false; window.scrollTo(0, 0); renderTab(); }

function renderAddAmount(m) {
  const d = S.d;
  const st = S.merchStats[d.merchant.trim()];
  /* 그 사용처에서 자주 찍었던 금액 — 한 번 눌러 끝낸다 */
  const often = (() => {
    if (!st || !st.amounts.length) return [];
    const cnt = {};
    st.amounts.forEach(a => { cnt[a] = (cnt[a] || 0) + 1; });
    return Object.entries(cnt).sort((a, b) => b[1] - a[1] || b[0] - a[0]).slice(0, 3).map(x => Number(x[0]));
  })();

  const cats = S.cats.filter(c => c.kind === d.kind);
  const groups = [...new Set(cats.map(c => c.category))];
  const cur = d.catId ? catById(d.catId) : null;
  const openGroup = d.cat || (cur ? cur.category : groups[0]);
  const subs = cats.filter(c => c.category === openGroup);

  m.innerHTML = `
    <div class="stepbar">
      <button class="backchip" id="f-back">‹ ${esc(d.merchant.trim() || '사용처 없음')}</button>
      <span class="kindpill ${kindCls(d.kind)}">${d.kind}</span>
    </div>

    <div class="steplab"><b>2</b> 얼마인가요?</div>
    <div class="stick">${amtHtml(d.amount, d.neg)}</div>
    ${often.length ? `<div class="chips ochips">${often.map(a =>
      `<button class="chip" data-a="${a}">${comma(a)}</button>`).join('')}</div>` : ''}
    ${padHtml('pad1')}

    <div class="catrow">
      <button class="catpick ${d.catId ? 'on' : ''}" id="f-catpick">
        ${d.catId ? `${catEmoji(d.catId)} ${esc(catLabel(d.catId))}` : '분류 선택'}
        <i>${d.catOpen ? '▲' : '▼'}</i>
      </button>
    </div>
    ${d.catOpen ? `
      <div class="chips" style="margin-top:8px;">${groups.map(g =>
        `<button class="chip sm" data-g="${esc(g)}" ${g === openGroup ? 'style="border-color:var(--accent);color:var(--accent-text);"' : ''}>${esc(g)}</button>`).join('')}</div>
      <div class="chips" style="margin-top:7px;">${subs.map(c =>
        `<button class="chip ${d.catId === c.id ? 'on' : ''}" data-c="${c.id}">${c.emoji_category || ''} ${esc(c.subcategory)}</button>`).join('')}</div>` : ''}

    <details class="more" ${d.moreOpen ? 'open' : ''}>
      <summary>날짜 · 메모 · 표시</summary>
      <div class="row" style="margin-top:10px;">
        <button class="chip sm" data-d="0">오늘</button>
        <button class="chip sm" data-d="-1">어제</button>
        <input class="in" type="date" id="f-date" value="${d.date}" style="flex:1;">
      </div>
      <input class="in" id="f-note" placeholder="메모" value="${esc(d.note)}" style="margin-top:8px;">
      <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px;">
        <button class="tog" id="t-neg" aria-pressed="${d.neg}">− 환불</button>
        <button class="tog" id="t-fx" aria-pressed="${d.fixed}">📌 고정비</button>
        <button class="tog" id="t-co" aria-pressed="${d.co}">🏢 회사</button>
        <button class="tog g" id="t-good" aria-pressed="${d.good === 'Good'}">👍</button>
        <button class="tog b" id="t-bad" aria-pressed="${d.good === 'Bad'}">👎</button>
      </div>
    </details>

    <p class="err" id="f-err"></p>
    <button class="save" id="f-save" ${d.amount ? '' : 'disabled'}>${
      d.amount ? Number(d.amount).toLocaleString('ko-KR') + '원 ' : ''}기록하기</button>`;

  bindPad('pad1', () => d.amount, (v) => { d.amount = v; }, renderTab);
  $('#f-back').addEventListener('click', () => { d.step = 1; renderTab(); });
  $$('[data-a]', m).forEach(b => b.addEventListener('click', () => { d.amount = b.dataset.a; renderTab(); }));
  $('#f-catpick').addEventListener('click', () => { d.catOpen = !d.catOpen; renderTab(); });
  $$('[data-g]', m).forEach(b => b.addEventListener('click', () => { d.cat = b.dataset.g; renderTab(); }));
  $$('[data-c]', m).forEach(b => b.addEventListener('click', () => {
    d.catId = Number(b.dataset.c); d.catOpen = false; renderTab();
  }));
  $$('[data-d]', m).forEach(b => b.addEventListener('click', () => {
    const dt = new Date(); dt.setDate(dt.getDate() + Number(b.dataset.d));
    dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
    d.date = dt.toISOString().slice(0, 10); d.moreOpen = true; renderTab();
  }));
  const det = m.querySelector('details.more');
  det.addEventListener('toggle', () => { d.moreOpen = det.open; });
  $('#f-date').addEventListener('change', (e) => { d.date = e.target.value; });
  $('#f-note').addEventListener('input', (e) => { d.note = e.target.value; });
  $('#t-neg').addEventListener('click', () => { d.neg = !d.neg; d.moreOpen = true; renderTab(); });
  $('#t-fx').addEventListener('click', () => { d.fixed = !d.fixed; d.moreOpen = true; renderTab(); });
  $('#t-co').addEventListener('click', () => { d.co = !d.co; d.moreOpen = true; renderTab(); });
  $('#t-good').addEventListener('click', () => { d.good = d.good === 'Good' ? null : 'Good'; d.moreOpen = true; renderTab(); });
  $('#t-bad').addEventListener('click', () => { d.good = d.good === 'Bad' ? null : 'Bad'; d.moreOpen = true; renderTab(); });
  $('#f-save').addEventListener('click', saveTx);
}

async function saveTx() {
  const d = S.d;
  const n = Number(d.amount || 0);
  const err = $('#f-err');
  if (!n) { err.textContent = '금액을 입력하세요.'; return; }
  if (!d.catId) { err.textContent = '분류를 선택하세요.'; return; }
  err.textContent = '';
  const btn = $('#f-save'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const g = S.merchants.find(x => x.name === d.merchant.trim());
    const { error } = await (await sb()).from('transactions').insert({
      date: d.date,
      category_id: d.catId,
      amount: d.neg ? -n : n,
      merchant: d.merchant.trim() || null,
      merchant_group: g ? g.merchant_group : null,
      note: d.note.trim() || null,
      good_bad: d.good,
      company_paid: d.co,
      is_fixed: d.fixed
    });
    if (error) throw new Error(error.message);
    const nm = d.merchant.trim();
    if (nm) {
      const o = S.merchStats[nm] || (S.merchStats[nm] = { name: nm, count: 0, catId: null, amounts: [], last: d.date });
      o.count++; o.catId = d.catId; o.amounts.unshift(n); o.last = d.date;
    }
    toast(comma(n) + '원 기록했습니다');
    const keep = { date: d.date, kind: d.kind };
    S.d = freshDraft(); S.d.date = keep.date; S.d.kind = keep.kind;
    await loadMonth();
    renderTab();
  } catch (e) {
    err.textContent = '저장하지 못했습니다 — ' + (e.message || e);
    btn.disabled = false; btn.textContent = '기록하기';
    S.d.step = 2;
  }
}

/* ---------------- 내역 ---------------- */
function monthTotals() {
  let inc = 0, exp = 0;
  S.tx.forEach(r => {
    const k = kindOf(r.category_id);
    if (k === '수입') inc += Number(r.amount);
    else if (k === '지출') exp += Number(r.amount);
  });
  return { inc, exp, net: inc - exp };
}

function mnavHtml() {
  return `<div class="mnav">
    <button data-mn="-1">‹</button><b>${monthLabel(S.month)}</b><button data-mn="1">›</button>
  </div>`;
}
function bindMnav(m) {
  $$('[data-mn]', m).forEach(b => b.addEventListener('click', async () => {
    S.month = shiftMonth(S.month, Number(b.dataset.mn));
    await loadMonth(); renderTab();
  }));
}

function renderList(m) {
  const t = monthTotals();
  const days = [...new Set(S.tx.map(r => r.date))].sort().reverse();
  m.innerHTML = `
    ${mnavHtml()}
    <div class="sum3">
      <div><span>수입</span><b class="i">${comma(t.inc)}</b></div>
      <div><span>지출</span><b class="e">${comma(t.exp)}</b></div>
      <div><span>순액</span><b class="n">${comma(t.net)}</b></div>
    </div>
    ${days.length ? days.map(dk => {
      const rows = S.tx.filter(r => r.date === dk);
      const dayExp = rows.reduce((a, r) => a + (kindOf(r.category_id) === '지출' ? Number(r.amount) : 0), 0);
      return `<div class="day">
        <div class="dh"><span>${dayLabel(dk)}</span><b>${dayExp ? '지출 ' + comma(dayExp) : ''}</b></div>
        <div class="list">${rows.map(r => txRow(r)).join('')}</div>
      </div>`;
    }).join('') : '<div class="empty">이 달 기록이 없습니다.</div>'}`;
  bindMnav(m);
  $$('[data-tx]', m).forEach(b => b.addEventListener('click', () => openEdit(Number(b.dataset.tx))));
}

function txRow(r) {
  const k = kindOf(r.category_id);
  const marks = (r.is_fixed ? '<span class="mk">📌</span>' : '') + (r.company_paid ? '<span class="mk">🏢</span>' : '')
    + (r.good_bad === 'Good' ? '<span class="mk">👍</span>' : r.good_bad === 'Bad' ? '<span class="mk">👎</span>' : '');
  return `<div class="it" data-tx="${r.id}">
    <span class="em">${catEmoji(r.category_id)}</span>
    <span class="tx">
      <div class="t1">${esc(r.merchant || catLabel(r.category_id))}${marks}</div>
      <div class="t2">${esc(catLabel(r.category_id))}${r.note ? ' · ' + esc(r.note) : ''}</div>
    </span>
    <span class="v ${kindCls(k)}">${k === '지출' ? '−' : k === '수입' ? '+' : ''}${comma(Math.abs(Number(r.amount)))}</span>
  </div>`;
}

/* ---------------- 수정 시트 ---------------- */
function openEdit(id) {
  const r = S.tx.find(x => x.id === id);
  if (!r) return;
  S.edit = { ...r, amount: String(Math.abs(Number(r.amount))), neg: Number(r.amount) < 0 };
  const sh = $('#sheet');
  sh.hidden = false;
  drawEdit();
  sh.onclick = (e) => { if (e.target === sh) closeEdit(); };
}
function closeEdit() { $('#sheet').hidden = true; S.edit = null; }

function drawEdit() {
  const e = S.edit;
  const c = catById(e.category_id);
  const kind = c ? c.kind : '지출';
  const cats = S.cats.filter(x => x.kind === kind);
  const groups = [...new Set(cats.map(x => x.category))];
  const openGroup = e._g || (c ? c.category : groups[0]);
  const subs = cats.filter(x => x.category === openGroup);

  $('#sheet').innerHTML = `
    <div class="box">
      <div class="sh"><h3>기록 수정</h3><button class="x" id="e-x">×</button></div>
      ${amtHtml(e.amount, e.neg)}
      ${padHtml('pad2')}
      <span class="lab">분류</span>
      <div class="chips">${groups.map(g =>
        `<button class="chip sm" data-eg="${esc(g)}" ${g === openGroup ? 'style="border-color:var(--accent);color:var(--accent-text);"' : ''}>${esc(g)}</button>`).join('')}</div>
      <div class="chips" style="margin-top:7px;">${subs.map(x =>
        `<button class="chip ${e.category_id === x.id ? 'on' : ''}" data-ec="${x.id}">${x.emoji_category || ''} ${esc(x.subcategory)}</button>`).join('')}</div>
      <span class="lab">사용처</span>
      <input class="in" id="e-merch" value="${esc(e.merchant || '')}">
      <span class="lab">날짜</span>
      <input class="in" type="date" id="e-date" value="${e.date}">
      <span class="lab">메모</span>
      <input class="in" id="e-note" value="${esc(e.note || '')}">
      <div class="row" style="margin-top:9px;">
        <button class="tog" id="e-fx" aria-pressed="${!!e.is_fixed}">📌 고정비</button>
        <button class="tog" id="e-co" aria-pressed="${!!e.company_paid}">🏢 회사</button>
        <button class="tog g" id="e-good" aria-pressed="${e.good_bad === 'Good'}">👍</button>
        <button class="tog b" id="e-bad" aria-pressed="${e.good_bad === 'Bad'}">👎</button>
      </div>
      <button class="save inline" id="e-save">저장</button>
      <button class="del" id="e-del">삭제</button>
    </div>`;

  bindPad('pad2', () => e.amount, (v) => { e.amount = v; }, drawEdit);
  $('#e-x').addEventListener('click', closeEdit);
  $$('[data-eg]').forEach(b => b.addEventListener('click', () => { e._g = b.dataset.eg; drawEdit(); }));
  $$('[data-ec]').forEach(b => b.addEventListener('click', () => { e.category_id = Number(b.dataset.ec); drawEdit(); }));
  $('#e-merch').addEventListener('input', (x) => { e.merchant = x.target.value; });
  $('#e-date').addEventListener('change', (x) => { e.date = x.target.value; });
  $('#e-note').addEventListener('input', (x) => { e.note = x.target.value; });
  $('#e-fx').addEventListener('click', () => { e.is_fixed = !e.is_fixed; drawEdit(); });
  $('#e-co').addEventListener('click', () => { e.company_paid = !e.company_paid; drawEdit(); });
  $('#e-good').addEventListener('click', () => { e.good_bad = e.good_bad === 'Good' ? null : 'Good'; drawEdit(); });
  $('#e-bad').addEventListener('click', () => { e.good_bad = e.good_bad === 'Bad' ? null : 'Bad'; drawEdit(); });
  $('#e-save').addEventListener('click', saveEdit);
  $('#e-del').addEventListener('click', delEdit);
}

async function saveEdit() {
  const e = S.edit;
  const n = Number(e.amount || 0);
  if (!n) { toast('금액을 입력하세요'); return; }
  const btn = $('#e-save'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const { error } = await (await sb()).from('transactions').update({
      date: e.date, category_id: e.category_id, amount: e.neg ? -n : n,
      merchant: (e.merchant || '').trim() || null, note: (e.note || '').trim() || null,
      good_bad: e.good_bad || null, is_fixed: !!e.is_fixed, company_paid: !!e.company_paid
    }).eq('id', e.id);
    if (error) throw new Error(error.message);
    closeEdit(); await loadMonth(); renderTab(); toast('수정했습니다');
  } catch (err) {
    toast('저장 실패 — ' + (err.message || err));
    btn.disabled = false; btn.textContent = '저장';
  }
}
async function delEdit() {
  if (!confirm('이 기록을 삭제할까요?')) return;
  try {
    const { error } = await (await sb()).from('transactions').delete().eq('id', S.edit.id);
    if (error) throw new Error(error.message);
    closeEdit(); await loadMonth(); renderTab(); toast('삭제했습니다');
  } catch (e) { toast('삭제 실패 — ' + (e.message || e)); }
}

/* ---------------- 아낀 돈 ----------------
   계좌를 드나든 돈이 아니라 "안 썼다 / 얻어먹었다"를 세는 기록.
   그래서 가계부(transactions)와 완전히 분리된 표에 쌓이고, 수입·지출 집계에 섞이지 않는다. */
function renderSave(m) {
  const s = S.s;
  const monthSum = S.sav.reduce((a, r) => a + Number(r.amount), 0);
  const allSum = S.savAll.reduce((a, r) => a + Number(r.amount), 0);
  const byKind = {};
  S.sav.forEach(r => { byKind[r.kind] = (byKind[r.kind] || 0) + Number(r.amount); });

  m.innerHTML = `
    ${mnavHtml()}
    <div class="sum3" style="grid-template-columns:1fr 1fr;">
      <div><span>${monthLabel(S.month)} 아낌</span><b class="n">${comma(monthSum)}</b></div>
      <div><span>지금까지 누적</span><b class="n">${comma(allSum)}</b></div>
    </div>

    <div class="card">
      <div style="font-size:13px;color:var(--text-faint);margin-bottom:2px;">얻어먹었거나, 사려다 참았거나 — 안 쓴 돈</div>
      <span class="lab" style="margin-top:6px;">어떻게</span>
      <div class="chips">${SAVE_KINDS.map(k =>
        `<button class="chip ${s.kind === k ? 'on' : ''}" data-sk="${k}">${SAVE_EMOJI[k]} ${k}</button>`).join('')}</div>
      <span class="lab">무엇을</span>
      <input class="in" id="s-title" placeholder="예: 팀 회식 얻어먹음 / 택시 참고 지하철" value="${esc(s.title)}">
      <span class="lab">얼마를</span>
      ${amtHtml(s.amount, false, 'sv')}
      ${padHtml('pad3')}
      <span class="lab">날짜</span>
      <div class="row">
        <button class="chip sm" data-sd="0">오늘</button>
        <button class="chip sm" data-sd="-1">어제</button>
        <input class="in" type="date" id="s-date" value="${s.date}" style="flex:1;">
      </div>
      <span class="lab">메모</span>
      <input class="in" id="s-note" placeholder="선택" value="${esc(s.note)}">
      <p class="err" id="s-err"></p>
      <button class="save sv inline" id="s-save">아낀 돈 기록</button>
    </div>

    <span class="lab">${monthLabel(S.month)} 기록 ${S.sav.length ? `· ${S.sav.length}건` : ''}</span>
    ${S.sav.length ? `<div class="list">${S.sav.map(r => `
      <div class="it" data-sv="${r.id}">
        <span class="em">${SAVE_EMOJI[r.kind] || '💧'}</span>
        <span class="tx">
          <div class="t1">${esc(r.title)}</div>
          <div class="t2">${esc(r.kind)} · ${r.date.slice(5).replace('-', '.')}${r.note ? ' · ' + esc(r.note) : ''}</div>
        </span>
        <span class="v s">${comma(Number(r.amount))}</span>
      </div>`).join('')}</div>` : '<div class="empty">이 달 기록이 없습니다.</div>'}

    ${Object.keys(byKind).length ? `<span class="lab">이 달 유형별</span>
      <div class="card">${Object.entries(byKind).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
        <div class="bar"><div class="bl"><span>${SAVE_EMOJI[k] || '💧'} ${esc(k)}</span><b>${comma(v)}</b></div>
        <div class="bt"><div class="bf" style="width:${Math.round(v / monthSum * 100)}%;background:var(--save)"></div></div></div>`).join('')}
      </div>` : ''}`;

  bindMnav(m);
  bindPad('pad3', () => s.amount, (v) => { s.amount = v; }, renderTab);
  $$('[data-sk]', m).forEach(b => b.addEventListener('click', () => { s.kind = b.dataset.sk; renderTab(); }));
  $$('[data-sd]', m).forEach(b => b.addEventListener('click', () => {
    const dt = new Date(); dt.setDate(dt.getDate() + Number(b.dataset.sd));
    dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
    s.date = dt.toISOString().slice(0, 10); renderTab();
  }));
  $('#s-title').addEventListener('input', (e) => { s.title = e.target.value; });
  $('#s-note').addEventListener('input', (e) => { s.note = e.target.value; });
  $('#s-date').addEventListener('change', (e) => { s.date = e.target.value; });
  $('#s-save').addEventListener('click', saveSaving);
  $$('[data-sv]', m).forEach(b => b.addEventListener('click', () => delSaving(Number(b.dataset.sv))));
}

async function saveSaving() {
  const s = S.s;
  const n = Number(s.amount || 0);
  const err = $('#s-err');
  if (!n) { err.textContent = '금액을 입력하세요.'; return; }
  if (!s.title.trim()) { err.textContent = '무엇을 아꼈는지 한 줄만 적어주세요.'; return; }
  err.textContent = '';
  const btn = $('#s-save'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const { error } = await (await sb()).from('savings_log').insert({
      date: s.date, amount: n, kind: s.kind, title: s.title.trim(), note: s.note.trim() || null
    });
    if (error) throw new Error(error.message);
    toast(comma(n) + '원 아꼈습니다 👏');
    const keep = { kind: s.kind, date: s.date };
    S.s = freshSave(); S.s.kind = keep.kind; S.s.date = keep.date;
    await loadMonth(); renderTab();
  } catch (e) {
    err.textContent = '저장하지 못했습니다 — ' + (e.message || e);
    btn.disabled = false; btn.textContent = '아낀 돈 기록';
  }
}
async function delSaving(id) {
  const r = S.sav.find(x => x.id === id);
  if (!r || !confirm(`'${r.title}' 기록을 삭제할까요?`)) return;
  try {
    const { error } = await (await sb()).from('savings_log').delete().eq('id', id);
    if (error) throw new Error(error.message);
    await loadMonth(); renderTab(); toast('삭제했습니다');
  } catch (e) { toast('삭제 실패 — ' + (e.message || e)); }
}

/* ---------------- 요약 ---------------- */
let SUM6 = null;
async function loadSum6() {
  const c = await sb();
  const from = shiftMonth(S.month, -5) + '-01';
  const to = shiftMonth(S.month, 1) + '-01';
  const { data } = await c.from('transactions').select('date,category_id,amount').gte('date', from).lt('date', to);
  const by = {};
  (data || []).forEach(r => {
    if (kindOf(r.category_id) !== '지출') return;
    const m = monthOf(r.date);
    by[m] = (by[m] || 0) + Number(r.amount);
  });
  SUM6 = { by, months: Array.from({ length: 6 }, (_, i) => shiftMonth(S.month, -5 + i)) };
}

function renderSum(m) {
  const t = monthTotals();
  const rate = t.inc > 0 ? Math.round((t.inc - t.exp) / t.inc * 100) : null;
  const monthSave = S.sav.reduce((a, r) => a + Number(r.amount), 0);
  const byCat = {};
  S.tx.forEach(r => {
    if (kindOf(r.category_id) !== '지출') return;
    const c = catById(r.category_id);
    const k = c ? c.category : '기타';
    byCat[k] = (byCat[k] || 0) + Number(r.amount);
  });
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const max = top.length ? top[0][1] : 1;

  m.innerHTML = `
    ${mnavHtml()}
    <div class="sum3">
      <div><span>수입</span><b class="i">${comma(t.inc)}</b></div>
      <div><span>지출</span><b class="e">${comma(t.exp)}</b></div>
      <div><span>순액</span><b class="n">${comma(t.net)}</b></div>
    </div>
    <div class="sum3" style="grid-template-columns:1fr 1fr;">
      <div><span>저축률</span><b class="n">${rate === null ? '—' : rate + '%'}</b></div>
      <div><span>아낀 돈</span><b style="color:var(--save-text)">${comma(monthSave)}</b></div>
    </div>

    <span class="lab">지출 많은 분류</span>
    <div class="card">${top.length ? top.map(([k, v]) => `
      <div class="bar"><div class="bl"><span>${esc(k)}</span><b>${comma(v)}</b></div>
      <div class="bt"><div class="bf" style="width:${Math.round(v / max * 100)}%"></div></div></div>`).join('')
      : '<div class="empty">지출 기록이 없습니다.</div>'}</div>

    <span class="lab">최근 6개월 지출</span>
    <div class="card" id="sum6"><div class="empty">불러오는 중…</div></div>`;
  bindMnav(m);

  loadSum6().then(() => {
    const host = $('#sum6');
    if (!host || !SUM6) return;
    const vals = SUM6.months.map(x => SUM6.by[x] || 0);
    const mx = Math.max(1, ...vals);
    host.innerHTML = `<div class="mini">${SUM6.months.map((x, i) => `
      <div><i style="height:${Math.max(2, Math.round(vals[i] / mx * 62))}px;${x === S.month ? 'background:var(--accent)' : ''}"></i>
      <span>${x.slice(5)}월</span></div>`).join('')}</div>
      <div style="text-align:center;font-size:11px;color:var(--text-faint);margin-top:7px;font-family:var(--mono);">
        평균 ${comma(vals.reduce((a, b) => a + b, 0) / vals.length)}원</div>`;
  }).catch(() => {});
}

/* ---------------- 로그인 · 시작 ---------------- */
function showLock(msg) {
  const el = document.createElement('div');
  el.id = 'lock';
  el.innerHTML = `
    <div class="box">
      <div class="mark">해</div>
      <h2>해달 가계부</h2>
      <p>${esc(msg || '로그인하고 시작하세요.')}</p>
      <input class="in" id="lk-em" type="email" placeholder="이메일" autocomplete="username" inputmode="email">
      <input class="in" id="lk-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <p class="err" id="lk-err"></p>
      <button id="lk-go">로그인</button>
    </div>`;
  document.body.appendChild(el);
  const go = async () => {
    const email = $('#lk-em').value.trim(), password = $('#lk-pw').value;
    if (!email || !password) { $('#lk-err').textContent = '이메일과 비밀번호를 입력하세요.'; return; }
    $('#lk-go').disabled = true; $('#lk-err').textContent = '';
    const { error } = await (await sb()).auth.signInWithPassword({ email, password });
    $('#lk-go').disabled = false;
    if (error) { $('#lk-err').textContent = '로그인하지 못했습니다.'; return; }
    el.remove();
    start();
  };
  $('#lk-go').addEventListener('click', go);
  $('#lk-pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function start() {
  document.getElementById('app').innerHTML = '<div class="empty" style="padding-top:80px;">불러오는 중…</div>';
  try {
    await loadRefs();
    await loadMonth();
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:70px;">불러오지 못했습니다.<br>${esc(e.message || e)}</div>`;
  }
}

(async () => {
  let c;
  try { c = await sb(); }
  catch (e) { document.body.innerHTML = '<div class="empty" style="padding-top:90px;">네트워크를 확인하고 다시 열어주세요.</div>'; return; }
  const { data } = await c.auth.getSession();
  if (data.session) start(); else showLock();
  c.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT') location.reload(); });
})();
</script>
</body>
