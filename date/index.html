        <span class="meta">${r ? `${esc(String(r.created_at).slice(0, 10))} 기록 · ` : ''}<kbd>${mac ? '⌘' : 'Ctrl'}</kbd>+<kbd>Enter</kbd> 저장 · <kbd>Tab</kbd> 칸 · <kbd>←→</kbd> 고르기 · <kbd>Esc</kbd> 닫기</span>
        ${isEdit ? '<button class="btn danger" id="f-del">삭제</button>' : ''}
        <button class="btn" id="f-save">${isEdit ? '수정 저장' : '기록'}</button>
      </div>
    </div>`;

  const amt = $('#f-amt'), mi = $('#f-merch');
  const sync = () => {
    d.amount = digits(amt.value);
    if (mi) d.merchant = mi.value;
    d.memo = $('#f-memo').value;
    d.date = $('#f-date').value || todayKey();
  };
  const redraw = (sel) => { sync(); drawForm(sel); };

  /* 분류 칩만 제자리에서 바꾼다 — 사용처를 치는 중에 창을 다시 그리면 한글 조합이 끊긴다 */
  const paintCats = () => {
    $$('#f-cat .chip').forEach(b => {
      const on = b.dataset.c === d.category;
      b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
    });
    const items = $$('#f-cat .chip'), cur = items.findIndex(b => b.classList.contains('on'));
    items.forEach((b, i) => { b.tabIndex = i === (cur < 0 ? 0 : cur) ? 0 : -1; });
    const au = $('#f-auto'); if (au) au.textContent = autoNote();
  };
  /* 사용처(+금액)로 분류를 자동으로 — 손으로 고른 분류는 건드리지 않는다. 종류는 칸을 떠날 때 바꾼다. */
  const autoFill = (withKind) => {
    if (!mi) return;
    const g = guessMerchant(mi.value, Number(digits(amt.value)));
    if (d.category == null || d.autoCat) {
      if (g && g.category && cats.includes(g.category)) { d.category = g.category; d.autoCat = g.from; }
      else if (d.autoCat) { d.category = null; d.autoCat = null; }
      paintCats();
    }
    if (withKind && g && !d.kindTouched && g.kind !== d.kind && g.kind !== '입금') {
      d.kind = g.kind;
      if (d.kind !== '지출') d.good = null;
      return true;
    }
    return false;
  };

  $('#f-x').addEventListener('click', closeForm);
  ov.onclick = (e) => { if (e.target === ov) closeForm(); };

  /* 종류 */
  $$('#f-kind button').forEach(b => b.addEventListener('click', () => {
    sync(); d.kind = b.dataset.k; d.kindTouched = true;
    if (d.kind === '입금') { d.category = null; d.autoCat = null; }
    if (d.kind !== '지출') d.good = null;
    drawForm();
  }));
  rovingGroup($('#f-kind'), true);

  /* 금액 — Enter 는 다음 칸. 금액이 바뀌면 자동 분류도 다시 본다(같은 곳이라도 금액 따라 분류가 다를 수 있다) */
  moneyInput(amt);
  amt.addEventListener('input', () => { if (mi && mi.value && (d.autoCat || d.category == null)) autoFill(false); });
  amt.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); focusNext(amt); }
  });

  /* 사용처 + 추천 목록 */
  if (mi) {
    const box = $('#f-sug');
    let list = [], hi = -1, moved = false;
    const open = () => !box.hidden;
    const close = () => { box.hidden = true; mi.setAttribute('aria-expanded', 'false'); mi.removeAttribute('aria-activedescendant'); hi = -1; moved = false; };
    const paintHi = () => {
      $$('.sug-it', box).forEach((el, i) => el.classList.toggle('hi', i === hi));
      if (hi >= 0) { mi.setAttribute('aria-activedescendant', 'f-sug-' + hi); const el = $('#f-sug-' + hi); if (el) el.scrollIntoView({ block: 'nearest' }); }
      else mi.removeAttribute('aria-activedescendant');
    };
    const render = () => {
      const q = mi.value, a = Number(digits(amt.value));
      list = suggestMerchants(q, a);
      /* 이미 다 친 이름 하나만 맞으면 굳이 띄우지 않는다 */
      if (!list.length || (list.length === 1 && list[0].key === norm(q))) { close(); return; }
      hi = norm(q) ? 0 : -1; moved = false;
      box.innerHTML = `<div class="sug-hd">${norm(q) ? '예전에 쓴 곳' : a ? '자주 쓴 곳 · 비슷한 금액 먼저' : '자주 · 최근 쓴 곳'} — ↑↓ 고르고 Enter</div>` +
        list.map((e, i) => { const g = guessFrom(e, a);
          return `<div class="sug-it" role="option" id="f-sug-${i}" data-i="${i}"><span class="em">${g.kind === '수입' ? '💰' : catEmoji(g.category)}</span>
            <b>${esc(e.name)}</b><span class="sc">${esc(g.kind === '수입' ? '수입' : (g.category || ''))} · ${e.n}번</span><span class="sa">${comma(g.typical)}</span></div>`; }).join('');
      box.hidden = false; mi.setAttribute('aria-expanded', 'true');
      paintHi();
    };
    const pick = (i) => {
      const e = list[i]; if (!e) return;
      mi.value = e.name; d.merchant = e.name;
      const g = guessFrom(e, Number(digits(amt.value)));
      if ((d.category == null || d.autoCat) && g.category && cats.includes(g.category)) { d.category = g.category; d.autoCat = 'history'; }
      if (!d.kindTouched && g.kind !== d.kind && g.kind !== '입금') { d.kind = g.kind; if (d.kind !== '지출') d.good = null; }
      close();
      /* 골랐으면 분류로 — 맞으면 Tab 으로 넘어가고, 틀리면 화살표로 바로 고친다 */
      redraw(d.kind === '지출' || d.category ? '#f-cat .chip[tabindex="0"]' : '#f-date');
    };
    mi.addEventListener('focus', render);
    mi.addEventListener('input', () => { autoFill(false); render(); });
    mi.addEventListener('blur', () => setTimeout(() => {
      if (!$('#ov').contains(mi)) return;
      close();
      /* 칸을 떠날 때 종류(지출↔수입)까지 맞춘다 — 창을 다시 그리니 지금 간 칸을 기억해 둔다 */
      if (autoFill(true)) redraw();
    }, 0));
    box.addEventListener('mousedown', e => {
      const it = e.target.closest('.sug-it'); if (!it) return;
      e.preventDefault(); pick(Number(it.dataset.i));
    });
    mi.addEventListener('keydown', e => {
      if (e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!open()) { render(); if (!open()) return; }
        const n = list.length;
        hi = e.key === 'ArrowDown' ? (hi + 1) % n : (hi <= 0 ? n - 1 : hi - 1);
        moved = true; paintHi();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (open() && hi >= 0) pick(hi); else { close(); focusNext(mi); }
      } else if (e.key === 'Tab' && !e.shiftKey && open() && moved && hi >= 0) {
        e.preventDefault(); pick(hi);   // 화살표로 골라 둔 것이 있으면 Tab 도 그걸 고른다
      } else if (e.key === 'Escape' && open()) {
        e.preventDefault(); e.stopPropagation(); close();
      }
    });
  }

  /* 분류 · 입금자 */
  $$('#f-cat .chip').forEach(b => b.addEventListener('click', () => {
    sync(); d.category = d.category === b.dataset.c ? null : b.dataset.c; d.autoCat = null; drawForm();
  }));
  rovingGroup($('#f-cat'), true);
  $$('#f-who .chip').forEach(b => b.addEventListener('click', () => { sync(); d.depositor = b.dataset.u; drawForm(); }));
  rovingGroup($('#f-who'), true);

  /* 날짜 — 입력칸은 ↑↓로 날짜가 바뀌고(브라우저 기본), 어제·오늘 칩은 ←→ 로 오간다 */
  $$('[data-day]').forEach(b => b.addEventListener('click', () => { sync(); d.date = shiftDay(todayKey(), Number(b.dataset.day)); drawForm(); }));
  rovingGroup($('#f-days'), true);
  /* 날짜 칸 — 화살표는 하루씩(←↓ 하루 전 · →↑ 하루 뒤). 브라우저 기본(연·월·일 칸 사이 이동)은 키보드로 쓰기 불편하다 */
  $('#f-date').addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') { e.preventDefault(); $('#f-memo').focus(); return; }
    const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key];
    if (step) { e.preventDefault(); sync(); d.date = shiftDay(d.date, step); drawForm('#f-date'); }
  });

  /* 좋은·아쉬운 지출 — ←→ 로 옮기고 Space 로 켜고 끈다 */
  const gb = (sel, v) => { const el = $(sel); if (el) el.addEventListener('click', () => { sync(); d.good = d.good === v ? null : v; drawForm(); }); };
  gb('#f-good', 'Good'); gb('#f-bad', 'Bad');
  rovingGroup($('#f-gb'), false);

  const save = async () => {
    sync();
    const err = $('#f-err');
    const n = Number(d.amount || 0);
    if (!n) { err.textContent = '금액을 넣으세요.'; amt.focus(); return; }
    if (d.kind === '지출' && !d.category) { err.textContent = '분류를 고르세요. (←→ 로 고를 수 있어요)'; const c = $('#f-cat .chip[tabindex="0"]'); if (c) c.focus(); return; }
    if (d.kind === '입금' && !PEOPLE.includes(d.depositor)) { err.textContent = '누가 넣었는지 고르세요.'; return; }
    const btn = $('#f-save');
    if (btn.disabled) return;
    btn.disabled = true;
    const payload = {
      kind: d.kind, amount: n, date: d.date,
      category: d.kind === '입금' ? null : d.category,
      merchant: d.kind === '입금' ? null : (d.merchant.trim() || null),
      memo: d.memo.trim() || null,
      good_bad: d.kind === '지출' ? d.good : null,
      depositor: d.kind === '입금' ? d.depositor : null
    };
    const c = await sb();
    const { error } = isEdit
      ? await c.from('date_tx').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', d.id)
      : await c.from('date_tx').insert({ ...payload, book_id: S.book.id });
    if (error) { err.textContent = '저장하지 못했습니다 — ' + error.message; btn.disabled = false; return; }
    toast(isEdit ? '수정했어요' : `${d.kind} ${comma(n)}원 기록했어요`);
    if (!isEdit) S.draft = freshDraft(d);   // 종류·날짜는 이어서 쓴다
    closeForm();
    S.month = monthOf(d.date);
    await loadAll(); renderPage();
  };
  $('#f-save').addEventListener('click', save);

  /* 창 전체 — Ctrl/⌘+Enter 저장, Tab 은 창 안에서만 돈다 */
  ov.onkeydown = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.stopPropagation(); save(); return; }
    /* Tab 은 칸 단위로 직접 옮긴다 — 날짜 칸 속 연·월·일에 갇히지 않고, 창 밖으로도 나가지 않는다 */
    if (e.key === 'Tab' && !e.defaultPrevented && !e.ctrlKey && !e.altKey && !e.metaKey) {
      const list = tabbables(); if (!list.length) return;
      e.preventDefault();
      const i = list.indexOf(document.activeElement), n = list.length;
      list[i < 0 ? 0 : (i + (e.shiftKey ? -1 : 1) + n) % n].focus();
    }
  };

  const del = $('#f-del');
  if (del) del.addEventListener('click', async () => {
    if (!confirm('이 기록을 삭제할까요?')) return;
    const { error } = await (await sb()).from('date_tx').delete().eq('id', d.id);
    if (error) { $('#f-err').textContent = '삭제하지 못했습니다 — ' + error.message; return; }
    closeForm(); toast('삭제했어요');
    await loadAll(); renderPage();
  });

  if (mode === 'open') { if (!isEdit && window.matchMedia('(min-width: 761px)').matches) { amt.focus(); amt.select(); } }
  else if (keep) { const el = $(keep, ov); if (el) el.focus(); }
}

document.addEventListener('keydown', (e) => {
  if (!S.book) return;
  if (S.app) { if (e.key === 'Escape' && W.open) wqClose(); return; }
  if (e.key === 'Escape' && !$('#ov').hidden) { e.preventDefault(); closeForm(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '');
  if (S.canEdit && !typing && $('#ov').hidden && (e.key === 'n' || e.key === 'N' || e.key === 'ㅜ') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); openForm();
  }
});

/* ================= 폰 앱 =================
   폰(좁은 화면)으로 열면 사이트 대신 이 화면이 뜬다 — 해달 폰 앱과 같은 틀.
     홈 : 지금 남은 돈 · 이번 달 숫자 · 입금 약속 · 최근 기록
     내역 · 달력 : 탭바가 하위 버튼(필터 · 달 이동)으로 바뀌고 ← 로 돌아온다
     더보기 : 리포트 · 설정 화면(사이트 화면을 그대로 빌려 쓴다) · PC 화면 · 로그아웃
   ＋ 는 한 칸씩 묻는 빠른 기록 화면. 기록 줄을 누르면 같은 화면이 '고치기'로 열린다.
   사이트 화면을 보고 싶으면 더보기 › PC 화면, 또는 주소에 ?view=site */
const WA_VIEW_KEY = 'westie:view';
const A = { tab: 'home', bar: null, kind: 'all', calDay: null, sub: null, anim: false };

function appWanted() {
  try {
    const q = new URLSearchParams(location.search).get('view');
    if (q === 'site') return false;
    if (q === 'app') return true;
    if (localStorage.getItem(WA_VIEW_KEY) === 'site') return false;
  } catch (e) {}
  return window.matchMedia('(max-width: 640px)').matches;
}

const WA_IC = {
  home: '<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
  list: '<path d="M8 7h11M8 12h11M8 17h11"/><circle cx="4.5" cy="7" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="17" r=".8"/>',
  cal: '<rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M9 3.5v4M15 3.5v4"/>',
  more: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  add: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M19 12H5.5M11 6l-6 6 6 6"/>',
  prev: '<path d="M14.5 6 8.5 12l6 6"/>',
  next: '<path d="M9.5 6l6 6-6 6"/>',
  sync: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/>'
};
const waIcon = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${WA_IC[k] || ''}</svg>`;
const waTabs = () => [['home', '홈'], ['list', '내역'], ...(S.canEdit ? [['add', '기록']] : []), ['cal', '달력'], ['more', '더보기']];
function waSubItems(tab) {
  if (tab === 'list') return [['f:all', '전체'], ['f:지출', '지출'], ['f:입금', '입금'], ['f:수입', '수입']];
  if (tab === 'cal') {
    const mo = (k) => +k.slice(5, 7) + '월';
    return [['c:-1', '‹ ' + mo(shiftMonth(S.month, -1))], ['c:0', '이번 달'], ['c:1', mo(shiftMonth(S.month, 1)) + ' ›']];
  }
  return [];
}
/* 더보기 메뉴 — 열면 사이트의 같은 화면을 빌려 그린다 */
const WA_MORE = [
  ['#', '리포트'],
  ['report/monthly', '📊', '월간 리포트', '분류별 지출 · 좋았던·아쉬운 지출'],
  ['report/trend', '📈', '추이', '최근 12개월 입금·지출 · 월말 잔액'],
  ['report/deposit', DEPOSIT_EMOJI, '입금 현황', '누가 얼마나 넣었나'],
  ['report/balance', '🔍', '잔액 맞추기', '통장 앱에 찍힌 잔액과 맞춰 보기'],
  ['#', '설정', true],
  ['set/book', '🏦', '통장', '이름 · 시작 잔액'],
  ['set/goals', '🤝', '입금 약속', '매달 넣기로 한 금액'],
  ['set/cats', '🏷️', '지출 분류', '분류 추가 · 삭제']
];

function waShell() {
  S.app = true;
  document.documentElement.classList.add('wa-app');
  const vp = document.querySelector('meta[name=viewport]');
  if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
  document.body.classList.add('wa-on');
  $('#app').innerHTML = `
    <header class="wa-top">
      <button class="wa-back" id="wa-back" aria-label="뒤로" hidden>${waIcon('back')}</button>
      <img class="face" id="wa-face" src="icon.png" alt="">
      <div class="wa-tt"><b id="wa-title">웨스티</b><small id="wa-subt"></small></div>
      <button class="wa-sync" id="wa-sync" aria-label="새로고침">${waIcon('sync')}</button>
    </header>
    <main class="wa-main" id="wa-main"></main>
    <nav class="wa-bar" id="wa-bar" aria-label="메뉴"></nav>`;
  $('#wa-sync').addEventListener('click', async (e) => {
    const b = e.currentTarget;
    if (b.classList.contains('spin')) return;
    b.classList.add('spin');
    try { await loadAll(); waRender(false); toast('새로 불러왔어요'); }
    catch (er) { toast('불러오지 못했어요'); }
    b.classList.remove('spin');
  });
  $('#wa-back').addEventListener('click', () => { A.sub = null; waRender(true); });
  $('#wa-bar').addEventListener('click', waBarClick);
  $('#wa-main').addEventListener('click', waMainClick);
  waPaintBar();
}

function waPaintBar() {
  const bar = $('#wa-bar');
  if (!bar) return;
  let html;
  if (!A.bar) {
    html = waTabs().map(([k, l]) => k === 'add'
      ? `<button class="wa-add" data-act="add" aria-label="기록하기">${waIcon('add')}</button>`
      : `<button class="wa-tb${A.tab === k ? ' on' : ''}" data-go="${k}">${waIcon(k)}<span>${l}</span></button>`).join('');
  } else {
    const cur = A.bar === 'list' ? 'f:' + A.kind : S.month === monthOf(todayKey()) ? 'c:0' : '';
    html = `<button class="wa-bk" data-act="back" aria-label="기본 메뉴로">${waIcon('back')}</button>`
      + waSubItems(A.bar).map(([k, l]) => `<button class="wa-sb${k === cur ? ' on' : ''}" data-sub="${k}">${l}</button>`).join('');
  }
  bar.innerHTML = `<div class="wa-bar-in${A.anim ? ' swap' : ''}">${html}</div>`;
  A.anim = false;
}

function waBarClick(e) {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'add') { wqOpen(); return; }
  if (b.dataset.act === 'back') { A.bar = null; A.anim = true; waPaintBar(); return; }
  if (b.dataset.go) {
    const t = b.dataset.go, changed = A.tab !== t;
    A.tab = t;
    if (t === 'more') A.sub = null;   /* 더보기를 다시 누르면 메뉴 처음으로 */
    if (t === 'list' || t === 'cal') { A.bar = t; A.anim = true; }
    if (t === 'cal' && changed && S.month === monthOf(todayKey())) A.calDay = todayKey();
    waPaintBar();
    waRender(changed || t === 'more');
    return;
  }
  const [kind, v] = (b.dataset.sub || '').split(':');
  if (kind === 'f') { A.kind = v; waPaintBar(); waRender(false); }
  else if (kind === 'c') {
    S.month = v === '0' ? monthOf(todayKey()) : shiftMonth(S.month, Number(v));
    A.calDay = S.month === monthOf(todayKey()) ? todayKey() : null;
    waPaintBar(); waRender(false);
  }
}

function waMainClick(e) {
  const row = e.target.closest('[data-tx]');
  if (row) { if (S.canEdit) openForm(Number(row.dataset.tx)); return; }
  const b = e.target.closest('[data-wa]');
  if (!b) return;
  const a = b.dataset.wa;
  if (a === 'list') { A.tab = 'list'; A.bar = 'list'; A.anim = true; S.month = monthOf(todayKey()); waPaintBar(); waRender(true); }
  else if (a === 'add') wqOpen(null, b.dataset.d || null);
  else if (a === 'mv') { S.month = shiftMonth(S.month, Number(b.dataset.d)); waRender(false); }
  else if (a === 'day') { A.calDay = A.calDay === b.dataset.k ? null : b.dataset.k; waRender(false); }
  else if (a === 'open') { A.tab = 'more'; A.sub = b.dataset.p; A.bar = null; waPaintBar(); waRender(true); }
  else if (a === 'site') {
    try { localStorage.setItem(WA_VIEW_KEY, 'site'); } catch (er) {}
    location.replace(location.pathname);
  } else if (a === 'out') {
    if (confirm('로그아웃할까요?')) sb().then(c => c.auth.signOut()).then(() => location.replace(location.pathname));
  }
}

function waRender(toTop) {
  const main = $('#wa-main');
  if (!main) return;
  const sub = A.tab === 'more' && A.sub ? A.sub.split('/') : null;
  const title = $('#wa-title');
  title.textContent = sub ? subLabel(sub[0], sub[1]) : { home: '웨스티', list: '내역', cal: '달력', more: '더보기' }[A.tab];
  title.classList.toggle('plain', A.tab !== 'home');
  $('#wa-subt').textContent = A.tab === 'home' ? `${PEOPLE.join(' · ')}의 ${S.book.name || '말랑한 통장'}` : '';
  $('#wa-back').hidden = !sub;
  $('#wa-face').hidden = !!sub;
  document.title = `웨스티 · ${S.book.name || '말랑한 통장'}`;
  if (!$('#wa-bar .swap')) waPaintBar();
  if (A.tab === 'list') waList(main);
  else if (A.tab === 'cal') waCal(main);
  else if (A.tab === 'more') waMore(main, sub);
  else waHome(main);
  if (toTop) window.scrollTo(0, 0);
}

/* ---- 공용 ---- */
const waDayLabel = (k) => {
  const t = todayKey();
  if (k === t) return '오늘';
  if (k === shiftDay(t, -1)) return '어제';
  return `${+k.slice(5, 7)}월 ${+k.slice(8, 10)}일`;
};
function waRow(r, withDay) {
  const mk = (r.good_bad === 'Good' ? ' 👍' : r.good_bad === 'Bad' ? ' 👎' : '') + (r.haedal_tx_id ? ' 🦦' : '');
  const sub = r.kind === '입금' ? '입금' : [r.kind === '수입' ? '수입' : r.category, r.memo].filter(Boolean).join(' · ');
  return `<button class="wa-tx${S.canEdit ? '' : ' ro'}" data-tx="${r.id}">
    <span class="em" aria-hidden="true">${r.kind === '입금' ? DEPOSIT_EMOJI : r.kind === '수입' ? '💰' : catEmoji(r.category)}</span>
    <span class="t">${withDay ? `<em class="dl">${waDayLabel(r.date)}</em>` : ''}<b>${esc(rowTitle(r))}</b><small>${esc(sub)}${mk}</small></span>
    <span class="v k-${r.kind}">${KIND_SIGN[r.kind] > 0 ? '+' : '−'}${comma(r.amount)}</span>
  </button>`;
}
function waDayGroups(rows) {
  const groups = [], idx = {};
  rows.forEach(r => {
    if (idx[r.date] === undefined) { idx[r.date] = groups.length; groups.push({ k: r.date, items: [] }); }
    groups[idx[r.date]].items.push(r);
  });
  return groups.map(g => {
    const out = totals(g.items).out;
    return `<section class="wa-day"><div class="wa-dh"><b>${waDayLabel(g.k)}</b><span>${DOW[new Date(g.k + 'T00:00:00').getDay()]}요일</span>
      <em>${out ? '−' + comma(out) : ''}</em></div>
      <div class="wa-card">${g.items.map(r => waRow(r, false)).join('')}</div></section>`;
  }).join('');
}
const waSort = (a, b) => b.date.localeCompare(a.date) || b.id - a.id;

/* ---- 달력 — 데이트한 날은 반다나색으로 옅게 ---- */
function waCal(main) {
  const m = S.month;
  const rows = monthRows(m);
  const byDay = {};
  rows.forEach(r => { (byDay[r.date] = byDay[r.date] || []).push(r); });
  const first = new Date(m + '-01T00:00:00').getDay();
  const n = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const today = todayKey();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<span class="wa-cd blank"></span>';
  for (let d = 1; d <= n; d++) {
    const k = `${m}-${String(d).padStart(2, '0')}`;
    const t = totals(byDay[k] || []);
    const wd = (first + d - 1) % 7;
    const short = (v) => v >= 10000 ? (Math.round(v / 1000) / 10) + '만' : comma(v);
    cells += `<button class="wa-cd${t.out ? ' date' : ''}${k === today ? ' today' : ''}${k === A.calDay ? ' sel' : ''}${wd === 0 ? ' sun' : wd === 6 ? ' sat' : ''}" data-wa="day" data-k="${k}">
      <span class="n">${d}</span>${t.out ? `<span class="s">${short(t.out)}</span>` : t.in + t.etc ? `<span class="s i">+${short(t.in + t.etc)}</span>` : ''}</button>`;
  }
  const t = totals(rows);
  const dates = Object.keys(byDay).filter(k => totals(byDay[k]).out).length;
  const sel = A.calDay && monthOf(A.calDay) === m ? A.calDay : null;
  const dayRows = sel ? (byDay[sel] || []).slice().sort(waSort) : [];
  main.innerHTML = `
    <div class="wa-mnav solo"><b>${monthLabel(m)}</b><span>데이트 ${dates}일 · 지출 <b class="o mono">${comma(t.out)}</b></span></div>
    <div class="wa-cal">${DOW.map((w, i) => `<span class="wa-wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</span>`).join('')}${cells}</div>
    ${sel ? (dayRows.length ? waDayGroups(dayRows) : `<div class="wa-empty" style="padding-bottom:4px;">${waDayLabel(sel)}은 기록이 없어요.</div>`)
        + (S.canEdit ? `<button class="wa-dayadd" data-wa="add" data-d="${sel}">＋ ${waDayLabel(sel)} 기록</button>` : '')
      : '<div class="wa-empty">날짜를 누르면 그날 기록이 보여요.</div>'}`;
}

/* ================= 빠른 기록 (폰) =================
   한 번에 한 칸씩 묻는다.  지출: 사용처 → 분류 → 금액 → 날짜   수입: 어디서 → 금액 → 날짜   입금: 누가 → 금액 → 날짜
   사용처를 고르면 예전 기록에서 분류(·지출/수입)를 데려와 분류 칸은 건너뛴다.
   금액은 화면 키패드(폰 키보드가 안 올라와 화면이 밀리지 않는다), 그 사용처에서 자주 쓴 금액이 버튼으로 뜬다.
   기록 줄을 누르면 같은 화면이 '고치기'로 열린다 — 모든 칸 요약이 보이고 누른 칸만 고친다. */
const WQ_STEPS = { '지출': ['merch', 'cat', 'amt', 'date'], '수입': ['merch', 'amt', 'date'], '입금': ['who', 'amt', 'date'] };
const W = { open: false, d: null };
const wqSteps = () => WQ_STEPS[W.d.kind];
const wqStepName = () => wqSteps()[Math.min(W.d.step, wqSteps().length - 1)];

/* 키보드가 올라와도 아래 버튼이 가리지 않게 — 보이는 영역 높이를 CSS 변수로 */
function wqFit() {
  const vv = window.visualViewport, r = document.documentElement.style;
  r.setProperty('--vvh', (vv ? vv.height : window.innerHeight) + 'px');
  r.setProperty('--vvt', (vv ? vv.offsetTop : 0) + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', wqFit); visualViewport.addEventListener('scroll', wqFit); }
window.addEventListener('resize', wqFit);
const wqTyping = (el) => !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT'
  || (el.tagName === 'INPUT' && !/^(button|checkbox|radio|submit|range|color|file)$/i.test(el.type)));
document.addEventListener('focusin', (e) => {
  if (!S.app || !wqTyping(e.target)) return;
  document.body.classList.add('kb-on');
  const t = e.target;
  setTimeout(() => { wqFit(); if (document.activeElement === t && t.closest('#wq')) t.scrollIntoView({ block: 'nearest' }); }, 320);
});
document.addEventListener('focusout', () => {
  if (!S.app) return;
  setTimeout(() => { if (!wqTyping(document.activeElement)) { document.body.classList.remove('kb-on'); wqFit(); } }, 80);
});
/* 손가락이 닿는 순간 누른다 — 키보드가 내려가며 화면이 움직여 엉뚱한 걸 누르지 않게 */
const wqNoBlur = (el) => el && el.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') e.preventDefault(); });

function wqOpen(id, date) {
  if (!S.canEdit) return;
  let d;
  if (id) {
    const r = S.tx.find(x => x.id === id);
    if (!r) return;
    if (r.haedal_tx_id) { toast('🦦 해달에서 적은 기록이라 해달에서 고쳐요'); return; }
    d = { id, kind: r.kind, kindTouched: true, merchant: r.merchant || '', noMerch: !r.merchant, category: r.category, autoCat: null,
          amount: String(Math.round(r.amount)), date: r.date, memo: r.memo || '', good: r.good_bad, depositor: r.depositor || PEOPLE[0],
          step: 9, reach: 9, focus: false, created: r.created_at };
  } else {
    d = { id: null, kind: '지출', kindTouched: false, merchant: '', noMerch: false, category: null, autoCat: null,
          amount: '', date: date || todayKey(), memo: '', good: null, depositor: null, step: 0, reach: 0, focus: true };
  }
  W.open = true; W.d = d;
  let el = $('#wq');
  if (!el) { el = document.createElement('div'); el.id = 'wq'; document.body.appendChild(el); }
  el.hidden = false;
  document.body.classList.add('wq-on');
  document.documentElement.classList.add('wq-lock');
  wqFit();
  wqPaint();
}
function wqClose() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  W.open = false; W.d = null;
  const el = $('#wq');
  if (el) { el.hidden = true; el.innerHTML = ''; }
  document.body.classList.remove('wq-on', 'kb-on');
  document.documentElement.classList.remove('wq-lock');
  waPaintBar();
}

/* 다음 칸 — 고치는 중이면 마지막 칸(요약이 다 보이는 곳)으로 돌아간다 */
function wqNext(skipCat) {
  const d = W.d, st = wqSteps();
  /* 금액을 넣고 넘어갈 때 — 자동으로 고른 분류를 금액까지 보고 다시 고른다 (같은 곳이라도 금액 따라 분류가 다르다) */
  if (st[d.step] === 'amt' && d.kind === '지출' && d.autoCat === 'history' && d.merchant.trim()) {
    const g = guessMerchant(d.merchant, Number(d.amount) || 0);
    if (g && g.kind === '지출' && g.category && (S.book.categories || []).includes(g.category)) d.category = g.category;
  }
  if (d.id) d.step = st.length - 1;
  else {
    let i = Math.min(d.step, st.length - 1) + 1;
    if (skipCat && st[i] === 'cat') i++;
    d.step = Math.min(i, st.length - 1);
  }
  d.focus = st[d.step] === 'merch';
  wqPaint();
}

function wqVal(name) {
  const d = W.d;
  if (name === 'merch') return d.merchant.trim() || (d.noMerch ? '없음' : '');
  if (name === 'cat') return d.category ? `${catEmoji(d.category)} ${d.category}` : '';
  if (name === 'amt') return d.amount ? comma(d.amount) + '원' : '';
  if (name === 'who') return d.depositor || '';
  if (name === 'date') return dayLabel(d.date) + (d.memo.trim() ? ' · ' + d.memo.trim() : '');
  return '';
}
const WQ_LAB = { merch: '사용처', cat: '분류', amt: '금액', who: '누가', date: '날짜' };

function wqPaint() {
  const el = $('#wq'), d = W.d;
  if (!el || !d) return;
  const st = wqSteps();
  d.step = Math.min(d.step, st.length - 1);
  d.reach = Math.max(d.reach, d.step);
  const lab = (n) => n === 'merch' && d.kind === '수입' ? '어디서' : WQ_LAB[n];
  const row = (n, i) => { const v = wqVal(n);
    return `<button class="wq-row" data-s="${i}"><span class="k">${lab(n)}</span><span class="v${n === 'amt' ? ' num' : ''}${v ? '' : ' ph'}">${esc(v || '—')}</span><span class="ed">바꾸기</span></button>`; };
  const before = [], after = [];
  st.forEach((n, i) => { if (i < d.step) before.push(row(n, i)); else if (i > d.step && i <= d.reach) after.push(row(n, i)); });
  el.dataset.step = st[d.step];
  el.innerHTML = `
    <div class="wq-top"><b>${d.id ? '고치기' : '기록'}</b>
      <div class="wq-kinds" role="radiogroup" aria-label="종류">${['지출', '입금', '수입'].map(k =>
        `<button data-k="${k}" role="radio" aria-checked="${d.kind === k}" class="${d.kind === k ? 'on' : ''}">${k}</button>`).join('')}</div>
      <button class="wq-x" id="wq-x">닫기</button></div>
    <div class="wq-main" id="wq-main">
      ${before.length ? `<div class="wq-stack">${before.join('')}</div>` : ''}
      <section class="wq-cur" id="wq-cur"></section>
      <p class="wq-err" id="wq-err"></p>
      ${after.length ? `<div class="wq-stack after">${after.join('')}</div>` : ''}
    </div>
    <div class="wq-dock" id="wq-dock"></div>`;
  $('#wq-x').addEventListener('click', wqClose);
  $$('.wq-kinds button', el).forEach(b => b.addEventListener('click', () => {
    if (b.dataset.k === d.kind) return;
    d.kind = b.dataset.k; d.kindTouched = true;
    if (d.kind === '입금') { d.category = null; d.autoCat = null; d.good = null; }
    if (d.kind === '수입') d.good = null;
    const st2 = wqSteps();
    /* 이미 정한 칸(금액·날짜)은 그대로 두고, 새 종류에서 아직 비어 있는 첫 칸으로 */
    const empty = st2.findIndex(n => n !== 'date' && !wqVal(n));
    const filled = st2.reduce((a, n, i) => (n !== 'date' && wqVal(n)) ? i : a, -1);
    d.step = empty < 0 ? st2.length - 1 : empty;
    d.reach = d.id ? st2.length - 1 : Math.max(d.step, filled);
    d.focus = st2[d.step] === 'merch';
    wqPaint();
  }));
  $$('[data-s]', el).forEach(b => b.addEventListener('click', () => {
    d.step = Number(b.dataset.s); d.focus = wqSteps()[d.step] === 'merch'; wqPaint();
  }));
  const cur = $('#wq-cur'), dock = $('#wq-dock');
  ({ merch: wqMerch, cat: wqCat, who: wqWho, amt: wqAmt, date: wqDate })[st[d.step]](cur, dock);
  dock.hidden = !dock.innerHTML.trim();
  const m = $('#wq-main');
  m.scrollTop = st[d.step] === 'merch' ? m.scrollHeight : 0;
}

/* 1) 사용처 — 입력줄은 맨 아래(키보드 바로 위), 후보는 그 위로. 가장 그럴듯한 후보에 불이 켜져 있고 '다음'이면 그걸 고른다 */
function wqMerch(cur, dock) {
  const d = W.d;
  cur.innerHTML = `<div class="wq-list" id="wq-sugs"></div>`;
  dock.innerHTML = `<div class="wq-drow">
    <input class="wq-in" id="wq-merch" placeholder="${d.kind === '수입' ? '예) 이자, 환불' : '어디에 썼나요?'}" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="next" value="${esc(d.merchant)}">
    <button class="wq-go" id="wq-mgo">다음</button></div>`;
  const mi = $('#wq-merch');
  const sugs = () => {
    const q = mi.value.trim();
    const list = wqSugFor(q).slice(0, 6);
    const exact = list.some(e => e.key === norm(q));
    const rows = list.map((e, i) => { const g = guessFrom(e, 0);
      return `<button data-m="${esc(e.name)}" class="${i === 0 ? 'best' : ''}"><span class="em">${g.kind === '수입' ? '💰' : catEmoji(g.category)}</span>
        <span class="nm">${esc(e.name)}</span><span class="ct">${esc(g.kind === '수입' ? '수입' : (g.category || ''))} · ${e.n}번</span>${i === 0 ? '<span class="kb">다음 ↵</span>' : ''}</button>`; });
    if (q && !exact) rows.push(`<button data-m="${esc(q)}" class="new${list.length ? '' : ' best'}"><span class="nm">'${esc(q)}' 새로 쓰기</span>${list.length ? '' : '<span class="kb">다음 ↵</span>'}</button>`);
    rows.push('<button data-m="" data-none="1" class="mut"><span class="nm">사용처 없이 넘어가기</span></button>');
    const host = $('#wq-sugs');
    host.innerHTML = (!q && !list.length ? '<div class="wq-hint">사용처를 적어 주세요 — 다음부터는 여기 떠요</div>' : '') + rows.reverse().join('');
    $$('[data-m]', host).forEach(b => {
      b.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') { e.preventDefault(); b.dataset.hit = '1'; } });
      b.addEventListener('pointerup', (e) => { if (b.dataset.hit) { e.preventDefault(); delete b.dataset.hit; wqPickMerch(b.dataset.m); } });
      b.addEventListener('pointercancel', () => { delete b.dataset.hit; });
      b.addEventListener('click', () => { if (W.d && wqStepName() === 'merch') wqPickMerch(b.dataset.m); });
    });
    const m = $('#wq-main'); if (m) m.scrollTop = m.scrollHeight;
    return list;
  };
  const best = () => {
    const q = mi.value.trim();
    const list = wqSugFor(q);
    /* 아무것도 안 쳤으면 가장 자주 쓴 곳, 쳤으면 맞는 후보 — 없으면 친 그대로 */
    wqPickMerch(list.length ? list[0].name : q);
  };
  sugs();
  const sync = () => { d.merchant = mi.value; sugs(); };
  mi.addEventListener('input', sync);
  mi.addEventListener('compositionend', sync);
  mi.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    e.preventDefault(); best();
  });
  const go = $('#wq-mgo');
  wqNoBlur(go);
  go.addEventListener('click', best);
  /* 누른 손길 안에서 바로 커서를 줘야 아이폰 키보드가 올라온다 */
  if (d.focus) { d.focus = false; mi.focus({ preventScroll: true }); }
}
/* 지출이면 지출로 쓴 곳, 수입이면 수입으로 쓴 곳만 — 종류를 직접 고르지 않았으면 이름을 쳤을 때만 둘 다 */
function wqSugFor(q) {
  const d = W.d;
  const list = suggestMerchants(q, 0);
  if (!d.kindTouched && q.trim()) return list;
  return list.filter(e => e.rows.some(r => r.kind === d.kind));
}
function wqPickMerch(name) {
  const d = W.d;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  d.merchant = name; d.noMerch = !name;
  const g = name ? guessMerchant(name, Number(d.amount) || 0) : null;
  if (g && !d.kindTouched && g.kind !== d.kind && g.kind !== '입금') { d.kind = g.kind; if (d.kind !== '지출') d.good = null; }
  const cats = S.book.categories || [];
  let got = false;
  if (d.kind === '지출' && g && g.category && cats.includes(g.category) && (d.category == null || d.autoCat)) {
    d.category = g.category; d.autoCat = g.from; got = true;
  }
  wqNext(got);
}

/* 2) 분류 — 누르기만 */
function wqCat(cur) {
  const d = W.d, cats = S.book.categories || [];
  cur.innerHTML = `<div class="wq-lab">분류${d.autoCat ? `<i>${d.autoCat === 'history' ? '예전 기록에서 골랐어요' : '이름으로 짐작했어요'}</i>` : ''}</div>
    <div class="wq-grid">${cats.map(c => `<button data-c="${esc(c)}" class="${d.category === c ? 'on' : ''}"><i>${catEmoji(c)}</i>${esc(c)}</button>`).join('')}</div>`;
  $$('[data-c]', cur).forEach(b => b.addEventListener('click', () => { d.category = b.dataset.c; d.autoCat = null; wqNext(); }));
}

/* 입금 — 누가 넣었나. 이번 달 약속까지 남은 돈도 같이 */
function wqWho(cur) {
  const d = W.d, rows = monthRows(monthOf(d.date));
  cur.innerHTML = `<div class="wq-lab">누가 넣었나요?</div>
    <div class="wq-who">${PEOPLE.map(who => {
      const goal = depositGoal(who), got = depositOf(who, rows);
      return `<button data-u="${esc(who)}" class="${d.depositor === who ? 'on' : ''}"><b>${esc(who)}</b>
        <span>${goal ? (got >= goal ? '이번 달 약속 완료 ✓' : `약속까지 ${comma(goal - got)}원`) : ''}</span></button>`; }).join('')}</div>`;
  $$('[data-u]', cur).forEach(b => b.addEventListener('click', () => { d.depositor = b.dataset.u; wqNext(); }));
}

/* 금액 후보 — 입금이면 약속까지 남은 돈·약속 금액, 아니면 그 사용처에서 자주 쓴 금액 */
function wqOften() {
  const d = W.d;
  if (d.kind === '입금') {
    if (!d.depositor) return [];
    const goal = depositGoal(d.depositor), left = goal - depositOf(d.depositor, monthRows(monthOf(d.date)));
    return [...new Set([left > 0 ? left : 0, goal].filter(v => v > 0))];
  }
  const k = norm(d.merchant);
  if (!k) return [];
  const cnt = {};
  S.tx.filter(r => r.kind === d.kind && norm(r.merchant) === k).forEach(r => { const a = Math.round(Number(r.amount)); cnt[a] = (cnt[a] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1] || b[0] - a[0]).slice(0, 4).map(x => Number(x[0]));
}

/* 3) 금액 — 화면 키패드 */
function wqAmt(cur, dock) {
  const d = W.d;
  const often = wqOften();
  cur.innerHTML = `<div class="wq-lab">금액</div>
    <div class="wq-amt${d.amount ? '' : ' ph'}" id="wq-amt">${d.amount ? comma(d.amount) : '0'}<small>원</small></div>
    ${often.length ? `<div class="wq-chips row">${often.map(a => `<button data-a="${a}" class="num">${comma(a)}</button>`).join('')}</div>` : ''}`;
  dock.innerHTML = `<div class="wq-pad" id="wq-pad">
      ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button data-k="${k}">${k}</button>`).join('')}
      <button class="fn" data-k="00">00</button><button data-k="0">0</button><button class="fn" data-k="del" aria-label="지우기">⌫</button>
    </div>
    <div class="wq-acts"><button class="wq-save" id="wq-next" ${d.amount ? '' : 'disabled'}>${d.id ? '확인' : '다음'}</button></div>`;
  $('#wq-pad').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    const k = b.dataset.k;
    let v = d.amount;
    if (k === 'del') v = v.slice(0, -1);
    else if (v.length < 10) v = (v === '' && (k === '00' || k === '0')) ? '' : v + k;
    d.amount = v;
    const a = $('#wq-amt');
    a.classList.toggle('ph', !v);
    a.innerHTML = `${v ? comma(v) : '0'}<small>원</small>`;
    $('#wq-next').disabled = !v;
  });
  $$('[data-a]', cur).forEach(b => b.addEventListener('click', () => { d.amount = b.dataset.a; wqNext(); }));
  $('#wq-next').addEventListener('click', () => { if (d.amount) wqNext(); });
}

/* 4) 날짜 · 어땠나 · 메모 → 기록하기 */
function wqDate(cur, dock) {
  const d = W.d;
  const days = [[0, '오늘'], [-1, '어제'], [-2, '그저께']];
  const custom = !days.some(([n]) => d.date === shiftDay(todayKey(), n));
  cur.innerHTML = `<div class="wq-lab">날짜</div>
    <div class="wq-chips">
      ${days.map(([n, l]) => `<button data-d="${n}" class="${d.date === shiftDay(todayKey(), n) ? 'on' : ''}">${l}</button>`).join('')}
      <label class="wq-datepick${custom ? ' on' : ''}"><span>${custom ? esc(dayLabel(d.date)) : '다른 날'}</span>
        <input type="date" id="wq-date" value="${d.date}"></label>
    </div>
    ${d.kind === '지출' ? `<div class="wq-lab">어땠나요 <i>선택</i></div>
    <div class="wq-chips">
      <button data-g="Good" class="g${d.good === 'Good' ? ' on' : ''}">👍 좋은 지출</button>
      <button data-g="Bad" class="b${d.good === 'Bad' ? ' on' : ''}">👎 아쉬운 지출</button>
    </div>` : ''}
    <input class="wq-in wq-memo" id="wq-memo" placeholder="메모 (선택) — 어디서 무엇을 했는지" value="${esc(d.memo)}" autocomplete="off" enterkeyhint="done">`;
  dock.innerHTML = `<div class="wq-acts">${d.id ? '<button class="wq-del" id="wq-del">삭제</button>' : ''}
    <button class="wq-save" id="wq-save">${d.id ? '고친 내용 저장' : '기록하기'}</button></div>`;
  const memo = $('#wq-memo');
  const keepMemo = () => { d.memo = memo.value; };
  $$('[data-d]', cur).forEach(b => b.addEventListener('click', () => { keepMemo(); d.date = shiftDay(todayKey(), Number(b.dataset.d)); wqPaint(); }));
  const dp = $('#wq-date');
  dp.addEventListener('change', () => { if (dp.value) { keepMemo(); d.date = dp.value; wqPaint(); } });
  $$('[data-g]', cur).forEach(b => b.addEventListener('click', () => {
    d.good = d.good === b.dataset.g ? null : b.dataset.g;
    $$('[data-g]', cur).forEach(x => x.classList.toggle('on', d.good === x.dataset.g));
  }));
  memo.addEventListener('input', keepMemo);
  memo.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); memo.blur(); } });
  const sv = $('#wq-save');
  wqNoBlur(sv);
  sv.addEventListener('click', wqSave);
  const del = $('#wq-del');
  if (del) {
    wqNoBlur(del);
    del.addEventListener('click', async () => {
      if (!confirm('이 기록을 삭제할까요?')) return;
      const { error } = await (await sb()).from('date_tx').delete().eq('id', d.id);
      if (error) { $('#wq-err').textContent = '삭제하지 못했어요 — ' + error.message; return; }
      wqClose(); toast('삭제했어요');
      await loadAll(); waRender(false);
    });
  }
}

async function wqSave() {
  const d = W.d;
  const memo = $('#wq-memo');
  if (memo) { d.memo = memo.value; memo.blur(); }
  const st = wqSteps();
  const fail = (step, msg) => { d.step = st.indexOf(step); d.reach = Math.max(d.reach, d.step); wqPaint(); $('#wq-err').textContent = msg; };
  const n = Number(d.amount || 0);
  if (d.kind === '입금' && !PEOPLE.includes(d.depositor)) return fail('who', '누가 넣었는지 골라 주세요.');
  if (d.kind === '지출' && !d.category) return fail('cat', '분류를 골라 주세요.');
  if (!n) return fail('amt', '금액을 넣어 주세요.');
  const btn = $('#wq-save');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '저장 중…';
  const payload = {
    kind: d.kind, amount: n, date: d.date,
    category: d.kind === '지출' ? d.category : null,
    merchant: d.kind === '입금' ? null : (d.merchant.trim() || null),
    memo: d.memo.trim() || null,
    good_bad: d.kind === '지출' ? d.good : null,
    depositor: d.kind === '입금' ? d.depositor : null
  };
  const c = await sb();
  const { error } = d.id
    ? await c.from('date_tx').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', d.id)
    : await c.from('date_tx').insert({ ...payload, book_id: S.book.id });
  if (error) {
    $('#wq-err').textContent = '저장하지 못했어요 — ' + error.message;
    btn.disabled = false; btn.textContent = d.id ? '고친 내용 저장' : '기록하기';
    return;
  }
  const isEdit = !!d.id, kind = d.kind;
  wqClose();
  toast(isEdit ? '고쳤어요' : `${kind} ${comma(n)}원 기록했어요 🐾`);
  try { await loadAll(); } catch (e) {}
  /* 새 기록은 홈으로 — 잔액·입금 현황이 바로 보이게. 고친 건 보던 화면 그대로 */
  if (!isEdit) { A.tab = 'home'; A.bar = null; A.sub = null; waPaintBar(); waRender(true); }
  else waRender(false);
}

/* ================= 로그인 · 시작 ================= */
function showGate(html) { $('#app').innerHTML = `<div class="gate">${html}</div>`; }

/* 가입 절차 없이 이메일로 온 로그인 링크를 누르면 들어온다. 처음이면 계정도 그때 만들어진다.
   비밀번호가 있는 계정은 비밀번호로도 들어올 수 있다. */
/* 메일로 온 6자리 코드를 이 화면에 넣어 들어온다.
   링크 방식은 아이폰 홈 화면 앱과 Safari 가 로그인 상태를 따로 갖고, 링크가 한 번 쓰이면 끝이라
   (다른 기기에서 먼저 열리면 폰에선 막힌다) 코드를 기본으로 한다. 메일 속 링크도 같은 브라우저면 여전히 된다. */
function showCode(em) {
  showGate(`<div class="mark" style="font-size:40px;text-align:center;">📮</div><h2>메일을 확인하세요</h2>
    <p class="sub">${esc(em)} 로 보낸 메일의<br><b>6자리 코드</b>를 넣어 주세요.</p>
    <input class="amt" id="cd-in" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000" style="text-align:center;letter-spacing:6px;">
    <p class="err" id="cd-err"></p>
    <button class="btn full" id="cd-go" style="margin-top:14px;">들어가기</button>
    <button class="btn ghost full" id="lk-back" style="margin-top:8px;">처음으로</button>`);
  const inp = $('#cd-in'), err = $('#cd-err');
  setTimeout(() => inp.focus(), 50);
  const go = async () => {
    const token = digits(inp.value);
    if (token.length < 6) { err.textContent = '코드 6자리를 넣으세요.'; return; }
    $('#cd-go').disabled = true;
    const { error } = await (await sb()).auth.verifyOtp({ email: em, token, type: 'email' });
    $('#cd-go').disabled = false;
    if (error) { err.textContent = '코드가 맞지 않거나 시간이 지났어요. 처음으로 가서 다시 받아 주세요.'; return; }
    start();
  };
  $('#cd-go').addEventListener('click', go);
  inp.addEventListener('input', () => { if (digits(inp.value).length === 6) go(); });
  $('#lk-back').addEventListener('click', () => showLogin());
}

function showLogin(msg) {
  showGate(`
    <img class="face" src="icon.png" alt="웨스티">
    <h2>웨스티</h2>
    <p class="sub">${esc(msg || '말랑한 통장 · 이메일로 로그인 코드를 보내 드려요')}</p>
    <label class="lab">이메일</label>
    <input class="in" id="lk-em" type="email" autocomplete="username" inputmode="email">
    <p class="err" id="lk-err"></p>
    <button class="btn full" id="lk-link" style="margin-top:14px;">로그인 코드 받기</button>
    <details>
      <summary>비밀번호로 로그인</summary>
      <input class="in" id="lk-pw" type="password" autocomplete="current-password" placeholder="비밀번호" style="margin-top:10px;">
      <button class="btn ghost full" id="lk-go" style="margin-top:8px;">로그인</button>
    </details>`);
  const err = $('#lk-err');
  const email = async () => {
    const v = $('#lk-em').value.trim().toLowerCase();
    if (!v) { err.textContent = '이메일을 입력하세요.'; return null; }
    const { data: ok, error } = await (await sb()).rpc('date_email_allowed', { em: v });
    if (error) { err.textContent = '확인하지 못했어요 — ' + error.message; return null; }
    if (!ok) { err.textContent = '이 통장에 등록된 이메일이 아니에요.'; return null; }
    err.textContent = '';
    return v;
  };
  $('#lk-link').addEventListener('click', async () => {
    const em = await email(); if (!em) return;
    $('#lk-link').disabled = true;
    const { error } = await (await sb()).auth.signInWithOtp({
      email: em, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
    $('#lk-link').disabled = false;
    if (error) { err.textContent = '메일을 보내지 못했어요 — ' + error.message; return; }
    showCode(em);
  });
  const go = async () => {
    const em = await email(); if (!em) return;
    const password = $('#lk-pw').value;
    if (!password) { err.textContent = '비밀번호를 입력하세요.'; return; }
    $('#lk-go').disabled = true;
    const { error } = await (await sb()).auth.signInWithPassword({ email: em, password });
    $('#lk-go').disabled = false;
    if (error) { err.textContent = '로그인하지 못했어요. 비밀번호를 확인하세요.'; return; }
    start();
  };
  $('#lk-go').addEventListener('click', go);
  $('#lk-pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function start() {
  $('#app').innerHTML = '<div class="empty" style="padding-top:22vh;">불러오는 중…</div>';
  try {
    const c = await sb();
    const { data: { user } } = await c.auth.getUser();
    if (!user) { showLogin(); return; }
    S.uid = user.id;
    /* 처음 들어오면 멤버로 등록되고, 통장이 아직 없으면 그때 만들어진다.
       등록된 이메일이 아니면 DB 가 거절한다. */
    const { data: bookId, error } = await c.rpc('date_enter');
    if (error) {
      await c.auth.signOut();
      showLogin(`${user.email} 은 이 통장에 들어올 수 없는 계정이에요`);
      return;
    }
    const { data: canEdit } = await c.rpc('date_is_editor');
    S.canEdit = !!canEdit;
    document.body.classList.toggle('can-edit', S.canEdit);
    S.book = { id: bookId };
    await loadAll();
    /* 폰이면 앱 화면, 아니면(또는 'PC 화면'을 골랐으면) 사이트 화면 */
    if (appWanted()) { history.replaceState(null, '', location.pathname + location.search); waShell(); waRender(true); return; }
    readHash();
    renderShell();
    renderPage();
  } catch (e) {
    $('#app').innerHTML = `<div class="empty" style="padding-top:20vh;">불러오지 못했어요.<br>${esc(e.message || e)}</div>`;
  }
}

(async () => {
  let c;
  try { c = await sb(); }
  catch (e) { $('#app').innerHTML = '<div class="empty" style="padding-top:22vh;">네트워크를 확인하고 다시 열어주세요.</div>'; return; }
  /* 로그인 링크로 돌아온 경우도 getSession 이 주소의 토큰을 먼저 처리해 세션을 돌려준다 */
  /* 이미 쓴 링크·만료된 링크로 돌아오면 주소에 error 가 붙는다 — 조용히 넘어가지 말고 알려 준다 */
  const hp = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
  const linkErr = hp.get('error_description') || hp.get('error');
  if (linkErr) history.replaceState(null, '', location.pathname);
  const { data } = await c.auth.getSession();
  if (data.session) start();
  else showLogin(linkErr ? '그 링크는 이미 쓰였거나 만료됐어요 — 코드를 다시 받아 주세요' : null);
  c.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT') location.replace(location.pathname); });
  /* 상대가 방금 적은 기록이 보이도록, 탭으로 돌아올 때마다 다시 읽는다 */
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.book || !$('#ov').hidden || W.open) return;
    try { await loadAll(); renderPage(); } catch (e) {}
  });
  window.addEventListener('hashchange', () => { if (S.book && !S.app) { readHash(); renderPage(); } });
})();
</script>
</body>
</html>
