<style>
/* ═══ 색 — 웨스티 ═══
   흰 털(바탕·상자), 까만 코(글자), 빨간 반다나(강조), 갈색 친구 털(지출), 하늘색 산책길(입금), 꿀빛 간식(수입).
   기본은 낮(흰 털 위), 시스템이 다크 모드면 밤 거실(어두운 바탕 위의 흰 강아지)로 바뀐다. */
:root{
  --bg:#faf7f2; --bg-2:#f3eee6; --panel:#ffffff; --panel-2:#f8f3ec;
  --border:rgba(70,48,36,0.10); --border-strong:rgba(70,48,36,0.18);
  --text:#221d1b; --text-dim:#5a514b; --text-faint:#8b8179;
  --accent-fill:#c8443b; --accent-text:#a9352d; --accent-bg:rgba(200,68,59,0.08); --accent-line:rgba(200,68,59,0.40);
  --ink-on-accent:#ffffff;
  --in-fill:#4a7db0; --in-text:#2f6496; --in-bg:rgba(74,125,176,0.10);
  --out-fill:#9a6a46; --out-text:#7f5232; --out-bg:rgba(154,106,70,0.11);
  --etc-fill:#c0952e; --etc-text:#86660f; --etc-bg:rgba(192,149,46,0.12);
  --fur:#ffffff; --fur-2:#f1e9df; --fur-shade:#c2b0a0; --fur-line:#dccfc2; --ink:#1d1918; --ear:#eea79f; --blush:#f4a9a2; --tongue:#e8837f; --frame:#6b2a26;
  --treat:#d9a35a; --treat-2:#b97f3a; --treat-3:#ecc283; --glass:rgba(255,255,255,0.55); --glass-line:rgba(70,48,36,0.22);
  --ground:rgba(70,48,36,0.06); --jar-glow:#f3eee6;
  --lift:0 1px 2px rgba(70,48,36,0.04), 0 8px 22px -14px rgba(70,48,36,0.28);
  --shade:rgba(40,28,22,0.38);
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --round:'Jua','Noto Sans KR',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --fs-tiny:10.5px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-base:13px; --fs-md:14px; --fs-lg:16px;
  --fs-xl:19px; --fs-2xl:22px; --fs-3xl:26px; --fs-4xl:32px;
  --r-sm:7px; --r-md:11px; --r-lg:18px; --r-pill:999px;
  --gap:12px; --edge:clamp(12px,1.6vw,26px);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#19171a; --bg-2:#1f1c20; --panel:#252226; --panel-2:#2d292e;
    --border:rgba(255,244,232,0.08); --border-strong:rgba(255,244,232,0.16);
    --text:#f4efe8; --text-dim:#c6bcb2; --text-faint:#988e85;
    --accent-fill:#d65a50; --accent-text:#f08b82; --accent-bg:rgba(214,90,80,0.14); --accent-line:rgba(214,90,80,0.48);
    --ink-on-accent:#ffffff;
    --in-fill:#6f9fd0; --in-text:#9cc2ea; --in-bg:rgba(111,159,208,0.15);
    --out-fill:#b98560; --out-text:#dcb08c; --out-bg:rgba(185,133,96,0.16);
    --etc-fill:#d2ad55; --etc-text:#e8cd84; --etc-bg:rgba(210,173,85,0.15);
    --fur:#f7f2ea; --fur-2:#e3d9cd; --fur-shade:#8d8278; --fur-line:#b9ad9f; --frame:#8a3a34;
    --glass:rgba(255,255,255,0.06); --glass-line:rgba(255,244,232,0.24);
    --ground:rgba(255,244,232,0.06); --jar-glow:transparent;
    --lift:0 1px 0 rgba(255,244,232,0.03), 0 10px 26px -16px rgba(0,0,0,0.7);
    --shade:rgba(8,6,8,0.7);
    color-scheme:dark;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;}
body{min-height:100vh;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-family:var(--mono);}
[hidden]{display:none !important;}

/* ═══ 헤더 — 해달 웹과 같은 뼈대: 브랜드 · 오른쪽 동작 / 아래 최상위 메뉴 ═══ */
.site-header{position:sticky;top:0;z-index:40;background:var(--bg);
  padding:calc(12px + var(--top)) var(--edge) 0;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
.brand{display:flex;align-items:baseline;gap:9px;cursor:pointer;user-select:none;min-width:0;}
.brand .mark{display:block;width:34px;height:34px;flex:0 0 auto;align-self:center;}
.brand .mark svg{display:block;width:100%;height:100%;}
.brand h1{font-family:var(--round);font-size:24px;font-weight:400;margin:0;letter-spacing:0;white-space:nowrap;line-height:1.2;}
.brand .tagline{font-size:var(--fs-xs);color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acts{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.bal-pill{font-family:var(--mono);font-size:var(--fs-sm);font-weight:600;color:var(--accent-text);
  border:1px solid var(--border);border-radius:var(--r-md);padding:5px 10px;white-space:nowrap;background:var(--panel);}
.bal-pill small{font-family:var(--sans);font-weight:400;color:var(--text-faint);margin-right:6px;}
.nav-act{height:32px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;
  font-weight:500;font-size:var(--fs-base);border:1px solid var(--border-strong);border-radius:var(--r-md);
  background:transparent;color:var(--text-dim);white-space:nowrap;transition:color .15s,border-color .15s,filter .15s;}
.nav-act:hover{color:var(--text);border-color:var(--accent-fill);}
.nav-act.accent{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--ink-on-accent);font-weight:700;}
.nav-act.accent:hover{filter:brightness(1.06);}
.nav-act kbd{font-family:var(--mono);font-size:10px;background:rgba(0,0,0,0.14);border-radius:3px;padding:2px 4px;line-height:1;opacity:.8;}

.navrow{border-bottom:2px solid var(--border-strong);margin:0 calc(-1 * var(--edge));padding:0 var(--edge);}
.navbar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;}
.navbar::-webkit-scrollbar{display:none;}
.nav-btn{font-size:var(--fs-md);font-weight:500;background:transparent;border:0;color:var(--text-faint);
  padding:9px 14px 10px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--accent-text);border-bottom-color:var(--accent-text);font-weight:700;}

/* ═══ 본문 — 좌측 레일(하위 메뉴) + 본문 ═══ */
.site-layout{display:grid;grid-template-columns:calc(176px + var(--edge)) minmax(0,1fr);align-items:start;}
.site-layout.no-rail{grid-template-columns:minmax(0,1fr);}
.site-layout.no-rail .railnav{display:none;}
.railnav{position:sticky;top:var(--hdr-h,96px);min-height:calc(100vh - var(--hdr-h,96px));
  display:flex;flex-direction:column;gap:1px;background:var(--bg-2);border-right:1px solid var(--border);
  padding:16px 14px 28px var(--edge);}
.sub-cat{font-size:var(--fs-xs);font-weight:700;color:var(--text-dim);background:var(--panel-2);
  border-radius:var(--r-sm);padding:6px 10px;margin:16px 0 6px;}
.sub-cat:first-child{margin-top:0;}
.sub-btn{position:relative;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:var(--r-md);color:var(--text-dim);font-size:var(--fs-base);padding:7px 10px 7px 22px;line-height:1.4;}
.sub-btn::before{content:'';position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--border-strong);}
.sub-btn:hover{background:var(--panel);border-color:var(--border);color:var(--text);}
.sub-btn.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent-text);font-weight:700;}
.sub-btn.on::before{background:var(--accent-text);}
.site-main{min-width:0;padding:0 var(--edge) calc(56px + var(--bot));}
.page-head{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-0.02em;padding:22px 0 0;}
#page{padding-top:14px;display:flex;flex-direction:column;gap:var(--gap);}
.page-head[hidden] + #page{padding-top:22px;}
.narrow{max-width:640px;width:100%;}

@media (max-width:860px){
  .brand .tagline{display:none;}
  .bal-pill{display:none;}
  .nav-act kbd{display:none;}
  .site-layout{grid-template-columns:minmax(0,1fr);}
  .railnav{position:static;min-height:0;flex-direction:row;align-items:center;gap:4px;overflow-x:auto;
    background:transparent;border-right:0;border-bottom:1px solid var(--border);padding:10px var(--edge) 12px;
    scrollbar-width:none;}
  .railnav::-webkit-scrollbar{display:none;}
  .sub-cat{display:none;}
  .sub-btn{width:auto;white-space:nowrap;padding:6px 12px;border-color:var(--border);}
  .sub-btn::before{display:none;}
  .page-head{font-size:var(--fs-xl);padding-top:16px;}
  .nav-btn{padding:9px 11px 10px;}
}

/* ═══ 상자 ═══ */
.box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;min-width:0;box-shadow:var(--lift);}
.hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.hd b{font-size:var(--fs-md);font-weight:700;letter-spacing:-0.01em;}
.hd span,.hd .lnk{margin-left:auto;font-size:var(--fs-xs);color:var(--text-faint);}
.lnk{background:none;border:0;padding:0;font-size:var(--fs-xs);color:var(--text-faint);}
.lnk:hover{color:var(--accent-text);}
.big{font-family:var(--mono);font-size:var(--fs-4xl);font-weight:700;letter-spacing:-0.03em;line-height:1.1;}
.big small{font-family:var(--sans);font-size:var(--fs-md);font-weight:500;color:var(--text-faint);margin-left:3px;letter-spacing:0;}
.subline{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:var(--fs-xs);color:var(--text-faint);}
.sep{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.grid3{display:grid;grid-template-columns:1.05fr 1.1fr 0.95fr;gap:var(--gap);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);}
@media (max-width:1180px){ .grid3{grid-template-columns:1fr 1fr;} .grid3>:last-child{grid-column:1/-1;} }
@media (max-width:860px){ .grid3,.grid2{grid-template-columns:1fr;} .big{font-size:var(--fs-3xl);} .box{padding:14px;} }

.i{color:var(--in-text);} .o{color:var(--out-text);} .e{color:var(--etc-text);} .a{color:var(--accent-text);}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tri div{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 11px;min-width:0;}
.tri span{display:block;font-size:var(--fs-tiny);color:var(--text-faint);}
.tri b{font-family:var(--mono);font-size:var(--fs-lg);font-weight:600;}
@media (max-width:420px){ .tri b{font-size:var(--fs-md);} .tri div{padding:8px;} }
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:var(--fs-sm);padding:4px 0;color:var(--text-dim);}
.kv b{font-family:var(--mono);font-weight:600;color:var(--text);}
.bar{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;margin-top:5px;}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent-fill);}
.bar i.in{background:var(--in-fill);}
.bar i.out{background:var(--out-fill);}
.brow{padding:6px 0;}
.brow .kv{padding:0;}
.note{font-size:var(--fs-xs);color:var(--text-faint);line-height:1.6;margin-top:10px;}
.empty{text-align:center;color:var(--text-faint);font-size:var(--fs-sm);padding:26px 0;}
.pill{display:inline-block;font-size:var(--fs-tiny);padding:1px 7px;border-radius:var(--r-pill);border:1px solid var(--border);color:var(--text-faint);}

/* ═══ 웨스티의 간식통 — 알갱이 하나 = 1만 원, 뼈다귀 하나 = 100만 원, 바닥 발자국 = 이번 달 지출 ═══ */
.jar-hero{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:22px;align-items:center;}
.jar-svg{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 38% 45%, var(--jar-glow) 0%, var(--jar-glow) 45%, transparent 75%);border-radius:var(--r-lg);}
.jar-svg .tail{transform-box:view-box;transform-origin:var(--tail-o);animation:wag 1.6s ease-in-out infinite;}
.jar-svg .head{transform-box:view-box;transform-origin:var(--head-o);animation:tilt 6s ease-in-out infinite;}
@keyframes wag{0%,100%{transform:rotate(-9deg);}50%{transform:rotate(12deg);}}
@keyframes tilt{0%,70%,100%{transform:rotate(0deg);}80%{transform:rotate(-5deg);}90%{transform:rotate(-5deg);}}
@media (prefers-reduced-motion: reduce){ .jar-svg .tail,.jar-svg .head{animation:none;} }
.stage{display:inline-block;font-family:var(--round);font-size:var(--fs-md);color:var(--accent-text);background:var(--accent-bg);
  border:1px solid var(--accent-line);border-radius:var(--r-pill);padding:2px 12px;margin-bottom:8px;}
.jar-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-xs);color:var(--text-faint);margin-top:10px;}
@media (max-width:860px){ .jar-hero{grid-template-columns:1fr;gap:6px;} .jar-svg{max-width:320px;margin:0 auto;} }

/* ═══ 도구줄 ═══ */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mnav{display:inline-flex;align-items:center;gap:6px;}
.mnav button{width:30px;height:30px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:transparent;color:var(--text-dim);}
.mnav button:hover{border-color:var(--accent-fill);color:var(--text);}
.mnav b{font-family:var(--mono);font-size:var(--fs-md);min-width:100px;text-align:center;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{height:30px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:transparent;
  color:var(--text-dim);font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.chip:hover{border-color:var(--accent-fill);color:var(--text);}
.chip.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--ink-on-accent);font-weight:700;}
.chip .x{opacity:.6;margin-left:2px;}
.search{height:30px;min-width:0;flex:1 1 160px;max-width:260px;padding:0 11px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r-md);font-size:var(--fs-sm);}
.search:focus{outline:none;border-color:var(--accent-fill);}
.grow{flex:1;}

/* ═══ 내역 표 ═══ */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
.tbl th{font-size:var(--fs-tiny);font-weight:500;color:var(--text-faint);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.can-edit .tbl tr.rw{cursor:pointer;}
.can-edit .tbl tr.rw:hover td{background:var(--panel-2);}
.tbl tr.day-first td{border-top:1px solid var(--border-strong);}
.tbl .num{text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap;}
.tbl .dt{color:var(--text-faint);white-space:nowrap;font-size:var(--fs-xs);width:92px;}
.tbl .cat{white-space:nowrap;color:var(--text-dim);}
.tbl .memo{color:var(--text-faint);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tbl .ttl{font-weight:500;}
.tbl .ttl .mk{margin-left:5px;font-size:12px;}
.tbl .msub{display:none;font-size:var(--fs-xs);color:var(--text-faint);}
.em{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--bg-2);align-items:center;justify-content:center;font-size:13px;margin-right:7px;vertical-align:middle;}
@media (max-width:860px){
  .tbl.tx thead,.tbl.tx .cat,.tbl.tx .memo{display:none;}
  .tbl .dt{width:58px;}
  .tbl .msub{display:block;}
  .tbl .em{display:none;}
  .tbl td{padding:9px 5px;}
}

/* ═══ 캘린더 ═══ */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.cal .dw{font-size:var(--fs-tiny);color:var(--text-faint);text-align:center;padding:4px 0;}
.cal .dw.sun{color:var(--out-text);}
.cell{min-height:78px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 7px;
  display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--text);font-size:var(--fs-xs);min-width:0;}
.cell.blank{background:transparent;border-color:transparent;}
.cell .dn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--text-faint);}
.cell.today .dn{color:var(--accent-text);font-weight:700;}
.cell.has{background:var(--panel);}
.cell.date{background:var(--accent-bg);border-color:var(--accent-line);}
.cell.sel{outline:2px solid var(--accent-fill);outline-offset:-1px;}
.cell .co{font-family:var(--mono);color:var(--out-text);font-weight:600;font-size:var(--fs-tiny);}
.cell .ci{font-family:var(--mono);color:var(--in-text);font-size:var(--fs-tiny);}
.cell .ce{font-size:11px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text-dim);}
@media (max-width:860px){ .cell{min-height:54px;padding:4px;} .cell .ce,.cell .ci{display:none;} .cell .co{font-size:9px;letter-spacing:-0.3px;} .cal{gap:3px;} }

/* ═══ 추이 막대 ═══ */
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px;}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0;}
.chart .bars{display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;flex:1;}
.chart .bars i{display:block;flex:1;max-width:16px;border-radius:3px 3px 0 0;min-height:2px;}
.chart .bars i.in{background:var(--in-fill);}
.chart .bars i.out{background:var(--out-fill);}
.chart .m span{font-size:var(--fs-tiny);color:var(--text-faint);font-family:var(--mono);}
.chart .m.cur span{color:var(--accent-text);font-weight:700;}
@media (max-width:860px){ .chart{gap:4px;} }
.legend{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--text-faint);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* ═══ 폼 ═══ */
.lab{display:block;font-size:var(--fs-xs);color:var(--text-faint);margin:14px 2px 6px;}
.lab:first-child{margin-top:0;}
.in{width:100%;height:40px;padding:0 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-md);font-size:16px;}
.in:focus{outline:none;border-color:var(--accent-fill);}
textarea.in{height:auto;min-height:74px;padding:9px 12px;line-height:1.5;resize:vertical;}
.row{display:flex;align-items:center;gap:8px;}
.row>.in{flex:1;min-width:0;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;height:38px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:transparent;color:var(--text-dim);font-size:var(--fs-md);font-weight:500;}
.seg button.on[data-k="지출"]{background:var(--out-bg);color:var(--out-text);border-color:var(--out-fill);font-weight:700;}
.seg button.on[data-k="입금"]{background:var(--in-bg);color:var(--in-text);border-color:var(--in-fill);font-weight:700;}
.seg button.on[data-k="수입"]{background:var(--etc-bg);color:var(--etc-text);border-color:var(--etc-fill);font-weight:700;}
.amt{width:100%;height:58px;padding:0 16px;background:var(--bg-2);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  font-family:var(--mono);font-size:28px;font-weight:600;text-align:right;}
.amt:focus{outline:none;border-color:var(--accent-fill);}
.amt::placeholder{color:var(--text-faint);opacity:.5;}
.tog{height:32px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:transparent;color:var(--text-faint);font-size:var(--fs-sm);}
.tog.g[aria-pressed="true"]{border-color:var(--in-fill);color:var(--in-text);background:var(--in-bg);}
.tog.b[aria-pressed="true"]{border-color:var(--out-fill);color:var(--out-text);background:var(--out-bg);}
.btn{height:40px;padding:0 18px;border:0;border-radius:var(--r-md);background:var(--accent-fill);color:var(--ink-on-accent);font-size:var(--fs-md);font-weight:700;white-space:nowrap;}
.btn:hover{filter:brightness(1.05);}
.btn:disabled{opacity:.45;}
.btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text-dim);font-weight:500;}
.btn.danger{background:transparent;border:1px solid var(--out-fill);color:var(--out-text);font-weight:500;}
.btn.full{width:100%;}
.err{color:var(--out-text);font-size:var(--fs-sm);margin:10px 2px 0;}
.err:empty{display:none;}
.acts-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}

/* ═══ 기록 창 — 해달의 기록 모달처럼 두 칸 ═══ */
#ov{position:fixed;inset:0;z-index:100;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;
  padding:max(6vh, calc(16px + var(--top))) 16px 16px;overflow-y:auto;}

.modal-ft{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border);}
.modal-ft .meta{font-size:var(--fs-xs);color:var(--text-faint);margin-right:auto;}
@media (max-width:760px){
  #ov{padding:0;align-items:flex-end;}
  .modal{border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;}
  .two{grid-template-columns:1fr;gap:0;}
  .two>div+div{margin-top:14px;}
  .modal-ft{padding-bottom:calc(12px + var(--bot));}

}

/* ═══ 로그인 ═══ */
.gate{max-width:380px;margin:0 auto;padding:calc(12vh + var(--top)) 20px 40px;}
.gate .mark{font-size:46px;text-align:center;}
.gate .mark svg{display:block;width:150px;height:auto;margin:0 auto;}
.gate h2{text-align:center;margin:6px 0 4px;font-family:var(--round);font-weight:400;font-size:30px;}
.gate p.sub{text-align:center;color:var(--text-faint);font-size:var(--fs-sm);margin:0 0 22px;}
.gate summary{font-size:var(--fs-sm);color:var(--text-faint);cursor:pointer;margin-top:16px;}

#toast{position:fixed;left:50%;bottom:calc(24px + var(--bot));transform:translateX(-50%) translateY(10px);
  background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);font-size:var(--fs-md);
  padding:9px 16px;border-radius:var(--r-pill);opacity:0;pointer-events:none;transition:.18s;z-index:200;white-space:nowrap;}

/* ═══ 폰 — 위 메뉴 대신 아래에 떠 있는 둥근 탭바 (홈 · 내역 · ＋ · 리포트 · 설정) ═══ */

}

<script>
/* ================= 웨스티 — 하랑·태준의 말랑한 통장 앱 (예전 이름: 데이트 통장 — 테이블 이름은 그대로 date_*) =================
   앱 이름은 '웨스티'(웨스트 하이랜드 화이트 테리어), 통장 이름(date_books.name)은 설정에서 따로 바꾼다.
   해달과 같은 Supabase 를 쓰지만 테이블은 완전히 따로다 (date_books · date_members · date_tx · date_balance_checks).
   누가 들어오고(allowed_emails), 누가 고칠 수 있고(editor_emails), 입금자 이름이 무엇인지(people)는
   모두 DB 의 date_books 에 있다 — 코드에는 개인 정보를 두지 않는다. 막는 건 DB(date_enter · RLS)가 한다.
   해달 본 장부(transactions)는 이 화면에서 한 줄도 읽지 않는다. 대신 해달에서 이 통장으로 보낸 돈을 적으면
   DB 트리거(date_sync_from_haedal)가 통장 기록을 대신 적어 준다 — 그런 줄은 haedal_tx_id 가 있고, 해달에서만 고친다.

   화면 구조는 해달 웹을 따른다: 위에 최상위 메뉴(홈·내역·리포트·설정), 왼쪽 레일에 하위 메뉴,
   오른쪽 위 '＋ 기록'(단축키 N)이 어디서든 기록 창을 띄운다.
   종류 : 지출(카드·계좌에서 나간 돈) · 입금(둘 중 한 사람이 넣은 돈) · 수입(이자·환불 등) */

/* 입금자 이름 — 통장을 불러오면 date_books.people 로 채운다 */
let PEOPLE = [];

let SB = null;
async function sb() {
  if (SB) return SB;
  SB = await haedalSupabase();   /* shared/supabase.js */
  return SB;
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const comma = (n) => (n < 0 ? '−' : '') + Math.abs(Math.round(n || 0)).toLocaleString('ko-KR');
const signed = (n) => (n > 0 ? '+' : '') + comma(n);
const digits = (v) => String(v || '').replace(/[^\d]/g, '');
const todayKey = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const shiftDay = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const monthOf = (k) => String(k).slice(0, 7);
const shiftMonth = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const monthLabel = (m) => `${m.slice(0, 4)}년 ${+m.slice(5, 7)}월`;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const dayLabel = (k) => { const d = new Date(k + 'T00:00:00'); return `${+k.slice(5, 7)}월 ${+k.slice(8, 10)}일 (${DOW[d.getDay()]})`; };
const shortDay = (k) => { const d = new Date(k + 'T00:00:00'); return `${+k.slice(5, 7)}.${+k.slice(8, 10)} ${DOW[d.getDay()]}`; };

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

const CAT_EMOJI = { '식사': '🍽️', '카페': '☕', '술': '🍻', '문화·여가': '🎬', '여행': '⛺', '교통': '🚌',
  '선물': '🎁', '생활': '🧺', '기타': '🐾' };
const catEmoji = (c) => CAT_EMOJI[c] || '🐾';
const DEPOSIT_EMOJI = '🦴';
const KIND_SIGN = { '지출': -1, '입금': 1, '수입': 1 };

const S = {
  uid: null, canEdit: false, book: null, members: [], tx: [], checks: [],
  page: 'home', sub: { entry: 'list', report: 'monthly', set: 'book' },
  month: monthOf(todayKey()), filter: 'all', q: '', calDay: null,
  draft: null, form: null
};

/* ---------------- 데이터 ---------------- */
async function loadAll() {
  const c = await sb();
  const [tx, ck, mem, bk] = await Promise.all([
    c.from('date_tx').select('*').eq('book_id', S.book.id).order('date', { ascending: false }).order('id', { ascending: false }).limit(10000),
    c.from('date_balance_checks').select('*').eq('book_id', S.book.id).order('on_date', { ascending: false }).order('id', { ascending: false }),
    c.from('date_members').select('*').eq('book_id', S.book.id).order('joined_at'),
    c.from('date_books').select('*').eq('id', S.book.id).single()
  ]);
  if (tx.error) throw new Error(tx.error.message);
  S.tx = tx.data || [];
  S.checks = ck.data || [];
  S.members = mem.data || [];
  if (bk.data) { S.book = bk.data; PEOPLE = Array.isArray(bk.data.people) ? bk.data.people : []; }
}

/* 장부 잔액 = 시작 잔액 + 입금·수입 − 지출. 기준일 이전 기록은 이미 시작 잔액에 들어 있다고 본다. */
function ledgerBalance(upto) {
  const from = S.book.opening_on || '0000-00-00';
  return Number(S.book.opening_balance || 0) + S.tx
    .filter(r => r.date >= from && (!upto || r.date <= upto))
    .reduce((a, r) => a + KIND_SIGN[r.kind] * Number(r.amount), 0);
}
const monthRows = (m) => S.tx.filter(r => monthOf(r.date) === m);
function totals(rows) {
  const t = { in: 0, out: 0, etc: 0 };
  rows.forEach(r => { const a = Number(r.amount); if (r.kind === '지출') t.out += a; else if (r.kind === '입금') t.in += a; else t.etc += a; });
  t.net = t.in + t.etc - t.out;
  return t;
}
const depositOf = (who, rows) => rows.filter(r => r.kind === '입금' && r.depositor === who).reduce((a, r) => a + Number(r.amount), 0);
const depositGoal = (who) => Number((S.book.deposit_goals || {})[who] || 0);

/* ================= 뼈대 · 메뉴 ================= */
const NAV = [['home', '홈'], ['entry', '내역'], ['report', '리포트'], ['set', '설정']];
/* ['#', '제목'] 은 항목이 아니라 레일의 묶음 제목 */
const SUBS = {
  home: [],
  entry: [['list', '입출금 내역'], ['calendar', '캘린더']],
  report: [['#', '기간별'], ['monthly', '월간'], ['trend', '추이'], ['#', '우리 둘'], ['deposit', '입금 현황'], ['balance', '잔액 맞추기']],
  set: [['book', '통장'], ['goals', '입금 약속'], ['cats', '지출 분류']]
};

const subLabel = (p, v) => ((SUBS[p] || []).find(x => x[0] === v) || [])[1];
/* 보기 전용이면 설정 메뉴를 아예 두지 않는다 */
const navItems = () => NAV.filter(([p]) => S.canEdit || p !== 'set');

function renderShell() {
  $('#app').innerHTML = `
    <header class="site-header" id="hdr">
      <div class="topbar">
        <div class="brand" id="brand" role="link" tabindex="0" title="홈으로">
          <span class="mark">${westieFaceSvg()}</span><h1>웨스티</h1><span class="tagline" id="tagline"></span>
        </div>
        <div class="acts">
          <span class="bal-pill" id="bal-pill"></span>
          ${S.canEdit ? '<button class="nav-act accent" id="add-btn" title="기록 (N)">＋ 기록<kbd>N</kbd></button>'
            : '<span class="bal-pill" style="display:inline-block;color:var(--text-faint)">보기 전용</span>'}
          <button class="nav-act" id="out-btn">로그아웃</button>
        </div>
      </div>
      <div class="navrow"><nav class="navbar" id="navbar"></nav></div>
    </header>
    <div class="site-layout" id="layout">
      <aside class="railnav" id="rail"></aside>
      <div class="site-main"><div class="page-head" id="page-head"></div><div id="page"></div></div>
    </div>
    <nav class="tabbar" id="tabbar"></nav>`;
  $('#brand').addEventListener('click', () => go('home'));
  $('#brand').addEventListener('keydown', e => { if (e.key === 'Enter') go('home'); });
  if (S.canEdit) $('#add-btn').addEventListener('click', () => openForm());
  $('#out-btn').addEventListener('click', async () => { await (await sb()).auth.signOut(); location.replace(location.pathname); });
  $('#navbar').addEventListener('click', e => { const b = e.target.closest('.nav-btn'); if (b) go(b.dataset.p); });
  $('#rail').addEventListener('click', e => { const b = e.target.closest('.sub-btn'); if (b) go(S.page, b.dataset.s); });
  $('#tabbar').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    if (b.dataset.p === '+') openForm(); else go(b.dataset.p);
  });
  const syncHdr = () => document.documentElement.style.setProperty('--hdr-h', $('#hdr').offsetHeight + 'px');
  window.addEventListener('resize', syncHdr); syncHdr();

function go(page, sub) {
  if (!navItems().some(([p]) => p === page)) page = 'home';
  S.page = page;
  if (sub) S.sub[page] = sub;
  const h = '#' + page + (SUBS[page].length ? '/' + S.sub[page] : '');
  if (location.hash !== h) history.replaceState(null, '', h);
  renderPage();
  window.scrollTo(0, 0);
}
function readHash() {
  const [p, s] = location.hash.replace('#', '').split('/');
  if (SUBS[p] && navItems().some(([x]) => x === p)) { S.page = p; if (s && subLabel(p, s)) S.sub[p] = s; }
}

function renderPage() {
  $('#tagline').textContent = `${PEOPLE.join(' · ')}의 ${S.book.name || '말랑한 통장'}`;
  document.title = `웨스티 · ${S.book.name || '말랑한 통장'}`;
  $('#bal-pill').innerHTML = `<small>잔액</small>${comma(ledgerBalance())}원`;
  $('#navbar').innerHTML = navItems().map(([p, l]) => `<button class="nav-btn ${S.page === p ? 'active' : ''}" data-p="${p}">${l}</button>`).join('');
  /* 폰 탭바 — 가운데 ＋ 는 기록할 수 있을 때만 */
  const tabs = navItems().map(([p, l]) => [p, l, TAB_ICON[p]]);
  if (S.canEdit) tabs.splice(2, 0, ['+', '기록', '＋']);
  $('#tabbar').innerHTML = tabs.map(([p, l, ic]) => `<button class="tab ${p === '+' ? 'plus' : ''} ${S.page === p ? 'on' : ''}" data-p="${p}" aria-label="${l}">
    <span class="ic">${ic}</span>${p === '+' ? '' : `<span>${l}</span>`}</button>`).join('');
  const subs = SUBS[S.page];
  $('#layout').classList.toggle('no-rail', !subs.length);
  $('#rail').innerHTML = subs.map(([v, l]) => v === '#' ? `<div class="sub-cat">${l}</div>`
    : `<button class="sub-btn ${S.sub[S.page] === v ? 'on' : ''}" data-s="${v}">${l}</button>`).join('');
  const head = $('#page-head');
  head.hidden = !subs.length;
  head.textContent = subs.length ? subLabel(S.page, S.sub[S.page]) : '';
  const host = $('#page');
  const sub = S.sub[S.page];
  if (S.page === 'home') pageHome(host);
  else if (S.page === 'entry') (sub === 'calendar' ? pageCalendar : pageList)(host);
  else if (S.page === 'report') ({ monthly: pageMonthly, trend: pageTrend, deposit: pageDeposit, balance: pageBalance })[sub](host);
  else ({ book: pageSetBook, goals: pageSetGoals, cats: pageSetCats })[sub](host);
}

function triHtml(t) {

    <div><span>입금·수입</span><b class="i">${comma(t.in + t.etc)}</b></div>
    <div><span>지출</span><b class="o">${comma(t.out)}</b></div>
    <div><span>증감</span><b class="a">${signed(t.net)}</b></div></div>`;

function rowTitle(r) { return r.kind === '입금' ? `${r.depositor} 입금` : (r.merchant || r.category || r.kind); }
function rowAmount(r) {
  const cls = r.kind === '지출' ? 'o' : r.kind === '입금' ? 'i' : 'e';
  return `<span class="${cls}">${KIND_SIGN[r.kind] > 0 ? '+' : '−'}${comma(r.amount)}</span>`;
}
/* 해달 입출금 표처럼 한 줄에 한 건. 같은 날 첫 줄에만 날짜를 적는다. 좁은 화면에선 분류·메모가 제목 밑으로 내려간다. */
function tableHtml(rows, withDate) {
  if (!rows.length) return '<div class="empty">기록이 없어요.</div>';
  let prev = null;
  return `<table class="tbl tx"><thead><tr>${withDate ? '<th>날짜</th>' : ''}<th>내용</th><th>분류</th><th>메모</th><th style="text-align:right">금액</th></tr></thead><tbody>
    ${rows.map(r => {
      const first = r.date !== prev; prev = r.date;
      const mk = (r.good_bad === 'Good' ? '<span class="mk">👍</span>' : r.good_bad === 'Bad' ? '<span class="mk">👎</span>' : '')
        + (r.haedal_tx_id ? '<span class="mk" title="해달에서 적은 기록">🦦</span>' : '');
      const msub = [r.kind === '입금' ? null : r.category, r.memo].filter(Boolean).map(esc).join(' · ');
      return `<tr class="rw ${first && withDate ? 'day-first' : ''}" data-id="${r.id}">
        ${withDate ? `<td class="dt">${first ? shortDay(r.date) : ''}</td>` : ''}
        <td><span class="em">${r.kind === '입금' ? DEPOSIT_EMOJI : catEmoji(r.category)}</span><span class="ttl">${esc(rowTitle(r))}${mk}</span>${msub ? `<span class="msub">${msub}</span>` : ''}</td>
        <td class="cat">${r.kind === '입금' ? '<span class="pill">입금</span>' : esc(r.category || '')}</td>
        <td class="memo" title="${esc(r.memo || '')}">${esc(r.memo || '')}</td>
        <td class="num">${rowAmount(r)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function bindRows(host) { if (S.canEdit) $$('tr.rw', host).forEach(tr => tr.addEventListener('click', () => openForm(Number(tr.dataset.id)))); }

/* ================= 웨스티 그림 =================
   부들부들 웨스티 — 발밑 가운데가 (0,0), 머리 가운데 ≈ (0,-108).
   털: 동그라미를 겹친 실루엣에 feTurbulence 로 가장자리를 흩뜨려 보송하게 만든다.
   테두리 선 대신 바깥에 옅은 회갈색 그림자 털을 한 겹 깔아서 흰 바탕에서도 모양이 보인다. */
const WC = {
  fur: 'var(--fur)', fur2: 'var(--fur-2)', shade: 'var(--fur-shade)', ink: 'var(--ink)',
  ear: 'var(--ear)', blush: 'var(--blush)', tongue: 'var(--tongue)', scarf: 'var(--accent-fill)', frame: 'var(--frame)'
};
function furDefs(id) {
  return `<defs>
    <filter id="fz-${id}" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.16 0.2" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.45"/>
    </filter>
    <filter id="fs-${id}" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15 0.19" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.3"/>
    </filter>
    <filter id="soft-${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <radialGradient id="fg-${id}" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="${WC.fur}"/><stop offset=".7" stop-color="${WC.fur}"/><stop offset="1" stop-color="${WC.fur2}"/>
    </radialGradient>
  </defs>`;
}
const circles = (bs, fill, grow = 0) => bs.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + grow}" fill="${fill}"/>`).join('');
/* 털 덩어리 하나 — 그림자 털 + 흰 털 */
function puff(id, bs) {
  return `<g filter="url(#fs-${id})">${circles(bs, WC.shade, 1.6)}</g>
    <g filter="url(#fz-${id})">${circles(bs, `url(#fg-${id})`)}</g>`;
}
/* 짧은 털 결 — 가장자리 안쪽에 옅게 */
function strands(cx, cy, rx, ry, n, from, to, seed) {
  let s = seed, out = '';
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const a = from + (to - from) * (i + r() * 0.6) / n;
    const x = cx + Math.cos(a) * rx * (0.78 + r() * 0.12), y = cy + Math.sin(a) * ry * (0.78 + r() * 0.12);
    const L = 5 + r() * 4, b = (r() - 0.5) * 0.6;
    const x2 = x + Math.cos(a + b) * L, y2 = y + Math.sin(a + b) * L;
    const mx = (x + x2) / 2 + Math.cos(a + 1.57) * 1.6, my = (y + y2) / 2 + Math.sin(a + 1.57) * 1.6;
    out += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
  }
  return out;
}
function ears(id) {
  const ear = (s) => `<path d="M${-30 * s} -126 Q${-31 * s} -152 ${-22 * s} -160 Q${-16 * s} -156 ${-6 * s} -140 Z" fill="${WC.fur}"/>
    <path d="M${-26 * s} -132 Q${-26 * s} -149 ${-21 * s} -154 Q${-15 * s} -147 ${-10 * s} -137 Z" fill="${WC.ear}"/>`;
  return `<g filter="url(#fs-${id})"><path d="M-33 -124 Q-34 -155 -22 -164 Q-14 -158 -3 -140 Z M33 -124 Q34 -155 22 -164 Q14 -158 3 -140 Z" fill="${WC.shade}"/></g>
    <g filter="url(#fz-${id})">${ear(1)}${ear(-1)}</g>`;
}
function westieHead(id, glasses) {
  /* 국화꽃처럼 둥글고 볼이 빵빵한 얼굴 */
  const blobs = [[0, -110, 34], [-24, -100, 22], [24, -100, 22], [0, -88, 22], [-14, -134, 18], [14, -134, 18], [0, -140, 16],
    [-34, -114, 14], [34, -114, 14], [-30, -92, 13], [30, -92, 13], [0, -78, 14]];
  return `${ears(id)}${puff(id, blobs)}
    <g stroke="${WC.shade}" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".28">
      ${strands(0, -104, 40, 34, 4, Math.PI * 0.92, Math.PI * 1.08, 11)}${strands(0, -104, 40, 34, 4, Math.PI * 1.92, Math.PI * 2.08, 3)}</g>
    <g filter="url(#soft-${id})" fill="${WC.blush}" opacity=".5"><ellipse cx="-22" cy="-94" rx="7" ry="4.5"/><ellipse cx="22" cy="-94" rx="7" ry="4.5"/></g>
    <!-- 눈: 크고 촉촉하게, 반짝임 두 개 -->
    <g fill="${WC.ink}"><ellipse cx="-13" cy="-108" rx="5.6" ry="6.2"/><ellipse cx="13" cy="-108" rx="5.6" ry="6.2"/></g>
    <g fill="#fff"><circle cx="-14.8" cy="-110.6" r="2.1"/><circle cx="11.2" cy="-110.6" r="2.1"/>
      <circle cx="-11.4" cy="-105.6" r=".9" opacity=".8"/><circle cx="14.6" cy="-105.6" r=".9" opacity=".8"/></g>
    <!-- 눈썹 털 — 웨스티 특유의 복슬한 눈썹 -->
    <g filter="url(#fz-${id})" fill="${WC.fur}"><ellipse cx="-14" cy="-119" rx="9" ry="4.2" transform="rotate(-12 -14 -119)"/>

/* ================= 웨스티의 간식통 =================
   지금 남은 돈을 웨스티 옆 간식통으로 그린다.
   - 사료 알갱이 하나 = 1만 원 (240알 = 240만 원이면 통이 가득 찬다)
   - 뼈다귀 하나 = 100만 원 (14개까지)
   - 바닥 발자국 = 이번 달 지출 (1만 원에 한 개, 같이 걸어 다닌 만큼 찍힌다)
   알갱이 자리는 고정된 난수로 뽑는다 — 새로 고침해도 모양이 흔들리지 않는다. */
const KIBBLE_WON = 10000, BONE_WON = 1000000, FULL_KIBBLE = 240;
function seeded(seed) { let x = seed >>> 0; return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }; }
function jarStage(bal) {
  if (bal <= 0) return '빈 간식통';
  if (bal < 200000) return '한 줌';
  if (bal < 1000000) return '조금씩 차는 중';
  if (bal < FULL_KIBBLE * KIBBLE_WON) return '거의 가득';
  return '가득 찼어요';
}
function boneSvg(x, y, rot, k) {
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${k})">
    <path d="M-9 -2.2 H9 A3.4 3.4 0 1 1 11.6 -5.6 A3.4 3.4 0 1 1 11.6 5.6 A3.4 3.4 0 1 1 9 2.2 H-9 A3.4 3.4 0 1 1 -11.6 5.6 A3.4 3.4 0 1 1 -11.6 -5.6 A3.4 3.4 0 1 1 -9 -2.2 Z"
      fill="var(--fur)" stroke="var(--fur-line)" stroke-width="1.4" stroke-linejoin="round"/></g>`;
}
function pawSvg(x, y, rot, op) {
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})" fill="var(--out-fill)" opacity="${op}">
    <ellipse cx="0" cy="1.3" rx="2.7" ry="2.2"/><circle cx="-2.5" cy="-1.6" r="1.05"/><circle cx="-0.85" cy="-2.9" r="1.05"/>
    <circle cx="0.85" cy="-2.9" r="1.05"/><circle cx="2.5" cy="-1.6" r="1.05"/></g>`;
}
function jarSvg(bal, monthOut) {
  const W = 360, H = 250, gy = 226, dx = 108;
  const jx0 = 210, jx1 = 310, jTop = 100, jBot = gy - 3, inTop = jTop + 6;
  const kibbles = Math.min(FULL_KIBBLE, Math.max(0, Math.floor(bal / KIBBLE_WON)));
  const bones = Math.min(14, Math.max(0, Math.floor(bal / BONE_WON)));
  const paws = Math.min(44, Math.max(0, Math.round(monthOut / KIBBLE_WON)));
  const level = jBot - (jBot - inTop) * Math.min(1, kibbles / FULL_KIBBLE);   // 사료가 찬 높이
  const jar = `M${jx0 + 6} ${jTop} H${jx1 - 6} Q${jx1} ${jTop} ${jx1} ${jTop + 10} V${jBot - 16} Q${jx1} ${jBot} ${jx1 - 16} ${jBot}
    H${jx0 + 16} Q${jx0} ${jBot} ${jx0} ${jBot - 16} V${jTop + 10} Q${jx0} ${jTop} ${jx0 + 6} ${jTop} Z`;
  const kc = ['var(--treat)', 'var(--treat-2)', 'var(--treat-3)'];
  let kib = '';
  const r1 = seeded(20261002);
  for (let i = 0; i < kibbles; i++) {
    const x = jx0 + 5 + r1() * (jx1 - jx0 - 10), y = level + 3 + r1() * Math.max(1, jBot - level - 6);
    const rot = Math.round(r1() * 180);
    kib += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4" ry="3" fill="${kc[Math.floor(r1() * 3)]}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  /* 뼈다귀 — 사료 윗면 근처에 눕혀 둔다 (통이 넘치면 위로 쌓인다) */
  let bn = '';
  const r2 = seeded(7);
  for (let i = 0; i < bones; i++) {
    const row = Math.floor(i / 3), x = jx0 + 22 + (i % 3) * 28 + (r2() - 0.5) * 8;
    const y = Math.max(inTop + 10, level - 2 - row * 11 + (r2() - 0.5) * 4);
    bn += boneSvg(x, y, Math.round((r2() - 0.5) * 40), 0.95);
  }
  let pw = '';
  const r3 = seeded(99);
  for (let i = 0; i < paws; i++) {
    const x = 18 + r3() * (W - 36), y = gy + 5 + r3() * 15;
    pw += pawSvg(x, y, Math.round(-30 + r3() * 60), (0.45 + r3() * 0.35).toFixed(2));
  }
  const fid = 'w' + (++furSeq);
  const label = `잔액 ${comma(bal)}원 — 사료 ${kibbles}알, 뼈다귀 ${bones}개. 이번 달 지출 발자국 ${paws}개`;
  return `<svg class="jar-svg" viewBox="0 48 ${W} ${H - 48}" role="img" aria-label="${label}" style="--tail-o:${dx + 26}px ${gy - 36}px;--head-o:${dx}px ${gy - 76}px">
    ${furDefs(fid)}<defs><clipPath id="jar-in"><path d="${jar}"/></clipPath></defs>
    <ellipse cx="${W / 2}" cy="${gy + 12}" rx="${W * 0.47}" ry="15" fill="var(--ground)"/>
    ${pw}
    <g transform="translate(${dx} ${gy})">${westieDog(fid, true)}</g>
    <path d="${jar}" fill="var(--glass)"/>
    <g clip-path="url(#jar-in)">${kib}</g>${bn}
    <path d="${jar}" fill="none" stroke="var(--glass-line)" stroke-width="2"/>
    <rect x="${jx0 + 9}" y="${jTop + 14}" width="6" height="${jBot - jTop - 40}" rx="3" fill="#fff" opacity=".45"/>
    <rect x="${jx0 - 5}" y="${jTop - 15}" width="${jx1 - jx0 + 10}" height="17" rx="7" fill="var(--accent-fill)"/>
    <rect x="${(jx0 + jx1) / 2 - 13}" y="${jTop - 23}" width="26" height="10" rx="5" fill="var(--accent-fill)"/>
    <rect x="${jx0 - 5}" y="${jTop - 4}" width="${jx1 - jx0 + 10}" height="4" fill="#000" opacity=".12"/>
  </svg>`;
}

function pageMonthly(host) {
  const rows = monthRows(S.month);
  const t = totals(rows);
  const out = rows.filter(r => r.kind === '지출');
  const group = (key) => {
    const o = {};
    out.forEach(r => { const k = key(r) || '기타'; o[k] = (o[k] || 0) + Number(r.amount); });
    return Object.entries(o).sort((a, b) => b[1] - a[1]);
  };
  const cats = group(r => r.category);
  const merch = group(r => r.merchant).slice(0, 6);
  const good = out.filter(r => r.good_bad === 'Good'), bad = out.filter(r => r.good_bad === 'Bad');
  const sum = (rs) => rs.reduce((a, r) => a + Number(r.amount), 0);
  const prev = totals(monthRows(shiftMonth(S.month, -1)));
  const bars = (list, withEmoji) => list.length ? list.map(([k, v]) => `<div class="brow">
      <div class="kv"><span>${withEmoji ? catEmoji(k) + ' ' : ''}${esc(k)}</span><b>${comma(v)} <span style="color:var(--text-faint);font-weight:400;font-size:var(--fs-xs);">${Math.round(v / t.out * 100)}%</span></b></div>
      <div class="bar"><i class="out" style="width:${v / list[0][1] * 100}%"></i></div></div>`).join('')
    : '<div class="empty" style="padding:14px 0;">지출이 없어요.</div>';
  const diff = t.out - prev.out;
  host.innerHTML = `
    <div class="toolbar">${mnavHtml()}</div>
    <div class="grid2">
      <div class="box"><div class="hd"><b>한눈에</b><span>지난달 지출 ${comma(prev.out)}원</span></div>${triHtml(t)}
        <div class="note">${prev.out ? `지난달보다 지출이 ${diff >= 0 ? `<b class="o">${comma(diff)}원 늘었어요</b>` : `<b class="i">${comma(-diff)}원 줄었어요</b>`}` : '지난달 기록이 없어요.'}</div></div>
      <div class="box"><div class="hd"><b>좋았던 지출 · 아쉬운 지출</b></div>
        <div class="kv"><span>👍 좋은 지출 ${good.length}건</span><b class="i">${comma(sum(good))}</b></div>
        <div class="kv"><span>👎 아쉬운 지출 ${bad.length}건</span><b class="o">${comma(sum(bad))}</b></div>
        <div class="kv"><span>표시 안 함 ${out.length - good.length - bad.length}건</span><b>${comma(t.out - sum(good) - sum(bad))}</b></div>
        ${bad.length ? `<div class="note">아쉬웠던 곳: ${bad.slice(0, 4).map(r => esc(r.merchant || r.category)).join(', ')}</div>` : ''}</div>
      <div class="box"><div class="hd"><b>분류별 지출</b></div>${bars(cats, true)}</div>
      <div class="box"><div class="hd"><b>자주 쓴 곳</b></div>${bars(merch, false)}</div>
    </div>`;
  bindMnav(host);
}

/* ================= 설정 ================= */
async function saveBook(patch, msg) {
  const { error } = await (await sb()).from('date_books').update(patch).eq('id', S.book.id);
  if (error) { toast('저장하지 못했어요 — ' + error.message); return; }
  toast(msg || '저장했어요');
  await loadAll(); renderPage();
}
function moneyInput(el) { el.addEventListener('input', () => { const v = digits(el.value); el.value = v ? comma(v) : ''; }); }

  }));

  host.innerHTML = `

/* ================= 기록 창 (새로 · 수정) ================= */
function freshDraft(keep) {
  return { id: null, kind: (keep && keep.kind) || '지출', amount: '', category: null, merchant: '', memo: '',
           good: null, depositor: (keep && keep.depositor) || PEOPLE[0], date: (keep && keep.date) || todayKey() };
}
function openForm(id, date) {
  if (!S.canEdit) return;
  if (id) {
    const r = S.tx.find(x => x.id === id);
    if (!r) return;
    if (r.haedal_tx_id) { toast('🦦 해달에서 적은 기록이에요 — 해달에서 고치면 여기도 바뀌어요'); return; }
    S.form = { id, kind: r.kind, amount: String(Math.round(r.amount)), category: r.category, merchant: r.merchant || '',
               memo: r.memo || '', good: r.good_bad, depositor: r.depositor || PEOPLE[0], date: r.date };
  } else {
    if (!S.draft) S.draft = freshDraft();
    if (date) S.draft.date = date;
    S.form = S.draft;
  }
  drawForm(true);
}
function closeForm() { $('#ov').hidden = true; $('#ov').innerHTML = ''; document.body.style.overflow = ''; S.form = null; }

function drawForm(focus) {
  const d = S.form, isEdit = !!d.id;
  const cats = S.book.categories || [];
  const merchants = [...new Set(S.tx.filter(r => r.merchant).map(r => r.merchant))].slice(0, 300);
  const r = isEdit ? S.tx.find(x => x.id === d.id) : null;
  const ov = $('#ov');
  ov.hidden = false;
  document.body.style.overflow = 'hidden';
  ov.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-hd"><h3>${isEdit ? '기록 수정' : '기록'}</h3><button class="x" id="f-x" aria-label="닫기">×</button></div>
      <div class="modal-bd"><div class="two">
        <div>
          <div class="seg" id="f-kind">${['지출', '입금', '수입'].map(k => `<button data-k="${k}" class="${d.kind === k ? 'on' : ''}">${k}</button>`).join('')}</div>
          <label class="lab">금액</label>
          <input class="amt" id="f-amt" inputmode="numeric" placeholder="0" value="${d.amount ? comma(d.amount) : ''}" autocomplete="off">
          ${d.kind === '입금' ? `
            <label class="lab">누가 넣었나요</label>
            <div class="chips" id="f-who">${PEOPLE.map(who => `<button class="chip ${d.depositor === who ? 'on' : ''}" data-u="${esc(who)}">${esc(who)}</button>`).join('')}</div>
          ` : `
            <label class="lab">분류</label>
            <div class="chips" id="f-cat">${cats.map(c => `<button class="chip ${d.category === c ? 'on' : ''}" data-c="${esc(c)}">${catEmoji(c)} ${esc(c)}</button>`).join('')}</div>
          `}
        </div>
        <div>
          ${d.kind === '입금' ? '' : `
            <label class="lab">${d.kind === '지출' ? '사용처' : '어디서'}</label>
            <input class="in" id="f-merch" list="f-merch-list" value="${esc(d.merchant)}" placeholder="${d.kind === '지출' ? '예) 북한산 입구 칼국수' : '예) 이자, 환불'}" autocomplete="off">
            <datalist id="f-merch-list">${merchants.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`}
          <label class="lab">날짜</label>
          <div class="row">
            <input class="in" id="f-date" type="date" value="${d.date}">
            <button class="chip ${d.date === shiftDay(todayKey(), -1) ? 'on' : ''}" data-day="-1">어제</button>
            <button class="chip ${d.date === todayKey() ? 'on' : ''}" data-day="0">오늘</button>
          </div>
          <label class="lab">메모</label>
          <textarea class="in" id="f-memo" rows="3" placeholder="어디서 무엇을 했는지…">${esc(d.memo)}</textarea>
          ${d.kind === '지출' ? `
            <label class="lab">어땠나요</label>
            <div class="chips">
              <button class="tog g" id="f-good" aria-pressed="${d.good === 'Good'}">👍 좋은 지출</button>
              <button class="tog b" id="f-bad" aria-pressed="${d.good === 'Bad'}">👎 아쉬운 지출</button>
            </div>` : ''}
        </div>
      </div><p class="err" id="f-err"></p></div>
      <div class="modal-ft">
        <span class="meta">${r ? `${esc(String(r.created_at).slice(0, 10))} 기록` : 'Enter 로 저장 · Esc 로 닫기'}</span>
        ${isEdit ? '<button class="btn danger" id="f-del">삭제</button>' : ''}
        <button class="btn" id="f-save">${isEdit ? '수정 저장' : '기록'}</button>
      </div>
    </div>`;

  const sync = () => {
    d.amount = digits($('#f-amt').value);
    const mi = $('#f-merch'); if (mi) d.merchant = mi.value;
    d.memo = $('#f-memo').value;
    d.date = $('#f-date').value || todayKey();
  };
  $('#f-x').addEventListener('click', closeForm);
  ov.onclick = (e) => { if (e.target === ov) closeForm(); };
  $$('#f-kind button').forEach(b => b.addEventListener('click', () => {
    sync(); d.kind = b.dataset.k;
    if (d.kind === '입금') d.category = null;
    if (d.kind !== '지출') d.good = null;
    drawForm(false);
  }));
  const amt = $('#f-amt');
  moneyInput(amt);
  $$('#f-cat .chip').forEach(b => b.addEventListener('click', () => { sync(); d.category = d.category === b.dataset.c ? null : b.dataset.c; drawForm(false); }));
  $$('#f-who .chip').forEach(b => b.addEventListener('click', () => { sync(); d.depositor = b.dataset.u; drawForm(false); }));
  $$('[data-day]').forEach(b => b.addEventListener('click', () => { sync(); d.date = shiftDay(todayKey(), Number(b.dataset.day)); drawForm(false); }));
  const gb = (sel, v) => { const el = $(sel); if (el) el.addEventListener('click', () => { sync(); d.good = d.good === v ? null : v; drawForm(false); }); };
  gb('#f-good', 'Good'); gb('#f-bad', 'Bad');

  const save = async () => {
    sync();
    const err = $('#f-err');
    const n = Number(d.amount || 0);
    if (!n) { err.textContent = '금액을 넣으세요.'; amt.focus(); return; }
    if (d.kind === '지출' && !d.category) { err.textContent = '분류를 고르세요.'; return; }
    if (d.kind === '입금' && !PEOPLE.includes(d.depositor)) { err.textContent = '누가 넣었는지 고르세요.'; return; }
    const btn = $('#f-save'); btn.disabled = true;
    const payload = {
      kind: d.kind, amount: n, date: d.date,
      category: d.kind === '입금' ? null : d.category,
      merchant: d.kind === '입금' ? null : (d.merchant.trim() || null),
      memo: d.memo.trim() || null,
      good_bad: d.kind === '지출' ? d.good : null,
      depositor: d.kind === '입금' ? d.depositor : null
    };
    const c = await sb();
    const { error } = isEdit
      ? await c.from('date_tx').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', d.id)
      : await c.from('date_tx').insert({ ...payload, book_id: S.book.id });
    if (error) { err.textContent = '저장하지 못했습니다 — ' + error.message; btn.disabled = false; return; }
    toast(isEdit ? '수정했어요' : `${d.kind} ${comma(n)}원 기록했어요`);
    if (!isEdit) S.draft = freshDraft(d);   // 종류·날짜는 이어서 쓴다
    closeForm();
    S.month = monthOf(d.date);
    await loadAll(); renderPage();
  };
  $('#f-save').addEventListener('click', save);
  $$('#f-amt, #f-merch, #f-date').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) save(); }));
  const del = $('#f-del');
  if (del) del.addEventListener('click', async () => {
    if (!confirm('이 기록을 삭제할까요?')) return;
    const { error } = await (await sb()).from('date_tx').delete().eq('id', d.id);
    if (error) { $('#f-err').textContent = '삭제하지 못했습니다 — ' + error.message; return; }
    closeForm(); toast('삭제했어요');
    await loadAll(); renderPage();
  });
  if (focus && !isEdit && window.matchMedia('(min-width: 761px)').matches) amt.focus();
}

document.addEventListener('keydown', (e) => {
  if (!S.book) return;
  if (e.key === 'Escape' && !$('#ov').hidden) { closeForm(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '');
  if (S.canEdit && !typing && $('#ov').hidden && (e.key === 'n' || e.key === 'N' || e.key === 'ㅜ') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); openForm();
  }
});

/* ================= 로그인 · 시작 ================= */
function showGate(html) { $('#app').innerHTML = `<div class="gate">${html}</div>`; }

/* 가입 절차 없이 이메일로 온 로그인 링크를 누르면 들어온다. 처음이면 계정도 그때 만들어진다.
   비밀번호가 있는 계정은 비밀번호로도 들어올 수 있다. */
function showLogin(msg) {
  showGate(`
    <div class="mark">${westieDogSvg()}</div>
    <h2>웨스티</h2>
    <p class="sub">${esc(msg || '말랑한 통장 · 이메일로 로그인 링크를 보내 드려요')}</p>
    <label class="lab">이메일</label>
    <input class="in" id="lk-em" type="email" autocomplete="username" inputmode="email">
    <p class="err" id="lk-err"></p>
    <button class="btn full" id="lk-link" style="margin-top:14px;">로그인 링크 받기</button>
    <details>
      <summary>비밀번호로 로그인</summary>
      <input class="in" id="lk-pw" type="password" autocomplete="current-password" placeholder="비밀번호" style="margin-top:10px;">
      <button class="btn ghost full" id="lk-go" style="margin-top:8px;">로그인</button>
    </details>`);
  const err = $('#lk-err');
  const email = async () => {
    const v = $('#lk-em').value.trim().toLowerCase();
    if (!v) { err.textContent = '이메일을 입력하세요.'; return null; }
    const { data: ok, error } = await (await sb()).rpc('date_email_allowed', { em: v });
    if (error) { err.textContent = '확인하지 못했어요 — ' + error.message; return null; }
    if (!ok) { err.textContent = '이 통장에 등록된 이메일이 아니에요.'; return null; }
    err.textContent = '';
    return v;
  };
  $('#lk-link').addEventListener('click', async () => {
    const em = await email(); if (!em) return;
    $('#lk-link').disabled = true;
    const { error } = await (await sb()).auth.signInWithOtp({
      email: em, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
    $('#lk-link').disabled = false;
    if (error) { err.textContent = '메일을 보내지 못했어요 — ' + error.message; return; }
    showGate(`<div class="mark">📮</div><h2>메일을 확인하세요</h2>
      <p class="sub">${esc(em)} 로 보낸 링크를 누르면<br>바로 들어와요.</p>
      <button class="btn ghost full" id="lk-back">다른 방법으로 로그인</button>`);
    $('#lk-back').addEventListener('click', () => showLogin());
  });
  const go = async () => {
    const em = await email(); if (!em) return;
    const password = $('#lk-pw').value;
    if (!password) { err.textContent = '비밀번호를 입력하세요.'; return; }
    $('#lk-go').disabled = true;
    const { error } = await (await sb()).auth.signInWithPassword({ email: em, password });
    $('#lk-go').disabled = false;
    if (error) { err.textContent = '로그인하지 못했어요. 비밀번호를 확인하세요.'; return; }
    start();
  };
  $('#lk-go').addEventListener('click', go);
  $('#lk-pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

async function start() {
  $('#app').innerHTML = '<div class="empty" style="padding-top:22vh;">불러오는 중…</div>';
  try {
    const c = await sb();
    const { data: { user } } = await c.auth.getUser();
    if (!user) { showLogin(); return; }
    S.uid = user.id;
    /* 처음 들어오면 멤버로 등록되고, 통장이 아직 없으면 그때 만들어진다.
       등록된 이메일이 아니면 DB 가 거절한다. */
    const { data: bookId, error } = await c.rpc('date_enter');
    if (error) {
      await c.auth.signOut();
      showLogin(`${user.email} 은 이 통장에 들어올 수 없는 계정이에요`);
      return;
    }
    const { data: canEdit } = await c.rpc('date_is_editor');
    S.canEdit = !!canEdit;
    document.body.classList.toggle('can-edit', S.canEdit);
    S.book = { id: bookId };
    await loadAll();
    readHash();
    renderShell();
    renderPage();
  } catch (e) {
    $('#app').innerHTML = `<div class="empty" style="padding-top:20vh;">불러오지 못했어요.<br>${esc(e.message || e)}</div>`;
  }
}

(async () => {
  let c;
  try { c = await sb(); }
  catch (e) { $('#app').innerHTML = '<div class="empty" style="padding-top:22vh;">네트워크를 확인하고 다시 열어주세요.</div>'; return; }
  /* 로그인 링크로 돌아온 경우도 getSession 이 주소의 토큰을 먼저 처리해 세션을 돌려준다 */
  const { data } = await c.auth.getSession();
  if (data.session) start(); else showLogin();
  c.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT') location.replace(location.pathname); });
  /* 상대가 방금 적은 기록이 보이도록, 탭으로 돌아올 때마다 다시 읽는다 */
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.book || !$('#ov').hidden) return;
    try { await loadAll(); renderPage(); } catch (e) {}
  });
  window.addEventListener('hashchange', () => { if (S.book) { readHash(); renderPage(); } });
})();
</script>
